'use strict';
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),nodes=new Map(D.nodes.map(n=>[n.id,n])),groups=new Map(D.groups.map(g=>[g.id,g]));
const state={open:new Set(['root']),selected:null,mode:'tree',zoom:1,tab:'preview',page:0,query:''};let searchingTimer;
const counts={};D.nodes.forEach(n=>{counts[n.group]=(counts[n.group]||0)+1});
const tree={id:'root',label:'专业群 AI 工作站方案',description:D.nodes.length+' 份文档 · 一个主位置，关系多条',color:'#446be7',children:D.groups.map(g=>({...g,children:Object.entries(D.subnames).filter(([id])=>D.nodes.some(n=>n.group===g.id&&n.sub===id)).map(([id,label])=>({id:g.id+'--'+id,label,color:g.color,children:D.nodes.filter(n=>n.group===g.id&&n.sub===id).sort((a,b)=>a.path.localeCompare(b.path,'zh-CN',{numeric:true}))})).filter(s=>s.children.length)})).filter(g=>g.children.length)};

function total(t){return t.children?t.children.reduce((a,c)=>a+total(c),0):1}function href(n){const parts=n.path.split('/').map(encodeURIComponent);return n.path.startsWith('产品方案/')?parts.slice(1).join('/'):'../'+parts.join('/')}

function docCard(n,extra=''){return `<button class="node doc ${state.selected===n.id?'selected':''} ${extra}" data-doc="${esc(n.id)}" style="--accent:${tone(n)}" title="${esc(n.title)}"><span class="doc-number">${esc(short(n))}</span><span class="node-text"><strong>${esc(n.title)}</strong><small>${esc(n.current?'待评审 · ': '')}${esc(n.role)}</small></span></button>`}
function folderHTML(t){if(!t.children)return docCard(t);const open=state.open.has(t.id);return `<div class="branch" data-branch="${esc(t.id)}"><button class="node ${t.id==='root'?'root':''}" data-folder="${esc(t.id)}" data-parent="${esc(parents.get(t.id)||'')}" aria-expanded="${open}" style="--accent:${esc(t.color||'#446be7')}"><span class="chevron">${open?'−':'+'}</span><span class="node-text"><strong>${esc(t.label)}</strong><small>${t.id==='root'?esc(t.description):total(t)+' 份文档 · '+(open?'点击收拢':'点击展开')}</small></span></button>${open?`<div class="children">${t.children.map(c=>`<div class="child">${folderHTML(c)}</div>`).join('')}</div>`:''}</div>`}
function render(){if(state.mode==='tree')$('map').innerHTML=folderHTML(tree);else renderGraph();$('tree-mode').classList.toggle('active',state.mode==='tree');$('graph-mode').classList.toggle('active',state.mode==='graph');$('view-note').textContent=state.mode==='tree'?'主树为阅读编排，关系线不代表方案已批准或功能已实现':'只显示选中文档的相邻关系，完整清单见详情';requestAnimationFrame(sizeAndDraw)}
function sizeAndDraw(){const map=$('map'),world=$('world'),v=$('viewport');map.style.transform=`scale(${state.zoom})`;world.style.width=Math.max(v.clientWidth,map.offsetWidth*state.zoom)+'px';world.style.height=Math.max(v.clientHeight-34,map.offsetHeight*state.zoom)+'px';$('zoom-label').textContent=Math.round(state.zoom*100)+'%';drawEdges()}
function drawEdges(){const base=$('map').getBoundingClientRect(),z=state.zoom,svg=$('edges');svg.setAttribute('width',$('map').offsetWidth*z);svg.setAttribute('height',$('map').offsetHeight*z);svg.setAttribute('viewBox',`0 0 ${$('map').offsetWidth} ${$('map').offsetHeight}`);const pt=(e,side)=>{const r=e.getBoundingClientRect();return [(side==='right'?r.right:r.left)-base.left,(r.top+r.height/2)-base.top].map(a=>a/z)};let lines=[];const connect=(a,b,color)=>{if(!a||!b)return;let[x1,y1]=pt(a,'right'),[x2,y2]=pt(b,'left');const mid=(x1+x2)/2;lines.push(`<path d="M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}" fill="none" stroke="${color||'#cbd5e4'}" stroke-width="1.5" opacity=".75"/>`)};
if(state.mode==='tree'){document.querySelectorAll('#map .branch').forEach(b=>{const parent=b.querySelector(':scope > .node'),children=b.querySelector(':scope > .children');if(!children)return;children.querySelectorAll(':scope > .child').forEach(c=>connect(parent,c.querySelector('.node'),getComputedStyle(parent).getPropertyValue('--accent')))});}else{const center=document.querySelector('#map .graph-center .node');document.querySelectorAll('#map [data-side="in"] .node').forEach(n=>connect(n,center,'#8ba4ca'));document.querySelectorAll('#map [data-side="out"] .node').forEach(n=>connect(center,n,'#8ba4ca'));}svg.innerHTML=lines.join('')}
function reveal(id){let p=parents.get(id);while(p){state.open.add(p);p=parents.get(p)}state.mode='tree';render();setTimeout(()=>document.querySelector(`#map [data-doc="${id}"]`)?.scrollIntoView({block:'center',inline:'center',behavior:'smooth'}),70)}
function choose(id,show=true){if(!nodes.has(id))return;state.selected=id;$('breadcrumb').textContent=pathLabels(id).slice(-3).join(' / ');if(show)renderPanel();render();location.hash='doc='+encodeURIComponent(id)}
function renderGraph(){let n=nodes.get(state.selected);if(!n){n=nodes.get(D.shortcuts.start)||D.nodes[0];state.selected=n.id}const incoming=D.edges.filter(e=>e.target===n.id),outgoing=D.edges.filter(e=>e.source===n.id),uniq=a=>[...new Set(a)];const ins=uniq(incoming.map(e=>e.source)).slice(0,10),outs=uniq(outgoing.map(e=>e.target)).slice(0,10);$('map').innerHTML=`<div class="local-graph"><div class="graph-column" data-side="in"><h4>哪些文档支撑或指向它 · ${uniq(incoming.map(e=>e.source)).length}</h4>${ins.map(id=>docCard(nodes.get(id))).join('')||'<div class="graph-empty">暂无已登记入向关联</div>'}</div><div class="graph-column graph-center">${docCard(n)}<div class="graph-empty">当前展示每侧前 10 份关联。<br>右侧“关联”页签保留全部关系与依据。</div></div><div class="graph-column" data-side="out"><h4>它继续支撑哪些文档 · ${uniq(outgoing.map(e=>e.target)).length}</h4>${outs.map(id=>docCard(nodes.get(id))).join('')||'<div class="graph-empty">暂无已登记出向关联</div>'}</div></div>`}
function relationItems(es,side){if(!es.length)return '<div class="subtle">暂无已登记关系</div>';return es.map(e=>{const n=nodes.get(side==='in'?e.source:e.target);return `<button class="relation-link" data-doc="${esc(n.id)}">${esc(n.title)}<small>${esc(e.kind)} · ${esc(e.evidence)}</small></button>`}).join('')}
function renderPanel(){const n=nodes.get(state.selected);if(!n)return;const incoming=D.edges.filter(e=>e.target===n.id),outgoing=D.edges.filter(e=>e.source===n.id);let content='';if(state.tab==='preview'){content=n.reference?`<div class="empty">这份资料不在导航中嵌入正文，请打开原文查看。</div>`:`${n.truncated?'<p class="hint">导航只保留摘要与章节；完整内容请打开原文。</p>':''}<pre class="source" id="source-body"></pre>`}else if(state.tab==='outline'){content='<h4>正文目录</h4>'+n.headings.map(h=>`<div class="relation-link">${esc(h)}</div>`).join('');}else{content=`<h4>被引用 / 被关联 · ${incoming.length}</h4>${relationItems(incoming,'in')}<h4>引用 / 关联出去 · ${outgoing.length}</h4>${relationItems(outgoing,'out')}<h4>结构化及其他附件 · ${n.assets.length}</h4>${n.assets.map(a=>`<a class="relation-link" target="_blank" rel="noopener" href="${esc(href(a))}">${esc(a.label)} ↗</a>`).join('')}`}
$('panel').innerHTML=`<div class="panel-top"><button class="close" id="close-panel" aria-label="关闭详情">×</button><span class="badge">${esc(n.current?'当前评审稿':n.role)}</span><h3>${esc(n.title)}</h3><div class="panel-meta">${esc(n.path)}<br>${esc(n.id)} · 原文指纹 ${n.sha256.slice(0,12)}<br>资料性质：${esc(n.role)}<br>状态说明：${esc(n.status)}<br>分组依据：${esc(n.reason)}</div><div class="panel-actions"><a href="${esc(href(n))}" target="_blank" rel="noopener">打开原文件 ↗</a><button id="locate">定位主树</button><button id="local-graph">看关系图</button></div><div class="tag-row">${n.tags.map(t=>`<span class="tag">${esc(D.subnames[t]||t)}</span>`).join('')}</div></div><div class="panel-content"><div class="tabs"><button data-tab="preview" class="${state.tab==='preview'?'active':''}">摘要</button><button data-tab="outline" class="${state.tab==='outline'?'active':''}">章节</button><button data-tab="relations" class="${state.tab==='relations'?'active':''}">关联 ${incoming.length+outgoing.length}</button></div>${content}</div>`;$('panel').classList.add('open');if($('source-body'))$('source-body').textContent=n.body;$('close-panel').onclick=()=>{$('panel').classList.remove('open');requestAnimationFrame(sizeAndDraw)};$('locate').onclick=()=>reveal(n.id);$('local-graph').onclick=()=>{state.mode='graph';render();setTimeout(()=>document.querySelector('.graph-center')?.scrollIntoView({block:'center',inline:'center'}),80)};$('panel').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderPanel()});requestAnimationFrame(sizeAndDraw)}
function results(){const q=$('search').value.trim().toLowerCase();state.query=q;$('search-results').hidden=!q;$('side-normal').hidden=!!q;if(!q)return;const words=q.split(/\s+/),full=$('fulltext').checked;let matches=D.nodes.filter(n=>words.every(w=>(n.title+' '+n.path+' '+n.headings.join(' ')+' '+(full?n.body:'')).toLowerCase().includes(w)));const size=35,from=state.page*size;state.page=Math.min(state.page,Math.max(0,Math.ceil(matches.length/size)-1));$('search-results').innerHTML=`<div class="sidebar-heading">找到 ${matches.length} 份资料</div>${matches.slice(state.page*size,state.page*size+size).map(n=>`<button class="search-result" data-result="${esc(n.id)}"><strong>${esc(n.title)}</strong><small>${esc(groups.get(n.group)?.label)} / ${esc(D.subnames[n.sub]||'')}</small></button>`).join('')||'<p class="hint">没有匹配的文档，试试业务名称或编号。</p>'}${matches.length>size?`<div class="pager"><button id="prev-results" ${state.page===0?'disabled':''}>上一页</button><span class="subtle">${state.page+1}/${Math.ceil(matches.length/size)}</span><button id="next-results" ${state.page>=Math.ceil(matches.length/size)-1?'disabled':''}>下一页</button></div>`:''}`;if($('prev-results'))$('prev-results').onclick=()=>{state.page--;results()};if($('next-results'))$('next-results').onclick=()=>{state.page++;results()}}
function zoom(delta){state.zoom=Math.max(.45,Math.min(1.6,state.zoom+delta));sizeAndDraw()}
function folderFocus(id){state.open.add('root');state.open.add(id);state.mode='tree';render();setTimeout(()=>document.querySelector(`#map [data-folder="${id}"]`)?.scrollIntoView({block:'center',inline:'center',behavior:'smooth'}),70)}
function route(){const h=new URLSearchParams(location.hash.slice(1));if(h.has('group')&&folders.has(h.get('group')))folderFocus(h.get('group'));else if(h.has('doc')&&nodes.has(h.get('doc'))&&state.selected!==h.get('doc')){choose(h.get('doc'));reveal(h.get('doc'))}}
$('revision').textContent=D.revision+' · '+D.model;$('n-system').textContent=D.stats.product_design;$('n-db').textContent=D.stats.current_review;$('n-rel').textContent=D.stats.relations.toLocaleString();$('side-footer').textContent=`${D.stats.documents} 份文档已纳管，其中历史实现与验证材料 ${D.stats.historical} 份。\n导航为来源截点快照；原文变化后需要重新生成。`;
$('groups').innerHTML=D.groups.map(g=>`<button class="group-link" data-group="${g.id}" style="--accent:${g.color}"><span class="dot"></span><span>${esc(g.label)}</span><small class="count">${counts[g.id]||0}</small></button>`).join('');
$('groups').addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(b){folderFocus(b.dataset.group);location.hash='group='+b.dataset.group}});
$('map').addEventListener('click',e=>{const f=e.target.closest('[data-folder]'),d=e.target.closest('[data-doc]');if(f){const id=f.dataset.folder;state.open.has(id)?state.open.delete(id):state.open.add(id);render()}else if(d)choose(d.dataset.doc)});
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-doc]');if(b)choose(b.dataset.doc)});$('search-results').addEventListener('click',e=>{const b=e.target.closest('[data-result]');if(b){choose(b.dataset.result);reveal(b.dataset.result);$('layout').classList.remove('show-side')}});
$('search').oninput=()=>{clearTimeout(searchingTimer);state.page=0;searchingTimer=setTimeout(results,120)};$('fulltext').onchange=()=>{state.page=0;results()};$('tree-mode').onclick=()=>{state.mode='tree';render()};$('graph-mode').onclick=()=>{state.mode='graph';render();setTimeout(()=>document.querySelector('.graph-center')?.scrollIntoView({block:'center',inline:'center'}),80)};$('level').onclick=()=>{if(!state.open.has('root'))state.open.add('root');else{const closed=[...folders.values()].filter(f=>f.children&&state.open.has(parents.get(f.id))&&!state.open.has(f.id));closed.forEach(f=>state.open.add(f.id))}state.mode='tree';render()};$('collapse').onclick=()=>{state.open=new Set(['root']);state.mode='tree';render()};$('expand').onclick=()=>{state.open=new Set(folders.keys());state.mode='tree';render();toast('已展开全部，可用搜索定位或“收拢全部”返回总览')};$('zoom-in').onclick=()=>zoom(.1);$('zoom-out').onclick=()=>zoom(-.1);$('reset').onclick=()=>{state.zoom=1;sizeAndDraw();$('viewport').scrollTo({left:0,top:0,behavior:'smooth'})};$('menu').onclick=()=>$('layout').classList.toggle('show-side');$('theme').onclick=()=>{document.body.classList.toggle('dark');try{localStorage.setItem('mes-doc-theme',document.body.classList.contains('dark')?'dark':'light')}catch{}requestAnimationFrame(drawEdges)};
$('start').onclick=()=>{const n=nodes.get(D.shortcuts.start);if(n){choose(n.id);reveal(n.id)}};$('status').onclick=()=>{const n=nodes.get(D.shortcuts.status);if(n){choose(n.id);reveal(n.id)}};function toast(s){$('toast').textContent=s;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,3200)}
try{if(localStorage.getItem('mes-doc-theme')==='dark')document.body.classList.add('dark')}catch{}window.addEventListener('hashchange',route);window.addEventListener('resize',()=>requestAnimationFrame(sizeAndDraw));new ResizeObserver(()=>requestAnimationFrame(sizeAndDraw)).observe($('viewport'));document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('panel').classList.remove('open');$('layout').classList.remove('show-side');requestAnimationFrame(sizeAndDraw)}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();$('search').focus()}});render();route();
</script></body></html>
