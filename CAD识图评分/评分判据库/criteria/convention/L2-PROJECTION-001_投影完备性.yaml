id: L2-PROJECTION-001
name: 跨视图投影完备性（特征应在各视图按投影关系表达）
layer: L2
basis: convention
severity: medium
covers_samples:
- T03-2
claim: 核准视图关系、特征同一性、遮挡和合法省略后，检查关键结构表达是否缺失；不要求每个特征在所有视图重复绘制。
grounding:
- 类型: 教科书
  出处: 《机械制图》"三视图投影规律"（长对正、高平齐、宽相等）
  备注: 版本、作者、页码未提供，不作已核准引文
  verification_status: unverified
- 类型: 行业惯例
  说明: 视图间投影关系是读图的唯一依据，缺投影会使结构不可解或误判
  备注: 待客户专家提供依据及适用范围，非已核准共识
  verification_status: unverified
rationale: '三视图的价值在于"由已知视图推未知结构"，其唯一依据就是投影对应关系。

  某特征的投影无故缺失 → 读图者无法确定该结构是"不存在"、"被遮挡"还是"漏画"，

  图样表达即不成立。

  '
counterexample: "- **简化画法**（GB/T 16675.1 及 4458.x 各份的简化条款）**明确允许省略**：\n  均布孔只画一个、对称件只画一半/四分之一、肋板剖切省略、重复结构省略等 —— **最大误报源**。\n  ★ 通道 A 实测：GB/T 4458.1-2002 中\"完整\"一词的唯一命中即\n  「重复结构要素……允许只绘制出其中一个或几个完整的结构并反映其分布情况」，\n\
  \  **正是简化画法条款本身** ⇒ 该命中不构成\"投影须完整\"的正面明文，反而是本反例的明文依据。\n- 该结构已用**局部视图 / 斜视图 / 局部放大图**表达，不必在基本视图重复\n- 该特征被其它特征**遮挡**，且按惯例（\"不必要的虚线可省略\"）不必画虚线\n- 该结构已在**剖视图**中表达，相应视图可不画其虚线\n- 结构**不可见且不影响理解**（如内部非加工空腔）\n"
fp_risk: '① 简化画法是本规则最大误报源——判定前须先检索 GB/T 16675.1 及对应标准的**简化条款清单**；

  ② "缺投影"与"按简化画法省略"在图上形态相似，须结合**图样用途**与**是否有标注**区分；

  ③ 关联失败（无法确定两视图中的哪个结构是同一特征）时**降级为"无法判定"**。

  '
input:
- views
- features_per_view
- view_relations
- simplifications
logic: 对每个关键特征，先确认视图关联；关联未知则无法判定。根据可见性及剖视类型确定应表达方式；不可见不是自动跳过依据。仅按已核准的简化条款放行；检查其余视图及说明是否足够表达。证据不足输出无法判定，明确缺失才列候选问题。
outputs:
- 命中
- 未命中
- 无法判定
detector_hint: '前置能力：① 三方向投影对齐（可用视图框 + 对应轴线几何求得，不必用 LLM）；

  ② 同一特征的跨视图同一性判定（本规则难点的全部所在，建议先做"孔/圆"这一最容易的一类）。

  必须内置"简化画法白名单"作为放行通道，否则误报不可接受。

  '
ocr_dependency:
  negated_standard: GB/T 4458.1-2002
  search_words:
  - 完整
  - 长对正
  - 高平齐
  - 宽相等
  - 遗漏
  - 按投影关系
  - 投影关系
  - 对应投影
  - 不完整
  - 缺
  channel_A: ★ 可用（权威）
  channel_B: 可用
  channel_C: 已抽查
  negate_strength: 检索线索，不证明不存在
  residual_risk: 同一原始PDF的文本层、OCR和目视是读取通道，不是独立权威来源；抽查关键页不等于全文消除漏读。需记录真实范围、全文页覆盖与缺失基础标准。
