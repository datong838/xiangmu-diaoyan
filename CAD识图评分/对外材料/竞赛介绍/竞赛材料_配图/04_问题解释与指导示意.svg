="#E3F2F2" stroke="#087F8C" stroke-width="1"/><text x="754" y="311" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="700" fill="#087F8C" text-anchor="middle">01</text><text x="793" y="304" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="26" font-weight="600" fill="#16344B" text-anchor="start">定位疑点</text><text x="793" y="339" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="400" fill="#5D7180" text-anchor="start">指出待核查位置，保留实际表达。</text><circle cx="754" cy="403" r="22" fill="#E3F2F2" stroke="#087F8C" stroke-width="1"/><text x="754" y="411" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="700" fill="#087F8C" text-anchor="middle">02</text><text x="793" y="404" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="26" font-weight="600" fill="#16344B" text-anchor="start">确认对象</text><text x="793" y="439" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="400" fill="#5D7180" text-anchor="start">这处尺寸指向孔，还是外圆表面？</text><circle cx="754" cy="503" r="22" fill="#E3F2F2" stroke="#087F8C" stroke-width="1"/><text x="754" y="511" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="700" fill="#087F8C" text-anchor="middle">03</text><text x="793" y="504" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="26" font-weight="600" fill="#16344B" text-anchor="start">解释原因</text><text x="793" y="539" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="400" fill="#5D7180" text-anchor="start">结合已确认对象，说明要求与依据。</text><circle cx="754" cy="603" r="22" fill="#E3F2F2" stroke="#087F8C" stroke-width="1"/><text x="754" y="611" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="700" fill="#087F8C" text-anchor="middle">04</text><text x="793" y="604" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="26" font-weight="600" fill="#16344B" text-anchor="start">指导与复检</text><text x="793" y="639" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="400" fill="#5D7180" text-anchor="start">给出修改方向，核对新版及关联影响。</text><rect x="728" y="735" width="174" height="35" rx="17" fill="#E3F2F2"/><text x="815.0" y="759" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="600" fill="#087F8C" text-anchor="middle">先看提示</text><rect x="918" y="735" width="174" height="35" rx="17" fill="#E3F2F2"/><text x="1005.0" y="759" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="600" fill="#087F8C" text-anchor="middle">核对依据</text><rect x="1108" y="735" width="210" height="35" rx="17" fill="#E3F2F2"/><text x="1213.0" y="759" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="600" fill="#087F8C" text-anchor="middle">修改后复检</text><text x="54" y="856" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="600" fill="#16344B" text-anchor="start">对象或字符尚未确认 → 先提示待核查；学生、教师或专业人员可提出异议并复核。</text><line x1="54" y1="873" x2="1346" y2="873" stroke="#D9E3E8" stroke-width="2"/><text x="54" y="907" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="400" fill="#5D7180" text-anchor="start">仅展示目标态使用方式，非真实图纸、实际检测结果或现有软件截图。</text></svg>