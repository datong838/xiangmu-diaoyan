<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img"><title>三类专业知识，支撑有依据的判断</title><desc>国标讲合规，教材讲原理，手册与案例补实践——各有作用，相互补充。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8AA0AE"/></marker></defs><rect x="0" y="0" width="1400" height="950" rx="0" fill="#F4F7F9"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#16344B"/><text x="54" y="48" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="600" fill="#8FD5D9" text-anchor="start">专业知识支撑 · 对外能力说明</text><text x="54" y="101" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="39" font-weight="700" fill="white" text-anchor="start">三类专业知识，支撑有依据的判断</text><text x="54" y="140" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="400" fill="#D0DFE8" text-anchor="start">国标讲合规，教材讲原理，手册与案例补实践——各有作用，相互补充。</text><rect x="54" y="211" width="410" height="387" rx="18" fill="white" stroke="#D9E3E8" stroke-width="1.5"/><rect x="54" y="211" width="410" height="10" rx="0" fill="#087F8C"/><text x="80" y="276" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="32" font-weight="700" fill="#087F8C" text-anchor="start">国标与规范</text><text x="80" y="327" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="27" font-weight="600" fill="#16344B" text-anchor="start">是否合规？</text><circle cx="84" cy="370" r="4" fill="#087F8C" stroke="#087F8C" stroke-width="2"/><text x="100" y="379" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="400" fill="#243B4C" text-anchor="start">明确表达要求</text><circle cx="84" cy="418" r="4" fill="#087F8C" stroke="#087F8C" stroke-width="2"/><text x="100" y="427" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="400" fill="#243B4C" text-anchor="start">说明适用范围与例外</text><circle cx="84" cy="466" r="4" fill="#087F8C" stroke="#087F8C" stroke-width="2"/><text x="100" y="475" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="400" fill="#243B4C" text-anchor="start">提供可核对的依据</text><rect x="76" y="526" width="366" height="48" rx="10" fill="#F1F5F7"/><text x="259" y="558" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="600" fill="#087F8C" text-anchor="middle">评判有据可查</text><line x1="259" y1="604" x2="259" y2="649" stroke="#8AA0AE" stroke-width="2" marker-end="url(#arrow)"/><rect x="496" y="211" width="410" height="387" rx="18" fill="white" stroke="#D9E3E8" stroke-width="1.5"/><rect x="496" y="211" width="410" height="10" rx="0" fill="#3567A0"/><text x="522" y="276" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="32" font-weight="700" fill="#3567A0" text-anchor="start">教材</text><text x="522" y="327" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="27" font-weight="600" fill="#16344B" text-anchor="start">怎样画对？</text><circle cx="526" cy="370" r="4" fill="#3567A0" stroke="#3567A0" stroke-width="2"/><text x="542" y="379" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="400" fill="#243B4C" text-anchor="start">认识对象、结构与视图</text><circle cx="526" cy="418" r="4" fill="#3567A0" stroke="#3567A0" stroke-width="2"/><text x="542" y="427" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="400" fill="#243B4C" text-anchor="start">理解符号和公差语义</text><circle cx="526" cy="466" r="4" fill="#3567A0" stroke="#3567A0" stroke-width="2"/><text x="542" y="475" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="400" fill="#243B4C" text-anchor="start">解释为什么这样表达</text><rect x="518" y="526" width="366" height="48" rx="10" fill="#F1F5F7"/><text x="701" y="558" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="600" fill="#3567A0" text-anchor="middle">理解对象与原理</text><line x1="701" y1="604" x2="701" y2="649" stroke="#8AA0AE" stroke-width="2" marker-end="url(#arrow)"/><rect x="938" y="211" width="410" height="387" rx="18" fill="white" stroke="#D9E3E8" stroke-width="1.5"/><rect x="938" y="211" width="410" height="10" rx="0" fill="#AC691D"/><text x="964" y="276" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="32" font-weight="700" fill="#AC691D" text-anchor="start">手册 · 正误图册</text><text x="964" y="327" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="27" font-weight="600" fill="#16344B" text-anchor="start">怎样辨错、怎样做好？</text><circle cx="968" cy="370" r="4" fill="#AC691D" stroke="#AC691D" stroke-width="2"/><text x="984" y="379" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="400" fill="#243B4C" text-anchor="start">补充工艺与实践知识</text><circle cx="968" cy="418" r="4" fill="#AC691D" stroke="#AC691D" stroke-width="2"/><text x="984" y="427" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="400" fill="#243B4C" text-anchor="start">展示错法与正确对照</text><circle cx="968" cy="466" r="4" fill="#AC691D" stroke="#AC691D" stroke-width="2"/><text x="984" y="475" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="400" fill="#243B4C" text-anchor="start">结合经确认的专家经验</text><rect x="960" y="526" width="366" height="48" rx="10" fill="#F1F5F7"/><text x="1143" y="558" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="600" fill="#AC691D" text-anchor="middle">学会辨析与改进</text><line x1="1143" y1="604" x2="1143" y2="649" stroke="#8AA0AE" stroke-width="2" marker-end="url(#arrow)"/><rect x="54" y="667" width="1294" height="100" rx="16" fill="#16344B"/><text x="700" y="708" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="29" font-weight="700" fill="white" text-anchor="middle">对着对象讲问题 · 联系依据讲原因 · 结合条件讲做法</text><text x="700" y="745" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="400" fill="#D0DFE8" text-anchor="middle">看懂图纸  →  判断适用要求  →  解释问题  →  指导修改</text><text x="69" y="821" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="400" fill="#5D7180" text-anchor="start">正误图册也包含规范和表达案例；具体用途按内容区分。</text><text x="69" y="858" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="400" fill="#5D7180" text-anchor="start">经验须说明适用条件，不能冒充国标；缺少设计与工艺条件时先补充资料。</text><line x1="54" y1="893" x2="1346" y2="893" stroke="#D9E3E8" stroke-width="2"/><text x="54" y="927" font-family="PingFang SC,Heiti SC,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="400" fill="#5D7180" text-anchor="start">专业知识资源关系示意｜不涉及模型、内部策略、参数或性能数据。</text></svg>