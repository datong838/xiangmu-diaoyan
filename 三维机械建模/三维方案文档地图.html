u003e.copy()\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMutates\u003c/td\u003e\u003ctd\u003e原地修改并返回相同句柄\u003c/td\u003e\u003ctd\u003e如 translate、cut、部分圆角与修复；先复制再改\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e带诊断的修改\u003c/td\u003e\u003ctd\u003e返回句柄与附加信息\u003c/td\u003e\u003ctd\u003e按单个函数的文档解包\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e名称不能替代契约，某些非流形扫掠会修改源对象。不要重用失败后状态不明确的对象；从已保存的原始输入重建。\u003c/p\u003e\u003cp\u003e\u003ccode\u003eFace.surface()\u003c/code\u003e、\u003ccode\u003eEdge.curve()\u003c/code\u003e 返回的可能是借用视图。执行表示转换、非简单缩放或改变拓扑后，应释放并重新获取相关视图；绑定会对部分危险操作直接拒绝。\u003c/p\u003e\u003ch3\u003e9. 网格化、USD 与格式互通\u003c/h3\u003e\u003ch4\u003e9.1 网格化\u003c/h4\u003e\u003cp\u003e延续上一节的 \u003ccode\u003epart\u003c/code\u003e：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003emesh = sm.tessellate(\n    part,\n    chord_height_tolerance=0.02,\n    curve_angle_tolerance_deg=15.0,\n    surface_angle_tolerance_deg=15.0,\n)\narrays = mesh.to_mesh_arrays()\nprint(arrays.keys())\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003ccode\u003e0.02\u003c/code\u003e 是当前建模单位中的弦高目标；本例约定毫米，即 0.02 mm。角度参数是度。角度和弦高越严格通常网格越密，耗时与内存越高，不应直接把可视化网格视为合格的有限元网格。\u003c/p\u003e\u003cp\u003e默认值是弦高 0、两个角度 25°、最大边长 0、长宽比 0。弦高 0 表示禁用该判据，不代表零误差；角度 0 同样表示禁用相应角度判据。最大边长和长宽比是细分目标，不是最终所有三角形的硬性保证。\u003c/p\u003e\u003cp\u003e默认严格模式会拒绝面级失败造成的不完整网格。若诊断需要部分输出，使用 \u003ccode\u003eallow_partial=True\u003c/code\u003e 时还必须配合 \u003ccode\u003ereturn_failures=True\u003c/code\u003e 或 \u003ccode\u003ereturn_report=True\u003c/code\u003e，检查失败清单；不能把带缺面的输出当成成功交付。\u003c/p\u003e\u003ch4\u003e9.2 两种 USD 目标\u003c/h4\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e目标\u003c/td\u003e\u003ctd\u003e方式\u003c/td\u003e\u003ctd\u003e特点\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e保存可再编辑的 BRep 互通文件\u003c/td\u003e\u003ctd\u003e\u003ccode\u003esm.usd.export_brep\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e自定义 BrepArray；需要 schema 与对应读取/显示支持\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e生成方便通用查看的场景资产\u003c/td\u003e\u003ctd\u003eBRep → tessellate → mesh arrays → \u003ccode\u003eUsdGeom.Mesh\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e标准网格，精确曲面和编辑拓扑不随网格保留\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e用于后续建模交换，可以在前例成功后执行：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003esm.usd.export_brep(part.copy(), str(out / \u0026quot;drilled_plate_brep.usda\u0026quot;))\nloaded = sm.usd.import_breps(str(out / \u0026quot;drilled_plate_brep.usda\u0026quot;))\nassert len(loaded) == 1\nassert loaded[0].is_manifold_solid()\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e这里导出副本，是为了隔离 UV trim 准备、缓存和路径属性等可能的输入侧影响。导出会覆盖同名文件，因此只使用独立输出目录。\u003c/p\u003e\u003cp\u003eBRep 经 USD 往返可能规范化或近似几何表示，例如容差折叠、曲线转换、部分 UV trim 的省略；不能把一次导入导出视为数学意义的完全无损存档。重要原件应另外保留原生模型与建模参数。\u003c/p\u003e\u003cp\u003e如果目标是生成一个可查看的 3D 场景，应遵循仓库 资产生成流程（见原文附件），从 example_generate_asset.py（见原文附件） 修改：在进程内完成建模，只在最后写标准 \u003ccode\u003eUsdGeom.Mesh\u003c/code\u003e，不要为了生成网格资产绕行 BrepArray 文件。\u003c/p\u003e\u003cp\u003e完整环境建立后，官方参考命令：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003euv run --locked --group gui python tools/scripts/example_generate_asset.py\nuv run --locked --group gui python tools/scripts/view_usd.py --screenshot _assets_output/ExampleAsset.png _assets_output/ExampleAsset.usda\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e这些官方示例使用固定输出名，重复运行前应备份旧输出或调整输出参数。资产流程默认 Z 向上、厘米尺度；若自己的数值按毫米建模，需要正确转换数值和/或设置 USD 单位元数据，不能只改文件扩展名。\u003c/p\u003e\u003ch4\u003e9.3 SMB、OCCT BREP 与 STEP/IGES\u003c/h4\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e格式\u003c/td\u003e\u003ctd\u003e当前说明范围\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e.smb\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eSMLib 原生 BRep；用 \u003ccode\u003ewrite_to_file\u003c/code\u003e、\u003ccode\u003eread_brep_from_file\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e.usd/.usda/.usdc\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eBRepArray 或标准 Mesh，取决于导出入口\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOCCT \u003ccode\u003e.brep\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e有 \u003ccode\u003eocct_to_usd\u003c/code\u003e、\u003ccode\u003eusd_to_occt\u003c/code\u003e 工具；不是 \u003ccode\u003e.smb\u003c/code\u003e 的同义名\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSTEP / IGES / JT\u003c/td\u003e\u003ctd\u003e不能仅凭 README 中模型格式名称或源码类名，就推断已经提供完整可用的通用 Python 导入导出器\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003eLinux 完整 release 构建、运行库路径配置妥当后，OCCT 转换入口是：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e./_build/linux-x86_64/release/occt_to_usd input.brep output.usda\n./_build/linux-x86_64/release/usd_to_occt input.usda output.brep\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003ccode\u003eusd_to_occt\u003c/code\u003e 生成 OCCT ASCII \u003ccode\u003e.brep\u003c/code\u003e；多个 BRep 可能拆成带序号的文件。转换有方向、缝边、容差与曲面表示细节，应做双向回读和几何核对，不能只凭工具退出码成功。\u003c/p\u003e\u003cp\u003e如果实际业务主要依赖 STEP/IGES 交换，应单独验证所需格式的真实入口和保真性，再决定转换链路。本次没有转换任何业务文件。\u003c/p\u003e\u003ch3\u003e10. Python GUI 与查看模型\u003c/h3\u003e\u003cp\u003e先完成原生构建，再安装/使用 uv，从仓库根目录启动：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003euv run --locked --group gui python tools/scripts/smlib_gui.py\nuv run --locked --group gui python tools/scripts/smlib_gui.py --release\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e默认寻找 debug 库；只有 release 构建时加 \u003ccode\u003e--release\u003c/code\u003e。GUI 的依赖由根目录 \u003ccode\u003euv.lock\u003c/code\u003e 固定，包含 PySide6、PyVista、VTK、NumPy 等。uv 环境只负责这些 Python 依赖，不会替代 SMLib 原生构建。\u003c/p\u003e\u003cp\u003e冒烟检查：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003euv run --locked --group gui python tools/scripts/smlib_gui_smoke.py\nuv run --locked --group gui python tools/scripts/smlib_gui_smoke.py --show --timeout-ms 2000\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e批量生成四视图接触表，建议指定输出目录，避免把图片写回输入模型旁边：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003euv run --locked --group gui python tools/scripts/smlib_gui_render.py TestFiles --output-dir _assets_output/renders\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e渲染器识别 \u003ccode\u003e.brep\u003c/code\u003e、\u003ccode\u003e.smb\u003c/code\u003e、\u003ccode\u003e.usd\u003c/code\u003e、\u003ccode\u003e.usda\u003c/code\u003e、\u003ccode\u003e.usdc\u003c/code\u003e。默认保留组合图；要保留单独视图，加 \u003ccode\u003e--save-views\u003c/code\u003e。每个输入默认在独立进程中处理；增加 \u003ccode\u003e--jobs\u003c/code\u003e 前评估内存，读取生成的 \u003ccode\u003esmlib_gui_render_report.json\u003c/code\u003e 检查逐文件结果。\u003c/p\u003e\u003cp\u003eGUI 左侧的 User Tests 支持运行 Python 建模片段，\u003ccode\u003esm\u003c/code\u003e 与 \u003ccode\u003esmdev\u003c/code\u003e 已由环境注入。Python Reload 不会重载修改后的 C++ 扩展，后者必须重编译。GUI 中的 Save 会写用户测试目录，操作前确认目标。\u003c/p\u003e\u003cp\u003e若用 usdview 看 BrepArray，需构建并加载 hdUsdBrep 插件。Linux/Windows 的启动器与限制见 Hydra 插件说明（见原文附件）。普通查看器能打开 USD 文件，并不表示它能显示自定义 BrepArray；通用展示可优先导出标准 Mesh。\u003c/p\u003e\u003ch3\u003e11. C++ 集成入口\u003c/h3\u003e\u003cp\u003e新集成优先使用 \u003ccode\u003esource/SM_API/inc/\u003c/code\u003e 的公开头文件，对应 \u003ccode\u003eSmApiPrimitives.h\u003c/code\u003e、\u003ccode\u003eSmApiBrep.h\u003c/code\u003e、\u003ccode\u003eSmApiQueries.h\u003c/code\u003e、\u003ccode\u003eSmApiGeneral.h\u003c/code\u003e 等。项目使用 C++17。\u003c/p\u003e\u003cp\u003e从官方示例学习上下文、返回状态与析构方式：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e./repo.sh build -r --target sm_api_boolean_bounds_example\nLD_LIBRARY_PATH=\u0026quot;$PWD/_build/linux-x86_64/release:$PWD/_build/target-deps/usd/release/lib:${LD_LIBRARY_PATH:-}\u0026quot; ./_build/linux-x86_64/release/sm_api_boolean_bounds_example\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e以上是 Linux 示例；其他平台使用对应构建目录与动态库查找方式。源码与约定见 SM_API 示例说明（见原文附件）。\u003c/p\u003e\u003cp\u003e集成时重点检查：\u003c/p\u003e\u003cp\u003e1. 状态与 \u003ccode\u003eSM_SUCCESS\u003c/code\u003e 比较，当前数值是 1000，不能写成 \u003ccode\u003estatus == 0\u003c/code\u003e。\u003c/p\u003e\u003cp\u003e2. 初始化上下文后再创建对象，对象销毁顺序必须符合所属上下文寿命。\u003c/p\u003e\u003cp\u003e3. 原生布尔接口不同重载的输入所有权可能不同，不要照搬 Python 规则或另一个重载的析构方式。\u003c/p\u003e\u003cp\u003e4. 不应为每次布尔操作无条件计算 tight bounds；普通 bounds 与体积计算的代价不同，按实际需要查询。\u003c/p\u003e\u003cp\u003e5. 服务化默认使用多进程 worker，不能在同进程多个线程中任意并行调用 \u003ccode\u003eSmApi*\u003c/code\u003e 或 \u003ccode\u003e_omni_solid\u003c/code\u003e。\u003c/p\u003e\u003cp\u003e具体并发限制及少量专用例外见 concurrency.md（见原文附件）。“支持并行处理多个任务”不等于“所有内核调用都线程安全”。\u003c/p\u003e\u003ch3\u003e12. 测试与验收\u003c/h3\u003e\u003cp\u003e仓库完整源码构建后，先运行目标平台测试，再运行自己的模型验收。不要只以程序退出码、截图或面数作为几何正确性证据。\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e层次\u003c/td\u003e\u003ctd\u003e检查内容\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e安装\u003c/td\u003e\u003ctd\u003e正确解释器能导入正确版本模块\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e简单几何\u003c/td\u003e\u003ctd\u003eBox 的尺寸、拓扑、体积与流形状态符合预期\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e实际操作\u003c/td\u003e\u003ctd\u003e打孔/扫掠/圆角后几何与设计参数一致\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e数据保存\u003c/td\u003e\u003ctd\u003e保存到新目录、回读、对比量测与拓扑\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e可视化\u003c/td\u003e\u003ctd\u003e无缺面、明显反面、裂缝或错误单位\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e文件交换\u003c/td\u003e\u003ctd\u003e必要时经独立工具检查，确认目标软件能读\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e异常路径\u003c/td\u003e\u003ctd\u003e无效输入有明确诊断，失败后不沿用不确定对象\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e修改绑定时，可参考官方聚焦测试助手：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003etools/agent/run_smpylib_tests.sh --target test_omni_solid.TestBooleans\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e具体平台适用性与扩大测试范围见 .agents/skills/usd-brep-test-selection/SKILL.md（见原文附件）。本次只新增文档，按该规则做 Markdown、路径和示例语法静态检查，不运行内核回归。\u003c/p\u003e\u003ch3\u003e13. 已知问题与排障\u003c/h3\u003e\u003cp\u003e以本次提交 KNOWN_ISSUES.md（见原文附件） 为准，以下影响机械模型验收：\u003c/p\u003e\u003cp\u003e- \u003ccode\u003eremove_fillet\u003c/code\u003e 可能报告成功却没有移除圆角，必须检查结果。\u003c/p\u003e\u003cp\u003e- \u003ccode\u003eheal_brep\u003c/code\u003e 可能隐藏阶段性修复失败；周期面、球面和圆环的缝边修复存在已知缺陷，甚至改变空腔或丢面。不要对唯一原件直接修复。\u003c/p\u003e\u003cp\u003e- 圆角附近部分三角形可能反向；已发现案例中 \u003ccode\u003esurface_angle_tolerance_deg=15\u003c/code\u003e 可避开，但不是通用保证。\u003c/p\u003e\u003cp\u003e- 圆形裁剪边界的面积、体积和质量属性可能超出请求精度，应收紧积分参数并以独立基准核对。\u003c/p\u003e\u003cp\u003e- 不合法 BrepArray 的计数/索引可能使导入进程崩溃，应先校验外来文件；服务化宜隔离进程。\u003c/p\u003e\u003cp\u003e- 其他导出器生成的 UV trim 数据可能转换错误，不能把任意 BrepArray 兼容性视为已保证。\u003c/p\u003e\u003cp\u003e- 发行包中的部分 validator 包装脚本仍假定源码目录存在，应按已知问题中的替代入口调用。\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e现象\u003c/td\u003e\u003ctd\u003e优先检查\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eNo module named _omni_solid\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e完整层级是否构建、平台目录、Python ABI、PYTHONPATH\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003emacOS 下载不到 premake\u003c/td\u003e\u003ctd\u003e官方该包不在公共服务器，需要适用的用户级包源\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e找不到 \u003ccode\u003epxr\u003c/code\u003e / USD 共享库\u003c/td\u003e\u003ctd\u003eOpenUSD 安装、解释器、库查找路径和版本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBrepArray 无法读写\u003c/td\u003e\u003ctd\u003e是否先 prebuild、schema 是否存在、OMNISOLID_PLUGIN_PATH\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGUI 原生模块导入失败\u003c/td\u003e\u003ctd\u003euv 不能替代原生构建；检查 debug/release 是否匹配\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e布尔失败\u003c/td\u003e\u003ctd\u003e输入是否仍有效，是否共面/相切，薄特征是否接近容差\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e圆角失败\u003c/td\u003e\u003ctd\u003e边是否仍属于当前模型，半径是否超出局部几何\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e结果看不到\u003c/td\u003e\u003ctd\u003e自定义 BRep 与普通 Mesh 区别、插件、单位、相机和可见性\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e外置盘路径失效\u003c/td\u003e\u003ctd\u003e卷是否挂载、卷名是否改变、原入口是否仍为正确链接\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e\u003ccode\u003eRuntimeError\u003c/code\u003e 排查先读 .agents/docs/errors.md（见原文附件），记录调用名、\u003ccode\u003eSM_ERR_*\u003c/code\u003e、数字状态、\u003ccode\u003eKernel trace\u003c/code\u003e、输入参数与最小复现。不盲目重复使用可能已修改或已被接管的输入，不通过无限调松容差掩盖几何问题。\u003c/p\u003e\u003ch3\u003e14. 许可和商业集成\u003c/h3\u003e\u003cp\u003e仓库主许可证为 Apache-2.0（见原文附件）。其许可允许商业使用和在符合条款的情况下集成到闭源产品；这不意味着所有随附组件或 GUI 依赖都自动采用同一许可证。\u003c/p\u003e\u003cp\u003e依据 \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.apache.org/licenses/LICENSE-2.0.html\"\u003eApache 官方条款\u003c/a\u003e，分发时需要按实际情况保留许可证与相关声明、标明修改，并处理适用的 NOTICE 内容；商标许可不因此自动获得。主许可证对你的新增自有代码没有一概要求公开源码。\u003c/p\u003e\u003cp\u003e本仓库还存在这些需要分别处理的部分：\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e内容\u003c/td\u003e\u003ctd\u003e仓库披露的许可情况\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要 NVIDIA 源码\u003c/td\u003e\u003ctd\u003eApache-2.0\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003erepo.sh\u003c/code\u003e、\u003ccode\u003erepo.bat\u003c/code\u003e、repoman bootstrapper\u003c/td\u003e\u003ctd\u003eMIT\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOpenUSD 及其随附库\u003c/td\u003e\u003ctd\u003e按各自许可证及发行包内声明处理\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003epybind11\u003c/td\u003e\u003ctd\u003eBSD-3-Clause\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e可选 GUI 的 PySide6/Qt 等\u003c/td\u003e\u003ctd\u003e包含 LGPL/GPL 选项及其他许可，不能按内核许可一并推断\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eproposals 中的标准提案快照\u003c/td\u003e\u003ctd\u003e有单独的来源与补充条款说明\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e商业打包前以 THIRD_PARTY_NOTICES.md（见原文附件） 和最终交付包的许可证为准，按实际再分发组件核对。若只使用内核或 Python 包，不要无意中把完整开发 GUI 环境也一起打包。\u003c/p\u003e\u003ch3\u003e15. 日常维护与下一步\u003c/h3\u003e\u003cp\u003e每次使用先确认外置盘挂载。更新前检查本地新增文档和其他改动，不要重置或清理工作区：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003ecd /Users/ddt/work/projects/ai_agent/cad/usd-brep\ngit status --short\ngit log -1 --oneline\ngit fetch origin\n# 人工检查上游变化与本地文件后，再进行快进更新：\ngit pull --ff-only\ngit lfs pull\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e本次网络直连 GitHub 失败，改用 macOS 已配置的本地代理 \u003ccode\u003e127.0.0.1:7897\u003c/code\u003e 后成功。若当前代理仍在运行，可单次指定，不修改全局 Git 设置：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003egit -c http.proxy=http://127.0.0.1:7897 fetch origin\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e端口是本次环境观察值，未来可能改变。不要将失效代理写死为仓库必要条件。\u003c/p\u003e\u003cp\u003e建议后续顺序：先落实可构建平台与依赖 → 导入最小模块 → 跑 Box 与打孔板 → 验证保存回读 → 再引入圆角、外部模型、GUI 或服务集成。本机若暂时拿不到 macOS 所需包，可在已有 Linux/Windows 环境验证 Python 包，另行核算虚拟机/容器和依赖空间。\u003c/p\u003e\u003cp\u003e不建议因为空间紧张直接执行大范围删除。上游提及的 \u003ccode\u003e_build\u003c/code\u003e、\u003ccode\u003e_compiler\u003c/code\u003e、\u003ccode\u003e_repo\u003c/code\u003e 都是构建工具目录，但清理前仍须确认没有应保留的结果、日志或人工文件；本说明不执行清理。\u003c/p\u003e\u003ch3\u003e16. 本次交付记录与资料来源\u003c/h3\u003e\u003cp\u003e本次执行：\u003c/p\u003e\u003cp\u003e- 从官方 HTTPS 地址完成 Git clone，保留真实 origin 与提交历史。\u003c/p\u003e\u003cp\u003e- 源码、模型和 Git 历史实测约 96 MiB，保存于 NVME2T。\u003c/p\u003e\u003cp\u003e- 安装本机缺少的 Git LFS；执行仓库本地初始化及 LFS 拉取确认。\u003c/p\u003e\u003cp\u003e- \u003ccode\u003egit fsck --full\u003c/code\u003e 通过；LFS 跟踪文件清单为空。\u003c/p\u003e\u003cp\u003e- 原请求路径已建立指向外置盘的符号链接。\u003c/p\u003e\u003cp\u003e- 仅新增本文件，上游代码与配置保持不变。\u003c/p\u003e\u003cp\u003e- 43 个仓库内链接检查通过，4 个 Python 代码块及 18 个 Shell 代码块语法检查通过；引用接口已与声明静态核对。没有执行构建与建模运行验收。\u003c/p\u003e\u003cp\u003e主要来源：\u003c/p\u003e\u003cp\u003e1. \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://github.com/NVIDIA-Omniverse/usd-brep\"\u003e官方仓库\u003c/a\u003e 与 \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://nvidia-omniverse.github.io/usd-brep/\"\u003e官方文档站\u003c/a\u003e。\u003c/p\u003e\u003cp\u003e2. 本地 \u003ca href=\"#doc=cad3-7c7a5e3466e18942\" data-preview-doc=\"cad3-7c7a5e3466e18942\"\u003eREADME\u003c/a\u003e、AGENTS（见原文附件）、架构概览（见原文附件）。\u003c/p\u003e\u003cp\u003e3. Python API 使用规则（见原文附件）、布尔操作（见原文附件）、基本体（见原文附件）、网格化（见原文附件）、USD 互通（见原文附件）。\u003c/p\u003e\u003cp\u003e4. Python 分发包说明（见原文附件）、GUI 说明（见原文附件）、示例目录（见原文附件）。\u003c/p\u003e\u003cp\u003e5. LICENSE（见原文附件）、第三方声明（见原文附件）、已知问题（见原文附件）。\u003c/p\u003e\u003cp\u003e更新仓库后，应重新核对这些入口及平台限制；本说明不是对未来提交的兼容性保证。\u003c/p\u003e"}, {"id": "cad3-b335630551682c19", "path": "README.md", "source_path": "/Users/ddt/work/projects/ai_agent/doc 11. 2026-10-17开工差距待办登记", "12. 2026-10-21自审补强方案"], "body": "# 编制工作方案与协作边界\n\n2026-10-16；KB-3D-DESIGN-001；探索草案。本文先于本轮其余方案落盘，不新增产品代码。\n\n## 1. 用户确定的建设关系\n\n两套方案，共建一个工程知识库：\n\n- [二维知识库方案](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/README.md)继续服务二维图纸理解、审查及其现有开发。\n- 本目录聚焦三维机械建模的知识需求、数据扩展、计划执行和验证。\n- 不另建一套来源目录、知识正文库、确认记录或检索事实库；三维专项索引和模型缓存可独立部署，但必须可由共同版本与来源重建。\n- 三维详细设计不要求二维开发立即重构；本轮只引用二维文档，不改动其目录和现有代码。\n\n方案不是固定权威或审批制度。共享合同有变化时，用具体样例提出兼容增量，协同吸收，而非从三维文档单方面宣布现有合同已升级。\n\n## 2. 本轮交付范围\n\n|文件|内容|\n|---|---|\n|README.md|定位、阅读导航、共同目标和当前边界|\n|00-编制工作方案与协作边界.md|本工作方案、范围及先后顺序|\n|01-总体方案与共库架构.md|共享底座与三维应用架构、知识职责、判断链|\n|02-三维对象与共享数据契约扩展.md|表示、对象、特征、意图、版本、拓扑关联及兼容增量|\n|03-知识组织与资料吸收.md|国标、教材、手册、案例、模型和内核源码如何转成工程知识|\n|04-建模规划与usd-brep执行适配.md|参数计划、操作合同、内核边界、隔离和失败处理|\n|05-二维三维关联与工程验证.md|歧义、投影对照、分层验证、装配及工艺边界|\n|06-检索资源与秒级响应.md|检索与建模时延分开、索引、资源测量和恢复|\n|07-分阶段实施与验收设计.md|可并行工作包、拟建文件、验收样例及退出条件|\n|08-依据自查与待决问题.md|已核资料、设计取舍、静态自查和待验证事项|\n|依据与自查记录.json|来源指纹、链接检查、文档清单、范围与验证局限|\n\n首轮不编写建模程序、不修改usd-brep、不构建模型、不批量处理公开数据、不部署服务、不新开付费模型调用。\n\n## 3. 工作顺序\n\n1. 核对二维README、10/11、15/16/17及现有engineering-kb入口，避免重复设计已有七对象合同。\n2. 核对本地usd-brep的AGENTS、README、操作索引、布尔操作及资产生成约定；区分仓库描述与本机实测。\n3. 编制01—07，明确共享对象、三维增量、实现责任和两个方案的链接。\n4. 编制08及机器自查记录，检查本地链接、文档完整性、无伪造已实现状态、未修改既有开发文件。\n5. 按任务交付本目录。后续编码必须先复核二维当时的合同与本地内核实际版本，再细化对应工作包。\n\n## 4. 当前基线\n\n二维[16最小契约](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/16-首轮实施与最小契约设计.md)已定义AssetVersion、Unit、Observation、KnowledgeItem、CapabilityUnit、QueryReceipt、ReviewEvent；[17验证记录](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/17-首轮契约与真实来源验证记录.md)报告39项离线测试及真实ParaCAD来源核对。本轮只阅读报告，不重跑这39项测试。\n\n三维扩展在本轮全部为设计；本地内核是否可导入、算例能否运行、机械模型质量和性能均未在本轮测试。不会将资料存在、API有名称、测试设计或静态文档校验写成三维功能通过。\n\n## 5. 持续目标补充与接口细化计划\n\n用户进一步要求设置持续进行目标并一边编写三维方案一边跟进二维。已设置active目标；明确包含工程事实扩展、三维对象/特征、意图/过程、知识到操作映射及分层验证。本阶段继续细化而非以首版十篇文档作为完成。\n\n本轮追加09-首阶段接口与板孔样例设计.md、设计样例/板孔计划.json。它们是字段级设计和合成样例，不是产品代码、不修改共同Schema。写入后用静态检查核对JSON语法、步骤引用、单位、场景数量和链接，明确不代替未来合同验证器与内核运行。未来可执行合同仍按07的M1任务推进。\n\n## 6. 接口校验附件实施方案（先于附件代码）\n\n本轮在本目录新增契约/model-plan.schema.json、验证/validate_plan.py、验证/test_plan.py及验证/接口校验结果.json，配套10-接口校验与二维增量跟进.md。仅校验DESIGN阶段板孔计划的结构、字段、引用、依赖和条件；不称已实现建模执行器、共同服务或生产合同。使用二维已存在的隔离Python环境只读调用jsonschema，不安装或更改环境。\n\nSchema拒绝未知字段/版本/操作、错误量值和单位；语义检查覆盖依赖DAG、参数/要求引用、尺寸与孔内含边界、刀具/主实体关系、解析验证所需方法。错误位置有明确path/code。不能把合成来源当真实版本引用，不能把NOT_RUN变成成功。首版所有输入必须SYNTHETIC_DESIGN/NOT_RUN，真实来源与执行包需后续独立合同；拒绝越界支持比静默冒充真实包更清楚。\n\n测试包括原始合法样例及缺字段、额外字段、非法数值、错单位、孔越界、循环/断依赖、重复ID、错引用、原件/确认伪装、非受限操作等；另检查输入样例运行前后字节不变。正式编码前已复习01/02/04/05/07/09及二维19/20的边界；附件结果不能关闭真实几何/工艺/检索性能差距。\n\n## 7. 设计深度补充方案\n\n继续新增11-工程事实与设计意图.md、12-装配事实与条件化验证.md、13-跨版本特征绑定与修改协议.md。补齐共同事实信封、设计参数/约束和依赖求值、装配定义/实例/变换/约束/工况、跨版本绑定分裂合并与修改事务。三篇均先定义输入、判定、失败和可复核样例，再给M1/M2接口实施要求；不增加生产代码、不创建另一套知识身份或数据库。\n\n已观察到二维目录原型SQLite文件出现，但未见其验收回执；不读取正在写入的数据库、不宣布它已完成。跟进继续以明确版本与回执为准。\n\n新增14-内核适配前置与测量风险.md，保存只读探测、实际函数签名及已知测量缺陷影响。先不安装/编译；将M2环境与测量方法的前置拆清。\n\n## 8. 共库兼容实核与评审准备\n\n新增验证/test_shared_compat.py与验证/共库兼容结果.json，先记录本方案：只读导入当前二维kb_contracts，对现有合成及真实A bundle调用原校验器；三维设计包由独立入口校验、原入口应明确拒绝；共享旧对象身份和raw不变、跨scope仍拒绝。独立三维测试不修改共同工程/原件，禁用pyc写入；记录实际读到的代码/Schema/输入指纹，若运行期间指纹改变则结果无效并重核快照。\n\n补充15-共库接口映射与首阶段评审清单.md，列出真实样本路线、完整目标逐项证据、每个实施工作包的条件与局限。修订09过时的“尚无Schema”语句，保留历史含义，不能让旧状态误导当前开发。\n\n## 9. 通用事实附件计划\n\n本轮先编制[16](16-工程事实扩展合同实施设计.md)，再新增其中列出的Schema、示例和校验代码。只写本方案目录；正式共同Schema、原件及二维开发不变。\n\n## 10. 交付审计计划\n\n本轮按用户原始“共库、三维独立方案、可评审/首阶段可实施”的目标逐项核对，形成18-交付自查与实施移交.md和验证/目标逐项审计.json；整理README，标明历史阶段快照，避免旧“尚无Schema”状态误导。补附件依赖锁定与二维22的新设计影响。仅当每项方案要求都有内容和可回查证据、首阶段有具体文件/输入/输出/正反例/复现方法后才判定方案目标达成；软件M2—M5执行仍需按原实施方案完成，不能宣称已经运行。\n\n## 11. 2026-10-17开工差距待办登记\n\n按用户本轮要求，将六项工程收敛差距及建设覆盖表登记至19-首期开工差距与待办清单.md；为每项列优先级、依赖、产物和完成证据，全部保持待办状态。修订README当前成熟度表述，并在18标明后续复核入口；不改历史机器审计、不重开目标、不执行待办开发、不修改二维工程或内核。\n\n## 12. 2026-10-21自审补强方案\n\n用户要求自审知识库方案并补强。核对现有19开工待办、二维28持续编译/工程Wiki、29自查和当前合同，先找实际差距，再新增20-持续知识编译与三维工程Wiki设计.md、21-方案自审与补强记录_20261021.md。同步01/02/03/06/07/16/19/README的具体衔接；保留原交付回执与历史状态，不修改二维文档、原始资料、内核或已有合同实现。\n\n必要的小验证只读调用现有validate_facts，记录“直径误用角度单位”“拓扑关系被数值替代”等结构允许范围，结果保存验证/自审证据_20261021.json；不把模拟输入当真实工程证据，不在本轮偷换为生产Schema。\n\n导航需同步收录新文档：仅修改../方案导航资料/生成导航.py对20/21的职责分类并刷新三维地图，运行其既有针对性测试；不改二维导航或8842服务。补强属于设计，不自动执行19待办、启动模型编译或恢复定时任务。", "reference": false, "current": false, "truncated": false, "tags": ["record"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/00-%E7%BC%96%E5%88%B6%E5%B7%A5%E4%BD%9C%E6%96%B9%E6%A1%88%E4%B8%8E%E5%8D%8F%E4%BD%9C%E8%BE%B9%E7%95%8C.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e编制工作方案与协作边界\u003c/h2\u003e\u003cp\u003e2026-10-16；KB-3D-DESIGN-001；探索草案。本文先于本轮其余方案落盘，不新增产品代码。\u003c/p\u003e\u003ch3\u003e1. 用户确定的建设关系\u003c/h3\u003e\u003cp\u003e两套方案，共建一个工程知识库：\u003c/p\u003e\u003cp\u003e- \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-6cda5b6a346c8f74\"\u003e二维知识库方案 ↗\u003c/a\u003e继续服务二维图纸理解、审查及其现有开发。\u003c/p\u003e\u003cp\u003e- 本目录聚焦三维机械建模的知识需求、数据扩展、计划执行和验证。\u003c/p\u003e\u003cp\u003e- 不另建一套来源目录、知识正文库、确认记录或检索事实库；三维专项索引和模型缓存可独立部署，但必须可由共同版本与来源重建。\u003c/p\u003e\u003cp\u003e- 三维详细设计不要求二维开发立即重构；本轮只引用二维文档，不改动其目录和现有代码。\u003c/p\u003e\u003cp\u003e方案不是固定权威或审批制度。共享合同有变化时，用具体样例提出兼容增量，协同吸收，而非从三维文档单方面宣布现有合同已升级。\u003c/p\u003e\u003ch3\u003e2. 本轮交付范围\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e文件\u003c/td\u003e\u003ctd\u003e内容\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eREADME.md\u003c/td\u003e\u003ctd\u003e定位、阅读导航、共同目标和当前边界\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e00-编制工作方案与协作边界.md\u003c/td\u003e\u003ctd\u003e本工作方案、范围及先后顺序\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e01-总体方案与共库架构.md\u003c/td\u003e\u003ctd\u003e共享底座与三维应用架构、知识职责、判断链\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e02-三维对象与共享数据契约扩展.md\u003c/td\u003e\u003ctd\u003e表示、对象、特征、意图、版本、拓扑关联及兼容增量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e03-知识组织与资料吸收.md\u003c/td\u003e\u003ctd\u003e国标、教材、手册、案例、模型和内核源码如何转成工程知识\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e04-建模规划与usd-brep执行适配.m 计.md、设计样例/板孔计划.json。它们是字段级设计和合成样例，不是产品代码、不修改共同Schema。写入后用静态检查核对JSON语法、步骤引用、单位、场景数量和链接，明确不代替未来合同验证器与内核运行。未来可执行合同仍按07的M1任务推进。\u003c/p\u003e\u003ch3\u003e6. 接口校验附件实施方案（先于附件代码）\u003c/h3\u003e\u003cp\u003e本轮在本目录新增契约/model-plan.schema.json、验证/validate_plan.py、验证/test_plan.py及验证/接口校验结果.json，配套10-接口校验与二维增量跟进.md。仅校验DESIGN阶段板孔计划的结构、字段、引用、依赖和条件；不称已实现建模执行器、共同服务或生产合同。使用二维已存在的隔离Python环境只读调用jsonschema，不安装或更改环境。\u003c/p\u003e\u003cp\u003eSchema拒绝未知字段/版本/操作、错误量值和单位；语义检查覆盖依赖DAG、参数/要求引用、尺寸与孔内含边界、刀具/主实体关系、解析验证所需方法。错误位置有明确path/code。不能把合成来源当真实版本引用，不能把NOT_RUN变成成功。首版所有输入必须SYNTHETIC_DESIGN/NOT_RUN，真实来源与执行包需后续独立合同；拒绝越界支持比静默冒充真实包更清楚。\u003c/p\u003e\u003cp\u003e测试包括原始合法样例及缺字段、额外字段、非法数值、错单位、孔越界、循环/断依赖、重复ID、错引用、原件/确认伪装、非受限操作等；另检查输入样例运行前后字节不变。正式编码前已复习01/02/04/05/07/09及二维19/20的边界；附件结果不能关闭真实几何/工艺/检索性能差距。\u003c/p\u003e\u003ch3\u003e7. 设计深度补充方案\u003c/h3\u003e\u003cp\u003e继续新增11-工程事实与设计意图.md、12-装配事实与条件化验证.md、13-跨版本特征绑定与修改协议.md。补齐共同事实信封、设计参数/约束和依赖求值、装配定义/实例/变换/约束/工况、跨版本绑定分裂合并与修改事务。三篇均先定义输入、判定、失败和可复核样例，再给M1/M2接口实施要求；不增加生产代码、不创建另一套知识身份或数据库。\u003c/p\u003e\u003cp\u003e已观察到二维目录原型SQLite文件出现，但未见其验收回执；不读取正在写入的数据库、不宣布它已完成。跟进继续以明确版本与回执为准。\u003c/p\u003e\u003cp\u003e新增14-内核适配前置与测量风险.md，保存只读探测、实际函数签名及已知测量缺陷影响。先不安装/编译；将M2环境与测量方法的前置拆清。\u003c/p\u003e\u003ch3\u003e8. 共库兼容实核与评审准备\u003c/h3\u003e\u003cp\u003e新增验证/test_shared_compat.py与验证/共库兼容结果.json，先记录本方案：只读导入当前二维kb_contracts，对现有合成及真实A bundle调用原校验器；三维设计包由独立入口校验、原入口应明确拒绝；共享旧对象身份和raw不变、跨scope仍拒绝。独立三维测试不修改共同工程/原件，禁用pyc写入；记录实际读到的代码/Schema/输入指纹，若运行期间指纹改变则结果无效并重核快照。\u003c/p\u003e\u003cp\u003e补充15-共库接口映射与首阶段评审清单.md，列出真实样本路线、完整目标逐项证据、每个实施工作包的条件与局限。修订09过时的“尚无Schema”语句，保留历史含义，不能让旧状态误导当前开发。\u003c/p\u003e\u003ch3\u003e9. 通用事实附件计划\u003c/h3\u003e\u003cp\u003e本轮先编制\u003ca href=\"#doc=cad3-2c368f8bb44bddb2\" data-preview-doc=\"cad3-2c368f8bb44bddb2\"\u003e16\u003c/a\u003e，再新增其中列出的Schema、示例和校验代码。只写本方案目录；正式共同Schema、原件及二维开发不变。\u003c/p\u003e\u003ch3\u003e10. 交付审计计划\u003c/h3\u003e\u003cp\u003e本轮按用户原始“共库、三维独立方案、可评审/首阶段可实施”的目标逐项核对，形成18-交付自查与实施移交.md和验证/目标逐项审计.json；整理README，标明历史阶段快照，避免旧“尚无Schema”状态误导。补附件依赖锁定与二维22的新设计影响。仅当每项方案要求都有内容和可回查证据、首阶段有具体文件/输入/输出/正反例/复现方法后才判定方案目标达成；软件M2—M5执行仍需按原实施方案完成，不能宣称已经运行。\u003c/p\u003e\u003ch3\u003e11. 2026-10-17开工差距待办登记\u003c/h3\u003e\u003cp\u003e按用户本轮要求，将六项工程收敛差距及建设覆盖表登记至19-首期开工差距与待办清单.md；为每项列优先级、依赖、产物和完成证据，全部保持待办状态。修订README当前成熟度表述，并在18标明后续复核入口；不改历史机器审计、不重开目标、不执行待办开发、不修改二维工程或内核。\u003c/p\u003e\u003ch3\u003e12. 2026-10-21自审补强方案\u003c/h3\u003e\u003cp\u003e用户要求自审知识库方案并补强。核对现有19开工待办、二维28持续编译/工程Wiki、29自查和当前合同，先找实际差距，再新增20-持续知识编译与三维工程Wiki设计.md、21-方案自审与补强记录_20261021.md。同步01/02/03/06/07/16/19/README的具体衔接；保留原交付回执与历史状态，不修改二维文档、原始资料、内核或已有合同实现。\u003c/p\u003e\u003cp\u003e必要的小验证只读调用现有validate_facts，记录“直径误用角度单位”“拓扑关系被数值替代”等结构允许范围，结果保存验证/自审证据_20261021.json；不把模拟输入当真实工程证据，不在本轮偷换为生产Schema。\u003c/p\u003e\u003cp\u003e导航需同步收录新文档：仅修改../方案导航资料/生成导航.py对20/21的职责分类并刷新三维地图，运行其既有针对性测试；不改二维导航或8842服务。补强属于设计，不自动执行19待办、启动模型编译或恢复定时任务。\u003c/p\u003e"}, {"id": "cad3-4b3363db3f47fe95", "path": "三维机械建模知识库方案/01-总体方案与共库架构.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/01-总体方案与共库架构.md", "title": "总体方案与共库架构", "group": "overview", "sub": "design", "role": "设计 · 非功能验收", "sha256": "fb509dbf1cd351a6701ccec4a495a51ca14b0bda6f6456d164dc9dd5961edc03", "headings": ["总体方案与共库架构", "1. 建设对象", "2. 共库架构", "3. D01—D08在三维中的延伸", "4. J链扩展为工程事实链", "5. 保持二维聚焦的接入方式", "6. 首轮边界", "7. 2026-10-21：持续积累与工程Wiki"], "body": "# 总体方案与共库架构\n\nKB-3D-DESIGN-001。承接[二维总体方案](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/01-总体建设方案.md)、[知识职责](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/10-知识域与认知职责组织.md)与[判断链](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/11-工程判断链与能力单元.md)。这些是共同讨论基线，可修订；本文件不单方面更改二维当前实现合同。\n\n## 1. 建设对象\n\n共同建设“可用于工程任务的知识与方法”，同时容纳二维表达和三维模型。三维任务包括参数建模、既有模型理解、局部修改、图模一致性检查、装配/工艺分析；任务不同，所需依据和结论范围不同。\n\n知识库回答：是什么对象、有什么关系、什么条件下采用什么结构、为什么、有哪些替代、如何验证。建模执行器把明确的参数计划转换成几何。工程验证器检查计划、结果和要求之间的关系。这三者各有输入输出，但使用同一来源和知识身份。\n\n## 2. 共库架构\n\n```mermaid\nflowchart TD\n  A[标准 教材 手册 图册 经验 数据集 模型 源码] --\u003e B[共同资产版本与原文定位]\n  B --\u003e C[共同知识项 条件 方法 证据关系]\n  C --\u003e D[共同检索与任务证据服务]\n  D --\u003e E[二维理解与图纸审查]\n  D --\u003e F[三维对象理解与参数计划]\n  F --\u003e G[usd-brep适配与隔离执行]\n  G --\u003e H[几何 约束 图模 工程验证]\n  E --\u003e I[任务观察 确认 复检记录]\n  H --\u003e I\n  I --\u003e C\n```\n\n图为目标设计，箭头不代表接口已实现。I→C保留观察、假设、确认和可复用方法的区别；不能把一次建模成功自动发布成普遍工程知识。\n\n一个逻辑库允许专题分片与执行服务分离，保留项目/企业/资料用途边界。共库不意味着所有项目资料互相可见；检索与缓存仍按当前权限、用途、版本过滤。\n\n## 3. D01—D08在三维中的延伸\n\n|职责|三维用途|需要避免的误判|\n|---|---|---|\n|D01 表达符号|尺寸、公差、螺纹、表面要求如何映射到参数或语义属性|每个符号都必须雕成实体；网格能表达全部技术要求|\n|D02 对象功能|孔/轴/槽/轴肩/基准/零件族及其候选功能|见到圆柱面就断定是通孔或轴承座|\n|D03 关系语境|面边邻接、特征依赖、尺寸附着、装配接触、视图对应|几何相近即同对象；邻接即功能关系|\n|D04 规范约定|特定任务、材料、标准版次下的设计/表达要求|找到标准件形状便自动宣称合规|\n|D05 工程原理|定位、载荷传递、互换性、刚度及设计取舍的依据|生成合理故事替代有依据的分析|\n|D06 实现工艺|加工可达、装配顺序、检验方法、设备能力和成本|建模内核能做即工厂能做|\n|D07 诊断改进|薄壁、干涉、约束冲突、失败操作的原因与备选|为求几何成功偷偷改设计尺寸|\n|D08 验证学习|重放、体积/拓扑、参数扰动、投影对照和复检|截图相似即模型准确；某个测试通过即整件合格|\n\n一条知识可以被二维与三维共同引用，增加任务标签和输入角色即可；不复制正文分别维护“二维版条款”和“三维版条款”。\n\n## 4. J链扩展为工程事实链\n\n保留二维J0—J11的编号与认知含义，只在三维增加输入类型和方法。二维文档中的“图面事实”在共同层可理解为工程事实的一类，二维原开发无需立即改名。\n\n|环节|三维输入输出|\n|---|---|\n|J0任务范围|新建/修改/检查、目标零件、允许修改范围、质量与交付表示|\n|J1事实质量|参数、BRep、图纸、扫描/网格的来源、精度、已读范围|\n|J2表达语义|尺寸与技术要求解释；几何单位、坐标和公差类型|\n|J3对象关系|特征候选、参数附着、拓扑邻接、装配及跨表示关联|\n|J4工程情境|材料、载荷、工序、设备、装配及检验条件|\n|J5问题假设|候选结构、待建特征、检查覆盖和不确定性|\n|J6适用条件|结构/方法的前提与例外、冲突、必要补充信息|\n|J7方法执行|参数求值、操作DAG、内核调用、工程计算或规则|\n|J8结论分型|几何成功/失败、约束满足、条件建议、工程未判定|\n|J9解释|参数来源、采用方法、验证证据及未覆盖范围|\n|J10改进|候选修改、依赖影响、副作用、代价和替代路线|\n|J11复检回写|同输入重放、修改后检查、失败反例与适用范围|\n\n允许只问某孔体积或某条知识位置；不强制每次完整运行所有环节。\n\n## 5. 保持二维聚焦的接入方式\n\n- 二维继续现有W0/W1及七对象原型；三维先用快照和适配映射研究，不要求先部署公共服务。\n- 共享合同扩展用新增对象/明确版本表达，二维已有合法输入应仍可读取；迁移不得静默变更旧字段含义。\n- 三维结果通过共同Observation/KnowledgeItem等引用接入，专项大几何数据放派生存储，目录保留指纹与定位。\n- 共同组件变动先给出差异和兼容样例；本轮不改二维Schema、文档或运行状态。\n\n## 6. 首轮边界\n\n从简单但有诊断价值的参数化单零件开始：板孔或阶梯轴。先验证“参数—计划—几何—检查—证据”，再处理二维歧义、手册经验、既有模型特征恢复及装配。自由曲面、通用逆向、自动完整装配求解、CAE/CAM均为后续能力，不能由内核名称推导已具备。\n\n## 7. 2026-10-21：持续积累与工程Wiki\n\n共同底座补入知识修订、逐条主张支持、Wiki投影和持续编译，复用二维28而非另建三维Wiki主存。三维模型/意图/方法/案例按有版本的关系接入；知识依赖与实例依赖分开维护。导航页面不等于已编译的工程知识页，详见[20](20-持续知识编译与三维工程Wiki设计.md)。", "reference": false, "current": false, "truncated": false, "tags": ["design"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/01-%E6%80%BB%E4%BD%93%E6%96%B9%E6%A1%88%E4%B8%8E%E5%85%B1%E5%BA%93%E6%9E%B6%E6%9E%84.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e总体方案与共库架构\u003c/h2\u003e\u003cp\u003eKB-3D-DESIGN-001。承接\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-3ae7ed23243f53b0\"\u003e二维总体方案 ↗\u003c/a\u003e、\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-f462ea074baa33ea\"\u003e知识职责 ↗\u003c/a\u003e与\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-e7f9b4f47365ab28\"\u003e判断链 ↗\u003c/a\u003e。这些是共同讨论基线，可修订；本文件不单方面更改二维当前实现合同。\u003c/p\u003e\u003ch3\u003e1. 建设对象\u003c/h3\u003e\u003cp\u003e共同建设“可用于工程任务的知识与方法”，同时容纳二维表达和三维模型。三维任务包括参数建模、既有模型理解、局部修改、图模一致性检查、装配/工艺分析；任务不同，所需依据和结论范围不同。\u003c/p\u003e\u003cp\u003e知识库回答：是什么对象、有什么关系、什么条件下采用什么结构、为什么、有哪些替代、如何验证。建模执行器把明确的参数计划转换成几何。工程验证器检查计划、结果和要求之间的关系。这三者各有输入输出，但使用同一来源和知识身份。\u003c/p\u003e\u003ch3\u003e2. 共库架构\u003c/h3\u003e\u003cpre\u003e\u003ccode\u003eflowchart TD\n  A[标准 教材 手册 图册 经验 数据集 模型 源码] --\u0026gt; B[共同资产版本与原文定位]\n  B --\u0026gt; C[共同知识项 条件 方法 证据关系]\n  C --\u0026gt; D[共同检索与任务证据服务]\n  D --\u0026gt; E[二维理解与图纸审查]\n  D --\u0026gt; F[三维对象理解与参数计划]\n  F --\u0026gt; G[usd-brep适配与隔离执行]\n  G --\u0026gt; H[几何 约束 图模 工程验证]\n  E --\u0026gt; I[任务观察 确认 复检记录]\n  H --\u0026gt; I\n  I --\u0026gt; C\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e图为目标设计，箭头不代表接口已实现。I→C保留观察、假设、确认和可复用方法的区别；不能把一次建模成功自动发布成普遍工程知识。\u003c/p\u003e\u003cp\u003e一个逻辑库允许专题分片与执行服务分离，保留项目/企业/资料用途边界。共库不意味着所有项目资料互相可见；检索与缓存仍按当前权限、用途、版本过滤。\u003c/p\u003e\u003ch3\u003e3. D01—D08在三维中的延伸\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e职责\u003c/td\u003e\u003ctd\u003e三维用途\u003c/td\u003e\u003ctd\u003e需要避免的误判\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eD01 表达符号\u003c/td\u003e\u003ctd\u003e尺寸、公差、螺纹、表面要求如何映射到参数或语义属性\u003c/td\u003e\u003ctd\u003e每个符号都必须雕成实体；网格能表达全部技术要求\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eD02 对象功能\u003c/td\u003e\u003ctd\u003e孔/轴/槽/轴肩/基准/零件族及其候选功能\u003c/td\u003e\u003ctd\u003e见到圆柱面就断定是通孔或轴承座\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eD03 关系语境\u003c/td\u003e\u003ctd\u003e面边邻接、特征依赖、尺寸附着、装配接触、视图对应\u003c/td\u003e\u003ctd\u003e几何相近即同对象；邻接即功能关系\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eD04 规范约定\u003c/td\u003e\u003ctd\u003e特定任务、材料、标准版次下的设计/表达要求\u003c/td\u003e\u003ctd\u003e找到标准件形状便自动宣称合规\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eD05 工程原理\u003c/td\u003e\u003ctd\u003e定位、载荷传递、互换性、刚度及设计取舍的依据\u003c/td\u003e\u003ctd\u003e生成合理故事替代有依据的分析\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eD06 实现工艺\u003c/td\u003e\u003ctd\u003e加工可达、装配顺序、检验方法、设备能力和成本\u003c/td\u003e\u003ctd\u003e建模内核能做即工厂能做\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eD07 诊断改进\u003c/td\u003e\u003ctd\u003e薄壁、干涉、约束冲突、失败操作的原因与备选\u003c/td\u003e\u003ctd\u003e为求几何成功偷偷改设计尺寸\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eD08 验证学习\u003c/td\u003e\u003ctd\u003e重放、体积/拓扑、参数扰动、投影对照和复检\u003c/td\u003e\u003ctd\u003e截图相似即模型准确；某个测试通过即整件合格\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e一条知识可以被二维与三维共同引用，增加任务标签和输入角色即可；不复制正文分别维护“二维版条款”和“三维版条款”。\u003c/p\u003e\u003ch3\u003e4. J链扩展为工程事实链\u003c/h3\u003e\u003cp\u003e保留二维J0—J11的编号与认知含义，只在三维增加输入类型和方法。二维文档中的“图面事实”在共同层可理解为工程事实的一类，二维原开发无需立即改名。\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e环节\u003c/td\u003e\u003ctd\u003e三维输入输出\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJ0任务范围\u003c/td\u003e\u003ctd\u003e新建/修改/检查、目标零件、允许修改范围、质量与交付表示\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJ1事实质量\u003c/td\u003e\u003ctd\u003e参数、BRep、图纸、扫描/网格的来源、精度、已读范围\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJ2表达语义\u003c/td\u003e\u003ctd\u003e尺寸与技术要求解释；几何单位、坐标和公差类型\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJ3对象关系\u003c/td\u003e\u003ctd\u003e特征候选、参数附着、拓扑邻接、装配及跨表示关联\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJ4工程情境\u003c/td\u003e\u003ctd\u003e材料、载荷、工序、设备、装配及检验条件\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJ5问题假设\u003c/td\u003e\u003ctd\u003e候选结构、待建特征、检查覆盖和不确定性\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJ6适用条件\u003c/td\u003e\u003ctd\u003e结构/方法的前提与例外、冲突、必要补充信息\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJ7方法执行\u003c/td\u003e\u003ctd\u003e参数求值、操作DAG、内核调用、工程计算或规则\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJ8结论分型\u003c/td\u003e\u003ctd\u003e几何成功/失败、约束满足、条件建议、工程未判定\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJ9解释\u003c/td\u003e\u003ctd\u003e参数来源、采用方法、验证证据及未覆盖范围\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJ10改进\u003c/td\u003e\u003ctd\u003e候选修改、依赖影响、副作用、代价和替代路线\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eJ11复检回写\u003c/td\u003e\u003ctd\u003e同输入重放、修改后检查、失败反例与适用范围\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e允许只问某孔体积或某条知识位置；不强制每次完整运行所有环节。\u003c/p\u003e\u003ch3\u003e5. 保持二维聚焦的接入方式\u003c/h3\u003e\u003cp\u003e- 二维继续现有W0/W1及七对象原型；三维先用快照和适配映射研究，不要求先部署公共服务。\u003c/p\u003e\u003cp\u003e- 共享合同扩展用新增对象/明确版本表达，二维已有合法输入应仍可读取；迁移不得静默变更旧字段含义。\u003c/p\u003e\u003cp\u003e- 三维结果通过共同Observation/KnowledgeItem等引用接入，专项大几何数据放派生存储，目录保留指纹与定位。\u003c/p\u003e\u003cp\u003e- 共同组件变动先给出差异和兼容样例；本轮不改二维Schema、文档或运行状态。\u003c/p\u003e\u003ch3\u003e6. 首轮边界\u003c/h3\u003e\u003cp\u003e从简单但有诊断价值的参数化单零件开始：板孔或阶梯轴。先验证“参数—计划—几何—检查—证据”，再处理二维歧义、手册经验、既有模型特征恢复及装配。自由曲面、通用逆向、自动完整装配求解、CAE/CAM均为后续能力，不能由内核名称推导已具备。\u003c/p\u003e\u003ch3\u003e7. 2026-10-21：持续积累与工程Wiki\u003c/h3\u003e\u003cp\u003e共同底座补入知识修订、逐条主张支持、Wiki投影和持续编译，复用二维28而非另建三维Wiki主存。三维模型/意图/方法/案例按有版本的关系接入；知识依赖与实例依赖分开维护。导航页面不等于已编译的工程知识页，详见\u003ca href=\"#doc=cad3-616f55d8361b307c\" data-preview-doc=\"cad3-616f55d8361b307c\"\u003e20\u003c/a\u003e。\u003c/p\u003e"}, {"id": "cad3-cdbdb6499bad06c7", "path": "三维机械建模知识库方案/02-三维对象与共享数据契约扩展.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/02-三维对象与共享数据契约扩展.md", "title": "三维对象与共享数据契约扩展", "group": "facts", "sub": "design", "role": "工程事实/意图设计", "sha256": "5036a94bca2e776f9785023956c259dd60bfb287308b5f010eee5aa6218ce0fe", "headings": ["三维对象与共享数据契约扩展", "1. 三个必须分开的层次", "2. 沿用的七对象", "3. 拟新增的三维对象", "4. 单位、坐标和容差", "5. 拓扑身份与修改失效", "6. 版本与共同发布", "7. 必须验证的合同反例", "8. 2026-10-21：语义注册与编译关联补强"], "body": "\u003e 后续补充：多域工程事实、意图、绑定与装配已有受限设计Schema和校验附件，见[16](16-工程事实扩展合同实施设计.md)、[17](17-工程事实合同验证与实施边界.md)；不等于生产合同或内核能力已验收。\n\n# 三维对象与共享数据契约扩展\n\n承接二维[02数据治理](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/02-全量记忆与数据治理.md)和[16最小契约](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/16-首轮实施与最小契约设计.md)。以下为增量设计，不是现有Schema已接受的字段；新类型进入实现前需补正式Schema与正反例。\n\n## 1. 三个必须分开的层次\n\n1. **表示**：图纸、BRep、网格、参数表、程序或说明；它们保存不同信息和误差。\n2. **工程对象**：零件、特征、基准、装配实例；同一对象可以有多种表示。\n3. **设计意图**：功能、关键参数、约束与选择理由；不能由面数或几何形状完整反推。\n\nBRep不是特征历史，网格不是精确BRep，场景层级不是装配约束求解器。导入几何可能没有历史；可增建候选特征，但不得伪称恢复了原作者的设计意图。\n\n## 2. 沿用的七对象\n\n|既有对象|三维使用方式|不改变的语义|\n|---|---|---|\n|AssetVersion|原模型、参数、建模程序、内核说明的内容版本|稳定来源身份与内容哈希分开|\n|Unit|模型实体范围、源页、操作记录的定位入口|身份绑定版本与定位；现原型仅支持IMAGE/JSON/TEXT|\n|Observation|测得体积、识别特征、投影对照结果|观察不是规范结论，保留来源和方法|\n|KnowledgeItem|孔/轴概念、工艺条件、建模方法、失败经验|命题与适用条件、依据、限制可追溯|\n|CapabilityUnit|特征识别/构造/验证方法登记|有输入角色和条件，不是任意脚本入口|\n|QueryReceipt|本次找到的知识、证据、缺口和范围|候选与已读证据不同；角色齐备非工程合格|\n|ReviewEvent|指定字符/对象/方案的确认事件|现原型只支持READING；不能擅自增加工程确认动作|\n\n## 3. 拟新增的三维对象\n\n|设计类型|主要字段/关系|用途|\n|---|---|---|\n|ModelRepresentation|asset_version_ref、format、producer、unit、frame、tolerance_policy、content_ref|记录几何表示及生产/转换来源|\n|EngineeringObject|object_id、kind、revision、parent_ref、representation_refs|持久工程身份；区分零件定义和装配实例|\n|FeatureHypothesis|kind、support_refs、bindings、alternatives、status、method_ref|候选孔/槽/轴肩等语义，不伪装为原生特征|\n|DesignIntent|requirements、parameters、constraints、unknowns、source_refs|记录功能与参数来源，保留设计缺口|\n|ModelPlan|plan_revision、inputs、steps、dependency_edges、checks、allowed_changes|声明建模方案和修改范围|\n|OperationRun|plan_step、adapter_version、input/output_hashes、options、diagnostics、elapsed|实际执行方法记录；复用共同MethodRun设计|\n|EntityBinding|object_revision、representation_revision、locator、basis、state|将工程对象绑定到面/边/区域，有版本与失效状态|\n|ValidationRecord|requirement_refs、method_run_ref、expected、observed、outcome、coverage|检查结果与工程结论分开|\n\n它们是待协同的最小候选，并不强求八张新表。OperationRun/ValidationRecord应优先复用共同MethodRun/Relation等后续合同，避免三维另起平行事件体系。大数组不塞进知识正文；记录受控存储引用、字节哈希、包成员/实体定位。\n\n## 4. 单位、坐标和容差\n\n- 数值沿用显式单位和十进制语义；单位未知保留null。内核浮点入参是经验证的转换结果，记录转换和误差预算。\n- 必须声明长度/角度单位、坐标系ID、轴向、手性、变换矩阵约定与装配实例变换。缺失时先识别为未知，不能按视觉大小猜毫米。\n- 转换矩阵明确源/目标frame及作用顺序；镜像、非均匀缩放须登记并重新验证法向、方向与几何。\n- 分开存设计公差、内核几何容差、离散化误差和测量/比较容差。不能拿“放大几何容差”替代满足设计要求。\n- 公差、粗糙度、材料和热处理多为语义属性/检验约束，不需要全部生成实体几何。螺纹可选语义/简化/完整几何表示，明确用途和精度损失。\n- 面积、体积、密度、载荷等新量纲超出现首轮单位集合，需版本化扩展并测试，不能直接塞进现求值器当已支持。\n\n## 5. 拓扑身份与修改失效\n\n不能用“第3条边”当跨修改稳定身份。布尔、圆角、修复、导入均可能分裂/合并/重编号。绑定记录以下状态：RESOLVED、AMBIGUOUS、INVALIDATED、UNRESOLVED（设计枚举）。\n\n优先记录生成步骤与输入特征的语义来源；重定位可结合支撑面类型、局部坐标、尺寸区间、邻接、所属特征和位置。几何签名只能生成候选，不能保证全局唯一。对称模型出现多个候选时返回歧义，禁止默认选第一个。\n\n模型版本改变，先使受影响绑定失效，再重求候选、验证尺寸/关系并记录结果。旧结果保留供回查；未受影响的引用也须有依赖依据，不能一律声称有效。跨版本关系是一条有证据的新记录，不把旧locator改写成新意义。\n\n## 6. 版本与共同发布\n\nModelPlan、内核/适配版本、知识快照、模型字节和验证方法都需绑定。相同参数并不保证不同内核版本产出相同字节或拓扑划分；比较应选择任务所需几何/语义观测量，不能只比文件哈希或面数。\n\n旧七对象输入不因增加三维能力而强制填写ModelPlan。建议单独扩展包或新版本入口；每个入口声明支持版本，未知类型返回UNSUPPORTED_SCHEMA，不静默丢字段。旧READING确认不能迁移为设计正确；新的几何/工程确认范围须单独设计操作者可信来源、幂等、冲突和撤回。\n\n## 7. 必须验证的合同反例\n\n缺单位；图纸与模型版次不一致；毫米转换为厘米误缩放；镜像变换未登记；圆角后旧边绑定；对称孔定位多候选；缺源的模型判断；READING确认升级工程结论；旧消费者遇新类型；不同项目越界引用。全部为待实施测试，不是通过记录。\n\n## 8. 2026-10-21：语义注册与编译关联补强\n\n生产事实入口还需PredicateDefinition/version、值类型、对象类型、量纲、基数、上下文和方法合同；当前模拟Schema未约束这些含义。自审实际发现直径deg、拓扑标量和混量纲推导均能通过旧附件，见[证据](验证/自审证据_20261021.json)。不得将contract_valid推为可执行或工程正确。\n\n共同KnowledgeRevision/ClaimSupport/WikiPageRevision/CompileRun/ExperienceRevision/ImpactEvent沿用二维28；三维只扩展模型/配置/绑定/工具关联。完整字段/迁移与执行准入仍待实现，见[20](20-持续知识编译与三维工程Wiki设计.md)。", "reference": false, "current": false, "truncated": false, "tags": ["design"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/02-%E4%B8%89%E7%BB%B4%E5%AF%B9%E8%B1%A1%E4%B8%8E%E5%85%B1%E4%BA%AB%E6%95%B0%E6%8D%AE%E5%A5%91%E7%BA%A6%E6%89%A9%E5%B1%95.md", "source_kind": "markdown", "preview_html": "\u003cp\u003e\u0026gt; 后续补充：多域工程事实、意图、绑定与装配已有受限设计Schema和校验附件，见\u003ca href=\"#doc=cad3-2c368f8bb44bddb2\" data-preview-doc=\"cad3-2c368f8bb44bddb2\"\u003e16\u003c/a\u003e、\u003ca href=\"#doc=cad3-c592d1bd1b31841b\" data-preview-doc=\"cad3-c592d1bd1b31841b\"\u003e17\u003c/a\u003e；不等于生产合同或内核能力已验收。\u003c/p\u003e\u003ch2\u003e三维对象与共享数据契约扩展\u003c/h2\u003e\u003cp\u003e承接二维\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-6f91c9fd23fcf004\"\u003e02数据治理 ↗\u003c/a\u003e和\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-29c6a198af2edf05\"\u003e16最小契约 ↗\u003c/a\u003e。以下为增量设计，不是现有Schema已接受的字段；新类型进入实现前需补正式Schema与正反例。\u003c/p\u003e\u003ch3\u003e1. 三个必须分开的层次\u003c/h3\u003e\u003cp\u003e1. \u003cstrong\u003e表示\u003c/strong\u003e：图纸、BRep、网格、参数表、程序或说明；它们保存不同信息和误差。\u003c/p\u003e\u003cp\u003e2. \u003cstrong\u003e工程对象\u003c/strong\u003e：零件、特征、基准、装配实例；同一对象可以有多种表示。\u003c/p\u003e\u003cp\u003e3. \u003cstrong\u003e设计意图\u003c/strong\u003e：功能、关键参数、约束与选择理由；不能由面数或几何形状完整反推。\u003c/p\u003e\u003cp\u003eBRep不是特征历史，网格不是精确BRep，场景层级不是装配约束求解器。导入几何可能没有历史；可增建候选特征，但不得伪称恢复了原作者的设计意图。\u003c/p\u003e\u003ch3\u003e2. 沿用的七对象\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e既有对象\u003c/td\u003e\u003ctd\u003e三维使用方式\u003c/td\u003e\u003ctd\u003e不改变的语义\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAssetVersion\u003c/td\u003e\u003ctd\u003e原模型、参数、建模程序、内核说明的内容版本\u003c/td\u003e\u003ctd\u003e稳定来源身份与内容哈希分开\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eUnit\u003c/td\u003e\u003ctd\u003e模型实体范围、源页、操作记录的定位入口\u003c/td\u003e\u003ctd\u003e身份绑定版本与定位；现原型仅支持IMAGE/JSON/TEXT\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eObservation\u003c/td\u003e\u003ctd\u003e测得体积、识别特征、投影对照结果\u003c/td\u003e\u003ctd\u003e观察不是规范结论，保留来源和方法\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eKnowledgeItem\u003c/td\u003e\u003ctd\u003e孔/轴概念、工艺条件、建模方法、失败经验\u003c/td\u003e\u003ctd\u003e命题与适用条件、依据、限制可追溯\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCapabilityUnit\u003c/td\u003e\u003ctd\u003e特征识别/构造/验证方法登记\u003c/td\u003e\u003ctd\u003e有输入角色和条件，不是任意脚本入口\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eQueryReceipt\u003c/td\u003e\u003ctd\u003e本次找到的知识、证据、缺口和范围\u003c/td\u003e\u003ctd\u003e候选与已读证据不同；角色齐备非工程合格\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eReviewEvent\u003c/td\u003e\u003ctd\u003e指定字符/对象/方案的确认事件\u003c/td\u003e\u003ctd\u003e现原型只支持READING；不能擅自增加工程确认动作\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003ch3\u003e3. 拟新增的三维对象\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e设计类型\u003c/td\u003e\u003ctd\u003e主要字段/关系\u003c/td\u003e\u003ctd\u003e用途\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eModelRepresentation\u003c/td\u003e\u003ctd\u003easset_version_ref、format、producer、unit、frame、tolerance_policy、content_ref\u003c/td\u003e\u003ctd\u003e记录几何表示及生产/转换来源\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eEngineeringObject\u003c/td\u003e\u003ctd\u003eobject_id、kind、revision、parent_ref、representation_refs\u003c/td\u003e\u003ctd\u003e持久工程身份；区分零件定义和装配实例\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eFeatureHypothesis\u003c/td\u003e\u003ctd\u003ekind、support_refs、bindings、alternatives、status、method_ref\u003c/td\u003e\u003ctd\u003e候选孔/槽/轴肩等语义，不伪装为原生特征\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDesignIntent\u003c/td\u003e\u003ctd\u003erequirements、parameters、constraints、unknowns、source_refs\u003c/td\u003e\u003ctd\u003e记录功能与参数来源，保留设计缺口\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eModelPlan\u003c/td\u003e\u003ctd\u003eplan_revision、inputs、steps、dependency_edges、checks、allowed_changes\u003c/td\u003e\u003ctd\u003e声明建模方案和修改范围\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOperationRun\u003c/td\u003e\u003ctd\u003eplan_step、adapter_version、input/output_hashes、options、diagnostics、elapsed\u003c/td\u003e\u003ctd\u003e实际执行方法记录；复用共同MethodRun设计\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eEntityBinding\u003c/td\u003e\u003ctd\u003eobject_revision、representation_revision、locator、basis、state\u003c/td\u003e\u003ctd\u003e将工程对象绑定到面/边/区域，有版本与失效状态\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eValidationRecord\u003c/td\u003e\u003ctd\u003erequirement_refs、method_run_ref、expected、observed、outcome、coverage\u003c/td\u003e\u003ctd\u003e检查结果与工程结论分开\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e它们是待协同的最小候选，并不强求八张新表。OperationRun/ValidationRecord应优先复用共同MethodRun/Relation等后续合同，避免三维另起平行事件体系。大数组不塞进知识正文；记录受控存储引用、字节哈希、包成员/实体定位。\u003c/p\u003e\u003ch3\u003e4. 单位、坐标和容差\u003c/h3\u003e\u003cp\u003e- 数值沿用显式单位和十进制语义；单位未知保留null。内核浮点入参是经验证的转换结果，记录转换和误差预算。\u003c/p\u003e\u003cp\u003e- 必须声明长度/角度单位、坐标系ID、轴向、手性、变换矩阵约定与装配实例变换。缺失时先识别为未知，不能按视觉大小猜毫米。\u003c/p\u003e\u003cp\u003e- 转换矩阵明确源/目标frame及作用顺序；镜像、非均匀缩放须登记并重新验证法向、方向与几何。\u003c/p\u003e\u003cp\u003e- 分开存设计公差、内核几何容差、离散化误差和测量/比较容差。不能拿“放大几何容差”替代满足设计要求。\u003c/p\u003e\u003cp\u003e- 公差、粗糙度、材料和热处理多为语义属性/检验约束，不需要全部生成实体几何。螺纹可选语义/简化/完整几何表示，明确用途和精度损失。\u003c/p\u003e\u003cp\u003e- 面积、体积、密度、载荷等新量纲超出现首轮单位集合，需版本化扩展并测试，不能直接塞进现求值器当已支持。\u003c/p\u003e\u003ch3\u003e5. 拓扑身份与修改失效\u003c/h3\u003e\u003cp\u003e不能用“第3条边”当跨修改稳定身份。布尔、圆角、修复、导入均可能分裂/合并/重编号。绑定记录以下状态：RESOLVED、AMBIGUOUS、INVALIDATED、UNRESOLVED（设计枚举）。\u003c/p\u003e\u003cp\u003e优先记录生成步骤与输入特征的语义来源；重定位可结合支撑面类型、局部坐标、尺寸区间、邻接、所属特征和位置。几何签名只能生成候选，不能保证全局唯一。对称模型出现多个候选时返回歧义，禁止默认选第一个。\u003c/p\u003e\u003cp\u003e模型版本改变，先使受影响绑定失效，再重求候选、验证尺寸/关系并记录结果。旧结果保留供回查；未受影响的引用也须有依赖依据，不能一律声称有效。跨版本关系是一条有证据的新记录，不把旧locator改写成新意义。\u003c/p\u003e\u003ch3\u003e6. 版本与共同发布\u003c/h3\u003e\u003cp\u003eModelPlan、内核/适配版本、知识快照、模型字节和验证方法都需绑定。相同参数并不保证不同内核版本产出相同字节或拓扑划分；比较应选择任务所需几何/语义观测量，不能只比文件哈希或面数。\u003c/p\u003e\u003cp\u003e旧七对象输入不因增加三维能力而强制填写ModelPlan。建议单独扩展包或新版本入口；每个入口声明支持版本，未知类型返回UNSUPPORTED_SCHEMA，不静默丢字段。旧READING确认不能迁移为设计正确；新的几何/工程确认范围须单独设计操作者可信来源、幂等、冲突和撤回。\u003c/p\u003e\u003ch3\u003e7. 必须验证的合同反例\u003c/h3\u003e\u003cp\u003e缺单位；图纸与模型版次不一致；毫米转换为厘米误缩放；镜像变换未登记；圆角后旧边绑定；对称孔定位多候选；缺源的模型判断；READING确认升级工程结论；旧消费者遇新类型；不同项目越界引用。全部为待实施测试，不是通过记录。\u003c/p\u003e\u003ch3\u003e8. 2026-10-21：语义注册与编译关联补强\u003c/h3\u003e\u003cp\u003e生产事实入口还需PredicateDefinition/version、值类型、对象类型、量纲、基数、上下文和方法合同；当前模拟Schema未约束这些含义。自审实际发现直径deg、拓扑标量和混量纲推导均能通过旧附件，见\u003ca href=\"#doc=cad3-e379503c52109a34\" data-preview-doc=\"cad3-e379503c52109a34\"\u003e证据\u003c/a\u003e。不得将contract_valid推为可执行或工程正确。\u003c/p\u003e\u003cp\u003e共同KnowledgeRevision/ClaimSupport/WikiPageRevision/CompileRun/ExperienceRevision/ImpactEvent沿用二维28；三维只扩展模型/配置/绑定/工具关联。完整字段/迁移与执行准入仍待实现，见\u003ca href=\"#doc=cad3-616f55d8361b307c\" data-preview-doc=\"cad3-616f55d8361b307c\"\u003e20\u003c/a\u003e。\u003c/p\u003e"}, {"id": "cad3-e4055e81fb58f798", "path": "三维机械建模知识库方案/03-知识组织与资料吸收.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/03-知识组织与资料吸收.md", "title": "知识组织与资料吸收", "group": "overview", "sub": "design", "role": "设计 · 非功能验收", "sha256": "e8ae909fd44b08bde0f7004dee96ca740f0e502fdf066cdf973c6a314f76b906", "headings": ["知识组织与资料吸收", "1. 从资料走向可执行的工程知识", "2. 三维知识单元的建议结构", "3. 现有三项公开数据的定位", "4. 每份资料的吸收顺序", "5. 跨二维三维共建例", "6. 首批建议主题", "7. 2026-10-21：吸收后的积累与维护"], "body": "# 知识组织与资料吸收\n\n共同依据：[二维10知识职责](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/10-知识域与认知职责组织.md)、[14现有及采购资料吸收](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/14-现有资料与采购资料吸收方案.md)。同一来源只登记一次，多任务引用，不复制另一套“三维教材库”。\n\n## 1. 从资料走向可执行的工程知识\n\n三维重点不是多收模型截图，而是把“对象是什么—为什么选这种结构—何时适用—参数怎样确定—怎样构造—如何检验—失败如何改”连起来。图片、图纸和三维模型提供观察与案例，不能独自填补工况、材料和加工能力。\n\n|资料|三维可提炼的知识|保留的上下文与限制|\n|---|---|---|\n|标准与规范|术语、尺寸系列、技术要求、检验与表达约定|适用对象、版次、条件、例外、原页；不编未读条款|\n|机械制图/设计教材|投影与剖切、对象概念、典型结构、功能和参数关系|教学简化、图注、章节前提；正确例图非完整设计模板|\n|设计/工艺/检验手册|参数选用、表格、公式、结构细节、加工/测量方法|表头单位、范围、材料、设备、工序、变量定义|\n|正误图册|结构前后差异、错误机理、修正条件、边界变体|不能只留下“红叉/绿勾”；区分表达错误和工程问题|\n|现场经验|特定工况下的观察、诊断、方案、复检结果|设备、工艺、批次、失败与成功范围，不能泛化至所有工厂|\n|三维工程文件|几何、拓扑、结构、装配实例与可用语义|格式、生产软件、导入转换、单位、精度和语义缺失|\n|内核源码/API/算例|操作前提、参数、所有权、错误与验证方法|精确版本与真实执行结果；工具用法不是机械设计依据|\n\n在未核验教材/手册正文和获取状态前，只登记采购线索和知识缺口。不得由书名补写该书里的槽宽、圆角或公差值。\n\n## 2. 三维知识单元的建议结构\n\n每项按需要包含：problem、object_kind、function_context、required_inputs、conditions、exceptions、parameter_selection、construction_strategy、validation_methods、alternatives、side_effects、source_refs、unknowns、reusable_scope。\n\n不要求每条知识具备全部字段。概念解释可以没有构造步骤；几何构造方法可以不含工艺结论。共享KnowledgeItem保存命题与来源，CapabilityUnit登记可执行方法，两者通过引用连接。\n\n例如“某类轴肩附近考虑退刀结构”应拆清：功能/工序前提、所需尺寸与依据、结构候选、构造方式、加工与配合检查。不能从例图直接抄一个槽宽成为全局规则；没有实际依据时只能形成待核知识草稿。\n\n## 3. 现有三项公开数据的定位\n\n|数据|三维应用价值|当前不能据此推导|\n|---|---|---|\n|ParaCAD|图形/JSON几何与约束的对照、二维表达语义、局部参数来源冲突实验|每张图都有可用DXF；标签等于真值；天然含厚度或完整三维设计|\n|TriView2CAD|在其限定对象族中研究视图、尺寸、参数与DXF的关系|20万种通用机械零件；学会了所有机械结构或工艺|\n|TrOCR工程文字行|工程标注字形/字串读取、符号混淆与确认方法|整图对象关联、视图重建、三维特征或工艺知识|\n\n资料格式、用途与许可状态继续引用各数据根的详细使用说明，不在此另建冲突副本：\n\n- [ParaCAD详细使用说明](/Volumes/NVME2T/projects/ai_agent/cad/dataset/ParaCAD/详细使用说明.md)。\n- [TriView2CAD详细使用说明](/Volumes/NVME2T/projects/ai_agent/cad/dataset/TriView2CAD/详细使用说明.md)。\n\nTrOCR实际根目录名在共同来源目录中核对后接入，本文不虚构文件链接。公开可下载不自动等于任何用途均可；沿用共同来源用途记录。\n\n## 4. 每份资料的吸收顺序\n\n1. 共同登记来源、内容版本、可用范围和用途。\n2. 保留章节、页、表格、公式、图片/模型实体的原始定位，记录解析失败与未覆盖范围。\n3. 选首批三维主题，提炼有条件的概念、关系、方法及对照；复用已被二维提炼的知识项。\n4. 将方法绑定到计划角色与验证方法；没有可执行工具时标METHOD_UNAVAILABLE，不能用语言结果代替运行。\n5. 用正例、反例、条件未知、近似但不适用例验证；经验只在已证明范围发布。\n\n## 5. 跨二维三维共建例\n\n同一条“直径/半径表达”知识：二维用于解释符号，三维用于参数映射和测量。新增的是任务用法与对象关系，不另抄一份正文。同一条“材料与工序限制”知识：二维用于给出条件化风险，三维用于筛选结构候选与复检；工况缺失时两边都保留未知。\n\n同一个错误案例可有PNG局部、DXF句柄、三维实体范围和操作日志；共享工程对象与证据关系将它们连接。不同来源的相似形状不直接合并对象或确认记录。\n\n## 6. 首批建议主题\n\n从参数明确的板孔与阶梯轴开始，逐步吸收孔轴配合、轴肩/退刀、倒角圆角、基准与检验，再到支架及小装配。主题是否进入由实际可用资料与方法决定，不为凑覆盖而生成无来源工程知识。覆盖统计同时报告对象族、D职责、J环节、条件区间、方法和未决项。\n\n## 7. 2026-10-21：吸收后的积累与维护\n\n资料提炼后形成有来源、条件与版本的KnowledgeRevision，再生成共同工程Wiki中的三维主题/策略/方法/案例页。页面逐条回到主张及原文，模型生成的解释保留假设与争议。新资料、方法修复或反例触发增量维护，不把每份PNG/每次对话生成独立页面。血缘相同的图、网格和页面按根来源去重，详见[20](20-持续知识编译与三维工程Wiki设计.md)。", "reference": false, "current": false, "truncated": false, "tags": ["design"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/03-%E7%9F%A5%E8%AF%86%E7%BB%84%E7%BB%87%E4%B8%8E%E8%B5%84%E6%96%99%E5%90%B8%E6%94%B6.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e知识组织与资料吸收\u003c/h2\u003e\u003cp\u003e共同依据：\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-f462ea074baa33ea\"\u003e二维10知识职责 ↗\u003c/a\u003e、\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-a368d3c80e839a45\"\u003e14现有及采购资料吸收 ↗\u003c/a\u003e。同一来源只登记一次，多任务引用，不复制另一套“三维教材库”。\u003c/p\u003e\u003ch3\u003e1. 从资料走向可执行的工程知识\u003c/h3\u003e\u003cp\u003e三维重点不是多收模型截图，而是把“对象是什么—为什么选这种结构—何时适用—参数怎样确定—怎样构造—如何检验—失败如何改”连起来。图片、图纸和三维模型提供观察与案例，不能独自填补工况、材料和加工能力。\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e资料\u003c/td\u003e\u003ctd\u003e三维可提炼的知识\u003c/td\u003e\u003ctd\u003e保留的上下文与限制\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e标准与规范\u003c/td\u003e\u003ctd\u003e术语、尺寸系列、技术要求、检验与表达约定\u003c/td\u003e\u003ctd\u003e适用对象、版次、条件、例外、原页；不编未读条款\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e机械制图/设计教材\u003c/td\u003e\u003ctd\u003e投影与剖切、对象概念、典型结构、功能和参数关系\u003c/td\u003e\u003ctd\u003e教学简化、图注、章节前提；正确例图非完整设计模板\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e设计/工艺/检验手册\u003c/td\u003e\u003ctd\u003e参数选用、表格、公式、结构细节、加工/测量方法\u003c/td\u003e\u003ctd\u003e表头单位、范围、材料、设备、工序、变量定义\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e正误图册\u003c/td\u003e\u003ctd\u003e结构前后差异、错误机理、修正条件、边界变体\u003c/td\u003e\u003ctd\u003e不能只留下“红叉/绿勾”；区分表达错误和工程问题\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e现场经验\u003c/td\u003e\u003ctd\u003e特定工况下的观察、诊断、方案、复检结果\u003c/td\u003e\u003ctd\u003e设备、工艺、批次、失败与成功范围，不能泛化至所有工厂\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e三维工程文件\u003c/td\u003e\u003ctd\u003e几何、拓扑、结构、装配实例与可用语义\u003c/td\u003e\u003ctd\u003e格式、生产软件、导入转换、单位、精度和语义缺失\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e内核源码/API/算例\u003c/td\u003e\u003ctd\u003e操作前提、参数、所有权、错误与验证方法\u003c/td\u003e\u003ctd\u003e精确版本与真实执行结果；工具用法不是机械设计依据\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e在未核验教材/手册正文和获取状态前，只登记采购线索和知识缺口。不得由书名补写该书里的槽宽、圆角或公差值。\u003c/p\u003e\u003ch3\u003e2. 三维知识单元的建议结构\u003c/h3\u003e\u003cp\u003e每项按需要包含：problem、object_kind、function_context、required_inputs、conditions、exceptions、parameter_selection、construction_strategy、validation_methods、alternatives、side_effects、source_refs、unknowns、reusable_scope。\u003c/p\u003e\u003cp\u003e不要求每条知识具备全部字段。概念解释可以没有构造步骤；几何构造方法可以不含工艺结论。共享KnowledgeItem保存命题与来源，CapabilityUnit登记可执行方法，两者通过引用连接。\u003c/p\u003e\u003cp\u003e例如“某类轴肩附近考虑退刀结构”应拆清：功能/工序前提、所需尺寸与依据、结构候选、构造方式、加工与配合检查。不能从例图直接抄一个槽宽成为全局规则；没有实际依据时只能形成待核知识草稿。\u003c/p\u003e\u003ch3\u003e3. 现有三项公开数据的定位\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e数据\u003c/td\u003e\u003ctd\u003e三维应用价值\u003c/td\u003e\u003ctd\u003e当前不能据此推导\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eParaCAD\u003c/td\u003e\u003ctd\u003e图形/JSON几何与约束的对照、二维表达语义、局部参数来源冲突实验\u003c/td\u003e\u003ctd\u003e每张图都有可用DXF；标签等于真值；天然含厚度或完整三维设计\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTriView2CAD\u003c/td\u003e\u003ctd\u003e在其限定对象族中研究视图、尺寸、参数与DXF的关系\u003c/td\u003e\u003ctd\u003e20万种通用机械零件；学会了所有机械结构或工艺\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTrOCR工程文字行\u003c/td\u003e\u003ctd\u003e工程标注字形/字串读取、符号混淆与确认方法\u003c/td\u003e\u003ctd\u003e整图对象关联、视图重建、三维特征或工艺知识\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e资料格式、用途与许可状态继续引用各数据根的详细使用说明，不在此另建冲突副本：\u003c/p\u003e\u003cp\u003e- ParaCAD详细使用说明（见原文附件）。\u003c/p\u003e\u003cp\u003e- TriView2CAD详细使用说明（见原文附件）。\u003c/p\u003e\u003cp\u003eTrOCR实际根目录名在共同来源目录中核对后接入，本文不虚构文件链接。公开可下载不自动等于任何用途均可；沿用共同来源用途记录。\u003c/p\u003e\u003ch3\u003e4. 每份资料的吸收顺序\u003c/h3\u003e\u003cp\u003e1. 共同登记来源、内容版本、可用范围和用途。\u003c/p\u003e\u003cp\u003e2. 保留章节、页、表格、公式、图片/模型实体的原始定位，记录解析失败与未覆盖范围。\u003c/p\u003e\u003cp\u003e3. 选首批三维主题，提炼有条件的概念、关系、方法及对照；复用已被二维提炼的知识项。\u003c/p\u003e\u003cp\u003e4. 将方法绑定到计划角色与验证方法；没有可执行工具时标METHOD_UNAVAILABLE，不能用语言结果代替运行。\u003c/p\u003e\u003cp\u003e5. 用正例、反例、条件未知、近似但不适用例验证；经验只在已证明范围发布。\u003c/p\u003e\u003ch3\u003e5. 跨二维三维共建例\u003c/h3\u003e\u003cp\u003e同一条“直径/半径表达”知识：二维用于解释符号，三维用于参数映射和测量。新增的是任务用法与对象关系，不另抄一份正文。同一条“材料与工序限制”知识：二维用于给出条件化风险，三维用于筛选结构候选与复检；工况缺失时两边都保留未知。\u003c/p\u003e\u003cp\u003e同一个错误案例可有PNG局部、DXF句柄、三维实体范围和操作日志；共享工程对象与证据关系将它们连接。不同来源的相似形状不直接合并对象或确认记录。\u003c/p\u003e\u003ch3\u003e6. 首批建议主题\u003c/h3\u003e\u003cp\u003e从参数明确的板孔与阶梯轴开始，逐步吸收孔轴配合、轴肩/退刀、倒角圆角、基准与检验，再到支架及小装配。主题是否进入由实际可用资料与方法决定，不为凑覆盖而生成无来源工程知识。覆盖统计同时报告对象族、D职责、J环节、条件区间、方法和未决项。\u003c/p\u003e\u003ch3\u003e7. 2026-10-21：吸收后的积累与维护\u003c/h3\u003e\u003cp\u003e资料提炼后形成有来源、条件与版本的KnowledgeRevision，再生成共同工程Wiki中的三维主题/策略/方法/案例页。页面逐条回到主张及原文，模型生成的解释保留假设与争议。新资料、方法修复或反例触发增量维护，不把每份PNG/每次对话生成独立页面。血缘相同的图、网格和页面按根来源去重，详见\u003ca href=\"#doc=cad3-616f55d8361b307c\" data-preview-doc=\"cad3-616f55d8361b307c\"\u003e20\u003c/a\u003e。\u003c/p\u003e"}, {"id": "cad3-91e81d5b6d72ab7c", "path": "三维机械建模知识库方案/04-建模规划与usd-brep执行适配.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/04-建模规划与usd-brep执行适配.md", "title": "建模规划与usd-brep执行适配", "group": "modeling", "sub": "design", "role": "执行适配设计", "sha256": "13a7f935e13b64fe078f6a27f33990d51d7b1680dfe22ab1d031f0879512b43b", "headings": ["建模规划与usd-brep执行适配", "1. 本地仓库核对范围", "2. 从知识到计划", "3. 操作合同", "4. 执行隔离与失败恢复", "5. 精确工程模型与显示资产两条输出", "6. 工具知识与工程知识分别检索", "7. 运行前置与已知风险"], "body": "# 建模规划与usd-brep执行适配\n\n共同连接：[二维11能力单元](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/11-工程判断链与能力单元.md)、[16条件及单位合同](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/16-首轮实施与最小契约设计.md)。本篇为拟建执行设计，未调用内核或编写产品代码。\n\n## 1. 本地仓库核对范围\n\n已阅读[AGENTS](/Users/ddt/work/projects/ai_agent/cad/usd-brep/AGENTS.md)、[README](/Users/ddt/work/projects/ai_agent/cad/usd-brep/README.md)、[操作索引](/Users/ddt/work/projects/ai_agent/cad/usd-brep/.agents/operations/INDEX.md)、[布尔约定](/Users/ddt/work/projects/ai_agent/cad/usd-brep/.agents/operations/booleans.md)与[资产生成流程](/Users/ddt/work/projects/ai_agent/cad/usd-brep/.agents/docs/generate_asset.md)。这些支持以下设计判断，但不证明本机全部API已可运行。\n\n|仓库描述的能力|拟接入职责|边界|\n|---|---|---|\n|SMLib、SM_API、Python绑定|精确几何表示下的实体/曲线/曲面操作|计算仍受数值和容差影响；不承诺无限精度|\n|体元、扫掠、旋转、布尔|执行明确的构造计划|不自动推导设计意图或补全图纸缺失尺寸|\n|圆角、倒角、偏置、修复|局部修改及几何维护|需核对版本、输入条件及是否改变设计要求|\n|面边顶点、体积、包围盒等查询|几何检查与候选特征依据|单个量值不足以证明完整几何或工艺正确|\n|BRep/USD与网格输出|保留精确模型、交付显示表示|表示转换可能损失精度/语义，须逐条记录|\n\n## 2. 从知识到计划\n\n规划器输出受限操作DAG，不直接执行资料里的任意代码。每步至少有：step_id、registered_operation、input_refs、parameters及来源、preconditions、expected_outputs、postchecks、allowed_changes、failure_policy。\n\n知识检索用于选择方法和补齐参数依据；确定性执行器校验依赖、单位、作用范围及方法注册。未知参数不能以模型“常见值”悄悄补上；需要演示时将假设作为独立方案版本并明确用途。\n\n首轮计划例：给定板长宽厚与孔的直径/中心/方向 → 验证参数 → 建板 → 建贯穿刀具体 → 差集 → 检查实体、体积、孔位置 → 输出模型及验证记录。刀具体的越界余量是执行参数，必须有约定与记录，不能与工程孔深混为一谈。\n\n## 3. 操作合同\n\n适配器为每个允许操作记录：API版本、单位/坐标、输入种类、所有权、是否修改/消耗、输出类型、错误类别、超时与资源预算、前后检查。几何参数转换由适配层负责，拒绝静默尺度改变。\n\n本地约定显示常见Python布尔会消耗输入，部分操作原地修改。执行时使用工作副本并仅保留返回句柄；失败后不假定旧句柄可继续使用。原件和已验收模型始终可回查，不能对原件直接试错。\n\n模板参数化与可重放计划由上层维护。把Python变量写进脚本不等于已经获得完整CAD约束求解器或交互特征树；参数依赖、循环、欠约束/过约束检测均需显式实现和验证。\n\n## 4. 执行隔离与失败恢复\n\n- 第一阶段采用单任务独立工作进程，避免共享可变几何句柄及上下文；并发策略待测后决定。\n- 输入只读快照，输出写临时派生目录，核验后发布模型版本与回执；失败不覆盖原模型。\n- 记录内核、Python/适配器版本、输入哈希、选项、容差、随机种子（若有）、日志及输出哈希。\n- 每步有预算；超时终止工作进程并标记TIMEOUT。进程崩溃与无效几何分开记录；不能用空文件算成功。\n- 重试仅针对可恢复的同参数执行/基础设施问题，有限次并保留记录；数值退化或条件不满足转诊断。不得偷偷移动位置、放大半径或降低精度换成功。\n- 若提出改变尺寸/容差/结构作为候选修正，生成新计划，说明影响并重新验证；不是原要求已完成。\n\n## 5. 精确工程模型与显示资产两条输出\n\n仓库的资产生成流程针对显示资产：保持进程内BRep运算，末端离散为UsdGeom.Mesh，避免为显示反复经BrepArray往返。该流程不能被解释为工程库只需保留网格。\n\n共同库保留原精确模型、构造计划和表示来源链；需要工程BRep交换时，另核对导出合同及往返几何/容差/语义损失。显示Mesh是派生表示，声明离散化误差，不能成为精确测量唯一依据。单位和up-axis写入场景并记录转换；仓库显示示例约定不能被外推为所有输入模型的单位。\n\nSTEP/IGES等格式不能仅因测试资料存在就宣布全链支持；需逐格式验证导入器、导出器、单位、实体、语义和失败处理。本轮不承诺格式覆盖。\n\n## 6. 工具知识与工程知识分别检索\n\n“圆角失败怎么排查”检索内核版本、操作条件与错误诊断；“这里圆角应多大”检索功能、工艺、材料与设计依据。前者不能替代后者；会调用API不代表会做机械设计。\n\n下一次实施读取本地相关操作指南和适用仓库Skill后再编码，不在本轮引入新依赖、修改C++或增加绑定。\n\n## 7. 运行前置与已知风险\n\n本轮只读解释器探测尚未发现可导入的几何绑定，未运行内核。已核函数映射与圆边界测量、修复假成功等风险见[14](14-内核适配前置与测量风险.md)；这些风险进入适配和结果检查，不靠返回成功统一放行。", "reference": false, "current": false, "truncated": false, "tags": ["design"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/04-%E5%BB%BA%E6%A8%A1%E8%A7%84%E5%88%92%E4%B8%8Eusd-brep%E6%89%A7%E8%A1%8C%E9%80%82%E9%85%8D.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e建模规划与usd-brep执行适配\u003c/h2\u003e\u003cp\u003e共同连接：\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-e7f9b4f47365ab28\"\u003e二维11能力单元 ↗\u003c/a\u003e、\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-29c6a198af2edf05\"\u003e16条件及单位合同 ↗\u003c/a\u003e。本篇为拟建执行设计，未调用内核或编写产品代码。\u003c/p\u003e\u003ch3\u003e1. 本地仓库核对范围\u003c/h3\u003e\u003cp\u003e已阅读AGENTS（见原文附件）、\u003ca href=\"#doc=cad3-7c7a5e3466e18942\" data-preview-doc=\"cad3-7c7a5e3466e18942\"\u003eREADME\u003c/a\u003e、\u003ca href=\"#doc=cad3-d0033feced8e4baa\" data-preview-doc=\"cad3-d0033feced8e4baa\"\u003e操作索引\u003c/a\u003e、布尔约定（见原文附件）与资产生成流程（见原文附件）。这些支持以下设计判断，但不证明本机全部API已可运行。\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e仓库描述的能力\u003c/td\u003e\u003ctd\u003e拟接入职责\u003c/td\u003e\u003ctd\u003e边界\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSMLib、SM_API、Python绑定\u003c/td\u003e\u003ctd\u003e精确几何表示下的实体/曲线/曲面操作\u003c/td\u003e\u003ctd\u003e计算仍受数值和容差影响；不承诺无限精度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e体元、扫掠、旋转、布尔\u003c/td\u003e\u003ctd\u003e执行明确的构造计划\u003c/td\u003e\u003ctd\u003e不自动推导设计意图或补全图纸缺失尺寸\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e圆角、倒角、偏置、修复\u003c/td\u003e\u003ctd\u003e局部修改及几何维护\u003c/td\u003e\u003ctd\u003e需核对版本、输入条件及是否改变设计要求\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e面边顶点、体积、包围盒等查询\u003c/td\u003e\u003ctd\u003e几何检查与候选特征依据\u003c/td\u003e\u003ctd\u003e单个量值不足以证明完整几何或工艺正确\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBRep/USD与网格输出\u003c/td\u003e\u003ctd\u003e保留精确模型、交付 3c/p\u003e\u003cp\u003e下一次实施读取本地相关操作指南和适用仓库Skill后再编码，不在本轮引入新依赖、修改C++或增加绑定。\u003c/p\u003e\u003ch3\u003e7. 运行前置与已知风险\u003c/h3\u003e\u003cp\u003e本轮只读解释器探测尚未发现可导入的几何绑定，未运行内核。已核函数映射与圆边界测量、修复假成功等风险见\u003ca href=\"#doc=cad3-d51eb9557b791b9d\" data-preview-doc=\"cad3-d51eb9557b791b9d\"\u003e14\u003c/a\u003e；这些风险进入适配和结果检查，不靠返回成功统一放行。\u003c/p\u003e"}, {"id": "cad3-582d14df1c2eb789", "path": "三维机械建模知识库方案/05-二维三维关联与工程验证.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/05-二维三维关联与工程验证.md", "title": "二维三维关联与工程验证", "group": "validation", "sub": "design", "role": "验证/装配/修改设计", "sha256": "fd5b31bea1716ccad521c75217c7ed1e75622d728f78962bad48906fe46268ee", "headings": ["二维三维关联与工程验证", "1. 三种任务，不能混成一个准确率", "2. 跨表示关联", "3. 六类验证及结论范围", "4. 参数化板孔的解析验证设计", "5. 工艺与装配怎么接入", "6. 人工复核与经验回写", "7. 本地内核测量风险补充"], "body": "# 二维三维关联与工程验证\n\n承接[二维04系统衔接](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/04-CAD知识工程与审查系统衔接.md)、[11判断链](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/11-工程判断链与能力单元.md)与[17真实来源验证](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/17-首轮契约与真实来源验证记录.md)。本篇全部是待实施设计。\n\n## 1. 三种任务，不能混成一个准确率\n\n|任务|主要输入|正常输出|\n|---|---|---|\n|明确参数建模|参数与约束、用途和交付要求|候选计划、模型、指定检查结果|\n|二维推导三维|图面事实、视图/剖面/标注及图外条件|有依据的三维候选、未定尺寸、歧义与补证需求|\n|既有模型理解/修改|原模型、变更要求、保留约束|特征候选、影响范围、新模型和复检结果|\n\n二维到三维经常不唯一：单视图不决定厚度，圆形不唯一决定球/圆柱/孔，遮挡和剖切会改变可见线。即使多视图，也可能缺装配语境和制造要求。允许多个满足当前证据的候选，并说明差异；不以一次外观相似选择唯一解。\n\n## 2. 跨表示关联\n\n关联记录包含源/目标版本、视图方向与投影类型、相机/比例/坐标变换、对象范围、支持证据、候选、误差及状态。像素框、DXF句柄和BRep实体的定位分别存储。\n\n矢量来源保留线型、层、尺寸及对象句柄；PNG保留识读及定位，不能因为有JSON就声称几何已像素级配准。对于ParaCAD，原图读数与JSON标签分别保留；没有对象附着、单位与尺度生成依据时，不用两个数字直接宣判三维尺寸错误。\n\n模型生成投影/剖面时，明确投影方法、隐藏线/切面处理、比较范围与误差。像素相似只能辅助；尺寸、关系和拓扑检查应尽量使用结构化证据。\n\n## 3. 六类验证及结论范围\n\n下列V1—V6是本方案的验证类别，不沿用或改名OCR的L0—L5。\n\n|类别|验证什么|通过仍不能说明什么|\n|---|---|---|\n|V1输入与合同|身份、版本、单位、坐标、参数范围和计划依赖|设计合理或模型已构造|\n|V2几何与拓扑|有效性、封闭/流形目标、退化、有限量值、预期实体数等|尺寸约束或功能满足|\n|V3参数与设计约束|关键尺寸、孔位、同轴/距离、材料保留范围等|工艺可行、耐久或安全|\n|V4图模一致性|指定视图、剖切、标注对象和关系在声明误差内一致|未知内部结构正确或全图无遗漏|\n|V5工程适用性|有依据的功能、装配、加工、检验要求|未执行的仿真、现场能力或所有工况满足|\n|V6修改复检与交付|变更范围、绑定失效、依赖检查、表示/导出损失|未声明范围整体无错|\n\n同一几何适用实体/曲面/线框等不同目标；不能强制所有输入必须闭合实体。检验方法要与目标类型相符。\n\n每项输出PASS/FAIL/UNKNOWN/NOT_APPLICABLE/ERROR，附方法、范围、输入及测量/依据。未配置或未运行的检查单列NOT_RUN；引擎异常是ERROR，不是工程FAIL。几何V2通过时可发布“几何检查通过、工程尚未判定”的范围化结果，不能合成整件工程PASS。\n\n## 4. 参数化板孔的解析验证设计\n\n设计测试：板L=100mm、W=60mm、T=10mm，直径10mm贯穿孔，中心(50,30)，沿厚度方向。所有数值是合成试验输入，不来自某条标准或真实设计。无圆角等其他去料时预期体积为L×W×T−π×(d/2)²×T，另外验证孔位置、方向、贯穿性与剩余壁厚范围。\n\n体积相同不证明孔位正确；孔偏移后体积不变，V3孔位检查必须失败。只在给定体积容差内比较；π计算、单位与误差预算要写进实际方法。此处不输出伪造实测体积或成功截图。\n\n反例包括孔径超边界、直径/半径混用、毫米/厘米混用、孔深不足、孔位改变、预期实体数改变。只靠体积或面数的验证方案不能通过这一组设计。\n\n## 5. 工艺与装配怎么接入\n\n工艺建议需要材料、工序、刀具/设备能力、可达方向、装夹与检验条件。知识库给出条件和方法，工具运行可达性/几何计算或外部工程分析；信息不足返回所缺条件。内核没有报错不能当制造可行证据。\n\n装配先做显式位姿与几何检查，再考虑约束、自由度、运动路径、公差累积和载荷。包围盒只做粗筛；接触、相切、允许间隙和实体穿透要区别，不能仅因接触就报告干涉。特定位置无碰撞也不代表整个装配路径可行。\n\nCAE/CAM、强度/疲劳和加工仿真需要额外方法、输入与验证，本方案仅预留方法接入；没有执行工具时不宣称这些能力已具备。\n\n## 6. 人工复核与经验回写\n\n人工看到某处文字、同意某个特征解释、确认某个设计选择是三种不同范围。沿用共同ReviewEvent原则，现有READING事件不能升级为工程确认。后续新增确认类型要有目标版本、条件、操作者来源、撤回与冲突处理。\n\n复检成功可形成带适用范围的经验候选，保留失败对照；只保存最终成功模型会丢掉最有价值的失败条件。重复用同一输入生成多个视角不增加独立工程样本数。\n\n## 7. 本地内核测量风险补充\n\n已核本地KNOWN_ISSUES的圆边界面积/体积误差。第4节解析体积用于独立参考；默认volume()不能作为高精度唯一验收量。实际精度、数值稳定性、误差预算及多量交叉检查见[14](14-内核适配前置与测量风险.md)。不能为消除差异擅自扩大设计公差。", "reference": false, "current": false, "truncated": false, "tags": ["design"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/05-%E4%BA%8C%E7%BB%B4%E4%B8%89%E7%BB%B4%E5%85%B3%E8%81%94%E4%B8%8E%E5%B7%A5%E7%A8%8B%E9%AA%8C%E8%AF%81.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e二维三维关联与工程验证\u003c/h2\u003e\u003cp\u003e承接\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-2641fca3877f7c42\"\u003e二维04系统衔接 ↗\u003c/a\u003e、\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-e7f9b4f47365ab28\"\u003e11判断链 ↗\u003c/a\u003e与\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-8cb913e5390b355f\"\u003e17真实来源验证 ↗\u003c/a\u003e。本篇全部是待实施设计。\u003c/p\u003e\u003ch3\u003e1. 三种任务，不能混成一个准确率\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e任务\u003c/td\u003e\u003ctd\u003e主要输入\u003c/td\u003e\u003ctd\u003e正常输出\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e明确参数建模\u003c/td\u003e\u003ctd\u003e参数与约束、用途和交付要求\u003c/td\u003e\u003ctd\u003e候选计划、模型、指定检查结果\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e二维推导三维\u003c/td\u003e\u003ctd\u003e图面事实、视图/剖面/标注及图外条件\u003c/td\u003e\u003ctd\u003e有依据的三维候选、未定尺寸、歧义与补证需求\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e既有模型理解/修改\u003c/td\u003e\u003ctd\u003e原模型、变更要求、保留约束\u003c/td\u003e\u003ctd\u003e特征候选、影响范围、新模型和复检结果\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e二维到三维经常不唯一：单视图不决定厚度，圆形不唯一决定球/圆柱/孔，遮挡和剖切会改变可见线。即使多视图，也可能缺装配语境和制造要求。允许多个满足当前证据的候选，并说明差异；不以一次外观相似选择唯一解。\u003c/p\u003e\u003ch3\u003e2. 跨表示关联\u003c/h3\u003e\u003cp\u003e关联记录包含源/目标版本、视图方向与投影类型、相机/比例/坐标变换、对象范围、支持证据、候选、误差及状态。像素框、DXF句柄和BRep实体的定位分别存储。\u003c/p\u003e\u003cp\u003e矢量来源保留线型、层、尺寸及对象句柄；PNG保留识读及定位，不能因为有JSON就声称几何已像素级配准。对于ParaCAD，原图读数与JSON标签分别保留；没有对象附着、单位与尺度生成依据时，不用两个数字直接宣判三维尺寸错误。\u003c/p\u003e\u003cp\u003e模型生成投影/剖面时，明确投影方法、隐藏线/切面处理、比较范围与误差。像素相似只能辅助；尺寸、关系和拓扑检查应尽量使用结构化证据。\u003c/p\u003e\u003ch3\u003e3. 六类验证及结论范围\u003c/h3\u003e\u003cp\u003e下列V1—V6是本方案的验证类别，不沿用或改名OCR的L0—L5。\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e类别\u003c/td\u003e\u003ctd\u003e验证什么\u003c/td\u003e\u003ctd\u003e通过仍不能说明什么\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eV1输入与合同\u003c/td\u003e\u003ctd\u003e身份、版本、单位、坐标、参数范围和计划依赖\u003c/td\u003e\u003ctd\u003e设计合理或模型已构造\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eV2几何与拓扑\u003c/td\u003e\u003ctd\u003e有效性、封闭/流形目标、退化、有限量值、预期实体数等\u003c/td\u003e\u003ctd\u003e尺寸约束或功能满足\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eV3参数与设计约束\u003c/td\u003e\u003ctd\u003e关键尺寸、孔位、同轴/距离、材料保留范围等\u003c/td\u003e\u003ctd\u003e工艺可行、耐久或安全\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eV4图模一致性\u003c/td\u003e\u003ctd\u003e指定视图、剖切、标注对象和关系在声明误差内一致\u003c/td\u003e\u003ctd\u003e未知内部结构正确或全图无遗漏\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eV5工程适用性\u003c/td\u003e\u003ctd\u003e有依据的功能、装配、加工、检验要求\u003c/td\u003e\u003ctd\u003e未执行的仿真、现场能力或所有工况满足\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eV6修改复检与交付\u003c/td\u003e\u003ctd\u003e变更范围、绑定失效、依赖检查、表示/导出损失\u003c/td\u003e\u003ctd\u003e未声明范围整体无错\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e同一几何适用实体/曲面/线框等不同目标；不能强制所有输入必须闭合实体。检验方法要与目标类型相符。\u003c/p\u003e\u003cp\u003e每项输出PASS/FAIL/UNKNOWN/NOT_APPLICABLE/ERROR，附方法、范围、输入及测量/依据。未配置或未运行的检查单列NOT_RUN；引擎异常是ERROR，不是工程FAIL。几何V2通过时可发布“几何检查通过、工程尚未判定”的范围化结果，不能合成整件工程PASS。\u003c/p\u003e\u003ch3\u003e4. 参数化板孔的解析验证设计\u003c/h3\u003e\u003cp\u003e设计测试：板L=100mm、W=60mm、T=10mm，直径10mm贯穿孔，中心(50,30)，沿厚度方向。所有数值是合成试验输入，不来自某条标准或真实设计。无圆角等其他去料时预期体积为L×W×T−π×(d/2)²×T，另外验证孔位置、方向、贯穿性与剩余壁厚范围。\u003c/p\u003e\u003cp\u003e体积相同不证明孔位正确；孔偏移后体积不变，V3孔位检查必须失败。只在给定体积容差内比较；π计算、单位与误差预算要写进实际方法。此处不输出伪造实测体积或成功截图。\u003c/p\u003e\u003cp\u003e反例包括孔径超边界、直径/半径混用、毫米/厘米混用、孔深不足、孔位改变、预期实体数改变。只靠体积或面数的验证方案不能通过这一组设计。\u003c/p\u003e\u003ch3\u003e5. 工艺与装配怎么接入\u003c/h3\u003e\u003cp\u003e工艺建议需要材料、工序、刀具/设备能力、可达方向、装夹与检验条件。知识库给出条件和方法，工具运行可达性/几何计算或外部工程分析；信息不足返回所缺条件。内核没有报错不能当制造可行证据。\u003c/p\u003e\u003cp\u003e装配先做显式位姿与几何检查，再考虑约束、自由度、运动路径、公差累积和载荷。包围盒只做粗筛；接触、相切、允许间隙和实体穿透要区别，不能仅因接触就报告干涉。特定位置无碰撞也不代表整个装配路径可行。\u003c/p\u003e\u003cp\u003eCAE/CAM、强度/疲劳和加工仿真需要额外方法、输入与验证，本方案仅预留方法接入；没有执行工具时不宣称这些能力已具备。\u003c/p\u003e\u003ch3\u003e6. 人工复核与经验回写\u003c/h3\u003e\u003cp\u003e人工看到某处文字、同意某个特征解释、确认某个设计选择是三种不同范围。沿用共同ReviewEvent原则，现有READING事件不能升级为工程确认。后续新增确认类型要有目标版本、条件、操作者来源、撤回与冲突处理。\u003c/p\u003e\u003cp\u003e复检成功可形成带适用范围的经验候选，保留失败对照；只保存最终成功模型会丢掉最有价值的失败条件。重复用同一输入生成多个视角不增加独立工程样本数。\u003c/p\u003e\u003ch3\u003e7. 本地内核测量风险补充\u003c/h3\u003e\u003cp\u003e已核本地KNOWN_ISSUES的圆边界面积/体积误差。第4节解析体积用于独立参考；默认volume()不能作为高精度唯一验收量。实际精度、数值稳定性、误差预算及多量交叉检查见\u003ca href=\"#doc=cad3-d51eb9557b791b9d\" data-preview-doc=\"cad3-d51eb9557b791b9d\"\u003e14\u003c/a\u003e。不能为消除差异擅自扩大设计公差。\u003c/p\u003e"}, {"id": "cad3-eb780149d59e871e", "path": "三维机械建模知识库方案/06-检索资源与秒级响应.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/06-检索资源与秒级响应.md", "title": "检索资源与秒级响应", "group": "modeling", "sub": "design", "role": "设计 · 非功能验收", "sha256": "a5d44938584a4f0d8c4c6a5d601d892267f04432535ace8db0626935684d085c", "headings": ["检索资源与秒级响应", "1. K0—K5共用，三维增加表示与索引", "2. 检索应按缺口取知识", "3. 秒级目标的分解", "4. 本地资源与部署顺序", "5. 几何版本与缓存", "6. 资源验证计划", "7. 2026-10-21：Wiki与原文双路及工作预算"], "body": "# 检索资源与秒级响应\n\n沿用[二维03检索设计](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/03-检索执行与秒级响应设计.md)与[05资源设计](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/05-容量资源与构建部署方案.md)。本篇给三维增量，不另建来源库或承诺已经实测。\n\n## 1. K0—K5共用，三维增加表示与索引\n\n|层|共同职责|三维增量|\n|---|---|---|\n|K0原件|完整原资料、内容版本|原模型/参数/程序/技术要求；不以网格替代原BRep|\n|K1身份定位|全量目录、可达性、失败分母|模型表示及实体范围、坐标单位、转换和依赖|\n|K2轻量导航|主题、来源、条件、索引入口|零件族、特征任务、工具能力与模型摘要|\n|K3专项索引|全文、属性、必要的语义索引|参数范围、特征候选、邻接/装配关系、局部几何检索|\n|K4知识方法|工程概念、条件、规则与方法|设计策略、构造模板、内核合同、验证及失败经验|\n|K5任务证据|按任务组织必要证据|参数/计划、所选实体、运行与验证摘要及原件入口|\n\n索引、派生网格、截图、几何签名可按需重建；唯一来源、确认和版本关系不应只存在于专项索引。模型实体原始编号与跨版本工程对象身份分开。\n\n## 2. 检索应按缺口取知识\n\n- 已知孔径，不知是否贯穿：取对象/剖面关联和候选几何，不重复解释直径符号。\n- 已知要倒角，不知尺寸依据：取功能与工艺条件、选用方法，不只取API文档。\n- 尺寸明确但布尔失败：取当前内核版本的操作前提、错误与诊断，不据此改工程尺寸。\n- 已完成模型但需检验：取对应要求的方法和可观测量，不靠整模型渲染图判断所有技术要求。\n\n范围/权限/用途/版本过滤 → 精确ID、符号与参数旁路 → 全文及必要语义候选 → 对象/关系条件核对 → 有界证据包。拓扑邻接和工程关系优先在受限对象集合中查询，不遍历整库全部图关系。\n\n几何相似是补充入口：相似形状可能功能、材料、工艺完全不同。不得用相似分数直接决定设计参数或适用规范。\n\n## 3. 秒级目标的分解\n\n|请求|目标/测量口径|不包含|\n|---|---|---|\n|已索引ID/定位Q0|沿用共同P95≤1秒待测目标|冷外置盘唤醒或离线原件读取|\n|知识证据Q1|首证据P95≤2秒、标准证据包≤5秒，待测|模型全量解析、OCR、完整几何计算|\n|复杂工程任务Q2|≤5秒返回范围、已知/缺口及执行状态，待测|把未完成建模或验证写成完成|\n|三维执行/验证|逐步记录排队、载入、计算、离散化、导出时长|不外推成统一秒级SLA|\n\n冷热、磁盘状态、模型复杂度、知识规模分别报告。缓存命中率与延迟同时报告，不能只测重复同题的热缓存。相同1GB模型不应每次全部载入模型上下文；读取实体局部、量值与证据，必要时让几何工具访问受控文件。\n\n100MB导航仍是目标量级，不是1TB知识或几何的无损记忆；K1/K3提供长尾和精确定位旁路。相关1GB是候选资源范围，不是一次推理的文本预算。\n\n## 4. 本地资源与部署顺序\n\nCPU承担解析、拓扑和多数几何计算；内存受同时活跃的BRep、交运算、中间结果和模型服务影响；磁盘承担原件、索引、模型版本、日志与缓存。GPU可承担显示或选配视觉模型，不把CUDA GPU作为知识检索及几何内核的统一前置。\n\n当前机器资源分配必须实测，不复用其他机器的配置结论。对于24GB等级机器，首轮单任务独立进程、有限模型范围、按需离散化；不同时全量向量化和复杂布尔计算。工作进程内存/时间预算、缓存上限由首轮样例测量后确定，不能在方案中编造峰值。\n\n外置盘存放大原件/派生几何；内置入口可为软链。挂载缺失时返回SOURCE_OFFLINE并保留队列/快照，禁止在同名空挂载点创建替代数据。备份要用独立故障域，软链和同盘副本不算独立备份。\n\n## 5. 几何版本与缓存\n\n缓存键包含原输入哈希、计划版本、内核/适配器版本、单位坐标、容差、工具选项及知识快照。工程建议还依赖工况与依据版本，不能只以形状哈希复用结论。源用途撤回或当前访问权限变化时重新鉴权，不凭旧缓存泄漏。\n\n参数变化使相关步骤及后继结果失效；首次实施可全计划重放保证正确，局部复用待依赖测试后优化。失败日志有配额与保留策略，不能无限保存中间全模型耗尽外置盘。\n\n## 6. 资源验证计划\n\n固定真实机器、版本、输入、单位、容差和覆盖分母；按模型字节、实体/曲面复杂度、操作类型和候选数分层。分别测载入/几何/查询/离散化/导出、峰值RSS、输出放大率、失败恢复及磁盘离线。\n\n知识检索测试沿用二维保留集规则；三维增加参数与条件区间、结构相似但工况不同、无向量命中的精确实体检索。容量、缓存和性能全部是待执行项，不能把文档链接检查当速度验收。\n\n## 7. 2026-10-21：Wiki与原文双路及工作预算\n\nWiki提供概念/条件/方法入口，精确项和原文全文保持旁路；缺页面/未编译范围可查，不等待在线全库编译。缓存同时绑定知识release、模型/配置/工况、方法版本及当前失效水位。概念投影与本次原文已读分别计量，详见[20](20-持续知识编译与三维工程Wiki设计.md)。\n\n离线CompileRun单列输入/输出token、缓存、模型/工具费用、峰值资源、失败与重试；每主题/批次设置预算和停止/续跑策略。在线检索、解释生成、OCR、几何与工程检查分开计时。具体预算须小主题实测后固定，不能以已有会话费用外推TB级总成本，也不能用多花模型预算掩盖Wiki对照无增益。", "reference": false, "current": false, "truncated": false, "tags": ["design"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/06-%E6%A3%80%E7%B4%A2%E8%B5%84%E6%BA%90%E4%B8%8E%E7%A7%92%E7%BA%A7%E5%93%8D%E5%BA%94.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e检索资源与秒级响应\u003c/h2\u003e\u003cp\u003e沿用\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-8d2a4c097dad14c7\"\u003e二维03检索设计 ↗\u003c/a\u003e与\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-b714d9e2ef6cb909\"\u003e05资源设计 ↗\u003c/a\u003e。本篇给三维增量，不另建来源库或承诺已经实测。\u003c/p\u003e\u003ch3\u003e1. K0—K5共用，三维增加表示与索引\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e层\u003c/td\u003e\u003ctd\u003e共同职责\u003c/td\u003e\u003ctd\u003e三维增量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eK0原件\u003c/td\u003e\u003ctd\u003e完整原资料、内容版本\u003c/td\u003e\u003ctd\u003e原模型/参数/程序/技术要求；不以网格替代原BRep\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eK1身份定位\u003c/td\u003e\u003ctd\u003e全量目录、可达性、失败分母\u003c/td\u003e\u003ctd\u003e模型表示及实体范围、坐标单位、转换和依赖\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eK2轻量导航\u003c/td\u003e\u003ctd\u003e主题、来源、条件、索引入口\u003c/td\u003e\u003ctd\u003e零件族、特征任务、工具能力与模型摘要\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eK3专项索引\u003c/td\u003e\u003ctd\u003e全文、属性、必要的语义索引\u003c/td\u003e\u003ctd\u003e参数范围、特征候选、邻接/装配关系、局部几何检索\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eK4知识方法\u003c/td\u003e\u003ctd\u003e工程概念、条件、规则与方法\u003c/td\u003e\u003ctd\u003e设计策略、构造模板、内核合同、验证及失败经验\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eK5任务证据\u003c/td\u003e\u003ctd\u003e按任务组织必要证据\u003c/td\u003e\u003ctd\u003e参数/计划、所选实体、运行与验证摘要及原件入口\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e索引、派生网格、截图、几何签名可按需重建；唯一来源、确认和版本关系不应只存在于专项索引。模型实体原始编号与跨版本工程对象身份分开。\u003c/p\u003e\u003ch3\u003e2. 检索应按缺口取知识\u003c/h3\u003e\u003cp\u003e- 已知孔径，不知是否贯穿：取对象/剖面关联和候选几何，不重复解释直径符号。\u003c/p\u003e\u003cp\u003e- 已知要倒角，不知尺寸依据：取功能与工艺条件、选用方法，不只取API文档。\u003c/p\u003e\u003cp\u003e- 尺寸明确但布尔失败：取当前内核版本的操作前提、错误与诊断，不据此改工程尺寸。\u003c/p\u003e\u003cp\u003e- 已完成模型但需检验：取对应要求的方法和可观测量，不靠整模型渲染图判断所有技术要求。\u003c/p\u003e\u003cp\u003e范围/权限/用途/版本过滤 → 精确ID、符号与参数旁路 → 全文及必要语义候选 → 对象/关系条件核对 → 有界证据包。拓扑邻接和工程关系优先在受限对象集合中查询，不遍历整库全部图关系。\u003c/p\u003e\u003cp\u003e几何相似是补充入口：相似形状可能功能、材料、工艺完全不同。不得用相似分数直接决定设计参数或适用规范。\u003c/p\u003e\u003ch3\u003e3. 秒级目标的分解\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e请求\u003c/td\u003e\u003ctd\u003e目标/测量口径\u003c/td\u003e\u003ctd\u003e不包含\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e已索引ID/定位Q0\u003c/td\u003e\u003ctd\u003e沿用共同P95≤1秒待测目标\u003c/td\u003e\u003ctd\u003e冷外置盘唤醒或离线原件读取\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e知识证据Q1\u003c/td\u003e\u003ctd\u003e首证据P95≤2秒、标准证据包≤5秒，待测\u003c/td\u003e\u003ctd\u003e模型全量解析、OCR、完整几何计算\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e复杂工程任务Q2\u003c/td\u003e\u003ctd\u003e≤5秒返回范围、已知/缺口及执行状态，待测\u003c/td\u003e\u003ctd\u003e把未完成建模或验证写成完成\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e三维执行/验证\u003c/td\u003e\u003ctd\u003e逐步记录排队、载入、计算、离散化、导出时长\u003c/td\u003e\u003ctd\u003e不外推成统一秒级SLA\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e冷热、磁盘状态、模型复杂度、知识规模分别报告。缓存命中率与延迟同时报告，不能只测重复同题的热缓存。相同1GB模型不应每次全部载入模型上下文；读取实体局部、量值与证据，必要时让几何工具访问受控文件。\u003c/p\u003e\u003cp\u003e100MB导航仍是目标量级，不是1TB知识或几何的无损记忆；K1/K3提供长尾和精确定位旁路。相关1GB是候选资源范围，不是一次推理的文本预算。\u003c/p\u003e\u003ch3\u003e4. 本地资源与部署顺序\u003c/h3\u003e\u003cp\u003eCPU承担解析、拓扑和多数几何计算；内存受同时活跃的BRep、交运算、中间结果和模型服务影响；磁盘承担原件、索引、模型版本、日志与缓存。GPU可承担显示或选配视觉模型，不把CUDA GPU作为知识检索及几何内核的统一前置。\u003c/p\u003e\u003cp\u003e当前机器资源分配必须实测，不复用其他机器的配置结论。对于24GB等级机器，首轮单任务独立进程、有限模型范围、按需离散化；不同时全量向量化和复杂布尔计算。工作进程内存/时间预算、缓存上限由首轮样例测量后确定，不能在方案中编造峰值。\u003c/p\u003e\u003cp\u003e外置盘存放大原件/派生几何；内置入口可为软链。挂载缺失时返回SOURCE_OFFLINE并保留队列/快照，禁止在同名空挂载点创建替代数据。备份要用独立故障域，软链和同盘副本不算独立备份。\u003c/p\u003e\u003ch3\u003e5. 几何版本与缓存\u003c/h3\u003e\u003cp\u003e缓存键包含原输入哈希、计划版本、内核/适配器版本、单位坐标、容差、工具选项及知识快照。工程建议还依赖工况与依据版本，不能只以形状哈希复用结论。源用途撤回或当前访问权限变化时重新鉴权，不凭旧缓存泄漏。\u003c/p\u003e\u003cp\u003e参数变化使相关步骤及后继结果失效；首次实施可全计划重放保证正确，局部复用待依赖测试后优化。失败日志有配额与保留策略，不能无限保存中间全模型耗尽外置盘。\u003c/p\u003e\u003ch3\u003e6. 资源验证计划\u003c/h3\u003e\u003cp\u003e固定真实机器、版本、输入、单位、容差和覆盖分母；按模型字节、实体/曲面复杂度、操作类型和候选数分层。分别测载入/几何/查询/离散化/导出、峰值RSS、输出放大率、失败恢复及磁盘离线。\u003c/p\u003e\u003cp\u003e知识检索测试沿用二维保留集规则；三维增加参数与条件区间、结构相似但工况不同、无向量命中的精确实体检索。容量、缓存和性能全部是待执行项，不能把文档链接检查当速度验收。\u003c/p\u003e\u003ch3\u003e7. 2026-10-21：Wiki与原文双路及工作预算\u003c/h3\u003e\u003cp\u003eWiki提供概念/条件/方法入口，精确项和原文全文保持旁路；缺页面/未编译范围可查，不等待在线全库编译。缓存同时绑定知识release、模型/配置/工况、方法版本及当前失效水位。概念投影与本次原文已读分别计量，详见\u003ca href=\"#doc=cad3-616f55d8361b307c\" data-preview-doc=\"cad3-616f55d8361b307c\"\u003e20\u003c/a\u003e。\u003c/p\u003e\u003cp\u003e离线CompileRun单列输入/输出token、缓存、模型/工具费用、峰值资源、失败与重试；每主题/批次设置预算和停止/续跑策略。在线检索、解释生成、OCR、几何与工程检查分开计时。具体预算须小主题实测后固定，不能以已有会话费用外推TB级总成本，也不能用多花模型预算掩盖Wiki对照无增益。\u003c/p\u003e"}, {"id": "cad3-b99c290817c8dc6f", "path": "三维机械建模知识库方案/07-分阶段实施与验收设计.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/07-分阶段实施与验收设计.md", "title": "分阶段实施与验收设计", "group": "delivery", "sub": "todo", "role": "实施路线/未完成事项", "sha256": "e207104eca18ef31aa603e4ccbe9a715002fe12f43251142a14c37b400258e25", "headings": ["分阶段实施与验收设计", "1. 阶段与依赖", "2. 拟建文件级清单", "3. 首批验收场景（全部NOT_RUN）", "4. 每阶段交付与可恢复性", "5. 持续跟进二维的方式", "6. 本轮与持续目标", "7. 2026-10-21：持续知识与语义准入工作包"], "body": "# 分阶段实施与验收设计\n\n引用[二维06工作包](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/06-实施验收与持续维护.md)、[16契约与文件设计](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/16-首轮实施与最小契约设计.md)、[17验证进展](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/17-首轮契约与真实来源验证记录.md)。三维分批接入共库，不要求二维提前完成全部三维功能。\n\n## 1. 阶段与依赖\n\n|阶段|工作|输入依赖|退出证据|\n|---|---|---|---|\n|M0方案与接口对齐|工程事实、共库边界、增量对象、验证设计|二维当前合同、内核本地约定|文档/来源/兼容清单及关键未决项，不能算运行验收|\n|M1最小三维合同|表示/参数/计划/绑定/运行/验证草案及正反例|七对象基线与共同MethodRun/Relation进展|新增类型可校验，旧样例回归，单位/失效反例有效|\n|M2内核适配小链|明确参数板孔、阶梯轴，输出运行证据|本机绑定可用、操作合同核对|真实运行、几何与参数检查、失败不覆盖原件|\n|M3二维三维关联|选实际可配对图模；保留歧义|可核来源、二维对象关联与M2|实际对象绑定、投影/参数核对、错绑/未知分支|\n|M4工程知识闭环|一个有资料支撑的工艺/结构主题|可用正文、明确工况、方法|正常/反例/未知，解释与改进、实际复检|\n|M5扩展与资源|小装配、更多对象及大容量检索|共同目录/检索/版本服务与前述质量|分层质量、真实资源和恢复证据；再扩到TB目标|\n\nM1文档与合成合同可和二维开发并行；需要改共同Schema时再协调具体版本。M3不能把ParaCAD的二维JSON直接当完整三维金标准；找不到可靠配对时先声明缺口并另选样本，不造配对。\n\n## 2. 拟建文件级清单\n\n共同工程根拟复用 `/Users/ddt/work/projects/ai_agent/cad/engineering-kb/`。下表为后续实现提案，本轮没有新增这些文件；编码前检查当时仓库和AGENTS及二维开发占用。\n\n|拟建路径|责任|前置与测试|\n|---|---|---|\n|contracts/extensions/model3d.schema.json|三维扩展包、单位/坐标与版本|先核共同Schema接口，旧七对象输入兼容|\n|fixtures/model3d/parameter_plate.json|明确标为合成的参数/约束/预期|无伪来源、单位、孔位、体积方法独立|\n|src/model3d/contracts.py|跨引用、frame、依赖DAG、绑定状态|断引用、循环、错单位、旧版本反例|\n|src/model3d/planner.py|受限计划装配与参数来源记录|禁止任意代码、缺参数不生成确定模型|\n|src/model3d/adapters/usd_brep.py|注册操作、所有权、版本与异常映射|先读仓库相关Skill；独立进程和副本|\n|src/model3d/worker.py|预算、临时输出、校验后发布|崩溃/超时/断盘不覆盖原件|\n|src/model3d/bindings.py|候选特征、拓扑定位与失效|对称歧义、分裂合并、不沿用边序号|\n|src/model3d/validation.py|V1—V6方法调度与分型|未运行、工具错误、缺条件均不变PASS|\n|tests/model3d/|合同、适配、绑定、端到端和故障测试|负例证明拒绝确实由目标逻辑触发|\n|reports/model3d/|版本、输入哈希、运行结果、资源和局限|由实际运行生成，不能提前写通过|\n\n源模型与巨大派生物继续放共同数据存储；工程根保留小样例和受控引用。具体package结构由实施时现有代码确定，不照文档机械建空目录。\n\n## 3. 首批验收场景（全部NOT_RUN）\n\n|ID|设计案例|期望验证|\n|---|---|---|\n|3D-01|板孔明确参数正常路径|实际建模；实体、解析体积、孔位/贯穿性通过指定范围检查|\n|3D-02|相同孔径而孔中心改变|体积可相同，孔位检查失败，证明非单一体积验收|\n|3D-03|缺厚度的单视图|NEEDS_CONTEXT或多个候选；不冒充唯一重建|\n|3D-04|cm/mm、直径/半径误用|合同或参数检查拒绝/报错，原文字串不覆盖|\n|3D-05|对称孔和圆角后边分裂|歧义/失效显式返回，不默认选择第一个|\n|3D-06|几何可构造但工艺条件缺失|几何结果与工程UNKNOWN并列|\n|3D-07|布尔失败/超时/外置盘掉线|有限恢复与回执，原件/已验收版本不变|\n|3D-08|改局部尺寸但影响配合|依赖影响与复检，不能只验证新局部|\n|3D-09|READING确认或旧版依据被误用|禁止升级工程结论，版本差异显式暴露|\n|3D-10|新三维输入与旧二维消费者|明确版本拒绝或适配；旧有效二维输入仍可读|\n|3D-11|真实图纸与三维候选对照|有真实版本/变换/范围，不只用渲染相似分数|\n|3D-12|手册条件变化与不适用近例|方法随条件变化，已执行/未执行明确|\n\n合成参数与派生扰动不算独立真实工程样本。按零件族/来源族划分开发集与保留集，不能将同源多视角当独立盲测。\n\n## 4. 每阶段交付与可恢复性\n\n每阶段必须给输入快照、方法与版本、运行命令、输出/失败、覆盖分母和风险。只完成部分时按部分交付，不以继续运行的目标冒充已达成。\n\n先保存原件和已通过版本，失败在临时派生目录隔离；重试不重写确认或旧运行记录。模型修改、知识修订与确认撤回分别有版本事件。恢复测试证明能重建指定模型或解释为什么当前无法重建。\n\n## 5. 持续跟进二维的方式\n\n编写/实现每个三维阶段前和阶段后，核对二维README、最新实施设计、机器回执与共同契约版本，保存快照和变化影响。只读跟进、不编辑对方进行中的文件，不依据聊天概述推断开发完成。\n\n初次编写时看到二维18真实B设计与54项回执；此后已跟进至21的79项回执及22人工确认持久化设计，最终差异见18。新进展如果只是报告文字，注明报告所述；若要做兼容验收，还需检查合同和实际执行。三维不能要求二维暂停等自己赶齐，也不能照搬旧快照后声称已经持续同步。\n\n## 6. 本轮与持续目标\n\n本轮先交付可读、可回查的方案集；持续目标还包括关键接口细化、具体例与验证设计自查、跟进二维进展和必要小范围验证。文档数量不是目标完成条件。尚未验证的接口、运行和工程能力保留开放状态；不恢复用户已取消的定时任务。\n\n## 7. 2026-10-21：持续知识与语义准入工作包\n\nM1补谓词/量纲/上下文注册与共同知识修订合同，M3/M4补知识/模型/方法关联、增量编译和反例经验；复用二维F22—F26及F07/F08/F11/F20。三维具体增量路径与12项3DWIKI场景见[20](20-持续知识编译与三维工程Wiki设计.md)，当前全为NOT_RUN。\n\n语义准入先于确定执行：旧模拟附件通过不代表直径/量纲等含义已核。首期先选择真实可用小主题，固定范围、字段/迁移、独立样本、预算与验收；模型血缘与工具血缘必须进入对照报告。未落实事项转19待办，不以设计落盘关闭实施项。", "reference": false, "current": false, "truncated": false, "tags": ["todo"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/07-%E5%88%86%E9%98%B6%E6%AE%B5%E5%AE%9E%E6%96%BD%E4%B8%8E%E9%AA%8C%E6%94%B6%E8%AE%BE%E8%AE%A1.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e分阶段实施与验收设计\u003c/h2\u003e\u003cp\u003e引用\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-9ec39eb3a83ffde0\"\u003e二维06工作包 ↗\u003c/a\u003e、\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-29c6a198af2edf05\"\u003e16契约与文件设计 ↗\u003c/a\u003e、\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-8cb913e5390b355f\"\u003e17验证进展 ↗\u003c/a\u003e。三维分批接入共库，不要求二维提前完成全部三维功能。\u003c/p\u003e\u003ch3\u003e1. 阶段与依赖\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e阶段\u003c/td\u003e\u003ctd\u003e工作\u003c/td\u003e\u003ctd\u003e输入依赖\u003c/td\u003e\u003ctd\u003e退出证据\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eM0方案与接口对齐\u003c/td\u003e\u003ctd\u003e工程事实、共库边界、增量对象、验证设计\u003c/td\u003e\u003ctd\u003e二维当前合同、内核本地约定\u003c/td\u003e\u003ctd\u003e文档/来源/兼容清单及关键未决项，不能算运行验收\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eM1最小三维合同\u003c/td\u003e\u003ctd\u003e表示/参数/计划/绑定/运行/验证草案及正反例\u003c/td\u003e\u003ctd\u003e七对象基线与共同MethodRun/Relation进展\u003c/td\u003e\u003ctd\u003e新增类型可校验，旧样例回归，单位/失效反例有效\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eM2内核适配小链\u003c/td\u003e\u003ctd\u003e明确参数板孔、阶梯轴，输出运行证据\u003c/td\u003e\u003ctd\u003e本机绑定可用、操作合同核对\u003c/td\u003e\u003ctd\u003e真实运行、几何与参数检查、失败不覆盖原件\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eM3二维三维关联\u003c/td\u003e\u003ctd\u003e选实际可配对图模；保留歧义\u003c/td\u003e\u003ctd\u003e可核来源、二维对象关联与M2\u003c/td\u003e\u003ctd\u003e实际对象绑定、投影/参数核对、错绑/未知分支\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eM4工程知识闭环\u003c/td\u003e\u003ctd\u003e一个有资料支撑的工艺/结构主题\u003c/td\u003e\u003ctd\u003e可用正文、明确工况、方法\u003c/td\u003e\u003ctd\u003e正常/反例/未知，解释与改进、实际复检\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eM5扩展与资源\u003c/td\u003e\u003ctd\u003e小装配、更多对象及大容量检索\u003c/td\u003e\u003ctd\u003e共同目录/检索/版本服务与前述质量\u003c/td\u003e\u003ctd\u003e分层质量、真实资源和恢复证据；再扩到TB目标\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003eM1文档与合成合同可和二维开发并行；需要改共同Schema时再协调具体版本。M3不能把ParaCA
