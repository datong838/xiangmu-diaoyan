fold_linear_sweep`, `non_manifold_rotational_sweep` | SmApiBrep.h | Create solids by sweeping profiles |\n| [fillets](fillets.md) | `circular_fillet`, `chamfer_fillet`, `fillet_edges`, `fillet_edges_per_edge`, `variable_radius_fillet`, `remove_fillet`, `surface_surface_fillet`, `fillet_preview`, `set_bevel_corners` | SmApiFillets.h, SmApiBrep.h | Round or bevel edges |\n| [curves](curves.md) | `create_line_segment`, `create_line`, `create_circle`, `create_arc`, `create_helix`, `create_ellipse`, `create_rectangle`, `create_regular_polygon`, `create_curve`, `create_canonical_curve`, `create_curve_approx_points`, `create_curve_interp_points`, `offset_curve`, `evaluate_curve`, `evaluate_continuity`, `drop_curve_to_surface`, `convert_to_lines_and_arcs`, `project_curve_to_surface`, `lift_uv_curve`, `make_curves_compatible`, `order_curves`, `remove_curve_knots` | SmApiCurves.h | Create and simplify curves for profiles and paths |\n| [surfaces](surfaces.md) | `create_surface_from_points`, `create_surface_from_corner_points`, `create_surface_from_ordered_points`, `create_surface_from_random_points`, `create_ruled_surface`, `create_surface_revolution`, `create_offset_surface`, `create_extrude_surface`, `create_sweep_surface`, `create_skin_surface`, `create_planar_faces` | SmApiSurfaces.h, SmApiTrimmedSurfaces.h | Create standalone NURBS surfaces and planar Brep faces |\n| [offset](offset.md) | `offset_brep`, `shell_brep`, `create_offset_profile` | SmApiBrep.h, SmApiPrimitives.h | Offset surfaces, hollow out solids, offset planar curve loops |\n| [stitching](stitching.md) | `stitch_into_solid`, `stitch_into_shell`, `unify_normals`, `stitch_advanced`, `stitch_brep`, `stitch_brep_with_face`, `simple_face_stitch` | SmApiBrep.h | Join disconnected faces into solids/shells |\n| [intersectors](intersectors.md) | `intersect_breps`, `intersect_brep_with_plane`, `intersect_curves`, `intersect_surfaces`, `intersect_faces`, `intersect_curve_surface`, `intersect_curve_brep`, `intersect_curve_face` | SmApiIntersectors.h | Compute geometric intersections |\n| [transforms](transforms.md) | `translate`, `rotate`, `scale`, `scale_about_point`, `transform` | SmApiGeneral.h | Reposition and resize geometry |\n| [concurrency](concurrency.md) | `SmApiCreateContext`, `SmApiGetOrCreateContext` | SmApiGeneral.h | Context lifetime, object-owned caches, and process-per-worker concurrency (operations run single-threaded in the shipped build) |\n| [queries](queries.md) | `is_manifold_solid`, `compute_volume`, `brep_bounding_box`, `brep_copy`, `face_bounding_box`, `face_area`, `edge_bounding_box`, `edge_length`, `vertex_point`, `brep_closest_point`, `brep_closest_point_all`, `curve_closest_point`, `curve_closest_point_all`, `surface_closest_point`, `get_closest_point`, `get_edges_via_api`, `get_faces_via_api`, `find_edge`, `find_face`, `evaluate_curve`, `evaluate_surface_point`, `evaluate_surface_normal`, `evaluate_surface_derivatives`; methods `Brep.{info,bounding_box,center,volume,is_manifold_solid,copy,face_count,edge_count,vertex_count}`, `Face.{bounding_box,area,surface,uv_domain,edges,vertices,outer_loop_edges,boundary_loops,boundary_outer_loop,point_at_uv,normal_at_uv,outward_normal_at_uv,brep}`, `Edge.{bounding_box,length,curve,start_vertex,end_vertex,vertices,other_vertex,faces,point_at,brep}`, `Vertex.{point,edges,faces,brep}`, `Curve.{parameter_range,start_point,end_point,evaluate,length,is_closed,is_planar}`, `Surface.{u_domain,v_domain,uv_domain,evaluate,normal,derivatives,is_planar,is_periodic_u,is_periodic_v}` | SmApiQueries.h, SmApiSurfaces.h, SmApiCurves.h | Validate, measure, evaluate stable topology queries |\n| [dev_topology](dev_topology.md) | `_smlib_dev`: `topology_pick_ray`, `edgeuses`, `loopuses`, `loops`, `edgeuse_of_face`, `loop_of_face`, `face_loops`, `assert_valid`, `dump`, `user_test`, `user_test_example`, `draw.extract_draw_batches`, `tests.*`; types `Loop`, `Loopuse`, `Edgeuse` | SmTopologySolver.h, SmDraw, `_smlib_tests` | Debugger topology pick, loopuse/edgeuse walks, AssertValid, Dump, kernel-direct user tests, Draw extraction, in-process prog_test |\n| [cut_project_trim](cut_project_trim.md) | `cut`, `project_brep_onto_plane`, `project_and_trim`, `create_silhouette_curves`, `project_curve`, `trim_surface_with_3d_curves`, `trim_project_parallel` | SmApiBrep.h, SmApiTrimmedSurfaces.h | Cut, project, and trim operations |\n| [tessellation](tessellation.md) | `tessellate`, `tessellate_boundaries` | SmApiBrep.h | Convert BReps to polygon meshes or sample boundary edges |\n| [polygon_booleans](polygon_booleans.md) | `poly_boolean`, `poly_boolean_union`, `poly_boolean_difference`, `poly_boolean_intersection`, `poly_boolean_merge` | SmApiPolygons.h | Boolean operations on polygon meshes |\n| [polybrep](polybrep.md) | `PolyBrep`, `PolyFace`, `PolyEdge`, `PolyVertex`, `poly_brep_is_manifold_via_api`, `poly_brep_volume_via_api` | SmPoly*, SmApiPolygons.h | Inspect and measure tessellated / imported meshes |\n| [heal_import](heal_import.md) | `heal_brep` | SmApiHeal.h | Attempt supported BRep repairs |\n| [interactive_performance](interactive_performance.md) | `mass_properties`, `volume`, `bounding_box`, `tessellate`, `translate`, `rotate`, `transform`, `boolean_difference` | SmApiQueries.h, SmApiBrep.h, SmApiGeneral.h | Preview-vs-exact API selection and cache reuse: property preview levers, tessellation quality knobs, rigid-transform reuse, repeated cutters (not kernel tessellation cost or context/concurrency) |\n\n## SM_API_USD Operations\n\n| Guide | Python Functions | C API Header | Description |\n|---|---|---|---|\n| [usd_import_export](usd_import_export.md) | `usd.ensure_plugin_registered`, `usd.import_breps`, `usd.import_brep`, `usd.export_brep`, `usd.export_breps`, `usd.append_breps`, `usd.import_meshes`, `usd.import_mesh`, `usd.export_mesh`, `usd.export_meshes`, `usd.append_meshes` | SmApiUsd.h | Round-trip BRep (`BrepArray`) and polygon meshes (`UsdGeomMesh` ↔ `PolyBrep`) |\n\n## See Also\n\n- **[`.agents/docs/errors.md`](../docs/errors.md)** — decoding `RuntimeError` from any binding: every `SM_ERR_*` code with typical causes and remedies, reading the kernel trace, operation-specific guidance for `pipe_sweep`, booleans, fillets, and tessellation.\n\n## Typical Workflow Order\n\n1. **Create** — primitives, curves, surfaces\n2. **Shape** — sweeps, booleans, cut, trim\n3. **Refine** — fillets, offset/shell\n4. **Validate** — is_manifold_solid, compute_volume, closest_point queries\n5. **Export** — USD export, tessellation (`tessellate` → `PolyBrep`)\n\n## Python Binding Coverage\n\nThe `_omni_solid` Python module provides near-complete coverage of stable SM_API modeling operations. **Tessellation** (`tessellate` / `SmApiTessellate`) and **polygon mesh booleans** (`poly_boolean*` / `SmApiPolyBoolean*`) are wrapped; **`PolyBrep`** supports topology traversal, bounding box, mass properties, plane section, and ray intersection (see **[polybrep](polybrep.md)**).\n\nDebugger-only surface (loopuse/edgeuse walks, topology pick, kernel Draw, in-process `prog_test`) lives in a separate **`_smlib_dev`** module — see **[dev_topology](dev_topology.md)**.\n\nThe stable `_omni_solid` module exposes:\n\n- **Enums:** `BooleanOp`, `BooleanOp2D`, `PolyBooleanOp`, `FilletXSect`, `TrimType`, `ContinuityType`\n- **Types:** `Vec3`, `Vec2`, `Brep`, `PolyBrep`, `PolyFace`, `PolyEdge`, `PolyVertex`, `Face`, `Edge`, `Vertex`, `Curve`, `BSplineCurve`, `Line`, `Circle`, `Surface`, `Object`, `Axis2Placement`\n- **Topology:** `brep.faces()`, `brep.edges()`, `brep.vertices()`; on `PolyBrep`: `get_faces()`, `get_edges()`, `get_vertices()`, `get_points()` (see **[polybrep](polybrep.md)**)\n- **Properties on geometric types:**\n  - `Brep`: `.info()`, `.bounding_box(tight=False)`, `.center()`, `.volume(relative_accuracy=1e-3)`, `.is_manifold_solid()`, `.copy()`, `.face_count()`, `.edge_count()`, `.vertex_count()`\n  - `Face`: `.bounding_box(tight=False)`, `.area(relative_accuracy=1e-3)`\n  - `Edge`: `.bounding_box(tight=False)`, `.length(desired_accuracy=1e-6)`\n  - `Vertex`: `.point()`\n  - `Curve`: `.parameter_range()`, `.start_point()`, `.end_point()`, `.evaluate(t)`, `.length(desired_accuracy=1e-6)`, `.is_closed(tolerance=0.0)`, `.is_planar(tolerance=SM_EFF_ZERO)`\n  - `Surface`: `.u_domain()`, `.v_domain()`, `.uv_domain()`, `.evaluate(u, v)`, `.normal(u, v)`, `.derivatives(u, v)`, `.is_planar(tolerance=SM_EFF_ZERO)`, `.is_periodic_u()`, `.is_periodic_v()`\n\n  Brep / Face / Edge / Vertex methods wrap `SmApiQueries.h` entry points and are also exposed as flat aliases under `sm.queries.*` (`brep_bounding_box`, `face_area`, `edge_length`, `vertex_point`, `brep_copy`, etc.). Surface evaluators wrap `SmApiSurfaces.h` (`SmApiEvaluateSurfacePoint` / `Normal` / `Derivatives`) and have flat aliases `sm.evaluate_surface_point` / `_normal` / `_derivatives`. The remaining Curve / Surface predicates (`is_planar`, `is_periodic_*`, `parameter_range`, `length`, ...) are method-only — they call the kernel directly. See **[queries](queries.md)**.\n\n- **Topology accessors on stable geometric types** (walk the BRep graph without loopuse/edgeuse):\n  - `Face`: `.surface()`, `.uv_domain()`, `.edges()`, `.vertices()`, `.outer_loop_edges()`, `.boundary_loops()`, `.boundary_outer_loop()`, `.point_at_uv(u, v)`, `.normal_at_uv(u, v)`, `.outward_normal_at_uv(u, v)`, `.brep()`\n  - `Edge`: `.curve()`, `.start_vertex()`, `.end_vertex()`, `.vertices()`, `.other_vertex(v)`, `.faces()`, `.point_at(t)`, `.brep()`\n  - `Vertex`: `.edges()`, `.faces()`, `.brep()`\n\n  Face boundary methods expose ordered edge occurrences and direction bits without stable use objects. For direct `Loop` / `Loopuse` / `Edgeuse` objects, `topology_pick_ray`, and kernel Draw extraction, see **[dev_topology](dev_topology.md)**.\n\n- **Type stubs (`.pyi`):** `source/SmPyLib/stubs/usd_brep/__init__.pyi` and `source/SmPyLib/stubs/usd_brep/usd.pyi` for stable API; `source/SmPyDevLib/stubs/smlib_dev/__init__.pyi` for debugger API.", "reference": false, "current": false, "truncated": false, "tags": ["tool"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "../../../cad/usd-brep/.agents/operations/INDEX.md", "source_kind": "markdown", "preview_html": "\u003cp\u003e\u0026lt;!-- SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION \u0026amp; AFFILIATES. All rights reserved. --\u0026gt;\u003c/p\u003e\u003cp\u003e\u0026lt;!-- SPDX-License-Identifier: Apache-2.0 --\u0026gt;\u003c/p\u003e\u003ch2\u003eOperation Index\u003c/h2\u003e\u003cp\u003eQuick reference for all SMLib operation guides organized by category.\u003c/p\u003e\u003ch3\u003eSM_API Operations\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003eGuide\u003c/td\u003e\u003ctd\u003ePython Functions\u003c/td\u003e\u003ctd\u003eC API Header\u003c/td\u003e\u003ctd\u003eDescription\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eprimitives（见原文附件）\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ecreate_box\u003c/code\u003e, \u003ccode\u003ecreate_sphere\u003c/code\u003e, \u003ccode\u003ecreate_cone\u003c/code\u003e, \u003ccode\u003ecreate_cylinder\u003c/code\u003e, \u003ccode\u003ecreate_torus\u003c/code\u003e, \u003ccode\u003ecreate_plane\u003c/code\u003e, \u003ccode\u003ecreate_planar_circle\u003c/code\u003e, \u003ccode\u003ecreate_pyramid\u003c/code\u003e, \u003ccode\u003ecreate_cylindrical_box\u003c/code\u003e, \u003ccode\u003ecreate_partial_sphere\u003c/code\u003e, \u003ccode\u003ecreate_sphere_no_pole\u003c/code\u003e, \u003ccode\u003ecreate_partial_cone\u003c/code\u003e, \u003ccode\u003ecreate_partial_cylinder\u003c/code\u003e, \u003ccode\u003ecreate_partial_torus\u003c/code\u003e, \u003ccode\u003ecreate_swung_primitive\u003c/code\u003e, \u003ccode\u003ecreate_blend_primitive\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eSmApiPrimitives.h\u003c/td\u003e\u003ctd\u003eCreate solid primitives and sheet bodies\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ebooleans（见原文附件）\u003c/td\u0 3c/code\u003e, \u003ccode\u003eusd.export_breps\u003c/code\u003e, \u003ccode\u003eusd.append_breps\u003c/code\u003e, \u003ccode\u003eusd.import_meshes\u003c/code\u003e, \u003ccode\u003eusd.import_mesh\u003c/code\u003e, \u003ccode\u003eusd.export_mesh\u003c/code\u003e, \u003ccode\u003eusd.export_meshes\u003c/code\u003e, \u003ccode\u003eusd.append_meshes\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eSmApiUsd.h\u003c/td\u003e\u003ctd\u003eRound-trip BRep (\u003ccode\u003eBrepArray\u003c/code\u003e) and polygon meshes (\u003ccode\u003eUsdGeomMesh\u003c/code\u003e ↔ \u003ccode\u003ePolyBrep\u003c/code\u003e)\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003ch3\u003eSee Also\u003c/h3\u003e\u003cp\u003e- \u003cstrong\u003e\u003ccode\u003e.agents/docs/errors.md\u003c/code\u003e（见原文附件）\u003c/strong\u003e — decoding \u003ccode\u003eRuntimeError\u003c/code\u003e from any binding: every \u003ccode\u003eSM_ERR_*\u003c/code\u003e code with typical causes and remedies, reading the kernel trace, operation-specific guidance for \u003ccode\u003epipe_sweep\u003c/code\u003e, booleans, fillets, and tessellation.\u003c/p\u003e\u003ch3\u003eTypical Workflow Order\u003c/h3\u003e\u003cp\u003e1. \u003cstrong\u003eCreate\u003c/strong\u003e — primitives, curves, surfaces\u003c/p\u003e\u003cp\u003e2. \u003cstrong\u003eShape\u003c/strong\u003e — sweeps, booleans, cut, trim\u003c/p\u003e\u003cp\u003e3. \u003cstrong\u003eRefine\u003c/strong\u003e — fillets, offset/shell\u003c/p\u003e\u003cp\u003e4. \u003cstrong\u003eValidate\u003c/strong\u003e — is_manifold_solid, compute_volume, closest_point queries\u003c/p\u003e\u003cp\u003e5. \u003cstrong\u003eExport\u003c/strong\u003e — USD export, tessellation (\u003ccode\u003etessellate\u003c/code\u003e → \u003ccode\u003ePolyBrep\u003c/code\u003e)\u003c/p\u003e\u003ch3\u003ePython Binding Coverage\u003c/h3\u003e\u003cp\u003eThe \u003ccode\u003e_omni_solid\u003c/code\u003e Python module provides near-complete coverage of stable SM_API modeling operations. \u003cstrong\u003eTessellation\u003c/strong\u003e (\u003ccode\u003etessellate\u003c/code\u003e / \u003ccode\u003eSmApiTessellate\u003c/code\u003e) and \u003cstrong\u003epolygon mesh booleans\u003c/strong\u003e (\u003ccode\u003epoly_boolean*\u003c/code\u003e / \u003ccode\u003eSmApiPolyBoolean*\u003c/code\u003e) are wrapped; \u003cstrong\u003e\u003ccode\u003ePolyBrep\u003c/code\u003e\u003c/strong\u003e supports topology traversal, bounding box, mass properties, plane section, and ray intersection (see \u003cstrong\u003epolybrep（见原文附件）\u003c/strong\u003e).\u003c/p\u003e\u003cp\u003eDebugger-only surface (loopuse/edgeuse walks, topology pick, kernel Draw, in-process \u003ccode\u003eprog_test\u003c/code\u003e) lives in a separate \u003cstrong\u003e\u003ccode\u003e_smlib_dev\u003c/code\u003e\u003c/strong\u003e module — see \u003cstrong\u003edev_topology（见原文附件）\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003eThe stable \u003ccode\u003e_omni_solid\u003c/code\u003e module exposes:\u003c/p\u003e\u003cp\u003e- \u003cstrong\u003eEnums:\u003c/strong\u003e \u003ccode\u003eBooleanOp\u003c/code\u003e, \u003ccode\u003eBooleanOp2D\u003c/code\u003e, \u003ccode\u003ePolyBooleanOp\u003c/code\u003e, \u003ccode\u003eFilletXSect\u003c/code\u003e, \u003ccode\u003eTrimType\u003c/code\u003e, \u003ccode\u003eContinuityType\u003c/code\u003e\u003c/p\u003e\u003cp\u003e- \u003cstrong\u003eTypes:\u003c/strong\u003e \u003ccode\u003eVec3\u003c/code\u003e, \u003ccode\u003eVec2\u003c/code\u003e, \u003ccode\u003eBrep\u003c/code\u003e, \u003ccode\u003ePolyBrep\u003c/code\u003e, \u003ccode\u003ePolyFace\u003c/code\u003e, \u003ccode\u003ePolyEdge\u003c/code\u003e, \u003ccode\u003ePolyVertex\u003c/code\u003e, \u003ccode\u003eFace\u003c/code\u003e, \u003ccode\u003eEdge\u003c/code\u003e, \u003ccode\u003eVertex\u003c/code\u003e, \u003ccode\u003eCurve\u003c/code\u003e, \u003ccode\u003eBSplineCurve\u003c/code\u003e, \u003ccode\u003eLine\u003c/code\u003e, \u003ccode\u003eCircle\u003c/code\u003e, \u003ccode\u003eSurface\u003c/code\u003e, \u003ccode\u003eObject\u003c/code\u003e, \u003ccode\u003eAxis2Placement\u003c/code\u003e\u003c/p\u003e\u003cp\u003e- \u003cstrong\u003eTopology:\u003c/strong\u003e \u003ccode\u003ebrep.faces()\u003c/code\u003e, \u003ccode\u003ebrep.edges()\u003c/code\u003e, \u003ccode\u003ebrep.vertices()\u003c/code\u003e; on \u003ccode\u003ePolyBrep\u003c/code\u003e: \u003ccode\u003eget_faces()\u003c/code\u003e, \u003ccode\u003eget_edges()\u003c/code\u003e, \u003ccode\u003eget_vertices()\u003c/code\u003e, \u003ccode\u003eget_points()\u003c/code\u003e (see \u003cstrong\u003epolybrep（见原文附件）\u003c/strong\u003e)\u003c/p\u003e\u003cp\u003e- \u003cstrong\u003eProperties on geometric types:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e  - \u003ccode\u003eBrep\u003c/code\u003e: \u003ccode\u003e.info()\u003c/code\u003e, \u003ccode\u003e.bounding_box(tight=False)\u003c/code\u003e, \u003ccode\u003e.center()\u003c/code\u003e, \u003ccode\u003e.volume(relative_accuracy=1e-3)\u003c/code\u003e, \u003ccode\u003e.is_manifold_solid()\u003c/code\u003e, \u003ccode\u003e.copy()\u003c/code\u003e, \u003ccode\u003e.face_count()\u003c/code\u003e, \u003ccode\u003e.edge_count()\u003c/code\u003e, \u003ccode\u003e.vertex_count()\u003c/code\u003e\u003c/p\u003e\u003cp\u003e  - \u003ccode\u003eFace\u003c/code\u003e: \u003ccode\u003e.bounding_box(tight=False)\u003c/code\u003e, \u003ccode\u003e.area(relative_accuracy=1e-3)\u003c/code\u003e\u003c/p\u003e\u003cp\u003e  - \u003ccode\u003eEdge\u003c/code\u003e: \u003ccode\u003e.bounding_box(tight=False)\u003c/code\u003e, \u003ccode\u003e.length(desired_accuracy=1e-6)\u003c/code\u003e\u003c/p\u003e\u003cp\u003e  - \u003ccode\u003eVertex\u003c/code\u003e: \u003ccode\u003e.point()\u003c/code\u003e\u003c/p\u003e\u003cp\u003e  - \u003ccode\u003eCurve\u003c/code\u003e: \u003ccode\u003e.parameter_range()\u003c/code\u003e, \u003ccode\u003e.start_point()\u003c/code\u003e, \u003ccode\u003e.end_point()\u003c/code\u003e, \u003ccode\u003e.evaluate(t)\u003c/code\u003e, \u003ccode\u003e.length(desired_accuracy=1e-6)\u003c/code\u003e, \u003ccode\u003e.is_closed(tolerance=0.0)\u003c/code\u003e, \u003ccode\u003e.is_planar(tolerance=SM_EFF_ZERO)\u003c/code\u003e\u003c/p\u003e\u003cp\u003e  - \u003ccode\u003eSurface\u003c/code\u003e: \u003ccode\u003e.u_domain()\u003c/code\u003e, \u003ccode\u003e.v_domain()\u003c/code\u003e, \u003ccode\u003e.uv_domain()\u003c/code\u003e, \u003ccode\u003e.evaluate(u, v)\u003c/code\u003e, \u003ccode\u003e.normal(u, v)\u003c/code\u003e, \u003ccode\u003e.derivatives(u, v)\u003c/code\u003e, \u003ccode\u003e.is_planar(tolerance=SM_EFF_ZERO)\u003c/code\u003e, \u003ccode\u003e.is_periodic_u()\u003c/code\u003e, \u003ccode\u003e.is_periodic_v()\u003c/code\u003e\u003c/p\u003e\u003cp\u003e  Brep / Face / Edge / Vertex methods wrap \u003ccode\u003eSmApiQueries.h\u003c/code\u003e entry points and are also exposed as flat aliases under \u003ccode\u003esm.queries.*\u003c/code\u003e (\u003ccode\u003ebrep_bounding_box\u003c/code\u003e, \u003ccode\u003eface_area\u003c/code\u003e, \u003ccode\u003eedge_length\u003c/code\u003e, \u003ccode\u003evertex_point\u003c/code\u003e, \u003ccode\u003ebrep_copy\u003c/code\u003e, etc.). Surface evaluators wrap \u003ccode\u003eSmApiSurfaces.h\u003c/code\u003e (\u003ccode\u003eSmApiEvaluateSurfacePoint\u003c/code\u003e / \u003ccode\u003eNormal\u003c/code\u003e / \u003ccode\u003eDerivatives\u003c/code\u003e) and have flat aliases \u003ccode\u003esm.evaluate_surface_point\u003c/code\u003e / \u003ccode\u003e_normal\u003c/code\u003e / \u003ccode\u003e_derivatives\u003c/code\u003e. The remaining Curve / Surface predicates (\u003ccode\u003eis_planar\u003c/code\u003e, \u003ccode\u003eis_periodic_*\u003c/code\u003e, \u003ccode\u003eparameter_range\u003c/code\u003e, \u003ccode\u003elength\u003c/code\u003e, ...) are method-only — they call the kernel directly. See \u003cstrong\u003equeries（见原文附件）\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e- \u003cstrong\u003eTopology accessors on stable geometric types\u003c/strong\u003e (walk the BRep graph without loopuse/edgeuse):\u003c/p\u003e\u003cp\u003e  - \u003ccode\u003eFace\u003c/code\u003e: \u003ccode\u003e.surface()\u003c/code\u003e, \u003ccode\u003e.uv_domain()\u003c/code\u003e, \u003ccode\u003e.edges()\u003c/code\u003e, \u003ccode\u003e.vertices()\u003c/code\u003e, \u003ccode\u003e.outer_loop_edges()\u003c/code\u003e, \u003ccode\u003e.boundary_loops()\u003c/code\u003e, \u003ccode\u003e.boundary_outer_loop()\u003c/code\u003e, \u003ccode\u003e.point_at_uv(u, v)\u003c/code\u003e, \u003ccode\u003e.normal_at_uv(u, v)\u003c/code\u003e, \u003ccode\u003e.outward_normal_at_uv(u, v)\u003c/code\u003e, \u003ccode\u003e.brep()\u003c/code\u003e\u003c/p\u003e\u003cp\u003e  - \u003ccode\u003eEdge\u003c/code\u003e: \u003ccode\u003e.curve()\u003c/code\u003e, \u003ccode\u003e.start_vertex()\u003c/code\u003e, \u003ccode\u003e.end_vertex()\u003c/code\u003e, \u003ccode\u003e.vertices()\u003c/code\u003e, \u003ccode\u003e.other_vertex(v)\u003c/code\u003e, \u003ccode\u003e.faces()\u003c/code\u003e, \u003ccode\u003e.point_at(t)\u003c/code\u003e, \u003ccode\u003e.brep()\u003c/code\u003e\u003c/p\u003e\u003cp\u003e  - \u003ccode\u003eVertex\u003c/code\u003e: \u003ccode\u003e.edges()\u003c/code\u003e, \u003ccode\u003e.faces()\u003c/code\u003e, \u003ccode\u003e.brep()\u003c/code\u003e\u003c/p\u003e\u003cp\u003e  Face boundary methods expose ordered edge occurrences and direction bits without stable use objects. For direct \u003ccode\u003eLoop\u003c/code\u003e / \u003ccode\u003eLoopuse\u003c/code\u003e / \u003ccode\u003eEdgeuse\u003c/code\u003e objects, \u003ccode\u003etopology_pick_ray\u003c/code\u003e, and kernel Draw extraction, see \u003cstrong\u003edev_topology（见原文附件）\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e- \u003cstrong\u003eType stubs (\u003ccode\u003e.pyi\u003c/code\u003e):\u003c/strong\u003e \u003ccode\u003esource/SmPyLib/stubs/usd_brep/__init__.pyi\u003c/code\u003e and \u003ccode\u003esource/SmPyLib/stubs/usd_brep/usd.pyi\u003c/code\u003e for stable API; \u003ccode\u003esource/SmPyDevLib/stubs/smlib_dev/__init__.pyi\u003c/code\u003e for debugger API.\u003c/p\u003e"}, {"id": "cad3-7c7a5e3466e18942", "path": "/Users/ddt/work/projects/ai_agent/cad/usd-brep/README.md", "source_path": "/Users/ddt/work/projects/ai_agent/cad/usd-brep/README.md", "title": "USD BRep", "group": "kernel", "sub": "tool", "role": "工具资料 · 非本机运行证明", "sha256": "d9daa1907b7de216fbefc54a794e796a1aa2b45532122e41a1e786931e51c172", "headings": ["USD BRep", "Requirements", "Using this repo", "Build it", "Linux", "macOS", "Windows", "Test it", "Format it", "Run the Python GUI", "Debug binaries by default (kernel Dump() echoes to the terminal).", "Release binaries: add --release", "Explore examples", "macOS local development", "Contributing", "License", "Heal USD BRep assets"], "body": "# USD BRep\n\nStandalone Omniverse repo containing USD BRep (NURBS boundary-representation solid modeling) libraries.\n\n## Requirements\n\n- [**Git**](https://git-scm.com/downloads) and [**Git LFS**](https://git-lfs.com/): Git LFS is required for the large binary fixtures tracked in `.gitattributes` (USD assets, STEP/IGES/JT models).\n\n- **(Windows - C++ Only) Microsoft Visual Studio (2019 or 2022)** with the MSVC C++ toolset:\n  - Install from [Visual Studio Downloads](https://visualstudio.microsoft.com/downloads/) (or **Build Tools for Visual Studio**) with the **Desktop development with C++** workload selected. A VS install without the C++ toolset is not enough.\n  - The build uses this **host-installed** compiler (`msbuild.link_host_toolchain` in `repo.toml`), not Packman `msvc`.\n  - `msbuild.vs_version` is pinned to `vs2019`, so VS 2022 users also need the **MSVC v142 build tools** component.\n  - If discovery fails, set `msbuild.vs_path`, `msbuild.vs_version`, or both — see [repo_build toolchains](https://docs.omniverse.nvidia.com/kit/docs/repo_build/latest/docs/toolchains.html). These settings locate an installed toolset; they do not install one.\n\n- **(Windows - C++ Only) Windows SDK**: Install alongside MSVC via the Visual Studio Installer. If discovery fails, set `msbuild.winsdk_path` in `repo.toml`.\n\n- **(Windows) [Microsoft Visual C++ Redistributable](https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist)**: Required to run the built binaries, which link the VC runtime dynamically rather than bundling it. The **Desktop development with C++** workload above ships the redistributable, so a machine set up to build already has it — install it separately only on machines that run the binaries without Visual Studio.\n\n- **(Linux) build-essential**: `sudo apt-get install build-essential`\n\nAll other build-time dependencies — OpenUSD, Python 3.12, pybind11, **premake**, and the `repo_*` tools — are pulled automatically via Packman when you build.\n\n## Using this repo\n\nPrerequisites are listed under [Requirements](#requirements). Use `./repo.sh` on Linux and macOS, `./repo.bat` on Windows. macOS: [macOS local development](#macos-local-development).\n\n### Build it\n\nRun prebuild before building a fresh checkout or after deleting `_build`. It stages\nthe omniSolid schema plugin in `_build/schema/omniSolid/resources`; `repo build`\nalone does not create these resources, which USD tools require at runtime.\n\n```bash\n# Linux\n./prebuild.sh\n./repo.sh build\n\n# macOS\n./prebuild.sh -p macos-universal\n./repo.sh build -p macos-universal\n\n# Windows\n./prebuild.bat\n./repo.bat build\n```\n\n### Test it\n\n```bash\n./repo.sh test\n./tests.sh linux-x86_64              # or macos-universal\n```\n\n### Format it\n\n```bash\n./repo.sh format\n```\n\n### Run the Python GUI\n\n```bash\n# Debug binaries by default (kernel Dump() echoes to the terminal).\nuv run --locked --group gui python tools/scripts/smlib_gui.py\n\n# Release binaries: add --release\nuv run --locked --group gui python tools/scripts/smlib_gui.py --release\n```\n\nSee `tools/smlib_gui/README.md` for smoke-test and troubleshooting commands.\n\n### Explore examples\n\nRunnable compositions organized by API layer live under [Examples](Examples/README.md).\n\n## macOS local development\n\nApple Silicon only: `./repo.sh build -p macos-universal`. Build symlinks host Packman Python into `_build/target-deps/python` when available (`SMLIB_PYTHON_ROOT` to override).\n\n**Python-only (default):** kernel, C++ tests, `_smlib_tests`, and `_smlib_dev` (imports need Tier 1 `_omni_solid`). No OpenUSD, OCCT, or `_omni_solid`.\n\n```bash\n./repo.sh build -p macos-universal -j10\n./tests.sh macos-universal\n```\n\n**Tier 1 (optional):** local OpenUSD 3.12 staged via `setup-macos-local-deps.sh`.\n\n```bash\nexport SMLIB_USD_ROOT=~/opt/usd-25.11-py312\n./tools/scripts/setup-macos-local-deps.sh\n./repo.sh build -p macos-universal -j10\n./tests.sh macos-universal\n```\n\nSet `PYTHONPATH=\"$PWD/_build/macos-universal/release\"` to import Python extensions. Packman OpenUSD/Python packages are not available on macOS. The macOS premake package (`premake@5.0.0-beta1+nv1-macos-universal`, `deps/host-deps.packman.xml`) is not on the public Packman server either; supply it through a user-level Packman configuration. Avoid `./repo.sh build -x`; delete `_build`, `_compiler`, and `_repo` to clean.\n\n## Contributing\n\nThis project is currently not accepting contributions.\n\nIssues and bug reports are welcome through the project issue tracker, and security\nissues should be reported as described in `SECURITY.md`. See `CONTRIBUTING.md` for\ndetails.\n\n## License\n\nUSD BRep is licensed under the Apache License, Version 2.0. See\n[LICENSE](LICENSE) for the terms governing use, reproduction, and distribution.\n\nCopyright (c) 2020-2026, NVIDIA CORPORATION \u0026 AFFILIATES. All rights reserved.\n\n`repo.sh`, `repo.bat`, and `tools/repoman/repoman_bootstrapper.py` are licensed\nunder the MIT License instead; see `THIRD_PARTY_NOTICES.md` for the full text.\n\nFor third-party notices and bundled components, see `THIRD_PARTY_NOTICES.md`.\n\n## Heal USD BRep assets\n\n`usd.heal_file` heals BrepArray definitions in the layers used by the current USD\ncomposition and writes the scene with the healed geometry, keeping its layers,\nreferences, native instancing, transforms and materials. External layers used only\nby unselected variants remain referenced but are not healed. Material subset\nopinions outside the BRep's defining prim spec are rejected rather than lost.\n\n```python\nimport usd_brep\nusd_brep.usd.heal_file(\"input.usdc\", \"input_healed.usdc\")\n```", "reference": false, "current": false, "truncated": false, "tags": ["tool"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "../../../cad/usd-brep/README.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003eUSD BRep\u003c/h2\u003e\u003cp\u003eStandalone Omniverse repo containing USD BRep (NURBS boundary-representation solid modeling) libraries.\u003c/p\u003e\u003ch3\u003eRequirements\u003c/h3\u003e\u003cp\u003e- \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://git-scm.com/downloads\"\u003e\u003cstrong\u003eGit\u003c/strong\u003e\u003c/a\u003e and \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://git-lfs.com/\"\u003e\u003cstrong\u003eGit LFS\u003c/strong\u003e\u003c/a\u003e: Git LFS is required for the large binary fixtures tracked in \u003ccode\u003e.gitattributes\u003c/code\u003e (USD assets, STEP/IGES/JT models).\u003c/p\u003e\u003cp\u003e- \u003cstrong\u003e(Windows - C++ Only) Microsoft Visual Studio (2019 or 2022)\u003c/strong\u003e with the MSVC C++ toolset:\u003c/p\u003e\u003cp\u003e  - Install from \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://visualstudio.microsoft.com/downloads/\"\u003eVisual Studio Downloads\u003c/a\u003e (or \u003cstrong\u003eBuild Tools for Visual Studio\u003c/strong\u003e) with the \u003cstrong\u003eDesktop development with C++\u003c/strong\u003e workload selected. A VS install without the C++ toolset is not enough.\u003c/p\u003e\u003cp\u003e  - The build uses this \u003cstrong\u003ehost-installed\u003c/strong\u003e compiler (\u003ccode\u003emsbuild.link_host_toolchain\u003c/code\u003e in \u003ccode\u003erepo.toml\u003c/code\u003e), not Packman \u003ccode\u003emsvc\u003c/code\u003e.\u003c/p\u003e\u003cp\u003e  - \u003ccode\u003emsbuild.vs_version\u003c/code\u003e is pinned to \u003ccode\u003evs2019\u003c/code\u003e, so VS 2022 users also need the \u003cstrong\u003eMSVC v142 build tools\u003c/strong\u003e component.\u003c/p\u003e\u003cp\u003e  - If discovery fails, set \u003ccode\u003emsbuild.vs_path\u003c/code\u003e, \u003ccode\u003emsbuild.vs_version\u003c/code\u003e, or both — see \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://docs.omniverse.nvidia.com/kit/docs/repo_build/latest/docs/toolchains.html\"\u003erepo_build toolchains\u003c/a\u003e. These settings locate an installed toolset; they do not install one.\u003c/p\u003e\u003cp\u003e- \u003cstrong\u003e(Windows - C++ Only) Windows SDK\u003c/strong\u003e: Install alongside MSVC via the Visual Studio Installer. If discovery fails, set \u003ccode\u003emsbuild.winsdk_path\u003c/code\u003e in \u003ccode\u003erepo.toml\u003c/code\u003e.\u003c/p\u003e\u003cp\u003e- \u003cstrong\u003e(Windows) \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist\"\u003eMicrosoft Visual C++ Redistributable\u003c/a\u003e\u003c/strong\u003e: Required to run the built binaries, which link the VC runtime dynamically rather than bundling it. The \u003cstrong\u003eDesktop development with C++\u003c/strong\u003e workload above ships the redistributable, so a machine set up to build already has it — install it separately only on machines that run the binaries without Visual Studio.\u003c/p\u003e\u003cp\u003e- \u003cstrong\u003e(Linux) build-essential\u003c/strong\u003e: \u003ccode\u003esudo apt-get install build-essential\u003c/code\u003e\u003c/p\u003e\u003cp\u003eAll other build-time dependencies — OpenUSD, Python 3.12, pybind11, \u003cstrong\u003epremake\u003c/strong\u003e, and the \u003ccode\u003erepo_*\u003c/code\u003e tools — are pulled automatically via Packman when you build.\u003c/p\u003e\u003ch3\u003eUsing this repo\u003c/h3\u003e\u003cp\u003ePrerequisites are listed under Requirements（见原文附件）. Use \u003ccode\u003e./repo.sh\u003c/code\u003e on Linux and macOS, \u003ccode\u003e./repo.bat\u003c/code\u003e on Windows. macOS: macOS local development（见原文附件）.\u003c/p\u003e\u003ch4\u003eBuild it\u003c/h4\u003e\u003cp\u003eRun prebuild before building a fresh checkout or after deleting \u003ccode\u003e_build\u003c/code\u003e. It stages\u003c/p\u003e\u003cp\u003ethe omniSolid schema plugin in \u003ccode\u003e_build/schema/omniSolid/resources\u003c/code\u003e; \u003ccode\u003erepo build\u003c/code\u003e\u003c/p\u003e\u003cp\u003ealone does not create these resources, which USD tools require at runtime.\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e# Linux\n./prebuild.sh\n./repo.sh build\n\n# macOS\n./prebuild.sh -p macos-universal\n./repo.sh build -p macos-universal\n\n# Windows\n./prebuild.bat\n./repo.bat build\n\u003c/code\u003e\u003c/pre\u003e\u003ch4\u003eTest it\u003c/h4\u003e\u003cpre\u003e\u003ccode\u003e./repo.sh test\n./tests.sh linux-x86_64              # or macos-universal\n\u003c/code\u003e\u003c/pre\u003e\u003ch4\u003eFormat it\u003c/h4\u003e\u003cpre\u003e\u003ccode\u003e./repo.sh format\n\u003c/code\u003e\u003c/pre\u003e\u003ch4\u003eRun the Python GUI\u003c/h4\u003e\u003cpre\u003e\u003ccode\u003e# Debug binaries by default (kernel Dump() echoes to the terminal).\nuv run --locked --group gui python tools/scripts/smlib_gui.py\n\n# Release binaries: add --release\nuv run --locked --group gui python tools/scripts/smlib_gui.py --release\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eSee \u003ccode\u003etools/smlib_gui/README.md\u003c/code\u003e for smoke-test and troubleshooting commands.\u003c/p\u003e\u003ch4\u003eExplore examples\u003c/h4\u003e\u003cp\u003eRunnable compositions organized by API layer live under Examples（见原文附件）.\u003c/p\u003e\u003ch3\u003emacOS local development\u003c/h3\u003e\u003cp\u003eApple Silicon only: \u003ccode\u003e./repo.sh build -p macos-universal\u003c/code\u003e. Build symlinks host Packman Python into \u003ccode\u003e_build/target-deps/python\u003c/code\u003e when available (\u003ccode\u003eSMLIB_PYTHON_ROOT\u003c/code\u003e to override).\u003c/p\u003e\u003cp\u003e\u003cstrong\u003ePython-only (default):\u003c/strong\u003e kernel, C++ tests, \u003ccode\u003e_smlib_tests\u003c/code\u003e, and \u003ccode\u003e_smlib_dev\u003c/code\u003e (imports need Tier 1 \u003ccode\u003e_omni_solid\u003c/code\u003e). No OpenUSD, OCCT, or \u003ccode\u003e_omni_solid\u003c/code\u003e.\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e./repo.sh build -p macos-universal -j10\n./tests.sh macos-universal\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003cstrong\u003eTier 1 (optional):\u003c/strong\u003e local OpenUSD 3.12 staged via \u003ccode\u003esetup-macos-local-deps.sh\u003c/code\u003e.\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eexport SMLIB_USD_ROOT=~/opt/usd-25.11-py312\n./tools/scripts/setup-macos-local-deps.sh\n./repo.sh build -p macos-universal -j10\n./tests.sh macos-universal\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eSet \u003ccode\u003ePYTHONPATH=\u0026quot;$PWD/_build/macos-universal/release\u0026quot;\u003c/code\u003e to import Python extensions. Packman OpenUSD/Python packages are not available on macOS. The macOS premake package (\u003ccode\u003epremake@5.0.0-beta1+nv1-macos-universal\u003c/code\u003e, \u003ccode\u003edeps/host-deps.packman.xml\u003c/code\u003e) is not on the public Packman server either; supply it through a user-level Packman configuration. Avoid \u003ccode\u003e./repo.sh build -x\u003c/code\u003e; delete \u003ccode\u003e_build\u003c/code\u003e, \u003ccode\u003e_compiler\u003c/code\u003e, and \u003ccode\u003e_repo\u003c/code\u003e to clean.\u003c/p\u003e\u003ch3\u003eContributing\u003c/h3\u003e\u003cp\u003eThis project is currently not accepting contributions.\u003c/p\u003e\u003cp\u003eIssues and bug reports are welcome through the project issue tracker, and security\u003c/p\u003e\u003cp\u003eissues should be reported as described in \u003ccode\u003eSECURITY.md\u003c/code\u003e. See \u003ccode\u003eCONTRIBUTING.md\u003c/code\u003e for\u003c/p\u003e\u003cp\u003edetails.\u003c/p\u003e\u003ch3\u003eLicense\u003c/h3\u003e\u003cp\u003eUSD BRep is licensed under the Apache License, Version 2.0. See\u003c/p\u003e\u003cp\u003eLICENSE（见原文附件） for the terms governing use, reproduction, and distribution.\u003c/p\u003e\u003cp\u003eCopyright (c) 2020-2026, NVIDIA CORPORATION \u0026amp; AFFILIATES. All rights reserved.\u003c/p\u003e\u003cp\u003e\u003ccode\u003erepo.sh\u003c/code\u003e, \u003ccode\u003erepo.bat\u003c/code\u003e, and \u003ccode\u003etools/repoman/repoman_bootstrapper.py\u003c/code\u003e are licensed\u003c/p\u003e\u003cp\u003eunder the MIT License instead; see \u003ccode\u003eTHIRD_PARTY_NOTICES.md\u003c/code\u003e for the full text.\u003c/p\u003e\u003cp\u003eFor third-party notices and bundled components, see \u003ccode\u003eTHIRD_PARTY_NOTICES.md\u003c/code\u003e.\u003c/p\u003e\u003ch3\u003eHeal USD BRep assets\u003c/h3\u003e\u003cp\u003e\u003ccode\u003eusd.heal_file\u003c/code\u003e heals BrepArray definitions in the layers used by the current USD\u003c/p\u003e\u003cp\u003ecomposition and writes the scene with the healed geometry, keeping its layers,\u003c/p\u003e\u003cp\u003ereferences, native instancing, transforms and materials. External layers used only\u003c/p\u003e\u003cp\u003eby unselected variants remain referenced but are not healed. Material subset\u003c/p\u003e\u003cp\u003eopinions outside the BRep\u0026#x27;s defining prim spec are rejected rather than lost.\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eimport usd_brep\nusd_brep.usd.heal_file(\u0026quot;input.usdc\u0026quot;, \u0026quot;input_healed.usdc\u0026quot;)\n\u003c/code\u003e\u003c/pre\u003e"}, {"id": "cad3-054e9d3e1f16b289", "path": "/Users/ddt/work/projects/ai_agent/cad/usd-brep/详细使用说明.md", "source_path": "/Users/ddt/work/projects/ai_agent/cad/usd-brep/详细使用说明.md", "title": "USD BRep 详细使用说明", "group": "kernel", "sub": "tool", "role": "工具资料 · 非本机运行证明", "sha256": "62b2c52d6397c9857dd217c38a632c4d788095ecff1571391373ef0ca31b92bc", "headings": ["USD BRep 详细使用说明", "1. 存放位置与空间", "2. 这是什么，适合做什么", "2.1 关于 SMLib、NLib 和收购历史", "3. 仓库导览与 API 层次", "4. 先选择运行平台", "5. Linux / Windows：Python 包快速开始", "Linux 激活：", "OpenUSD 版本不能随意混装", "6. 源码构建与依赖缓存", "6.1 先把大缓存留在外置盘", "6.2 Linux 源码路线", "6.3 Windows 源码路线", "6.4 本机 macOS Apple Silicon：先检查门槛", "7. 源码构建后的 Python 环境", "8. 机械建模示例：矩形板打通孔", "8.1 模型与验证设计", "8.2 示例代码", "布尔运算会接管输入。传入副本，以便保留 plate 与 cutter。", "输出到仓库内新建的独立目录，仓库位于外置盘时输出也留在外置盘。", "8.3 所有权与修改规则", "9. 网格化、USD 与格式互通", "9.1 网格化", "9.2 两种 USD 目标", "9.3 SMB、OCCT BREP 与 STEP/IGES", "10. Python GUI 与查看模型", "11. C++ 集成入口", "12. 测试与验收", "13. 已知问题与排障", "14. 许可和商业集成", "15. 日常维护与下一步", "人工检查上游变化与本地文件后，再进行快进更新：", "16. 本次交付记录与资料来源"], "body": "# USD BRep 详细使用说明\n\n\u003e 整理日期：2026-10-14。适用仓库：NVIDIA-Omniverse/usd-brep，版本 `1.0.0`，提交 `c9c5979f04cea8c38213004d4f04df0dcfb40d05`。\n\u003e\n\u003e 本次已完成官方 Git 仓库克隆、完整性检查、空间测量和文档静态核对；尚未构建原生库，未安装 usd-brep Python 包，未运行 GUI、几何计算或导入导出。以下构建与建模命令是后续操作指南，不是本次运行成功的记录。\n\n## 1. 存放位置与空间\n\n| 项目 | 本次结果 |\n| --- | --- |\n| 实际仓库目录 | `/Volumes/NVME2T/projects/ai_agent/cad/usd-brep` |\n| 原请求路径入口 | `/Users/ddt/work/projects/ai_agent/cad/usd-brep`，指向外置盘的符号链接 |\n| 克隆后占用 | 约 96 MiB，包含源码、随仓模型及 Git 历史，不含后续构建 |\n| Git 元数据 | 约 19 MiB，已包含在上述 96 MiB 中 |\n| 自带 TestFiles | 约 28 MiB，已包含在上述 96 MiB 中 |\n| 内置盘剩余 | 检查时约 24 GiB，使用率 95% |\n| NVME2T 剩余 | 检查时约 1.7 TiB，使用率 8% |\n\n源码本身很小，内置盘放得下；本次选择外置盘，是为了给后续编译、OpenUSD、Python 环境和依赖缓存留出空间。后续空间取决于平台、debug/release、OpenUSD 和 GUI 依赖，尚未实测。可先为完整开发环境预留 10–20 GiB；这是容量规划建议，不是官方最低要求或本项目实测值。\n\n外置盘需要保持挂载，且卷名为 `NVME2T`。拔盘后原路径入口会失效。不要在入口失效时另建同名目录，以免形成两份互相混淆的仓库。\n\n```bash\ncd /Users/ddt/work/projects/ai_agent/cad/usd-brep\npwd -P\ndu -sh .\ndf -h /Volumes/NVME2T\n```\n\n特别说明：上游 README 提及 Git LFS 和 `.gitattributes`，但本次提交中没有该文件，`git lfs ls-files --all --size` 为空，`git lfs pull` 成功且没有额外对象需要下载。因此 96 MiB 是当前实际检出的仓库占用；未来版本可能不同。本机已安装 Git LFS 3.8.0，并仅对该仓库执行了本地初始化，没有修改全局 Git LFS 配置。\n\n## 2. 这是什么，适合做什么\n\nUSD BRep 是 C++ 和 Python 几何建模库，核心是 SMLib。它用曲面、曲线与拓扑关系描述实体边界，支持解析几何和 NURBS，适合通过程序构造机械零件、执行实体运算，以及与 USD 工作流互通。\n\n它提供建模能力，但不等于完整的桌面 CAD 产品。不能仅凭内核开源，就认为已有完整草图约束、特征历史树、装配约束、工程图标注、CAM 或工业认证功能。本仓库的 Python GUI 主要是开发、观察和调试工具。\n\n| 需求 | 仓库入口 | 使用提醒 |\n| --- | --- | --- |\n| 长方体、圆柱、球、圆锥、圆环 | `create_box`、`create_cylinder` 等 | 先用简单体验证环境 |\n| 打孔、合并、交集 | `boolean_difference`、`boolean_union`、`boolean_intersection` | 输入有所有权转移，保留原件时先复制 |\n| 拉伸、旋转、扫掠 | `linear_sweep`、`rotational_sweep`、`pipe_sweep` 等 | 先检查轮廓闭合与路径连续性 |\n| 圆角、倒角 | `fillet_edges`、`circular_fillet`、`chamfer_fillet` | 半径过大、短边和退化交界容易失败 |\n| 偏置、抽壳、缝合 | `offset_brep`、`shell_brep`、`stitch_into_solid` | 不应只看函数是否返回成功 |\n| 面积、体积、拓扑查询 | `Brep`、`Face`、`Edge` 等方法 | 圆形裁剪边界的积分存在已知精度问题 |\n| 可视化网格 | `tessellate` → `PolyBrep` | 网格是近似结果，不能替代精确模型 |\n| USD BRep 互通 | `_omni_solid.usd` / `usd_brep.usd` | 自定义 BrepArray 需要相应 schema 和查看支持 |\n\n“精确几何”表示采用解析/NURBS 边界模型，而不是先用三角网格表示实体；并不代表所有数值求交、测量或文件转换都没有容差与误差。\n\n### 2.1 关于 SMLib、NLib 和收购历史\n\n当前仓库源码、AGENTS 和架构说明可以确认 SMLib 内核及其封装层的存在。关于“SMLib 于 2022 年被 NVIDIA 收购”“基于 NLib”“与《The NURBS Book》作者 Piegl \u0026 Tiller 的关系”，本次未取得可直接支持全部历史细节的官方材料，因此不把它们作为已核实结论。实际集成以当前代码、许可、接口和测试结果为依据。\n\n## 3. 仓库导览与 API 层次\n\n| 路径 | 用途 |\n| --- | --- |\n| [README.md](README.md) | 平台要求、构建和顶层入口 |\n| [AGENTS.md](AGENTS.md) | 架构、所有权与仓库规则 |\n| [source/SMLib](source/SMLib) | 底层 C++ 内核、几何和拓扑算法 |\n| [source/SM_API](source/SM_API) | `SmApi*` 高层 C 风格 C++ 接口 |\n| [source/SM_API_USD](source/SM_API_USD) | USD 文件与实体/网格互通 |\n| [source/BREP_SM_USD](source/BREP_SM_USD) | SMLib 与 USD BRep 的内部转换 |\n| [source/BREP_USD_DATA](source/BREP_USD_DATA) | USD BRep 数据处理 |\n| [source/SmPyLib](source/SmPyLib) | 稳定 Python 绑定 `_omni_solid` |\n| [source/SmPyDevLib](source/SmPyDevLib) | 调试接口 `_smlib_dev` |\n| [Examples](Examples) | 按 Python、SM_API、内核分层的示例 |\n| [.agents/operations/INDEX.md](.agents/operations/INDEX.md) | 各项操作的参数和注意事项 |\n| [tools/pyproject/README.md](tools/pyproject/README.md) | 分发包 `usd_brep` 的使用说明 |\n| [tools/smlib_gui/README.md](tools/smlib_gui/README.md) | GUI、冒烟检查与批量渲染 |\n| [KNOWN_ISSUES.md](KNOWN_ISSUES.md) | 当前版本已知问题 |\n\n建议先从 Python 或 SM_API 入手；只有需要内核级功能、性能分析或排障时才直接使用 SMLib。`SM_API` 是 C 风格的 C++ 包装，不应据此推断它是可直接用任意语言 FFI 调用的纯 C ABI。\n\n分清两种 Python 入口：\n\n- 源码构建：`import _omni_solid as sm`，本说明的机械建模示例使用这一入口。\n- 安装分发包：`import usd_brep`，官方推荐按 `primitives`、`booleans`、`usd` 等子模块组织调用。不要直接把源码示例的所有函数名机械替换过去。\n\n根目录 `pyproject.toml` 是 GUI 开发环境配置，`uv` 的 `package = false`；不能把根目录当成普通纯 Python 库，认为 `pip install -e .` 就会自动编译安装内核。\n\n## 4. 先选择运行平台\n\n| 平台 | 推荐路线 | 当前官方说明中的条件 |\n| --- | --- | --- |\n| Linux x86_64 / aarch64 | Python 分发包，或完整源码构建 | CPython 3.12；源码构建需编译工具链 |\n| Windows x86_64 / aarch64 | 根据发行包实际可用架构选择 | Python 3.12；运行需 VC++ 运行库；源码工具链另见 README |\n| macOS Apple Silicon | 本地源码开发 | 没有按官方包说明可直接套用的 macOS wheel 路线；有额外依赖门槛 |\n| Intel Mac | 当前不作为已支持路线 | 官方 macOS 本地说明明确限 Apple Silicon |\n\n分发包文档列出 Windows/Linux 及 x86_64、aarch64，并不保证每种操作系统/架构组合都发布了相应 wheel。安装前应以实际 wheel 标签为准。本次没有验证 PyPI 的可安装性或下载发行包。\n\n本机检查得到 `arm64`，可采用 Apple Silicon 路线；但源码克隆完成不等于完整 `_omni_solid` 环境已经可用。\n\n## 5. Linux / Windows：Python 包快速开始\n\n以下命令在目标 Linux 或 Windows 的 Python 3.12 环境中执行，不是让当前 Mac 直接运行。\n\n```bash\npython3.12 -m venv .venv\n# Linux 激活：\nsource .venv/bin/activate\npython -m pip install --upgrade pip\npython -m pip install usd-brep\npython -c \"import usd_brep; print(usd_brep.__file__)\"\n```\n\nWindows PowerShell 使用 `py -3.12 -m venv .venv` 创建环境，使用 `.\\.venv\\Scripts\\Activate.ps1` 激活，其余 pip 命令相同。\n\n先验证最简单的创建与查询，再逐项加入文件和布尔运算：\n\n```python\nimport usd_brep\n\nbox = usd_brep.primitives.create_box((0.0, 0.0, 0.0), 10.0, 20.0, 5.0)\nprint(box.face_count(), box.edge_count(), box.vertex_count())\nprint(box.bounding_box())\n```\n\n上例接口已按仓库文档与声明静态核对，未在安装包环境中运行。后续包接口以 [包 README](tools/pyproject/README.md) 和实际安装版本的 `help()` 为准。\n\n### OpenUSD 版本不能随意混装\n\n官方包 README 说明 wheel 内带其构建所用的 OpenUSD 25.11 运行库，不需要另外安装同版本的 `usd-core`。另一个独立构建的同版本 OpenUSD 在同进程中可能发生符号冲突并崩溃。不要为解决导入报错，随意追加 `usd-core==25.11`。\n\n若自己的应用也需要 `pxr`，优先采用分进程、文件交换方式，或严格按官方已测试的版本组合验证；`usd_brep` 包自身不会把它的 USD Python 模块装入你的 `pxr` 命名空间。\n\n可选校验工具按官方包文档安装：\n\n```bash\npython -m pip install 'usd-brep[validation]'\nnvidia_usd_validate model.usda\n```\n\n该 extra 在 Linux aarch64 不可用，原因是对应 PyPI `usd-core` 缺失。其他平台也应检查安装解析结果，保留环境版本记录。\n\n## 6. 源码构建与依赖缓存\n\n### 6.1 先把大缓存留在外置盘\n\n仅把仓库放到外置盘，还不能保证所有依赖都写到外置盘。Packman 在 macOS 的默认缓存是 `~/Library/Application Support/packman-cache`。开始构建前，可在当前终端设置：\n\n```bash\nexport PM_PACKAGES_ROOT=/Volumes/NVME2T/.cache/usd-brep/packman\nexport UV_CACHE_DIR=/Volumes/NVME2T/.cache/usd-brep/uv\nexport UV_PYTHON_INSTALL_DIR=/Volumes/NVME2T/.cache/usd-brep/uv-python\nmkdir -p \"$PM_PACKAGES_ROOT\" \"$UV_CACHE_DIR\" \"$UV_PYTHON_INSTALL_DIR\"\ncd /Volumes/NVME2T/projects/ai_agent/cad/usd-brep\n```\n\n`PM_PACKAGES_ROOT` 已从仓库 Packman 启动脚本核对；其余两个为 uv 的缓存/托管 Python 位置配置，已核对 [uv 官方环境变量说明](https://docs.astral.sh/uv/reference/environment/)。本次未执行上述缓存设置或 uv 下载。GUI 的 `.venv` 位于仓库内，也会随仓库留在外置盘。已有的系统编译器、工具安装和系统临时文件仍可能占用内置盘。\n\n### 6.2 Linux 源码路线\n\nDebian/Ubuntu 系统示例：\n\n```bash\nsudo apt-get update\nsudo apt-get install build-essential git git-lfs\ncd /path/to/usd-brep\n./prebuild.sh\n./repo.sh build\n./repo.sh test\n./tests.sh linux-x86_64\n```\n\naarch64 使用匹配的平台和可用依赖。官方说明其余构建依赖经 Packman 拉取，主要包括 OpenUSD、Python 3.12、pybind11、premake 和 repo 工具。下载成功仍取决于网络与对应平台包是否可用。\n\n新检出或删除 `_build` 后必须先运行 `prebuild`，它会准备 `_build/schema/omniSolid/resources`。只运行 `repo build` 可能导致运行时找不到 schema。\n\n### 6.3 Windows 源码路线\n\n先安装 Visual Studio 2019 或 2022 的“使用 C++ 的桌面开发”工作负载，以及 Windows SDK。仓库配置固定使用 `vs2019`；VS 2022 用户还需要 v142 工具集。单纯安装 VS 界面不代表 C++ 编译器已经齐备。\n\n```bat\ncd C:\\path\\to\\usd-brep\nprebuild.bat\nrepo.bat build\nrepo.bat test\n```\n\n如果编译器发现失败，依据官方 README 和 repo_build 文档配置 `msbuild.vs_path`、`msbuild.vs_version` 或 `msbuild.winsdk_path`。这些配置只能定位已经安装的工具，不能替代安装。\n\n### 6.4 本机 macOS Apple Silicon：先检查门槛\n\n官方支持入口：\n\n```bash\ncd /Volumes/NVME2T/projects/ai_agent/cad/usd-brep\n./prebuild.sh -p macos-universal\n./repo.sh build -p macos-universal\n./tests.sh macos-universal\n```\n\n但当前版本存在以下实际前置条件：\n\n1. macOS 对应的 Packman OpenUSD/Python 成品包不按 Linux/Windows 路线提供，需要可用的本地主机 Python 3.12。\n2. `deps/host-deps.packman.xml` 指定的 `premake@5.0.0-beta1+nv1-macos-universal` 不在公共 Packman 服务器，需要通过用户级 Packman 配置提供。不能假设普通 Homebrew premake 可以直接等价替换。\n3. 默认构建是 Python-only 开发层级，包含内核、C++ 测试及 `_smlib_tests`、`_smlib_dev`；不会生成完整 OpenUSD/OCCT 或 `_omni_solid`。开发模块的导入还依赖完整稳定模块，所以不能把默认层级当作可直接运行本说明建模示例的环境。\n4. 要启用完整 Python/USD 层，需要准备本地 OpenUSD 25.11 与 Python 3.12 的匹配构建，并暂存依赖。\n\n已具备这些依赖时，按自己的真实安装位置设置：\n\n```bash\nexport SMLIB_USD_ROOT=/Volumes/NVME2T/deps/usd-25.11-py312\nexport SMLIB_PYTHON_ROOT=/absolute/path/to/python312-prefix\n./tools/scripts/setup-macos-local-deps.sh\n./prebuild.sh -p macos-universal\n./repo.sh build -p macos-universal -j10\n./tests.sh macos-universal\n```\n\n这里的两个依赖目录是填写示例，本次没有创建或安装。USD 根目录应有 `include/pxr`，Python 根目录应有 `include/python3.12`。`setup-macos-local-deps.sh` 会替换 `_build/target-deps` 下相关依赖入口；已有构建环境中执行前应确认这些入口没有被用于其他任务。\n\n本次没有尝试这条构建路线，因此不能保证仅复制这些命令即可在本机成功；首要待解决项是 macOS premake 包和匹配的本地 OpenUSD/Python。\n\n## 7. 源码构建后的 Python 环境\n\n以下均以前面的完整构建成功为前提。解释器必须与原生扩展的 Python 3.12 ABI、CPU 架构匹配。\n\nmacOS release 环境示意：\n\n```bash\ncd /Volumes/NVME2T/projects/ai_agent/cad/usd-brep\nexport PYTHONPATH=\"$PWD/_build/macos-universal/release:$PWD/_build/target-deps/usd/release/lib/python${PYTHONPATH:+:$PYTHONPATH}\"\nexport OMNISOLID_PLUGIN_PATH=\"$PWD/_build/schema/omniSolid/resources\"\n\"$SMLIB_PYTHON_ROOT/bin/python3\" -c 'import _omni_solid as sm; print(sm.__file__)'\n```\n\n若动态库加载失败，应核对 USD 安装的 rpath、架构和 Python 版本；不要直接把其他项目的动态库混入当前环境。\n\nLinux x86_64 release 可按仓库测试环境设置：\n\n```bash\nexport PYTHONPATH=\"$PWD/_build/linux-x86_64/release${PYTHONPATH:+:$PYTHONPATH}\"\nexport OMNISOLID_PLUGIN_PATH=\"$PWD/_build/schema/omniSolid/resources\"\nexport LD_LIBRARY_PATH=\"$PWD/_build/linux-x86_64/release:$PWD/_build/target-deps/usd/release/lib:$PWD/_build/target-deps/python/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\"\n./_build/target-deps/python/bin/python3 -c 'import _omni_solid as sm; print(sm.__file__)'\n```\n\n不要用 `inspect.signature()` 是否成功作为绑定可用性的判断，pybind11 内置函数不一定支持它；使用 `help(sm.create_box)`、`__doc__` 和类型声明。声明入口是 [__init__.pyi](source/SmPyLib/stubs/usd_brep/__init__.pyi) 与 [usd.pyi](source/SmPyLib/stubs/usd_brep/usd.pyi)。\n\n## 8. 机械建模示例：矩形板打通孔\n\n### 8.1 模型与验证设计\n\n- 板尺寸：40 × 30 × 8，板的最小坐标角为原点。\n- 孔中心：X=20、Y=15，半径=4，轴沿 Z。\n- 刀具体从 Z=-1 延伸到 Z=9，穿过板两侧，减少恰好共面的端面条件。\n- 本示例约定长度单位为毫米；内核不会仅从数值自动识别单位。\n- 理论体积：`40*30*8 - pi*4**2*8`，约 9197.8761 mm³。\n- 验收至少包括：实体流形检查、体积与理论值比较、原板保持不变，以及保存后重读。\n\n### 8.2 示例代码\n\n以下为文档内的参考代码，尚未创建独立脚本或执行。先使用第 7 节的环境验证导入，再保存为自己的脚本运行。代码采用临时的新输出目录，避免覆盖已有模型。\n\n```python\nfrom pathlib import Path\nimport math\nimport tempfile\nimport _omni_solid as sm\n\nlength, width, thickness = 40.0, 30.0, 8.0\nradius = 4.0\n\nplate = sm.create_box((0.0, 0.0, 0.0), length, width, thickness)\ncutter = sm.create_cylinder((20.0, 15.0, -1.0), radius, thickness + 2.0)\n\n# 布尔运算会接管输入。传入副本，以便保留 plate 与 cutter。\npart = sm.boolean_difference(plate.copy(), cutter.copy())\nassert part.is_manifold_solid()\nassert plate.face_count() == 6\n\nexpected = length * width * thickness - math.pi * radius**2 * thickness\nactual = part.volume(relative_accuracy=1e-6)\nassert math.isclose(actual, expected, rel_tol=1e-4, abs_tol=1e-3), (actual, expected)\n\nprint(\"拓扑:\", part.face_count(), part.edge_count(), part.vertex_count())\nprint(\"包围盒:\", part.bounding_box())\nprint(\"体积:\", actual, \"理论值:\", expected)\n\n# 输出到仓库内新建的独立目录，仓库位于外置盘时输出也留在外置盘。\nroot = Path.cwd() / \"_assets_output\"\nroot.mkdir(exist_ok=True)\nout = Path(tempfile.mkdtemp(prefix=\"drilled_plate_\", dir=root))\npath = out / \"drilled_plate.smb\"\npart.write_to_file(str(path), ascii=True)\nrestored = sm.read_brep_from_file(str(path))\nassert restored.is_manifold_solid()\nassert math.isclose(restored.volume(relative_accuracy=1e-6), actual, rel_tol=1e-4)\nprint(\"已保存:\", path)\n```\n\n这些断言是该简单零件的预期验收条件，尚未经本机运行确认，不能据此宣称内核已通过验收。圆形边界的体积积分有已知问题，因此示例主动收紧 `relative_accuracy`；实际应用仍要用独立基准校验。\n\n对应官方可执行示例/测试参考：[Python 圆角管示例](Examples/PyAPI/round_corner_pipe.py)、[绑定测试](source/SmPyLib/tests/test_omni_solid.py)。后者是上游测试文件，本次未执行。\n\n### 8.3 所有权与修改规则\n\n| 操作类型 | 含义 | 使用原则 |\n| --- | --- | --- |\n| Pure | 创建新对象、输入保留 | 如 primitive、普通实体扫掠、tessellate |\n| Consumes | 接管输入所有权 | 常规布尔运算后只使用返回对象；保留输入时传 `.copy()` |\n| Mutates | 原地修改并返回相同句柄 | 如 translate、cut、部分圆角与修复；先复制再改 |\n| 带诊断的修改 | 返回句柄与附加信息 | 按单个函数的文档解包 |\n\n名称不能替代契约，某些非流形扫掠会修改源对象。不要重用失败后状态不明确的对象；从已保存的原始输入重建。\n\n`Face.surface()`、`Edge.curve()` 返回的可能是借用视图。执行表示转换、非简单缩放或改变拓扑后，应释放并重新获取相关视图；绑定会对部分危险操作直接拒绝。\n\n## 9. 网格化、USD 与格式互通\n\n### 9.1 网格化\n\n延续上一节的 `part`：\n\n```python\nmesh = sm.tessellate(\n    part,\n    chord_height_tolerance=0.02,\n    curve_angle_tolerance_deg=15.0,\n    surface_angle_tolerance_deg=15.0,\n)\narrays = mesh.to_mesh_arrays()\nprint(arrays.keys())\n```\n\n`0.02` 是当前建模单位中的弦高目标；本例约定毫米，即 0.02 mm。角度参数是度。角度和弦高越严格通常网格越密，耗时与内存越高，不应直接把可视化网格视为合格的有限元网格。\n\n默认值是弦高 0、两个角度 25°、最大边长 0、长宽比 0。弦高 0 表示禁用该判据，不代表零误差；角度 0 同样表示禁用相应角度判据。最大边长和长宽比是细分目标，不是最终所有三角形的硬性保证。\n\n默认严格模式会拒绝面级失败造成的不完整网格。若诊断需要部分输出，使用 `allow_partial=True` 时还必须配合 `return_failures=True` 或 `return_report=True`，检查失败清单；不能把带缺面的输出当成成功交付。\n\n### 9.2 两种 USD 目标\n\n| 目标 | 方式 | 特点 |\n| --- | --- | --- |\n| 保存可再编辑的 BRep 互通文件 | `sm.usd.export_brep` | 自定义 BrepArray；需要 schema 与对应读取/显示支持 |\n| 生成方便通用查看的场景资产 | BRep → tessellate → mesh arrays → `UsdGeom.Mesh` | 标准网格，精确曲面和编辑拓扑不随网格保留 |\n\n用于后续建模交换，可以在前例成功后执行：\n\n```python\nsm.usd.export_brep(part.copy(), str(out / \"drilled_plate_brep.usda\"))\nloaded = sm.usd.import_breps(str(out / \"drilled_plate_brep.usda\"))\nassert len(loaded) == 1\nassert loaded[0].is_manifold_solid()\n```\n\n这里导出副本，是为了隔离 UV trim 准备、缓存和路径属性等可能的输入侧影响。导出会覆盖同名文件，因此只使用独立输出目录。\n\nBRep 经 USD 往返可能规范化或近似几何表示，例如容差折叠、曲线转换、部分 UV trim 的省略；不能把一次导入导出视为数学意义的完全无损存档。重要原件应另外保留原生模型与建模参数。\n\n如果目标是生成一个可查看的 3D 场景，应遵循仓库 [资产生成流程](.agents/docs/generate_asset.md)，从 [example_generate_asset.py](tools/scripts/example_generate_asset.py) 修改：在进程内完成建模，只在最后写标准 `UsdGeom.Mesh`，不要为了生成网格资产绕行 BrepArray 文件。\n\n完整环境建立后，官方参考命令：\n\n```bash\nuv run --locked --group gui python tools/scripts/example_generate_asset.py\nuv run --locked --group gui python tools/scripts/view_usd.py --screenshot _assets_output/ExampleAsset.png _assets_output/ExampleAsset.usda\n```\n\n这些官方示例使用固定输出名，重复运行前应备份旧输出或调整输出参数。资产流程默认 Z 向上、厘米尺度；若自己的数值按毫米建模，需要正确转换数值和/或设置 USD 单位元数据，不能只改文件扩展名。\n\n### 9.3 SMB、OCCT BREP 与 STEP/IGES\n\n| 格式 | 当前说明范围 |\n| --- | --- |\n| `.smb` | SMLib 原生 BRep；用 `write_to_file`、`read_brep_from_file` |\n| `.usd/.usda/.usdc` | BRepArray 或标准 Mesh，取决于导出入口 |\n| OCCT `.brep` | 有 `occt_to_usd`、`usd_to_occt` 工具；不是 `.smb` 的同义名 |\n| STEP / IGES / JT | 不能仅凭 README 中模型格式名称或源码类名，就推断已经提供完整可用的通用 Python 导入导出器 |\n\nLinux 完整 release 构建、运行库路径配置妥当后，OCCT 转换入口是：\n\n```bash\n./_build/linux-x86_64/release/occt_to_usd input.brep output.usda\n./_build/linux-x86_64/release/usd_to_occt input.usda output.brep\n```\n\n`usd_to_occt` 生成 OCCT ASCII `.brep`；多个 BRep 可能拆成带序号的文件。转换有方向、缝边、容差与曲面表示细节，应做双向回读和几何核对，不能只凭工具退出码成功。\n\n如果实际业务主要依赖 STEP/IGES 交换，应单独验证所需格式的真实入口和保真性，再决定转换链路。本次没有转换任何业务文件。\n\n## 10. Python GUI 与查看模型\n\n先完成原生构建，再安装/使用 uv，从仓库根目录启动：\n\n```bash\nuv run --locked --group gui python tools/scripts/smlib_gui.py\nuv run --locked --group gui python tools/scripts/smlib_gui.py --release\n```\n\n默认寻找 debug 库；只有 release 构建时加 `--release`。GUI 的依赖由根目录 `uv.lock` 固定，包含 PySide6、PyVista、VTK、NumPy 等。uv 环境只负责这些 Python 依赖，不会替代 SMLib 原生构建。\n\n冒烟检查：\n\n```bash\nuv run --locked --group gui python tools/scripts/smlib_gui_smoke.py\nuv run --locked --group gui python tools/scripts/smlib_gui_smoke.py --show --timeout-ms 2000\n```\n\n批量生成四视图接触表，建议指定输出目录，避免把图片写回输入模型旁边：\n\n```bash\nuv run --locked --group gui python tools/scripts/smlib_gui_render.py TestFiles --output-dir _assets_output/renders\n```\n\n渲染器识别 `.brep`、`.smb`、`.usd`、`.usda`、`.usdc`。默认保留组合图；要保留单独视图，加 `--save-views`。每个输入默认在独立进程中处理；增加 `--jobs` 前评估内存，读取生成的 `smlib_gui_render_report.json` 检查逐文件结果。\n\nGUI 左侧的 User Tests 支持运行 Python 建模片段，`sm` 与 `smdev` 已由环境注入。Python Reload 不会重载修改后的 C++ 扩展，后者必须重编译。GUI 中的 Save 会写用户测试目录，操作前确认目标。\n\n若用 usdview 看 BrepArray，需构建并加载 hdUsdBrep 插件。Linux/Windows 的启动器与限制见 [Hydra 插件说明](source/HYDRA_USD_BREP/README.md)。普通查看器能打开 USD 文件，并不表示它能显示自定义 BrepArray；通用展示可优先导出标准 Mesh。\n\n## 11. C++ 集成入口\n\n新集成优先使用 `source/SM_API/inc/` 的公开头文件，对应 `SmApiPrimitives.h`、`SmApiBrep.h`、`SmApiQueries.h`、`SmApiGeneral.h` 等。项目使用 C++17。\n\n从官方示例学习上下文、返回状态与析构方式：\n\n```bash\n./repo.sh build -r --target sm_api_boolean_bounds_example\nLD_LIBRARY_PATH=\"$PWD/_build/linux-x86_64/release:$PWD/_build/target-deps/usd/release/lib:${LD_LIBRARY_PATH:-}\" ./_build/linux-x86_64/release/sm_api_boolean_bounds_example\n```\n\n以上是 Linux 示例；其他平台使用对应构建目录与动态库查找方式。源码与约定见 [SM_API 示例说明](Examples/SM_API/README.md)。\n\n集成时重点检查：\n\n1. 状态与 `SM_SUCCESS` 比较，当前数值是 1000，不能写成 `status == 0`。\n2. 初始化上下文后再创建对象，对象销毁顺序必须符合所属上下文寿命。\n3. 原生布尔接口不同重载的输入所有权可能不同，不要照搬 Python 规则或另一个重载的析构方式。\n4. 不应为每次布尔操作无条件计算 tight bounds；普通 bounds 与体积计算的代价不同，按实际需要查询。\n5. 服务化默认使用多进程 worker，不能在同进程多个线程中任意并行调用 `SmApi*` 或 `_omni_solid`。\n\n具体并发限制及少量专用例外见 [concurrency.md](.agents/operations/concurrency.md)。“支持并行处理多个任务”不等于“所有内核调用都线程安全”。\n\n## 12. 测试与验收\n\n仓库完整源码构建后，先运行目标平台测试，再运行自己的模型验收。不要只以程序退出码、截图或面数作为几何正确性证据。\n\n| 层次 | 检查内容 |\n| --- | --- |\n| 安装 | 正确解释器能导入正确版本模块 |\n| 简单几何 | Box 的尺寸、拓扑、体积与流形状态符合预期 |\n| 实际操作 | 打孔/扫掠/圆角后几何与设计参数一致 |\n| 数据保存 | 保存到新目录、回读、对比量测与拓扑 |\n| 可视化 | 无缺面、明显反面、裂缝或错误单位 |\n| 文件交换 | 必要时经独立工具检查，确认目标软件能读 |\n| 异常路径 | 无效输入有明确诊断，失败后不沿用不确定对象 |\n\n修改绑定时，可参考官方聚焦测试助手：\n\n```bash\ntools/agent/run_smpylib_tests.sh --target test_omni_solid.TestBooleans\n```\n\n具体平台适用性与扩大测试范围见 [.agents/skills/usd-brep-test-selection/SKILL.md](.agents/skills/usd-brep-test-selection/SKILL.md)。本次只新增文档，按该规则做 Markdown、路径和示例语法静态检查，不运行内核回归。\n\n## 13. 已知问题与排障\n\n以本次提交 [KNOWN_ISSUES.md](KNOWN_ISSUES.md) 为准，以下影响机械模型验收：\n\n- `remove_fillet` 可能报告成功却没有移除圆角，必须检查结果。\n- `heal_brep` 可能隐藏阶段性修复失败；周期面、球面和圆环的缝边修复存在已知缺陷，甚至改变空腔或丢面。不要对唯一原件直接修复。\n- 圆角附近部分三角形可能反向；已发现案例中 `surface_angle_tolerance_deg=15` 可避开，但不是通用保证。\n- 圆形裁剪边界的面积、体积和质量属性可能超出请求精度，应收紧积分参数并以独立基准核对。\n- 不合法 BrepArray 的计数/索引可能使导入进程崩溃，应先校验外来文件；服务化宜隔离进程。\n- 其他导出器生成的 UV trim 数据可能转换错误，不能把任意 BrepArray 兼容性视为已保证。\n- 发行包中的部分 validator 包装脚本仍假定源码目录存在，应按已知问题中的替代入口调用。\n\n| 现象 | 优先检查 |\n| --- | --- |\n| `No module named _omni_solid` | 完整层级是否构建、平台目录、Python ABI、PYTHONPATH |\n| macOS 下载不到 premake | 官方该包不在公共服务器，需要适用的用户级包源 |\n| 找不到 `pxr` / USD 共享库 | OpenUSD 安装、解释器、库查找路径和版本 |\n| BrepArray 无法读写 | 是否先 prebuild、schema 是否存在、OMNISOLID_PLUGIN_PATH |\n| GUI 原生模块导入失败 | uv 不能替代原生构建；检查 debug/release 是否匹配 |\n| 布尔失败 | 输入是否仍有效，是否共面/相切，薄特征是否接近容差 |\n| 圆角失败 | 边是否仍属于当前模型，半径是否超出局部几何 |\n| 结果看不到 | 自定义 BRep 与普通 Mesh 区别、插件、单位、相机和可见性 |\n| 外置盘路径失效 | 卷是否挂载、卷名是否改变、原入口是否仍为正确链接 |\n\n`RuntimeError` 排查先读 [.agents/docs/errors.md](.agents/docs/errors.md)，记录调用名、`SM_ERR_*`、数字状态、`Kernel trace`、输入参数与最小复现。不盲目重复使用可能已修改或已被接管的输入，不通过无限调松容差掩盖几何问题。\n\n## 14. 许可和商业集成\n\n仓库主许可证为 [Apache-2.0](LICENSE)。其许可允许商业使用和在符合条款的情况下集成到闭源产品；这不意味着所有随附组件或 GUI 依赖都自动采用同一许可证。\n\n依据 [Apache 官方条款](https://www.apache.org/licenses/LICENSE-2.0.html)，分发时需要按实际情况保留许可证与相关声明、标明修改，并处理适用的 NOTICE 内容；商标许可不因此自动获得。主许可证对你的新增自有代码没有一概要求公开源码。\n\n本仓库还存在这些需要分别处理的部分：\n\n| 内容 | 仓库披露的许可情况 |\n| --- | --- |\n| 主要 NVIDIA 源码 | Apache-2.0 |\n| `repo.sh`、`repo.bat`、repoman bootstrapper | MIT |\n| OpenUSD 及其随附库 | 按各自许可证及发行包内声明处理 |\n| pybind11 | BSD-3-Clause |\n| 可选 GUI 的 PySide6/Qt 等 | 包含 LGPL/GPL 选项及其他许可，不能按内核许可一并推断 |\n| proposals 中的标准提案快照 | 有单独的来源与补充条款说明 |\n\n商业打包前以 [THIRD_PARTY_NOTICES.md](THIRD_PARTY_NOTICES.md) 和最终交付包的许可证为准，按实际再分发组件核对。若只使用内核或 Python 包，不要无意中把完整开发 GUI 环境也一起打包。\n\n## 15. 日常维护与下一步\n\n每次使用先确认外置盘挂载。更新前检查本地新增文档和其他改动，不要重置或清理工作区：\n\n```bash\ncd /Users/ddt/work/projects/ai_agent/cad/usd-brep\ngit status --short\ngit log -1 --oneline\ngit fetch origin\n# 人工检查上游变化与本地文件后，再进行快进更新：\ngit pull --ff-only\ngit lfs pull\n```\n\n本次网络直连 GitHub 失败，改用 macOS 已配置的本地代理 `127.0.0.1:7897` 后成功。若当前代理仍在运行，可单次指定，不修改全局 Git 设置：\n\n```bash\ngit -c http.proxy=http://127.0.0.1:7897 fetch origin\n```\n\n端口是本次环境观察值，未来可能改变。不要将失效代理写死为仓库必要条件。\n\n建议后续顺序：先落实可构建平台与依赖 → 导入最小模块 → 跑 Box 与打孔板 → 验证保存回读 → 再引入圆角、外部模型、GUI 或服务集成。本机若暂时拿不到 macOS 所需包，可在已有 Linux/Windows 环境验证 Python 包，另行核算虚拟机/容器和依赖空间。\n\n不建议因为空间紧张直接执行大范围删除。上游提及的 `_build`、`_compiler`、`_repo` 都是构建工具目录，但清理前仍须确认没有应保留的结果、日志或人工文件；本说明不执行清理。\n\n## 16. 本次交付记录与资料来源\n\n本次执行：\n\n- 从官方 HTTPS 地址完成 Git clone，保留真实 origin 与提交历史。\n- 源码、模型和 Git 历史实测约 96 MiB，保存于 NVME2T。\n- 安装本机缺少的 Git LFS；执行仓库本地初始化及 LFS 拉取确认。\n- `git fsck --full` 通过；LFS 跟踪文件清单为空。\n- 原请求路径已建立指向外置盘的符号链接。\n- 仅新增本文件，上游代码与配置保持不变。\n- 43 个仓库内链接检查通过，4 个 Python 代码块及 18 个 Shell 代码块语法检查通过；引用接口已与声明静态核对。没有执行构建与建模运行验收。\n\n主要来源：\n\n1. [官方仓库](https://github.com/NVIDIA-Omniverse/usd-brep) 与 [官方文档站](https://nvidia-omniverse.github.io/usd-brep/)。\n2. 本地 [README](README.md)、[AGENTS](AGENTS.md)、[架构概览](.agents/docs/OVERVIEW.md)。\n3. [Python API 使用规则](.agents/skills/smlib-python-api-use/SKILL.md)、[布尔操作](.agents/operations/booleans.md)、[基本体](.agents/operations/primitives.md)、[网格化](.agents/operations/tessellation.md)、[USD 互通](.agents/operations/usd_import_export.md)。\n4. [Python 分发包说明](tools/pyproject/README.md)、[GUI 说明](tools/smlib_gui/README.md)、[示例目录](Examples/README.md)。\n5. [LICENSE](LICENSE)、[第三方声明](THIRD_PARTY_NOTICES.md)、[已知问题](KNOWN_ISSUES.md)。\n\n更新仓库后，应重新核对这些入口及平台限制；本说明不是对未来提交的兼容性保证。", "reference": false, "current": false, "truncated": false, "tags": ["tool"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "../../../cad/usd-brep/%E8%AF%A6%E7%BB%86%E4%BD%BF%E7%94%A8%E8%AF%B4%E6%98%8E.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003eUSD BRep 详细使用说明\u003c/h2\u003e\u003cp\u003e\u0026gt; 整理日期：2026-10-14。适用仓库：NVIDIA-Omniverse/usd-brep，版本 \u003ccode\u003e1.0.0\u003c/code\u003e，提交 \u003ccode\u003ec9c5979f04cea8c38213004d4f04df0dcfb40d05\u003c/code\u003e。\u003c/p\u003e\u003cp\u003e\u0026gt;\u003c/p\u003e\u003cp\u003e\u0026gt; 本次已完成官方 Git 仓库克隆、完整性检查、空间测量和文档静态核对；尚未构建原生库，未安装 usd-brep Python 包，未运行 GUI、几何计算或导入导出。以下构建与建模命令是后续操作指南，不是本次运行成功的记录。\u003c/p\u003e\u003ch3\u003e1. 存放位置与空间\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e项目\u003c/td\u003e\u003ctd\u003e本次结果\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e实际仓库目录\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e/Volumes/NVME2T/projects/ai_agent/cad/usd-brep\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e原请求路径入口\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e/Users/ddt/work/projects/ai_agent/cad/usd-brep\u003c/code\u003e，指向外置盘的符号链接\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e克隆后占用\u003c/td\u003e\u003ctd\u003e约 96 MiB，包含源码、随仓模型及 Git 历史，不含后续构建\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGit 元数据\u003c/td\u003e\u003ctd\u003e约 19 MiB，已包含在上述 96 MiB 中\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e自带 TestFiles\u003c/td\u003e\u003ctd\u003e约 28 MiB，已包含在上述 96 MiB 中\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e内置盘剩余\u003c/td\u003e\u003ctd\u003e检查时约 24 GiB，使用率 95%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNVME2T 剩余\u003c/td\u003e\u003ctd\u003e检查时约 1.7 TiB，使用率 8%\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e源码本身很小，内置盘放得下；本次选择外置盘，是为了给后续编译、OpenUSD、Python 环境和依赖缓存留出空间。后续空间取决于平台、debug/release、OpenUSD 和 GUI 依赖，尚未实测。可先为完整开发环境预留 10–20 GiB；这是容量规划建议，不是官方最低要求或本项目实测值。\u003c/p\u003e\u003cp\u003e外置盘需要保持挂载，且卷名为 \u003ccode\u003eNVME2T\u003c/code\u003e。拔盘后原路径入口会失效。不要在入口失效时另建同名目录，以免形成两份互相混淆的仓库。\u003c/p\u003e\u003cpre\u003e\u003ccode\u003ecd /Users/ddt/work/projects/ai_agent/cad/usd-brep\npwd -P\ndu -sh .\ndf -h /Volumes/NVME2T\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e特别说明：上游 README 提及 Git LFS 和 \u003ccode\u003e.gitattributes\u003c/code\u003e，但本次提交中没有该文件，\u003ccode\u003egit lfs ls-files --all --size\u003c/code\u003e 为空，\u003ccode\u003egit lfs pull\u003c/code\u003e 成功且没有额外对象需要下载。因此 96 MiB 是当前实际检出的仓库占用；未来版本可能不同。本机已安装 Git LFS 3.8.0，并仅对该仓库执行了本地初始化，没有修改全局 Git LFS 配置。\u003c/p\u003e\u003ch3\u003e2. 这是什么，适合做什么\u003c/h3\u003e\u003cp\u003eUSD BRep 是 C++ 和 Python 几何建模库，核心是 SMLib。它用曲面、曲线与拓扑关系描述实体边界，支持解析几何和 NURBS，适合通过程序构造机械零件、执行实体运算，以及与 USD 工作流互通。\u003c/p\u003e\u003cp\u003e它提供建模能力，但不等于完整的桌面 CAD 产品。不能仅凭内核开源，就认为已有完整草图约束、特征历史树、装配约束、工程图标注、CAM 或工业认证功能。本仓库的 Python GUI 主要是开发、观察和调试工具。\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e需求\u003c/td\u003e\u003ctd\u003e仓库入口\u003c/td\u003e\u003ctd\u003e使用提醒\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e长方体、圆柱、球、圆锥、圆环\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ecreate_box\u003c/code\u003e、\u003ccode\u003ecreate_cylinder\u003c/code\u003e 等\u003c/td\u003e\u003ctd\u003e先用简单体验证环境\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e打孔、合并、交集\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eboolean_difference\u003c/code\u003e、\u003ccode\u003eboolean_union\u003c/code\u003e、\u003ccode\u003eboolean_intersection\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e输入有所有权转移，保留原件时先复制\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e拉伸、旋转、扫掠\u003c/td\u003e\u003ctd\u003e\u003ccode\u003elinear_sweep\u003c/code\u003e、\u003ccode\u003erotational_sweep\u003c/code\u003e、\u003ccode\u003epipe_sweep\u003c/code\u003e 等\u003c/td\u003e\u003ctd\u003e先检查轮廓闭合与路径连续性\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e圆角、倒角\u003c/td\u003e\u003ctd\u003e\u003ccode\u003efillet_edges\u003c/code\u003e、\u003ccode\u003ecircular_fillet\u003c/code\u003e、\u003ccode\u003echamfer_fillet\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e半径过大、短边和退化交界容易失败\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e偏置、抽壳、缝合\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eoffset_brep\u003c/code\u003e、\u003ccode\u003eshell_brep\u003c/code\u003e、\u003ccode\u003estitch_into_solid\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e不应只看函数是否返回成功\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e面积、体积、拓扑查询\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eBrep\u003c/code\u003e、\u003ccode\u003eFace\u003c/code\u003e、\u003ccode\u003eEdge\u003c/code\u003e 等方法\u003c/td\u003e\u003ctd\u003e圆形裁剪边界的积分存在已知精度问题\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e可视化网格\u003c/td\u003e\u003ctd\u003e\u003ccode\u003etessellate\u003c/code\u003e → \u003ccode\u003ePolyBrep\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e网格是近似结果，不能替代精确模型\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eUSD BRep 互通\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e_omni_solid.usd\u003c/code\u003e / \u003ccode\u003eusd_brep.usd\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e自定义 BrepArray 需要相应 schema 和查看支持\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e“精确几何”表示采用解析/NURBS 边界模型，而不是先用三角网格表示实体；并不代表所有数值求交、测量或文件转换都没有容差与误差。\u003c/p\u003e\u003ch4\u003e2.1 关于 SMLib、NLib 和收购历史\u003c/h4\u003e\u003cp\u003e当前仓库源码、AGENTS 和架构说明可以确认 SMLib 内核及其封装层的存在。关于“SMLib 于 2022 年被 NVIDIA 收购”“基于 NLib”“与《The NURBS Book》作者 Piegl \u0026amp; Tiller 的关系”，本次未取得可直接支持全部历史细节的官方材料，因此不把它们作为已核实结论。实际集成以当前代码、许可、接口和测试结果为依据。\u003c/p\u003e\u003ch3\u003e3. 仓库导览与 API 层次\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e路径\u003c/td\u003e\u003ctd\u003e用途\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ca href=\"#doc=cad3-7c7a5e3466e18942\" data-preview-doc=\"cad3-7c7a5e3466e18942\"\u003eREADME.md\u003c/a\u003e\u003c/td\u003e\u003ctd\u003e平台要求、构建和顶层入口\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAGENTS.md（见原文附件）\u003c/td\u003e\u003ctd\u003e架构、所有权与仓库规则\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003esource/SMLib（见原文附件）\u003c/td\u003e\u003ctd\u003e底层 C++ 内核、几何和拓扑算法\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003esource/SM_API（见原文附件）\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eSmApi*\u003c/code\u003e 高层 C 风格 C++ 接口\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003esource/SM_API_USD（见原文附件）\u003c/td\u003e\u003ctd\u003eUSD 文件与实体/网格互通\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003esource/BREP_SM_USD（见原文附件）\u003c/td\u003e\u003ctd\u003eSMLib 与 USD BRep 的内部转换\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003esource/BREP_USD_DATA（见原文附件）\u003c/td\u003e\u003ctd\u003eUSD BRep 数据处理\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003esource/SmPyLib（见原文附件）\u003c/td\u003e\u003ctd\u003e稳定 Python 绑定 \u003ccode\u003e_omni_solid\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003esource/SmPyDevLib（见原文附件）\u003c/td\u003e\u003ctd\u003e调试接口 \u003ccode\u003e_smlib_dev\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eExamples（见原文附件）\u003c/td\u003e\u003ctd\u003e按 Python、SM_API、内核分层的示例\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ca href=\"#doc=cad3-d0033feced8e4baa\" data-preview-doc=\"cad3-d0033feced8e4baa\"\u003e.agents/operations/INDEX.md\u003c/a\u003e\u003c/td\u003e\u003ctd\u003e各项操作的参数和注意事项\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003etools/pyproject/README.md（见原文附件）\u003c/td\u003e\u003ctd\u003e分发包 \u003ccode\u003eusd_brep\u003c/code\u003e 的使用说明\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003etools/smlib_gui/README.md（见原文附件）\u003c/td\u003e\u003ctd\u003eGUI、冒烟检查与批量渲染\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eKNOWN_ISSUES.md（见原文附件）\u003c/td\u003e\u003ctd\u003e当前版本已知问题\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e建议先从 Python 或 SM_API 入手；只有需要内核级功能、性能分析或排障时才直接使用 SMLib。\u003ccode\u003eSM_API\u003c/code\u003e 是 C 风格的 C++ 包装，不应据此推断它是可直接用任意语言 FFI 调用的纯 C ABI。\u003c/p\u003e\u003cp\u003e分清两种 Python 入口：\u003c/p\u003e\u003cp\u003e- 源码构建：\u003ccode\u003eimport _omni_solid as sm\u003c/code\u003e，本说明的机械建模示例使用这一入口。\u003c/p\u003e\u003cp\u003e- 安装分发包：\u003ccode\u003eimport usd_brep\u003c/code\u003e，官方推荐按 \u003ccode\u003eprimitives\u003c/code\u003e、\u003ccode\u003ebooleans\u003c/code\u003e、\u003ccode\u003eusd\u003c/code\u003e 等子模块组织调用。不要直接把源码示例的所有函数名机械替换过去。\u003c/p\u003e\u003cp\u003e根目录 \u003ccode\u003epyproject.toml\u003c/code\u003e 是 GUI 开发环境配置，\u003ccode\u003euv\u003c/code\u003e 的 \u003ccode\u003epackage = false\u003c/code\u003e；不能把根目录当成普通纯 Python 库，认为 \u003ccode\u003epip install -e .\u003c/code\u003e 就会自动编译安装内核。\u003c/p\u003e\u003ch3\u003e4. 先选择运行平台\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e平台\u003c/td\u003e\u003ctd\u003e推荐路线\u003c/td\u003e\u003ctd\u003e当前官方说明中的条件\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLinux x86_64 / aarch64\u003c/td\u003e\u003ctd\u003ePython 分发包，或完整源码构建\u003c/td\u003e\u003ctd\u003eCPython 3.12；源码构建需编译工具链\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWindows x86_64 / aarch64\u003c/td\u003e\u003ctd\u003e根据发行包实际可用架构选择\u003c/td\u003e\u003ctd\u003ePython 3.12；运行需 VC++ 运行库；源码工具链另见 README\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003emacOS Apple Silicon\u003c/td\u003e\u003ctd\u003e本地源码开发\u003c/td\u003e\u003ctd\u003e没有按官方包说明可直接套用的 macOS wheel 路线；有额外依赖门槛\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIntel Mac\u003c/td\u003e\u003ctd\u003e当前不作为已支持路线\u003c/td\u003e\u003ctd\u003e官方 macOS 本地说明明确限 Apple Silicon\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e分发包文档列出 Windows/Linux 及 x86_64、aarch64，并不保证每种操作系统/架构组合都发布了相应 wheel。安装前应以实际 wheel 标签为准。本次没有验证 PyPI 的可安装性或下载发行包。\u003c/p\u003e\u003cp\u003e本机检查得到 \u003ccode\u003earm64\u003c/code\u003e，可采用 Apple Silicon 路线；但源码克隆完成不等于完整 \u003ccode\u003e_omni_solid\u003c/code\u003e 环境已经可用。\u003c/p\u003e\u003ch3\u003e5. Linux / Windows：Python 包快速开始\u003c/h3\u003e\u003cp\u003e以下命令在目标 Linux 或 Windows 的 Python 3.12 环境中执行，不是让当前 Mac 直接运行。\u003c/p\u003e\u003cpre\u003e\u003ccode\u003epython3.12 -m venv .venv\n# Linux 激活：\nsource .venv/bin/activate\npython -m pip install --upgrade pip\npython -m pip install usd-brep\npython -c \u0026quot;import usd_brep; print(usd_brep.__file__)\u0026quot;\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eWindows PowerShell 使用 \u003ccode\u003epy -3.12 -m venv .venv\u003c/code\u003e 创建环境，使用 \u003ccode\u003e.\\.venv\\Scripts\\Activate.ps1\u003c/code\u003e 激活，其余 pip 命令相同。\u003c/p\u003e\u003cp\u003e先验证最简单的创建与查询，再逐项加入文件和布尔运算：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eimport usd_brep\n\nbox = usd_brep.primitives.create_box((0.0, 0.0, 0.0), 10.0, 20.0, 5.0)\nprint(box.face_count(), box.edge_count(), box.vertex_count())\nprint(box.bounding_box())\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e上例接口已按仓库文档与声明静态核对，未在安装包环境中运行。后续包接口以 包 README（见原文附件） 和实际安装版本的 \u003ccode\u003ehelp()\u003c/code\u003e 为准。\u003c/p\u003e\u003ch4\u003eOpenUSD 版本不能随意混装\u003c/h4\u003e\u003cp\u003e官方包 README 说明 wheel 内带其构建所用的 OpenUSD 25.11 运行库，不需要另外安装同版本的 \u003ccode\u003eusd-core\u003c/code\u003e。另一个独立构建的同版本 OpenUSD 在同进程中可能发生符号冲突并崩溃。不要为解决导入报错，随意追加 \u003ccode\u003eusd-core==25.11\u003c/code\u003e。\u003c/p\u003e\u003cp\u003e若自己的应用也需要 \u003ccode\u003epxr\u003c/code\u003e，优先采用分进程、文件交换方式，或严格按官方已测试的版本组合验证；\u003ccode\u003eusd_brep\u003c/code\u003e 包自身不会把它的 USD Python 模块装入你的 \u003ccode\u003epxr\u003c/code\u003e 命名空间。\u003c/p\u003e\u003cp\u003e可选校验工具按官方包文档安装：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003epython -m pip install \u0026#x27;usd-brep[validation]\u0026#x27;\nnvidia_usd_validate model.usda\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e该 extra 在 Linux aarch64 不可用，原因是对应 PyPI \u003ccode\u003eusd-core\u003c/code\u003e 缺失。其他平台也应检查安装解析结果，保留环境版本记录。\u003c/p\u003e\u003ch3\u003e6. 源码构建与依赖缓存\u003c/h3\u003e\u003ch4\u003e6.1 先把大缓存留在外置盘\u003c/h4\u003e\u003cp\u003e仅把仓库放到外置盘，还不能保证所有依赖都写到外置盘。Packman 在 macOS 的默认缓存是 \u003ccode\u003e~/Library/Application Support/packman-cache\u003c/code\u003e。开始构建前，可在当前终端设置：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eexport PM_PACKAGES_ROOT=/Volumes/NVME2T/.cache/usd-brep/packman\nexport UV_CACHE_DIR=/Volumes/NVME2T/.cache/usd-brep/uv\nexport UV_PYTHON_INSTALL_DIR=/Volumes/NVME2T/.cache/usd-brep/uv-python\nmkdir -p \u0026quot;$PM_PACKAGES_ROOT\u0026quot; \u0026quot;$UV_CACHE_DIR\u0026quot; \u0026quot;$UV_PYTHON_INSTALL_DIR\u0026quot;\ncd /Volumes/NVME2T/projects/ai_agent/cad/usd-brep\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003ccode\u003ePM_PACKAGES_ROOT\u003c/code\u003e 已从仓库 Packman 启动脚本核对；其余两个为 uv 的缓存/托管 Python 位置配置，已核对 \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://docs.astral.sh/uv/reference/environment/\"\u003euv 官方环境变量说明\u003c/a\u003e。本次未执行上述缓存设置或 uv 下载。GUI 的 \u003ccode\u003e.venv\u003c/code\u003e 位于仓库内，也会随仓库留在外置盘。已有的系统编译器、工具安装和系统临时文件仍可能占用内置盘。\u003c/p\u003e\u003ch4\u003e6.2 Linux 源码路线\u003c/h4\u003e\u003cp\u003eDebian/Ubuntu 系统示例：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003esudo apt-get update\nsudo apt-get install build-essential git git-lfs\ncd /path/to/usd-brep\n./prebuild.sh\n./repo.sh build\n./repo.sh test\n./tests.sh linux-x86_64\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eaarch64 使用匹配的平台和可用依赖。官方说明其余构建依赖经 Packman 拉取，主要包括 OpenUSD、Python 3.12、pybind11、premake 和 repo 工具。下载成功仍取决于网络与对应平台包是否可用。\u003c/p\u003e\u003cp\u003e新检出或删除 \u003ccode\u003e_build\u003c/code\u003e 后必须先运行 \u003ccode\u003eprebuild\u003c/code\u003e，它会准备 \u003ccode\u003e_build/schema/omniSolid/resources\u003c/code\u003e。只运行 \u003ccode\u003erepo build\u003c/code\u003e 可能导致运行时找不到 schema。\u003c/p\u003e\u003ch4\u003e6.3 Windows 源码路线\u003c/h4\u003e\u003cp\u003e先安装 Visual Studio 2019 或 2022 的“使用 C++ 的桌面开发”工作负载，以及 Windows SDK。仓库配置固定使用 \u003ccode\u003evs2019\u003c/code\u003e；VS 2022 用户还需要 v142 工具集。单纯安装 VS 界面不代表 C++ 编译器已经齐备。\u003c/p\u003e\u003cpre\u003e\u003ccode\u003ecd C:\\path\\to\\usd-brep\nprebuild.bat\nrepo.bat build\nrepo.bat test\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e如果编译器发现失败，依据官方 README 和 repo_build 文档配置 \u003ccode\u003emsbuild.vs_path\u003c/code\u003e、\u003ccode\u003emsbuild.vs_version\u003c/code\u003e 或 \u003ccode\u003emsbuild.winsdk_path\u003c/code\u003e。这些配置只能定位已经安装的工具，不能替代安装。\u003c/p\u003e\u003ch4\u003e6.4 本机 macOS Apple Silicon：先检查门槛\u003c/h4\u003e\u003cp\u003e官方支持入口：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003ecd /Volumes/NVME2T/projects/ai_agent/cad/usd-brep\n./prebuild.sh -p macos-universal\n./repo.sh build -p macos-universal\n./tests.sh macos-universal\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e但当前版本存在以下实际前置条件：\u003c/p\u003e\u003cp\u003e1. macOS 对应的 Packman OpenUSD/Python 成品包不按 Linux/Windows 路线提供，需要可用的本地主机 Python 3.12。\u003c/p\u003e\u003cp\u003e2. \u003ccode\u003edeps/host-deps.packman.xml\u003c/code\u003e 指定的 \u003ccode\u003epremake@5.0.0-beta1+nv1-macos-universal\u003c/code\u003e 不在公共 Packman 服务器，需要通过用户级 Packman 配置提供。不能假设普通 Homebrew premake 可以直接等价替换。\u003c/p\u003e\u003cp\u003e3. 默认构建是 Python-only 开发层级，包含内核、C++ 测试及 \u003ccode\u003e_smlib_tests\u003c/code\u003e、\u003ccode\u003e_smlib_dev\u003c/code\u003e；不会生成完整 OpenUSD/OCCT 或 \u003ccode\u003e_omni_solid\u003c/code\u003e。开发模块的导入还依赖完整稳定模块，所以不能把默认层级当作可直接运行本说明建模示例的环境。\u003c/p\u003e\u003cp\u003e4. 要启用完整 Python/USD 层，需要准备本地 OpenUSD 25.11 与 Python 3.12 的匹配构建，并暂存依赖。\u003c/p\u003e\u003cp\u003e已具备这些依赖时，按自己的真实安装位置设置：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eexport SMLIB_USD_ROOT=/Volumes/NVME2T/deps/usd-25.11-py312\nexport SMLIB_PYTHON_ROOT=/absolute/path/to/python312-prefix\n./tools/scripts/setup-macos-local-deps.sh\n./prebuild.sh -p macos-universal\n./repo.sh build -p macos-universal -j10\n./tests.sh macos-universal\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e这里的两个依赖目录是填写示例，本次没有创建或安装。USD 根目录应有 \u003ccode\u003einclude/pxr\u003c/code\u003e，Python 根目录应有 \u003ccode\u003einclude/python3.12\u003c/code\u003e。\u003ccode\u003esetup-macos-local-deps.sh\u003c/code\u003e 会替换 \u003ccode\u003e_build/target-deps\u003c/code\u003e 下相关依赖入口；已有构建环境中执行前应确认这些入口没有被用于其他任务。\u003c/p\u003e\u003cp\u003e本次没有尝试这条构建路线，因此不能保证仅复制这些命令即可在本机成功；首要待解决项是 macOS premake 包和匹配的本地 OpenUSD/Python。\u003c/p\u003e\u003ch3\u003e7. 源码构建后的 Python 环境\u003c/h3\u003e\u003cp\u003e以下均以前面的完整构建成功为前提。解释器必须与原生扩展的 Python 3.12 ABI、CPU 架构匹配。\u003c/p\u003e\u003cp\u003emacOS release 环境示意：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003ecd /Volumes/NVME2T/projects/ai_agent/cad/usd-brep\nexport PYTHONPATH=\u0026quot;$PWD/_build/macos-universal/release:$PWD/_build/target-deps/usd/release/lib/python${PYTHONPATH:+:$PYTHONPATH}\u0026quot;\nexport OMNISOLID_PLUGIN_PATH=\u0026quot;$PWD/_build/schema/omniSolid/resources\u0026quot;\n\u0026quot;$SMLIB_PYTHON_ROOT/bin/python3\u0026quot; -c \u0026#x27;import _omni_solid as sm; print(sm.__file__)\u0026#x27;\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e若动态库加载失败，应核对 USD 安装的 rpath、架构和 Python 版本；不要直接把其他项目的动态库混入当前环境。\u003c/p\u003e\u003cp\u003eLinux x86_64 release 可按仓库测试环境设置：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003eexport PYTHONPATH=\u0026quot;$PWD/_build/linux-x86_64/release${PYTHONPATH:+:$PYTHONPATH}\u0026quot;\nexport OMNISOLID_PLUGIN_PATH=\u0026quot;$PWD/_build/schema/omniSolid/resources\u0026quot;\nexport LD_LIBRARY_PATH=\u0026quot;$PWD/_build/linux-x86_64/release:$PWD/_build/target-deps/usd/release/lib:$PWD/_build/target-deps/python/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\u0026quot;\n./_build/target-deps/python/bin/python3 -c \u0026#x27;import _omni_solid as sm; print(sm.__file__)\u0026#x27;\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e不要用 \u003ccode\u003einspect.signature()\u003c/code\u003e 是否成功作为绑定可用性的判断，pybind11 内置函数不一定支持它；使用 \u003ccode\u003ehelp(sm.create_box)\u003c/code\u003e、\u003ccode\u003e__doc__\u003c/code\u003e 和类型声明。声明入口是 __init__.pyi（见原文附件） 与 usd.pyi（见原文附件）。\u003c/p\u003e\u003ch3\u003e8. 机械建模示例：矩形板打通孔\u003c/h3\u003e\u003ch4\u003e8.1 模型与验证设计\u003c/h4\u003e\u003cp\u003e- 板尺寸：40 × 30 × 8，板的最小坐标角为原点。\u003c/p\u003e\u003cp\u003e- 孔中心：X=20、Y=15，半径=4，轴沿 Z。\u003c/p\u003e\u003cp\u003e- 刀具体从 Z=-1 延伸到 Z=9，穿过板两侧，减少恰好共面的端面条件。\u003c/p\u003e\u003cp\u003e- 本示例约定长度单位为毫米；内核不会仅从数值自动识别单位。\u003c/p\u003e\u003cp\u003e- 理论体积：\u003ccode\u003e40*30*8 - pi*4**2*8\u003c/code\u003e，约 9197.8761 mm³。\u003c/p\u003e\u003cp\u003e- 验收至少包括：实体流形检查、体积与理论值比较、原板保持不变，以及保存后重读。\u003c/p\u003e\u003ch4\u003e8.2 示例代码\u003c/h4\u003e\u003cp\u003e以下为文档内的参考代码，尚未创建独立脚本或执行。先使用第 7 节的环境验证导入，再保存为自己的脚本运行。代码采用临时的新输出目录，避免覆盖已有模型。\u003c/p\u003e\u003cpre\u003e\u003ccode\u003efrom pathlib import Path\nimport math\nimport tempfile\nimport _omni_solid as sm\n\nlength, width, thickness = 40.0, 30.0, 8.0\nradius = 4.0\n\nplate = sm.create_box((0.0, 0.0, 0.0), length, width, thickness)\ncutter = sm.create_cylinder((20.0, 15.0, -1.0), radius, thickness + 2.0)\n\n# 布尔运算会接管输入。传入副本，以便保留 plate 与 cutter。\npart = sm.boolean_difference(plate.copy(), cutter.copy())\nassert part.is_manifold_solid()\nassert plate.face_count() == 6\n\nexpected = length * width * thickness - math.pi * radius**2 * thickness\nactual = part.volume(relative_accuracy=1e-6)\nassert math.isclose(actual, expected, rel_tol=1e-4, abs_tol=1e-3), (actual, expected)\n\nprint(\u0026quot;拓扑:\u0026quot;, part.face_count(), part.edge_count(), part.vertex_count())\nprint(\u0026quot;包围盒:\u0026quot;, part.bounding_box())\nprint(\u0026quot;体积:\u0026quot;, actual, \u0026quot;理论值:\u0026quot;, expected)\n\n# 输出到仓库内新建的独立目录，仓库位于外置盘时输出也留在外置盘。\nroot = Path.cwd() / \u0026quot;_assets_output\u0026quot;\nroot.mkdir(exist_ok=True)\nout = Path(tempfile.mkdtemp(prefix=\u0026quot;drilled_plate_\u0026quot;, dir=root))\npath = out / \u0026quot;drilled_plate.smb\u0026quot;\npart.write_to_file(str(path), ascii=True)\nrestored = sm.read_brep_from_file(str(path))\nassert restored.is_manifold_solid()\nassert math.isclose(restored.volume(relative_accuracy=1e-6), actual, rel_tol=1e-4)\nprint(\u0026quot;已保存:\u0026quot;, path)\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e这些断言是该简单零件的预期验收条件，尚未经本机运行确认，不能据此宣称内核已通过验收。圆形边界的体积积分有已知问题，因此示例主动收紧 \u003ccode\u003erelative_accuracy\u003c/code\u003e；实际应用仍要用独立基准校验。\u003c/p\u003e\u003cp\u003e对应官方可执行示例/测试参考：Python 圆角管示例（见原文附件）、绑定测试（见原文附件）。后者是上游测试文件，本次未执行。\u003c/p\u003e\u003ch4\u003e8.3 所有权与修改规则\u003c/h4\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e操作类型\u003c/td\u003e\u003ctd\u003e含义\u003c/td\u003e\u003ctd\u003e使用原则\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePure\u003c/td\u003e\u003ctd\u003e创建新对象、输入保留\u003c/td\u003e\u003ctd\u003e如 primitive、普通实体扫掠、tessellate\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eConsumes\u003c/td\u003e\u003ctd\u003e接管输入所有权\u003c/td\u003e\u003ctd\u003e常规布尔运算后只使用返回对象；保留输入时传 \u003ccode\
