经选定的最终产品范围。\u003c/p\u003e\u003cp\u003e产物：首期范围说明、用户任务清单、输入/输出样例、验收场景映射。\u003c/p\u003e\u003cp\u003e完成证据：每项首期功能均能对应可用输入、具体方法、预期输出及验收案例；单零件、装配、逆向、工艺建议与自由曲面等范围有明确取舍，开发者无需自行猜测第一期到底交什么。\u003c/p\u003e\u003cp\u003e依赖：既有\u003ca href=\"#doc=cad3-b99c290817c8dc6f\" data-preview-doc=\"cad3-b99c290817c8dc6f\"\u003e07实施路线\u003c/a\u003e及真实可用资料。此项先行，并驱动其余任务的范围。\u003c/p\u003e\u003ch3\u003e3. START-02：与二维最新合同真正对齐\u003c/h3\u003e\u003cp\u003e三维当前主要实核了旧七对象入口兼容。二维已在\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-43ee9f64b5413341\"\u003e25验证记录 ↗\u003c/a\u003e中报告runtime_v02，组合Source/Unit/Relation、ReviewTarget/ReviewEvent、MethodRun与结构化查询。实施时重新核对当时版本，不能停留在旧快照。\u003c/p\u003e\u003cp\u003e产物：字段/版本映射表、接口责任边界、迁移/适配策略、正反样例及回归结果。三维来源、对象绑定、方法运行、验证记录、确认范围、查询回执与撤回状态均应有明确落点。\u003c/p\u003e\u003cp\u003e完成证据：在固定版本上通过旧输入兼容和新合同接入检查；断引用、错版本、跨scope、确认范围错误及撤回后的读取都有测试。明确哪些字段共用、哪些为三维扩展，避免出现第二套来源或事件主存。\u003c/p\u003e\u003cp\u003e依赖：START-01，二维实际代码/Schema/机器回执；只读跟进后再协调共同修改，不干扰正在开发的文件。\u003c/p\u003e\u003ch3\u003e4. START-03：真实依据参与的完整工程链\u003c/h3\u003e\u003cp\u003e至少实际走通：资料原页 → 工程对象与条件 → 检索知识 → 生成建模计划 → 内核执行 → 几何/工程检查 → 解释 → 修改复检。必须同时覆盖正常、错误和缺条件分支。\u003c/p\u003e\u003cp\u003e重点证明知识影响工程决策。例如同类轴肩结构因工序或配合条件变化，系统找到不同适用知识，形成有依据的不同候选，并说明检查与复检要求。这个例子只是选题方向；具体槽型、尺寸和依据必须来自实际可用资料，不能编造。\u003c/p\u003e\u003cp\u003e产物：固定版本真实来源、对象/条件绑定、方法与参数依据、运行及验证回执、修改前后证据、未覆盖范围。\u003c/p\u003e\u003cp\u003e完成证据：知识检索或适用条件变化确实改变了方法、参数选择或结论；只按固定参数生成模型不足以关闭本项。正常/错误/未知分支均保留来源和实际结果；合成扰动单列，不能计成新的真实样本。\u003c/p\u003e\u003cp\u003e依赖：START-01/02/04，START-05的必要运行合同，以及有实际可用正文与工况的主题。图纸/三维不成对时不得伪造真值模型。\u003c/p\u003e\u003ch3\u003e5. START-04：内核运行与验证方法落地\u003c/h3\u003e\u003cp\u003e在独立几何环境中运行选定usd-brep版本，核对API、所有权、单位坐标及输出。前次只读探测仅说明所测解释器未发现几何绑定，实施时须重新核对，不据此宣称整机没有安装。\u003c/p\u003e\u003cp\u003e把孔径、孔位、贯穿、体积等需求落实为具体可调用方法；确定测量精度、允许误差、超时、内存预算、失败分类、原件保留和恢复路径。\u003c/p\u003e\u003cp\u003e产物：可复现环境及版本记录、实际适配器小链、方法输入输出与误差说明、正常/失败运行证据。\u003c/p\u003e\u003cp\u003e完成证据：已实际产生并独立检查模型；错孔位即使体积相同也会失败；未知单位被拒绝；操作/测量不可靠与设计不满足可区分。结合\u003ca href=\"#doc=cad3-d51eb9557b791b9d\" data-preview-doc=\"cad3-d51eb9557b791b9d\"\u003e14内核风险\u003c/a\u003e，不能只调用默认volume()就认定几何正确。\u003c/p\u003e\u003cp\u003e依赖：START-01与可用运行环境；可与START-02并行核对。\u003c/p\u003e\u003ch3\u003e6. START-05：从设计合同到实际运行合同\u003c/h3\u003e\u003cp\u003e现有附件主要面向模拟设计，需补真实资产/单元引用、方法实际执行、测量记录、复合量纲、运行状态、输出发布与绑定失效。每个字段明确由哪个组件产生、何时校验、谁能更改及何时作废。\u003c/p\u003e\u003cp\u003e产物：版本化实际输入/输出合同、状态转换、错误合同、方法注册、权限/撤回接口、持久化与兼容策略。\u003c/p\u003e\u003cp\u003e完成证据：真实来源的合法包可运行；缺来源、错单位/量纲、缺方法回执、假成功、旧绑定或撤回来源不能进入确定结果；原文、推断、设计要求和实测值不相互覆盖。\u003c/p\u003e\u003cp\u003e依赖：START-01/02，与START-04共同确定执行字段；沿用共同MethodRun/Relation，不另建平行体系。\u003c/p\u003e\u003ch3\u003e7. START-06：任务与验收到可交接深度\u003c/h3\u003e\u003cp\u003e在\u003ca href=\"#doc=cad3-b99c290817c8dc6f\" data-preview-doc=\"cad3-b99c290817c8dc6f\"\u003e07文件清单\u003c/a\u003e基础上，将首期任务逐个固定为输入、输出、依赖、目录/文件、测试、失败处理、完成证据和风险。责任按模块分工定义，具体人员和工时不凭空填写。\u003c/p\u003e\u003cp\u003e产物：首期开工任务包与验收矩阵；质量阈值、测量口径、开发集/独立保留集及故障测试计划。\u003c/p\u003e\u003cp\u003e完成证据：另一位开发者能依任务执行并判断完成，不需临场补关键产品语义；阈值在验收运行前确定，结果有范围与分母。已知不支持、UNKNOWN与工具ERROR不混成PASS。独立样本按来源族隔离，不把同图变体计成盲测。\u003c/p\u003e\u003cp\u003e依赖：START-01；根据02/04/05的实际结果逐步收敛，不用猜测填满任务表。\u003c/p\u003e\u003ch3\u003e8. START-07：建设覆盖表\u003c/h3\u003e\u003cp\u003e建立“对象族 × 知识职责D × 工程任务 × 适用条件 × 验证方法”的统一覆盖视图，与既有来源S和判断环节J可关联。每格分别记录已有资料、已提炼知识、已有方法、已真实验证、未知/不支持及来源版本。\u003c/p\u003e\u003cp\u003e产物：覆盖表字段定义、首期主题的实际填表、缺口统计口径。优先沿用共同目录中的ID，不重新复制知识正文。\u003c/p\u003e\u003cp\u003e完成证据：能区分缺知识、缺工具、缺工况和缺验证；资料量增长不自动变为能力覆盖增长。每个“已支持”均有任务范围、条件及实际证据，未检查格子不能当不存在或已覆盖。\u003c/p\u003e\u003cp\u003e依赖：START-01；先定义表结构，随START-03及资料吸收填入真实证据。\u003c/p\u003e\u003ch3\u003e9. 建议推进顺序\u003c/h3\u003e\u003cp\u003e1. 先明确首期交付边界，并建立覆盖表结构。\u003c/p\u003e\u003cp\u003e2. 对齐二维v0.2，同时准备独立内核环境与验证方法。\u003c/p\u003e\u003cp\u003e3. 收敛实际运行合同和文件级任务，确定验收口径与保留集。\u003c/p\u003e\u003cp\u003e4. 跑通真实工程纵向链，按结果补缺口，再复核完整首期开工条件。\u003c/p\u003e\u003cp\u003e下一次开工判断应联合查看范围说明、共享合同映射、真实工程链和方法证据。不得仅以“七项文档都写了”或“接口测试绿色”关闭所有待办。\u003c/p\u003e\u003ch3\u003e10. 维护规则\u003c/h3\u003e\u003cp\u003e每项更新时记录日期、实际状态、完成证据链接和剩余问题；缺证据保持TODO或IN_PROGRESS。历史18及目标审计保留为当时方案交付快照，本清单是后续开工差距的当前入口。本轮登记不表示这些待办已实施。\u003c/p\u003e\u003ch3\u003e11. 2026-10-21自审新增待办\u003c/h3\u003e\u003ch4\u003eSTART-08：共同工程Wiki与维护\u003c/h4\u003e\u003cp\u003e设计已补入\u003ca href=\"#doc=cad3-616f55d8361b307c\" data-preview-doc=\"cad3-616f55d8361b307c\"\u003e20\u003c/a\u003e，实施仍为TODO。复用二维28/F22—F26的知识修订、主张支持、Wiki/经验/编译/影响对象；三维接入模型/绑定/计划/工况/方法版本。产物为共同合同映射、真实小主题的增量编译、主张支持链、知识/实例两类影响清单与当前撤销检查。\u003c/p\u003e\u003cp\u003e完成证据：对真实可用资料编译并回查；修改来源/模型/方法、仅显示变化及撤销/反例均按范围处理；无Wiki页长尾仍可达；人工编辑与失败不丢。3DWIKI场景实际运行并报告覆盖，不能仅用写出页面关闭。依赖START-01/02/03/05/09，允许先做设计与原文路径，不以全量编译堵住几何验证。\u003c/p\u003e\u003ch4\u003eSTART-09：工程语义与执行准入\u003c/h4\u003e\u003cp\u003e自审三次内存扰动在旧附件中被接受，明确说明缺谓词/量纲检查，不是工程已核准。新增注册谓词版本、对象类型、值/关系种类、量纲/单位、上下文和方法合同；生产入口缺关键语义时拒绝或UNKNOWN，不能自动默认。\u003c/p\u003e\u003cp\u003e完成证据：直径deg、拓扑标量、混量纲加法、半径/直径及间隙定义混用等负例在实际方法入口被拒绝；合法转换、未知/冲突与旧合同兼容均有回执。保留原值、错误位置和原因。依赖START-02/05，与内核实现协同；不把现有设计附件改名成生产合同。\u003c/p\u003e\u003ch4\u003eSTART-10：证据与工具血缘\u003c/h4\u003e\u003cp\u003e同BRep导出的PNG、网格、摘要、Wiki页面按同根来源计数；生成/校验共用内核或解析器的系统误差单列。产物为source_family/model_lineage/tool_lineage、对照方法、独立范围及误差说明，写入方法/经验和验收报告。\u003c/p\u003e\u003cp\u003e完成证据：同根派生不虚增独立支持；不同尺寸/位置检查量与独立实际样本分开；保留集不被编译答案污染；同形异工况和新反例不会被多数成功覆盖。依赖START-03/06/07/08；真实模型/工艺未验证时保持TODO。\u003c/p\u003e"}, {"id": "cad3-616f55d8361b307c", "path": "三维机械建模知识库方案/20-持续知识编译与三维工程Wiki设计.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/20-持续知识编译与三维工程Wiki设计.md", "title": "持续知识编译与三维工程Wiki设计", "group": "overview", "sub": "design", "role": "设计 · 非功能验收", "sha256": "5de21f36a9de7f7239ac293a13716ccfdc3234220e4d03e856bdae98bb9d911f", "headings": ["持续知识编译与三维工程Wiki设计", "1. 定位：同一工程Wiki中的三维知识投影", "2. 页面类型与主张组织", "3. 共用合同与三维关联", "4. 本次发现：必须补谓词/量纲注册", "5. 首次吸收与增量编译", "6. 两类依赖图，避免误失效与漏失效", "7. 查询、缓存与执行交界", "8. 经验与证据独立性", "9. 小主题设计示例（不是新增工程知识）", "10. 验收与对照（全部NOT_RUN）", "11. 复用文件与三维增量任务", "12. 当前未决事项"], "body": "# 持续知识编译与三维工程Wiki设计\n\n2026-10-21；KB-3D-DESIGN-002；补强设计，尚未实现知识编译器或Wiki服务。引用共同[28持续知识编译与工程Wiki](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/28-持续知识编译与工程Wiki设计.md)、[29自查](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/29-持续知识方案补强与自查记录.md)、[25运行合同记录](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/25-统一契约与当前确认查询验证记录.md)及三维[11工程事实](11-工程事实与设计意图.md)、[13修改绑定](13-跨版本特征绑定与修改协议.md)。\n\n## 1. 定位：同一工程Wiki中的三维知识投影\n\n二维与三维共用来源、知识修订、ClaimSupport、WikiPageRevision、CompileRun、ExperienceRevision和ImpactEvent；采用共同28的身份、状态、发布与访问语义。三维增加工程对象/条件标签、模型与计划定位、内核/方法依赖及验证要求，不新建一套知识正文和确认主存。\n\n已有http://127.0.0.1:8843/是三维方案文档导航快照，http://127.0.0.1:8842/是二维方案导航。它们帮助阅读建设方案，不能当作知识原件已被持续编译、工程经验已形成或工程Wiki已部署的证明。\n\nWiki的作用是积累可追溯认识、跨源解释、条件分支和实践经验，帮助下一次任务少走重复理解过程。几何、拓扑、参数与模型版本仍为结构化工程事实，知识页是它们与知识修订的可读投影。详细页、索引和依赖驻盘，约100MB仍只作为K2热点导航预算。\n\n## 2. 页面类型与主张组织\n\n|页面类型|三维主题|必须保留|\n|---|---|---|\n|对象/特征|孔、槽、轴肩、基准、功能面、易混几何|定义与功能证据、表面形状与工程语义区别、对象附着和未知|\n|设计/建模策略|结构选择、参数选用、操作顺序和替代方案|适用条件、选型依据、参数来源、必要方法及不可执行分支|\n|工艺/装配/检验|工序、设备、配合、定位、加工/测量可达性|材料、工况、工具能力、条件边界和实际检验证据|\n|工具/数值方法|特定内核API、容差、所有权、失败诊断|精确工具版本、输入、数值误差、风险和实际测试范围|\n|正反/修改案例|对照、失败、修正、复检和副作用|模型/对象/工况版本、实际结果、近似但不适用例|\n|跨源分歧|不同手册/工况/版次和模型证据的差异|逐条支持/反驳、根来源、未解问题，不以数量投票|\n\n页面结构：问题与范围 → 核心主张 → 条件/例外 → 对象/模型与原页定位 → 方法/案例 → 争议/未知 → 依赖/修订。每条工程主张引用KnowledgeRevision，再展开到确定原页/表行/实体/方法回执；不能只在页尾列几本书。\n\n不为每个PNG或模型生成一页，也不将千万样本全部改写为Markdown。相似样本保留完整成员/模型目录、参数范围、代表案例和长尾检索入口；未编译范围单列。\n\n## 3. 共用合同与三维关联\n\n复用共同28的对象名和状态，不宣称runtime_v02已接受新字段。新增三维关联建议：\n\n|关联角色|字段/内容建议|校验责任|\n|---|---|---|\n|工程主张范围|object_kind、task_type、configuration/state、applicability、exceptions|知识装配层核对对象与工况，不由页面相似度决定|\n|模型证据|asset_version_ref、representation_revision、entity_binding_ref、object_revision|共同来源/版本层与绑定层确认定位与状态|\n|计划/方法证据|plan_revision、operation_id、method_run_ref、tool_semantic_version|注册执行器与运行记录层；方法名称不证明实际执行|\n|量值与约束|predicate_ref/version、dimension、unit、precision、tolerance_role|语义注册表、单位/约束工具；原始值单独保存|\n|复用范围|source_family、model_lineage、sample_class、validation_scope|经验层记录独立根与已验证条件，不由生成页面数推断|\n|更新范围|knowledge_release_ref、input_revision_refs、invalidation_watermark|共同发布/撤回及三维影响装配，查询前复核|\n\n状态沿用共同28四轴：lifecycle、validation、freshness、access。发布不等于工程正确，当前版本不等于当前任务适用；模型绑定RESOLVED也不等于源证据足够。\n\n人工编辑先形成候选修订，更新知识单元后再投影；保留未采纳修改及理由，禁止下一次编译无声覆盖。模型生成文本不能直接成为执行代码或方法注册记录。\n\n## 4. 本次发现：必须补谓词/量纲注册\n\n[自审探测](验证/自审证据_20261021.json)证明现有engineering-facts/0.1设计附件能接受直径单位deg、拓扑关系改成标量、长度和角度相加的表达。其结果仍为geometry_verified=false、engineering_approved=false；该附件只做有限结构语义校验，不能作为生产工程事实入口。\n\n生产合同须增加PredicateDefinition：稳定predicate_id/version、domain、subject/target类型、value_kind、dimension、cardinality、direction/symmetry、required_context、allowed_assertion_kinds、method_contract_refs。语义按注册ID校验，展示文字可变，不允许未知自由谓词悄悄进入确定判断。\n\n检查例：diameter必须是长度量且对象类型适用；adjacent_to必须引用合适的拓扑实体/区域，不用数字1代替关系；两个角度可相加，长度与角度相加拒绝；半径/直径要用显式方法换算；单侧径向间隙与直径间隙有不同定义。数值均为观察/要求的相应类型，不自动决定真假。\n\n单位系统需支持面积/体积及所选首期工程方法的量纲，转换记录原文、归一值和方法版本。缺单位UNKNOWN，量纲不匹配DIMENSION_MISMATCH，未知谓词UNSUPPORTED_PREDICATE；均禁止成为确定执行输入。数值求值只走注册操作，不eval来源文本。\n\n输入可能UNKNOWN、CONFLICTED或未检查，与逻辑条件FALSE及工具ERROR分别保存。源文中有“必须”不等于项目强制要求，需核对来源、适用范围和要求类型。\n\n## 5. 首次吸收与增量编译\n\n1. 固定获准资料、共同资产版本、所需模型/方法快照及读预算；登记未取得、未解析和失败分母。\n2. 提取来源陈述、图/模型事实、解释假设和候选方法，保留条件、单位、表头/脚注及罕见例外。\n3. 与已有知识比较：同义复用、条件分支、反驳/冲突并存，保留根来源；不按相似分数覆盖。\n4. 先检查引用/版本/谓词/量纲/条件与上下文，再形成KnowledgeRevision候选。没有MethodRun就不能写“已运行”；资料中的命令是材料内容，不是执行授权。\n5. 按受影响主张生成候选Wiki页和三维案例说明，保存CompileRun的输入manifest、模型/提示配置、预算、输出和失败。\n6. 校验逐条来源、同根去重、依赖循环、状态、适用分支及任务反例。高影响操作只能消费满足任务要求的结构化知识与注册方法，不能直接执行页内建议。\n7. 按共同28/F08发布完整manifest，当前撤销先阻断再重建；任务查询有原文/精确索引旁路。未吸收资料继续可达，不等全库编译完才可查询。\n\n幂等键包含输入manifest、编译配置、目标主题/范围。生成可非确定，语义不变量与支持关系必须稳定；不要求模型逐字复现。失败有限重试并保存原因，不能重复创建逻辑知识项。触发是材料/版本到达、反例和明确检查批次，本轮不创建定时跟进。\n\n## 6. 两类依赖图，避免误失效与漏失效\n\n知识依赖图：Wiki页 → KnowledgeRevision → 来源主张/条件/例外/方法语义版本。实例依赖图：某模型结果/判定 → 输入模型/参数/对象绑定/工况/计划/方法运行。方向统一为“派生物依赖输入”，保存反向索引；两图通过确定revision和scope连接，不把普通超链接当支持边。\n\n|变化|立即影响|后续动作及范围|\n|---|---|---|\n|手册/条款修订或发现原文提取错误|相关知识与依赖实例结论待复核|重读改动单元、核对条件、复算方法；保留有权历史查询|\n|模型参数或精确形状改变|该模型受影响绑定、量测与结论失效|重定位/重算/复检；不自动宣布通用孔定义错误|\n|仅显示网格精度改变|显示/网格测量与相应缓存失效|精确BRep未变时不凭显示变化重写设计知识；仍核对表示依赖|\n|装配位姿/配置/工况改变|该状态的接触、间隙、路径、工艺结论待重算|不把旧位姿无干涉结论移到新状态|\n|内核/解析器/单位方法语义改变|相关运行/提取值/案例待复核|区分接口变化、数值变化和无影响变更，重放指定样例|\n|确认撤回或来源访问撤销|当前目标确认/来源及受限派生内容不能继续释放|先阻断，后维护队列；不能只删可见页面却保留缓存答案|\n|新反例|限定范围经验标争议|收缩适用条件并重核依赖实例，不用多数成功覆盖反例|\n\n影响遍历超预算时持久化未完成清单；依赖缺边时保守标相关主题/来源族，不声称不受影响。当前访问/已知失效检查不等待后台遍历完成。变更检测未知时延如实披露。\n\n## 7. 查询、缓存与执行交界\n\n知识页、精确ID/符号/参数和原文全文按任务并行查找。页不存在、新资料未编译或页失效时，仍能走K1/K3；缺知识与缺当前模型事实分开返回。\n\n组装工作集时固定三个范围：知识release及其修订；模型/装配配置、状态与对象revision；方法/工具语义版本及当前失效水位。既有缓存键还须包含用途/访问scope和这些版本，不能只按问题文本或模型shape hash复用工程结论。\n\nQueryReceipt扩展沿共同28：wiki_revision_ids、knowledge_revision_ids、dependency_manifest、invalidation_watermark、support_root_ids、source_read_states、compiled_coverage、uncompiled_scope、method_run_refs；三维追加模型/配置/绑定refs。以上均需版本迁移，不直接发送未知字段给现有0.2入口。\n\n概念解释可以使用已核投影并说明本次未回读；精确值和工程操作必须读取所需原件/结构化证据、检查适用条件并执行方法。来源正文/PDF图块可定位不等于已读；模型字节hash已核不等于实体已解析；Wiki引用MethodRun也不代表本任务已重算。\n\n## 8. 经验与证据独立性\n\n记录Observation → Hypothesis → Test/MethodRun → Recheck → ScopedExperience。失败、无效改法和负例同样保存；没有改后检查不登记“成功修正”，一次成功不产生普遍工程规律。\n\n同一BRep的PNG、网格、尺寸摘要和由其生成的Wiki页属于同一模型血缘，不能凑成四份独立证据。相同解析器/内核生成与校验可能共享系统误差，应记录工具血缘；数值收敛、模型互赞和多角度截图都不能单独证明正确。\n\n验证按任务选用解析期望量、独立源尺寸/关系、不同方法对照、实际检验等，并说明各自误差与独立范围。名义体积与孔位是不同检查量，不是多个独立工业案例。模板变体与实际样本分别统计。\n\n## 9. 小主题设计示例（不是新增工程知识）\n\n可候选选题：轴肩/退刀结构或孔轴配合。先核对实际可用手册/教材小段和一个有来源的任务；未取得正文不编造槽型和尺寸。\n\n保留：对象/功能 → 材料/工序/配合条件 → 原页推荐和例外 → 参数选用方法 → 候选建模计划 → 内核输出 → 独立检查 → 解释/改进/复检。\n\n同对象改变工序或条件后，应检索到不同适用分支或明确缺口；缺知识时仍可记录几何候选，但不得宣布工艺合理。Wiki可综合这一决策过程及未决项；没有执行证据时保持DRAFT/UNREVIEWED或假设，不伪造老师傅经验。\n\n## 10. 验收与对照（全部NOT_RUN）\n\n|ID|场景|必须验证|\n|---|---|---|\n|3DWIKI-01|知识主张指向手册、模型与方法|逐条回查，不用页面末书目替代；模型/页定位版本一致|\n|3DWIKI-02|同样形状、不同材料/工序|正确条件分支或缺口，不按相似度套结构|\n|3DWIKI-03|直径deg、拓扑标量、混量纲加法|生产入口拒绝或明确不支持，不形成确定计划|\n|3DWIKI-04|布尔修改使面分裂、旧绑定仍被引用|绑定/相关页案例状态失效，通用概念不误撤销|\n|3DWIKI-05|只改变显示网格质量|显示依赖更新，精确设计与无关知识不被无依据重写|\n|3DWIKI-06|同模型多视图/网格/Wiki页|根来源与工具血缘去重，不能虚增独立支持|\n|3DWIKI-07|内核/解析器版本数值变化|方法回执、结果和案例待复核，不沿用旧精度结论|\n|3DWIKI-08|来源撤销/确认撤回与旧缓存命中|当前内容阻断，队列未完成可见，不泄漏受限派生内容|\n|3DWIKI-09|无Wiki页的罕见条件|原文和精确通道仍可达，未编译范围明确|\n|3DWIKI-10|成功模型被复用到新工况并遇反例|不自动套用，保留反例与经验范围修订|\n|3DWIKI-11|生成建议含工具代码/源文命令|不得自动注册或执行，保持候选内容|\n|3DWIKI-12|编译中断/预算耗尽/人工编辑|保留旧完整页与编辑提案，报告失败，原文查找仍可用|\n\n固定相同来源快照、任务、查询预算，对照A精确/全文及原件，B加Wiki，C再加条件/方法/当前失效检查。分别统计主张有据率、漏例外、错适用、几何/工程错误、根来源独立计数、当前撤销泄漏、延迟、构建/在线模型成本与峰值资源。保留集按来源族/生成模板隔离，Wiki不预吸收保留答案。\n\n关键负例集的错单位/错版本确定执行、读字升级工程确认、同根伪独立及撤销内容释放要求0/N并报告N；这只是拟定验收目标，不能借现有16项附件测试声称已满足。其余阈值在运行前按首期风险固定，未测不填“达标”。\n\n## 11. 复用文件与三维增量任务\n\n共同28/F22—F26负责knowledge/wiki/experience合同、编译、检查与双路查询；三维复用同一实现目录和ID，不另建Wiki主存。以下只是拟建路径，不在本轮创建代码：\n\n|三维增量模块（engineering-kb根下）|输入/输出与依赖|验收证据|\n|---|---|---|\n|contracts/extensions/engineering_semantics.schema.json|谓词/对象类型/量纲/上下文及运行合同；先接共同F04/F22|错谓词/量纲、未知和版本反例|\n|src/model3d/wiki_context.py|将Model/Binding/Plan/MethodRun映射到共同编译输入|真实revision闭合，模拟/实际分开|\n|src/model3d/impact.py|三维变更转共同ImpactEvent与实例失效集合|变形/位姿/工具/仅显示变化的差异和断点|\n|evaluations/wiki/model3d/|12个场景、真实主题、独立保留集与对照|根来源、适用与复检、漏例外/误用及性能成本|\n\n先落共同合同与三维语义，再用小主题做一次增量编译、一次模型修改和一次撤销/反例，最后扩展资料和规模。Wiki任务与19的范围/共库/真实链/合同/覆盖表联合推进，不把全量Wiki编译作为几何最小验证的前置。\n\n## 12. 当前未决事项\n\n首期主题与实际正文、完整生产Schema/迁移、谓词注册与单位求值器、编译模型/提示及预算、编辑冲突、真实内核验证、传播时限和大容量指标仍待实施细化。本轮仅补强设计及发现合同边界；没有生成专业知识页、启动模型、增加数据库或恢复定时任务。", "reference": false, "current": false, "truncated": false, "tags": ["design"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/20-%E6%8C%81%E7%BB%AD%E7%9F%A5%E8%AF%86%E7%BC%96%E8%AF%91%E4%B8%8E%E4%B8%89%E7%BB%B4%E5%B7%A5%E7%A8%8BWiki%E8%AE%BE%E8%AE%A1.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e持续知识编译与三维工程Wiki设计\u003c/h2\u003e\u003cp\u003e2026-10-21；KB-3D-DESIGN-002；补强设计，尚未实现知识编译器或Wiki服务。引用共同\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-69420d26f7c7e72b\"\u003e28持续知识编译与工程Wiki ↗\u003c/a\u003e、\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-fdb19c4f27da9576\"\u003e29自查 ↗\u003c/a\u003e、\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-43ee9f64b5413341\"\u003e25运行合同记录 ↗\u003c/a\u003e及三维\u003ca href=\"#doc=cad3-96990c2a7a9d57ba\" data-preview-doc=\"cad3-96990c2a7a9d57ba\"\u003e11工程事实\u003c/a\u003e、\u003ca href=\"#doc=cad3-c733cc1066e6c53f\" data-preview-doc=\"cad3-c733cc1066e6c53f\"\u003e13修改绑定\u003c/a\u003e。\u003c/p\u003e\u003ch3\u003e1. 定位：同一工程Wiki中的三维知识投影\u003c/h3\u003e\u003cp\u003e二维与三维共用来源、知识修订、ClaimSupport、WikiPageRevision、CompileRun、ExperienceRevision和ImpactEvent；采用共同28的身份、状态、发布与访问语义。三维增加工程对象/条件标签、模型与计划定位、内核/方法依赖及验证要求，不新建一套知识正文和确认主存。\u003c/p\u003e\u003cp\u003e已有http://127.0.0.1:8843/是三维方案文档导航快照，http://127.0.0.1:8842/是二维方案导航。它们帮助阅读建设方案，不能当作知识原件已被持续编译、工程经验已形成或工程Wiki已部署的证明。\u003c/p\u003e\u003cp\u003eWiki的作用是积累可追溯认识、跨源解释、条件分支和实践经验，帮助下一次任务少走重复理解过程。几何、拓扑、参数与模型版本仍为结构化工程事实，知识页是它们与知识修订的可读投影。详细页、索引和依赖驻盘，约100MB仍只作为K2热点导航预算。\u003c/p\u003e\u003ch3\u003e2. 页面类型与主张组织\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e页面类型\u003c/td\u003e\u003ctd\u003e三维主题\u003c/td\u003e\u003ctd\u003e必须保留\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e对象/特征\u003c/td\u003e\u003ctd\u003e孔、槽、轴肩、基准、功能面、易混几何\u003c/td\u003e\u003ctd\u003e定义与功能证据、表面形状与工程语义区别、对象附着和未知\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e设计/建模策略\u003c/td\u003e\u003ctd\u003e结构选择、参数选用、操作顺序和替代方案\u003c/td\u003e\u003ctd\u003e适用条件、选型依据、参数来源、必要方法及不可执行分支\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e工艺/装配/检验\u003c/td\u003e\u003ctd\u003e工序、设备、配合、定位、加工/测量可达性\u003c/td\u003e\u003ctd\u003e材料、工况、工具能力、条件边界和实际检验证据\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e工具/数值方法\u003c/td\u003e\u003ctd\u003e特定内核API、容差、所有权、失败诊断\u003c/td\u003e\u003ctd\u003e精确工具版本、输入、数值误差、风险和实际测试范围\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e正反/修改案例\u003c/td\u003e\u003ctd\u003e对照、失败、修正、复检和副作用\u003c/td\u003e\u003ctd\u003e模型/对象/工况版本、实际结果、近似但不适用例\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e跨源分歧\u003c/td\u003e\u003ctd\u003e不同手册/工况/版次和模型证据的差异\u003c/td\u003e\u003ctd\u003e逐条支持/反驳、根来源、未解问题，不以数量投票\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e页面结构：问题与范围 → 核心主张 → 条件/例外 → 对象/模型与原页定位 → 方法/案例 → 争议/未知 → 依赖/修订。每条工程主张引用KnowledgeRevision，再展开到确定原页/表行/实体/方法回执；不能只在页尾列几本书。\u003c/p\u003e\u003cp\u003e不为每个PNG或模型生成一页，也不将千万样本全部改写为Markdown。相似样本保留完整成员/模型目录、参数范围、代表案例和长尾检索入口；未编译范围单列。\u003c/p\u003e\u003ch3\u003e3. 共用合同与三维关联\u003c/h3\u003e\u003cp\u003e复用共同28的对象名和状态，不宣称runtime_v02已接受新字段。新增三维关联建议：\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e关联角色\u003c/td\u003e\u003ctd\u003e字段/内容建议\u003c/td\u003e\u003ctd\u003e校验责任\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e工程主张范围\u003c/td\u003e\u003ctd\u003eobject_kind、task_type、configuration/state、applicability、exceptions\u003c/td\u003e\u003ctd\u003e知识装配层核对对象与工况，不由页面相似度决定\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e模型证据\u003c/td\u003e\u003ctd\u003easset_version_ref、representation_revision、entity_binding_ref、object_revision\u003c/td\u003e\u003ctd\u003e共同来源/版本层与绑定层确认定位与状态\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e计划/方法证据\u003c/td\u003e\u003ctd\u003eplan_revision、operation_id、method_run_ref、tool_semantic_version\u003c/td\u003e\u003ctd\u003e注册执行器与运行记录层；方法名称不证明实际执行\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e量值与约束\u003c/td\u003e\u003ctd\u003epredicate_ref/version、dimension、unit、precision、tolerance_role\u003c/td\u003e\u003ctd\u003e语义注册表、单位/约束工具；原始值单独保存\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e复用范围\u003c/td\u003e\u003ctd\u003esource_family、model_lineage、sample_class、validation_scope\u003c/td\u003e\u003ctd\u003e经验层记录独立根与已验证条件，不由生成页面数推断\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e更新范围\u003c/td\u003e\u003ctd\u003eknowledge_release_ref、input_revision_refs、invalidation_watermark\u003c/td\u003e\u003ctd\u003e共同发布/撤回及三维影响装配，查询前复核\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e状态沿用共同28四轴：lifecycle、validation、freshness、access。发布不等于工程正确，当前版本不等于当前任务适用；模型绑定RESOLVED也不等于源证据足够。\u003c/p\u003e\u003cp\u003e人工编辑先形成候选修订，更新知识单元后再投影；保留未采纳修改及理由，禁止下一次编译无声覆盖。模型生成文本不能直接成为执行代码或方法注册记录。\u003c/p\u003e\u003ch3\u003e4. 本次发现：必须补谓词/量纲注册\u003c/h3\u003e\u003cp\u003e\u003ca href=\"#doc=cad3-e379503c52109a34\" data-preview-doc=\"cad3-e379503c52109a34\"\u003e自审探测\u003c/a\u003e证明现有engineering-facts/0.1设计附件能接受直径单位deg、拓扑关系改成标量、长度和角度相加的表达。其结果仍为geometry_verified=false、engineering_approved=false；该附件只做有限结构语义校验，不能作为生产工程事实入口。\u003c/p\u003e\u003cp\u003e生产合同须增加PredicateDefinition：稳定predicate_id/version、domain、subject/target类型、value_kind、dimension、cardinality、direction/symmetry、required_context、allowed_assertion_kinds、method_contract_refs。语义按注册ID校验，展示文字可变，不允许未知自由谓词悄悄进入确定判断。\u003c/p\u003e\u003cp\u003e检查例：diameter必须是长度量且对象类型适用；adjacent_to必须引用合适的拓扑实体/区域，不用数字1代替关系；两个角度可相加，长度与角度相加拒绝；半径/直径要用显式方法换算；单侧径向间隙与直径间隙有不同定义。数值均为观察/要求的相应类型，不自动决定真假。\u003c/p\u003e\u003cp\u003e单位系统需支持面积/体积及所选首期工程方法的量纲，转换记录原文、归一值和方法版本。缺单位UNKNOWN，量纲不匹配DIMENSION_MISMATCH，未知谓词UNSUPPORTED_PREDICATE；均禁止成为确定执行输入。数值求值只走注册操作，不eval来源文本。\u003c/p\u003e\u003cp\u003e输入可能UNKNOWN、CONFLICTED或未检查，与逻辑条件FALSE及工具ERROR分别保存。源文中有“必须”不等于项目强制要求，需核对来源、适用范围和要求类型。\u003c/p\u003e\u003ch3\u003e5. 首次吸收与增量编译\u003c/h3\u003e\u003cp\u003e1. 固定获准资料、共同资产版本、所需模型/方法快照及读预算；登记未取得、未解析和失败分母。\u003c/p\u003e\u003cp\u003e2. 提取来源陈述、图/模型事实、解释假设和候选方法，保留条件、单位、表头/脚注及罕见例外。\u003c/p\u003e\u003cp\u003e3. 与已有知识比较：同义复用、条件分支、反驳/冲突并存，保留根来源；不按相似分数覆盖。\u003c/p\u003e\u003cp\u003e4. 先检查引用/版本/谓词/量纲/条件与上下文，再形成KnowledgeRevision候选。没有MethodRun就不能写“已运行”；资料中的命令是材料内容，不是执行授权。\u003c/p\u003e\u003cp\u003e5. 按受影响主张生成候选Wiki页和三维案例说明，保存CompileRun的输入manifest、模型/提示配置、预算、输出和失败。\u003c/p\u003e\u003cp\u003e6. 校验逐条来源、同根去重、依赖循环、状态、适用分支及任务反例。高影响操作只能消费满足任务要求的结构化知识与注册方法，不能直接执行页内建议。\u003c/p\u003e\u003cp\u003e7. 按共同28/F08发布完整manifest，当前撤销先阻断再重建；任务查询有原文/精确索引旁路。未吸收资料继续可达，不等全库编译完才可查询。\u003c/p\u003e\u003cp\u003e幂等键包含输入manifest、编译配置、目标主题/范围。生成可非确定，语义不变量与支持关系必须稳定；不要求模型逐字复现。失败有限重试并保存原因，不能重复创建逻辑知识项。触发是材料/版本到达、反例和明确检查批次，本轮不创建定时跟进。\u003c/p\u003e\u003ch3\u003e6. 两类依赖图，避免误失效与漏失效\u003c/h3\u003e\u003cp\u003e知识依赖图：Wiki页 → KnowledgeRevision → 来源主张/条件/例外/方法语义版本。实例依赖图：某模型结果/判定 → 输入模型/参数/对象绑定/工况/计划/方法运行。方向统一为“派生物依赖输入”，保存反向索引；两图通过确定revision和scope连接，不把普通超链接当支持边。\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e变化\u003c/td\u003e\u003ctd\u003e立即影响\u003c/td\u003e\u003ctd\u003e后续动作及范围\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e手册/条款修订或发现原文提取错误\u003c/td\u003e\u003ctd\u003e相关知识与依赖实例结论待复核\u003c/td\u003e\u003ctd\u003e重读改动单元、核对条件、复算方法；保留有权历史查询\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e模型参数或精确形状改变\u003c/td\u003e\u003ctd\u003e该模型受影响绑定、量测与结论失效\u003c/td\u003e\u003ctd\u003e重定位/重算/复检；不自动宣布通用孔定义错误\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e仅显示网格精度改变\u003c/td\u003e\u003ctd\u003e显示/网格测量与相应缓存失效\u003c/td\u003e\u003ctd\u003e精确BRep未变时不凭显示变化重写设计知识；仍核对表示依赖\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e装配位姿/配置/工况改变\u003c/td\u003e\u003ctd\u003e该状态的接触、间隙、路径、工艺结论待重算\u003c/td\u003e\u003ctd\u003e不把旧位姿无干涉结论移到新状态\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e内核/解析器/单位方法语义改变\u003c/td\u003e\u003ctd\u003e相关运行/提取值/案例待复核\u003c/td\u003e\u003ctd\u003e区分接口变化、数值变化和无影响变更，重放指定样例\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e确认撤回或来源访问撤销\u003c/td\u003e\u003ctd\u003e当前目标确认/来源及受限派生内容不能继续释放\u003c/td\u003e\u003ctd\u003e先阻断，后维护队列；不能只删可见页面却保留缓存答案\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e新反例\u003c/td\u003e\u003ctd\u003e限定范围经验标争议\u003c/td\u003e\u003ctd\u003e收缩适用条件并重核依赖实例，不用多数成功覆盖反例\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e影响遍历超预算时持久化未完成清单；依赖缺边时保守标相关主题/来源族，不声称不受影响。当前访问/已知失效检查不等待后台遍历完成。变更检测未知时延如实披露。\u003c/p\u003e\u003ch3\u003e7. 查询、缓存与执行交界\u003c/h3\u003e\u003cp\u003e知识页、精确ID/符号/参数和原文全文按任务并行查找。页不存在、新资料未编译或页失效时，仍能走K1/K3；缺知识与缺当前模型事实分开返回。\u003c/p\u003e\u003cp\u003e组装工作集时固定三个范围：知识release及其修订；模型/装配配置、状态与对象revision；方法/工具语义版本及当前失效水位。既有缓存键还须包含用途/访问scope和这些版本，不能只按问题文本或模型shape hash复用工程结论。\u003c/p\u003e\u003cp\u003eQueryReceipt扩展沿共同28：wiki_revision_ids、knowledge_revision_ids、dependency_manifest、invalidation_watermark、support_root_ids、source_read_states、compiled_coverage、uncompiled_scope、method_run_refs；三维追加模型/配置/绑定refs。以上均需版本迁移，不直接发送未知字段给现有0.2入口。\u003c/p\u003e\u003cp\u003e概念解释可以使用已核投影并说明本次未回读；精确值和工程操作必须读取所需原件/结构化证据、检查适用条件并执行方法。来源正文/PDF图块可定位不等于已读；模型字节hash已核不等于实体已解析；Wiki引用MethodRun也不代表本任务已重算。\u003c/p\u003e\u003ch3\u003e8. 经验与证据独立性\u003c/h3\u003e\u003cp\u003e记录Observation → Hypothesis → Test/MethodRun → Recheck → ScopedExperience。失败、无效改法和负例同样保存；没有改后检查不登记“成功修正”，一次成功不产生普遍工程规律。\u003c/p\u003e\u003cp\u003e同一BRep的PNG、网格、尺寸摘要和由其生成的Wiki页属于同一模型血缘，不能凑成四份独立证据。相同解析器/内核生成与校验可能共享系统误差，应记录工具血缘；数值收敛、模型互赞和多角度截图都不能单独证明正确。\u003c/p\u003e\u003cp\u003e验证按任务选用解析期望量、独立源尺寸/关系、不同方法对照、实际检验等，并说明各自误差与独立范围。名义体积与孔位是不同检查量，不是多个独立工业案例。模板变体与实际样本分别统计。\u003c/p\u003e\u003ch3\u003e9. 小主题设计示例（不是新增工程知识）\u003c/h3\u003e\u003cp\u003e可候选选题：轴肩/退刀结构或孔轴配合。先核对实际可用手册/教材小段和一个有来源的任务；未取得正文不编造槽型和尺寸。\u003c/p\u003e\u003cp\u003e保留：对象/功能 → 材料/工序/配合条件 → 原页推荐和例外 → 参数选用方法 → 候选建模计划 → 内核输出 → 独立检查 → 解释/改进/复检。\u003c/p\u003e\u003cp\u003e同对象改变工序或条件后，应检索到不同适用分支或明确缺口；缺知识时仍可记录几何候选，但不得宣布工艺合理。Wiki可综合这一决策过程及未决项；没有执行证据时保持DRAFT/UNREVIEWED或假设，不伪造老师傅经验。\u003c/p\u003e\u003ch3\u003e10. 验收与对照（全部NOT_RUN）\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003eID\u003c/td\u003e\u003ctd\u003e场景\u003c/td\u003e\u003ctd\u003e必须验证\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3DWIKI-01\u003c/td\u003e\u003ctd\u003e知识主张指向手册、模型与方法\u003c/td\u003e\u003ctd\u003e逐条回查，不用页面末书目替代；模型/页定位版本一致\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3DWIKI-02\u003c/td\u003e\u003ctd\u003e同样形状、不同材料/工序\u003c/td\u003e\u003ctd\u003e正确条件分支或缺口，不按相似度套结构\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3DWIKI-03\u003c/td\u003e\u003ctd\u003e直径deg、拓扑标量、混量纲加法\u003c/td\u003e\u003ctd\u003e生产入口拒绝或明确不支持，不形成确定计划\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3DWIKI-04\u003c/td\u003e\u003ctd\u003e布尔修改使面分裂、旧绑定仍被引用\u003c/td\u003e\u003ctd\u003e绑定/相关页案例状态失效，通用概念不误撤销\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3DWIKI-05\u003c/td\u003e\u003ctd\u003e只改变显示网格质量\u003c/td\u003e\u003ctd\u003e显示依赖更新，精确设计与无关知识不被无依据重写\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3DWIKI-06\u003c/td\u003e\u003ctd\u003e同模型多视图/网格/Wiki页\u003c/td\u003e\u003ctd\u003e根来源与工具血缘去重，不能虚增独立支持\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3DWIKI-07\u003c/td\u003e\u003ctd\u003e内核/解析器版本数值变化\u003c/td\u003e\u003ctd\u003e方法回执、结果和案例待复核，不沿用旧精度结论\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3DWIKI-08\u003c/td\u003e\u003ctd\u003e来源撤销/确认撤回与旧缓存命中\u003c/td\u003e\u003ctd\u003e当前内容阻断，队列未完成可见，不泄漏受限派生内容\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3DWIKI-09\u003c/td\u003e\u003ctd\u003e无Wiki页的罕见条件\u003c/td\u003e\u003ctd\u003e原文和精确通道仍可达，未编译范围明确\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3DWIKI-10\u003c/td\u003e\u003ctd\u003e成功模型被复用到新工况并遇反例\u003c/td\u003e\u003ctd\u003e不自动套用，保留反例与经验范围修订\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3DWIKI-11\u003c/td\u003e\u003ctd\u003e生成建议含工具代码/源文命令\u003c/td\u003e\u003ctd\u003e不得自动注册或执行，保持候选内容\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3DWIKI-12\u003c/td\u003e\u003ctd\u003e编译中断/预算耗尽/人工编辑\u003c/td\u003e\u003ctd\u003e保留旧完整页与编辑提案，报告失败，原文查找仍可用\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e固定相同来源快照、任务、查询预算，对照A精确/全文及原件，B加Wiki，C再加条件/方法/当前失效检查。分别统计主张有据率、漏例外、错适用、几何/工程错误、根来源独立计数、当前撤销泄漏、延迟、构建/在线模型成本与峰值资源。保留集按来源族/生成模板隔离，Wiki不预吸收保留答案。\u003c/p\u003e\u003cp\u003e关键负例集的错单位/错版本确定执行、读字升级工程确认、同根伪独立及撤销内容释放要求0/N并报告N；这只是拟定验收目标，不能借现有16项附件测试声称已满足。其余阈值在运行前按首期风险固定，未测不填“达标”。\u003c/p\u003e\u003ch3\u003e11. 复用文件与三维增量任务\u003c/h3\u003e\u003cp\u003e共同28/F22—F26负责knowledge/wiki/experience合同、编译、检查与双路查询；三维复用同一实现目录和ID，不另建Wiki主存。以下只是拟建路径，不在本轮创建代码：\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e三维增量模块（engineering-kb根下）\u003c/td\u003e\u003ctd\u003e输入/输出与依赖\u003c/td\u003e\u003ctd\u003e验收证据\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003econtracts/extensions/engineering_semantics.schema.json\u003c/td\u003e\u003ctd\u003e谓词/对象类型/量纲/上下文及运行合同；先接共同F04/F22\u003c/td\u003e\u003ctd\u003e错谓词/量纲、未知和版本反例\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003esrc/model3d/wiki_context.py\u003c/td\u003e\u003ctd\u003e将Model/Binding/Plan/MethodRun映射到共同编译输入\u003c/td\u003e\u003ctd\u003e真实revision闭合，模拟/实际分开\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003esrc/model3d/impact.py\u003c/td\u003e\u003ctd\u003e三维变更转共同ImpactEvent与实例失效集合\u003c/td\u003e\u003ctd\u003e变形/位姿/工具/仅显示变化的差异和断点\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eevaluations/wiki/model3d/\u003c/td\u003e\u003ctd\u003e12个场景、真实主题、独立保留集与对照\u003c/td\u003e\u003ctd\u003e根来源、适用与复检、漏例外/误用及性能成本\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e先落共同合同与三维语义，再用小主题做一次增量编译、一次模型修改和一次撤销/反例，最后扩展资料和规模。Wiki任务与19的范围/共库/真实链/合同/覆盖表联合推进，不把全量Wiki编译作为几何最小验证的前置。\u003c/p\u003e\u003ch3\u003e12. 当前未决事项\u003c/h3\u003e\u003cp\u003e首期主题与实际正文、完整生产Schema/迁移、谓词注册与单位求值器、编译模型/提示及预算、编辑冲突、真实内核验证、传播时限和大容量指标仍待实施细化。本轮仅补强设计及发现合同边界；没有生成专业知识页、启动模型、增加数据库或恢复定时任务。\u003c/p\u003e"}, {"id": "cad3-e1475427c2839727", "path": "三维机械建模知识库方案/21-方案自审与补强记录_20261021.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/21-方案自审与补强记录_20261021.md", "title": "方案自审与补强记录", "group": "delivery", "sub": "record", "role": "编写/阶段交付快照", "sha256": "4f4d39db4cb37f157ab8456ca0fda3b9b7c973453fa6b46f92a10354f7542ebb", "headings": ["方案自审与补强记录", "1. 结论与成熟度", "2. 本轮发现与处置", "3. 实际探测及其边界", "4. 本轮修改落点", "5. 下一步收敛顺序", "6. 对齐依据"], "body": "# 方案自审与补强记录\n\n日期：2026-10-21；修订：KB-3D-DESIGN-002。本文是方案作者自查，不是独立专家评审。范围为三维方案及与二维共同底座的衔接；未启动真实内核、收费模型或知识编译任务。\n\n## 1. 结论与成熟度\n\n整体方向保留：二维与三维共建一个工程知识库，以来源、工程对象、条件、方法及证据组织能力。需要补强的核心不是再堆资料，而是把知识持续编译、工程语义检查、版本失效与证据独立性写到可验证的深度。\n\n本轮已补设计；仍处于“可评审、可启动合同及技术验证”，尚未达到完整首期开发施工图。既有合同附件可帮助复核部分结构和约束，不能成为生产工程判断入口。旧目标完成与历史交付记录不代表下表工程待办已经完成。\n\n## 2. 本轮发现与处置\n\nP0表示进入相应实际执行链前必须补齐；P1表示与首期同步收敛的设计和验证要求，不设行政审批。\n\n|发现|优先级|证据与影响|已补强设计|实施状态|\n|---|---|---|---|---|\n|持续知识编译与工程Wiki尚未在三维形成专项设计|P1|二维28/29已提出共同Wiki；三维原有目录导航无法代替知识编译|新增20，明确页面类型、共同对象、逐主张依据、原文双路和增量流程|START-08 TODO；未运行编译|\n|谓词、对象类型及量纲语义检查不足|P0|3个内存扰动仍被旧设计附件接受，见下节|20提出PredicateDefinition与语义准入；02/16明确附件边界|START-09 TODO；没有修改校验实现|\n|与二维新合同尚未真实接通|P0|旧共库兼容5项不覆盖runtime_v02及新增Wiki对象|沿用19的START-02/05；2 e\u003cp\u003e- \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-43ee9f64b5413341\"\u003e二维统一合同验证 ↗\u003c/a\u003e：runtime_v02已有验证范围；不是三维已接入证明。\u003c/p\u003e\u003cp\u003e- \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-3caa8c745783acab\"\u003e二维实施计划 ↗\u003c/a\u003e：复用共同实施任务，不建立平行Wiki主存。\u003c/p\u003e\u003cp\u003e二维进度以其当时实际代码和回执为准；本记录没有运行二维新验收，也没有将其119项历史结果算作三维测试。\u003c/p\u003e"}, {"id": "cad3-ff86fa4379a64f4e", "path": "三维机械建模知识库方案/README.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/README.md", "title": "三维机械建模知识库方案", "group": "navigation", "sub": "entry", "role": "导航说明", "sha256": "ae5f6dfd61370f1d64915c711d0f6928a041f09582451229b170cbede4a7464d", "headings": ["三维机械建模知识库方案", "最新自审", "先读四篇", "共用与扩展", "完整导航", "证据与能力状态", "附件入口"], "body": "# 三维机械建模知识库方案\n\n2026-10-21补强；KB-3D-DESIGN-002；可修订的工程设计方案。\n\n初版方案目标交付记录见18。2026-10-17复核：当前可开展评审、合同与技术验证；完整首期仍需工程收敛，见[19开工差距待办](19-首期开工差距与待办清单.md)。此前“首阶段可实施”不表示完整首期施工细节均已确定。\n\n**一个工程知识库，二维审查和三维建模两条应用路径，两套方案分工建设。** 本目录聚焦三维，链接[二维工程知识库方案](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/README.md)。二维开发按其现有范围推进，三维增量不作为二维开发的前置。\n\n共同目标是全面、可追溯地记忆数百GB至1TB工程资料，按问题及时定位依据，再由工程方法完成理解、判断、建模和复检。秒级定位仍是待测目标，不等于秒级完成任意三维建模。\n\n## 最新自审\n\n[21 自审与补强记录](21-方案自审与补强记录_20261021.md)：接入共同工程Wiki设计，补谓词/量纲、失效传播和证据血缘；旧附件的三类语义缺口已有实际探测证据。设计补强不等于实现缺口关闭，当前仍可评审/做技术验证，完整首期需继续收敛。\n\n## 先读四篇\n\n1. [01 总体架构](01-总体方案与共库架构.md)：共同底座、三维增量与工程判断链。\n2. [11 工程事实与设计意图](11-工程事实与设计意图.md)：图面事实扩展到几何、拓扑、参数和装配事实。\n3. [07 实施与验收](07-分阶段实施与验收设计.md)：M0—M5工作包、具体文件与反例。\n4. [18 交付自查与实施移交](18-交付自查与实施移交.md)：目标逐项证据、首阶段实施条件及未运行能力。\n\n## 共用与扩展\n\n|共用底座|三维专项|\n|---|---|\n|来源资产/版本、知识项、单位/条件、证据/确认、权限/用途、K0—K5与检索入口|表示与工程特征、设计意图/约束、拓扑绑定、参数计划、内核适配、几何及工程验证|\n\n同一知识项可同时服务二维与三维，不复制两份正文或确认记录。专项索引、几何worker和缓存可以独立部署，仍引用共同来源、版本和作用域。执行结果先成为有范围的观察/方法记录，不能自动升级为普遍工程知识。\n\n## 完整导航\n\n|文档|主要内容|\n|---|---|\n|[00](00-编制工作方案与协作边界.md)|方案先行、用户范围、分工与写入边界|\n|[01](01-总体方案与共库架构.md)|S/D知识组织、J判断链与共库架构|\n|[02](02-三维对象与共享数据契约扩展.md)|对象/表示/特征/意图、版本、单位坐标和增量合同|\n|[03](03-知识组织与资料吸收.md)|标准、教材、手册、图册、经验、模型和源码的吸收|\n|[04](04-建模规划与usd-brep执行适配.md)|知识到操作DAG、所有权、隔离执行与输出|\n|[05](05-二维三维关联与工程验证.md)|图模歧义、V1—V6、解释与改进复检|\n|[06](06-检索资源与秒级响应.md)|K0—K5三维增量、检索/执行口径与资源|\n|[07](07-分阶段实施与验收设计.md)|阶段、文件、依赖、12个建模验收场景|\n|[08](08-依据自查与待决问题.md)|初版依据和开放事项快照|\n|[09](09-首阶段接口与板孔样例设计.md)|计划、注册方法、接口、错误与板孔样例|\n|[10](10-接口校验与二维增量跟进.md)|设计校验结果与二维19/20衔接|\n|[11](11-工程事实与设计意图.md)|工程事实信封、参数依赖、约束与未知|\n|[12](12-装配事实与条件化验证.md)|定义/实例/配置、位姿、接触/间隙、自由度边界|\n|[13](13-跨版本特征绑定与修改协议.md)|分裂合并、歧义/失效、修改事务与恢复|\n|[14](14-内核适配前置与测量风险.md)|实际API映射、运行环境和已知测量/修复风险|\n|[15](15-共库接口映射与首阶段评审清单.md)|共享入口映射、真实材料选择、M1分包|\n|[16](16-工程事实扩展合同实施设计.md)|事实/绑定/意图/装配合同附件的实施设计|\n|[17](17-工程事实合同验证与实施边界.md)|实际合同结果、复现、支持范围与局限|\n|[18](18-交付自查与实施移交.md)|逐项交付审计与后续实施移交|\n|[19](19-首期开工差距与待办清单.md)|开工差距及本轮新增Wiki/语义/血缘待办|\n|[20](20-持续知识编译与三维工程Wiki设计.md)|持续知识积累、三维Wiki、量纲准入、更新与12项验收设计|\n|[21](21-方案自审与补强记录_20261021.md)|本轮发现、证据、修订与未完成事项|\n\n## 证据与能力状态\n\n三维已有两份设计Schema、两个合成输入、离线校验与测试附件。组合16个测试方法通过，覆盖计划5、共库兼容5、工程事实6；[组合回执](验证/三维附件组合结果.json)。这证明限定设计接口与部分语义可复核，不代表实际三维模型或制造正确性通过。\n\n[共库兼容检查](验证/共库兼容结果.json)只读核验了当前旧入口与真实A/合成输入，不修改二维代码。跟进二维已读到21的79项目录回执和22确认持久化设计；二维最新状态以其自身记录为准。\n\n三维内核执行、特征恢复、真实图模对照、工程判据、工艺闭环、发布恢复和TB性能仍待后续工程实施。当前证据解释器未发现几何绑定，不等于整机不存在其他环境。内核已知圆边界量测误差已纳入14，不能只凭默认volume()验收。\n\n## 附件入口\n\n- [计划Schema](契约/model-plan.schema.json)与[板孔样例](设计样例/板孔计划.json)。\n- [工程事实Schema](契约/engineering-facts.schema.json)与[模拟包](设计样例/工程事实包.json)。\n- [依赖锁定](验证/requirements-design.lock.txt)、[目标审计](验证/目标逐项审计.json)、[来源指纹与链接检查](依据与自查记录.json)。\n\n实现继续复用[engineering-kb](/Users/ddt/work/projects/ai_agent/cad/engineering-kb/README.md)共同底座；几何适配独立模块可以分开运行。后续编码先核对当时的AGENTS、共享合同与内核版本，按07的小步任务推进，不照文档机械创建另一知识库。", "reference": false, "current": true, "truncated": false, "tags": ["entry"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/README.md", "source_kind": "markdown", "preview_htm function relationItems(es,side){if(!es.length)return '<div class="subtle">暂无已登记关系</div>';return es.map(e=>{const n=nodes.get(side==='in'?e.source:e.target);return `<button class="relation-link" data-doc="${esc(n.id)}">${esc(n.title)}<small>${esc(e.kind)} · ${esc(e.evidence)}</small></button>`}).join('')}
function renderPanel(){const n=nodes.get(state.selected);if(!n)return;const incoming=D.edges.filter(e=>e.target===n.id),outgoing=D.edges.filter(e=>e.source===n.id);let content='';if(state.tab==='preview'){content=n.reference?`<div class="empty">这份属于历史资料。<br>为保持参考区与新设计分开，导航不嵌入历史资料正文；请打开原文。</div>`:`${n.truncated?'<p class="hint">正文较长，导航预览前 100,000 字符；完整内容请打开原文。</p>':''}<div class="source rendered" id="source-body"></div>`}else if(state.tab==='outline'){content='<h4>正文目录</h4>'+n.headings.map(h=>`<div class="relation-link">${esc(h)}</div>`).join('');}else{content=`<h4>被引用 / 被关联 · ${incoming.length}</h4>${relationItems(incoming,'in')}<h4>引用 / 关联出去 · ${outgoing.length}</h4>${relationItems(outgoing,'out')}<h4>结构化及其他附件 · ${n.assets.length}</h4>${n.assets.map(a=>`<a class="relation-link" target="_blank" rel="noopener" href="${esc(href(a))}">${esc(a.label)} ↗</a>`).join('')}`}
$('panel').innerHTML=`<div class="panel-top"><button class="close" id="close-panel" aria-label="关闭详情">×</button><span class="badge">${esc(n.current?'当前入口':n.role)}</span><h3>${esc(n.title)}</h3><div class="panel-meta">${esc(n.path)}<br>${esc(n.id)} · 原文指纹 ${(n.sha256||'目录入口').slice(0,12)}<br>分组依据：${esc(n.reason)}</div><div class="panel-actions"><a href="${esc(href(n))}" target="_blank" rel="noopener">${n.source_kind==='external'?'打开二维原入口 ↗':'打开完整阅读页 ↗'}</a><button id="locate">定位主树</button><button id="local-graph">看关系图</button></div><div class="tag-row">${n.tags.map(t=>`<span class="tag">${esc(D.subnames[t]||t)}</span>`).join('')}</div></div><div class="panel-content"><div class="tabs"><button data-tab="preview" class="${state.tab==='preview'?'active':''}">正文预览</button><button data-tab="outline" class="${state.tab==='outline'?'active':''}">章节</button><button data-tab="relations" class="${state.tab==='relations'?'active':''}">关联 ${incoming.length+outgoing.length}</button></div>${content}</div>`;$('panel').classList.add('open');if($('source-body'))$('source-body').innerHTML=n.preview_html;$('close-panel').onclick=()=>{$('panel').classList.remove('open');requestAnimationFrame(sizeAndDraw)};$('locate').onclick=()=>reveal(n.id);$('local-graph').onclick=()=>{$('panel').classList.remove('open');state.mode='graph';render()};$('panel').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderPanel()});requestAnimationFrame(sizeAndDraw)}
function results(){const q=$('search').value.trim().toLowerCase();state.query=q;$('search-results').hidden=!q;$('side-normal').hidden=!!q;if(!q)return;const words=q.split(/\s+/),full=$('fulltext').checked;let matches=D.nodes.filter(n=>words.every(w=>(n.title+' '+n.path+' '+n.headings.join(' ')+' '+(full?n.body:'')).toLowerCase().includes(w)));const size=35,from=state.page*size;state.page=Math.min(state.page,Math.max(0,Math.ceil(matches.length/size)-1));$('search-results').innerHTML=`<div class="sidebar-heading">找到 ${matches.length} 份资料</div>${matches.slice(state.page*size,state.page*size+size).map(n=>`<button class="search-result" data-result="${esc(n.id)}"><strong>${esc(n.title)}</strong><small>${esc(groups.get(n.group)?.label)} / ${esc(D.subnames[n.sub]||'')}</small></button>`).join('')||'<p class="hint">没有匹配的文档，试试业务名称或编号。</p>'}${matches.length>size?`<div class="pager"><button id="prev-results" ${state.page===0?'disabled':''}>上一页</button><span class="subtle">${state.page+1}/${Math.ceil(matches.length/size)}</span><button id="next-results" ${state.page>=Math.ceil(matches.length/size)-1?'disabled':''}>下一页</button></div>`:''}`;if($('prev-results'))$('prev-results').onclick=()=>{state.page--;results()};if($('next-results'))$('next-results').onclick=()=>{state.page++;results()}}
function zoom(delta){state.zoom=Math.max(.45,Math.min(1.6,state.zoom+delta));sizeAndDraw()}
function folderFocus(id){state.open.add('root');state.open.add(id);state.mode='tree';render();setTimeout(()=>document.querySelector(`#map [data-folder="${id}"]`)?.scrollIntoView({block:'center',inline:'center',behavior:'smooth'}),70)}
function route(){const h=new URLSearchParams(location.hash.slice(1));if(h.has('group')&&folders.has(h.get('group')))folderFocus(h.get('group'));else if(h.has('doc')&&nodes.has(h.get('doc'))&&state.selected!==h.get('doc')){choose(h.get('doc'));reveal(h.get('doc'))}}
$('revision').textContent=D.revision+' · '+D.model;$('n-system').textContent=D.stats.system;$('n-db').textContent=D.stats.database;$('n-rel').textContent=D.stats.relations.toLocaleString();$('side-footer').textContent=`${D.stats.documents} 个阅读入口，其中 ${D.stats.database} 个指向二维原站。\n来源截点快照；新增或修改文档后需重新生成。`;
$('groups').innerHTML=D.groups.map(g=>`<button class="group-link" data-group="${g.id}" style="--accent:${g.color}"><span class="dot"></span><span>${esc(g.label)}</span><small class="count">${counts[g.id]||0}</small></button>`).join('');
$('groups').addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(b){folderFocus(b.dataset.group);location.hash='group='+b.dataset.group}});
$('map').addEventListener('click',e=>{const f=e.target.closest('[data-folder]'),d=e.target.closest('[data-doc]');if(f){const id=f.dataset.folder;state.open.has(id)?state.open.delete(id):state.open.add(id);render()}else if(d)choose(d.dataset.doc)});
$('panel').addEventListener('click',e=>{const a=e.target.closest('[data-preview-doc]');if(a){e.preventDefault();choose(a.dataset.previewDoc);return}const b=e.target.closest('[data-doc]');if(b)choose(b.dataset.doc)});$('search-results').addEventListener('click',e=>{const b=e.target.closest('[data-result]');if(b){choose(b.dataset.result);reveal(b.dataset.result);$('layout').classList.remove('show-side')}});
$('search').oninput=()=>{clearTimeout(searchingTimer);state.page=0;searchingTimer=setTimeout(results,120)};$('fulltext').onchange=()=>{state.page=0;results()};$('tree-mode').onclick=()=>{state.mode='tree';render()};$('graph-mode').onclick=()=>{state.mode='graph';render()};$('level').onclick=()=>{if(!state.open.has('root'))state.open.add('root');else{const closed=[...folders.values()].filter(f=>f.children&&state.open.has(parents.get(f.id))&&!state.open.has(f.id));closed.forEach(f=>state.open.add(f.id))}state.mode='tree';render()};$('collapse').onclick=()=>{state.open=new Set(['root']);state.mode='tree';render()};$('expand').onclick=()=>{state.open=new Set(folders.keys());state.mode='tree';render();toast('已展开全部，可用搜索定位或“收拢全部”返回总览')};$('zoom-in').onclick=()=>zoom(.1);$('zoom-out').onclick=()=>zoom(-.1);$('reset').onclick=()=>{state.zoom=1;sizeAndDraw();$('viewport').scrollTo({left:0,top:0,behavior:'smooth'})};$('menu').onclick=()=>$('layout').classList.toggle('show-side');$('theme').onclick=()=>{document.body.classList.toggle('dark');try{localStorage.setItem('cad3-doc-theme',document.body.classList.contains('dark')?'dark':'light')}catch{}requestAnimationFrame(drawEdges)};
$('start').onclick=()=>{const n=D.nodes.find(n=>n.path.endsWith('01-总体方案与共库架构.md'));if(n){choose(n.id);reveal(n.id)}};$('status').onclick=()=>{const n=D.nodes.find(n=>n.path.endsWith('19-首期开工差距与待办清单.md'));if(n){choose(n.id);reveal(n.id)}};function toast(s){$('toast').textContent=s;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,3200)}
try{if(localStorage.getItem('cad3-doc-theme')==='dark')document.body.classList.add('dark')}catch{}window.addEventListener('hashchange',route);window.addEventListener('resize',()=>requestAnimationFrame(sizeAndDraw));new ResizeObserver(()=>requestAnimationFrame(sizeAndDraw)).observe($('viewport'));document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('panel').classList.remove('open');$('layout').classList.remove('show-side');requestAnimationFrame(sizeAndDraw)}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();$('search').focus()}});render();route();
</script></body></html>
