、完整MethodRun/Relation共享服务。原README/17可能尚未追上该回执，故保留各自时间与证据，不改对方文档。\n\n## 3. 设计自查结果与取舍\n\n- 共库：共享来源、版本、知识项和确认，专项几何索引/执行可以分离，避免双库内容漂移。\n- 聚焦：仅新增本目录文件；不把三维依赖变成二维开发阻塞项。\n- 工程事实：保留图面读取，增加几何、拓扑、参数和装配事实及证据关系。\n- 四块补齐：对象/特征、意图/过程、知识到操作映射、分层验证各有专篇与实施项。\n- 正确性：数值、单位、对象附着、适用条件、工具执行和工程结论分离；未知/冲突不自动变PASS。\n- 内核边界：几何能力与工程知识分工；显示网格和精确模型分别保存，避免把资产流程外推成工程格式约定。\n- 实施诚实：三维扩展和12场景均为设计，未运行；54项为二维已有回执，不能记成三维测试。\n- 性能：检索秒级待测；建模/仿真不统一承诺秒级；1TB与100MB沿用共同边界。\n\n## 4. 仍需深化或验证的事项\n\n|编号|事项|下一步与证据|\n|---|---|---|\n|3D-A01|三维扩展对象仍是字段草案|形成最小扩展包、接口和合法/非法样例，检查旧合同兼容|\n|3D-A02|共同MethodRun/Relation等仍演进|跟进二维实际Schema，避免平行设计冲突|\n|3D-A03|内核本机可用状态未核|实施前依适用Skill做限定环境核对与最小算例|\n|3D-A04|拓扑稳定绑定方案未实测|对称、分裂/合并、修改回退和歧义测试|\n|3D-A05|真实图模配对与工程依据未选定|先声明样本来源、单位、版本及可判断范围|\n|3D-A06|工艺知识的实际条件方法未提炼|按共同采购/正文状态选一个有依据的小主题|\n|3D-A07|资源/延迟/恢复未测|分层小批次，记录实际机器与执行/检索口径|\n|3D-A08|三维确认和发布语义尚未实现|不复用READING冒充工程确认；新增范围先做契约|\n\n这些是技术工作项，不是额外审批门槛。能独立推进的小范围设计/验证继续推进，不能因远期条目未齐而停掉整个目标。\n\n## 5. 当前交付层级\n\n可用于方向与架构讨论；作为三维独立编制、共库接入的首版方案。M1字段级契约、M2内核真实运行及跨源工程闭环尚待后续证据，本轮不宣布完整可部署或工程建模能力完成。持续目标保持进行中。", "reference": false, "current": false, "truncated": false, "tags": ["record"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/08-%E4%BE%9D%E6%8D%AE%E8%87%AA%E6%9F%A5%E4%B8%8E%E5%BE%85%E5%86%B3%E9%97%AE%E9%A2%98.md", "source_kind": "markdown", "preview_html": "\u003cp\u003e\u0026gt; 阶段快照：本文记录编写当时状态；最终方案交付自查及工程未实施项见\u003ca href=\"#doc=cad3-2cbe394557f4bc58\" data-preview-doc=\"cad3-2cbe394557f4bc58\"\u003e18\u003c/a\u003e。\u003c/p\u003e\u003ch2\u003e依据自查与待决问题\u003c/h2\u003e\u003cp\u003e2026-10-16；KB-3D-DESIGN-001。本文件区分已读来源、设计判断和未运行事项。\u003c/p\u003e\u003ch3\u003e1. 依据与继承\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e来源\u003c/td\u003e\u003ctd\u003e本轮用途\u003c/td\u003e\u003ctd\u003e不据此声称\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-6cda5 2-三维对象与共享数据契约扩展.md)、[04内核适配](04-建模规划与usd-brep执行适配.md)一致。\n\n## 1. 首阶段最小包\n\n先限定新建板孔模型，减少同时引入类型。采用独立三维计划扩展包设计，引用共同资产/知识对象；不把未知新字段塞入现有拒绝额外字段的七对象Schema。此处设计版本model3d-plan/0.1；本目录已编制限定设计JSON Schema；它不等于共同生产合同，接入时仍需核对版本与真实来源/执行扩展。\n\n包顶层字段：schema_version、sample_class、scope、source_bindings、units、frame、parameters、requirements、steps、validations、expected_failures、limitations。首版不支持自由代码、表达式eval、任意文件路径、自动装配求解或无限递归计划。\n\n每个参数有值、单位和来源角色。演示样例sample_class=SYNTHETIC_DESIGN，来源为sample_parameter，不能补造真实来源哈希或人工确认。真实运行改为共同资产版本/Unit引用并核对授权、内容哈希与读取状态。共享scope从受信任务上下文注入，样例里的scope只是设计占位，不是鉴权凭据。\n\n## 2. 拟议接口与返回\n\n|接口草案|输入|输出/异常|\n|---|---|---|\n|validate_plan(plan, context)|计划、受信范围、支持版本/操作集合|normalized_plan或结构化错误列表，不构造几何|\n|resolve_bindings(plan, snapshot)|已校验计划、共同知识/参数快照|resolved_inputs、missing、conflicts及证据；缺输入不伪造值|\n|execute_plan(plan, resolved_inputs, budget)|封闭输入与方法注册、资源预算|RunReceipt；独立进程执行，失败留临时结果|\n|validate_result(run, requirements)|实际运行与目标要求|逐项ValidationRecord，未运行明确NOT_RUN|\n|publish_result(run, validations, policy)|当前有效输入、结果、交付要求|新的模型版本与范围化结果；不覆盖原版本|\n\nRunReceipt至少包含run_id、plan_hash、snapshot_refs、adapter/kernel版本、input_hashes、output_refs、step_results、budget_usage、started/finished_at和limitations。未运行时不得填伪run_id/输出哈希；本设计JSON没有这些字段。\n\n错误code建议为UNSUPPORTED_SCHEMA、SCOPE_MISMATCH、MISSING_INPUT、UNIT_UNKNOWN、DIMENSION_MISMATCH、INVALID_FRAME、PARAMETER_RANGE_REJECTED、INPUT_SNAPSHOT_REVALIDATION_REQUIRED、CYCLIC_PLAN、UNKNOWN_OPERATION、STALE_BINDING、AMBIGUOUS_BINDING、SOURCE_OFFLINE、KERNEL_FAILURE、TIMEOUT、RESOURCE_LIMIT。每项有path、reason、recoverable和related_refs；原始内核诊断保留在受控日志，不覆盖统一错误类型。\n\n## 3. 步骤与方法注册合同\n\nstep_id在计划内唯一；depends_on必须存在且组成DAG。parameters中的parameter_ref必须存在；input_steps只能引用前驱的具名输出。executor按拓扑顺序运行，拒绝缺依赖与循环，不能借排序静默修正含义。\n\n每个registered_operation由受信代码映射到确定工具，名称不是可导入Python函数路径。板孔设计采用create_plate、create_through_hole_tool、subtract、measure等语义操作，适配器再映射实际usd-brep API。这样计划不依赖某一内核函数签名；实现前仍须对照绑定真实参数和所有权。\n\n刀具的轴向延伸余量独立作为执行设置，要求满足穿透与误差预算；不能改孔设计深度来掩盖问题。布尔差集保留主/刀具体方向，输入副本由工作进程持有，失败后不复用已消耗句柄。\n\n## 4. 板孔参数与检查\n\n[板孔计划.json](设计样例/板孔计划.json)是合成设计样例：100×60×10mm板，中点直径10mm孔，右手坐标、Z方向贯穿。孔轴线在板内范围0≤z≤T，切削工具超出两端；板原点为最小角，不用默认“中心建板”约定。\n\n先检查L/W/T/d\u003e0、孔中心与半径使孔完整位于板内、单位和frame有效、操作依赖闭合。该样例的严格内含条件不代表所有机械板孔都必须内含；开口槽/半孔是别的任务类型。\n\n结果独立检查：目标封闭实体、正体积、板边界、孔径/孔中心/贯穿关系、体积与解析方法在声明误差内一致。绑定到要求ID，不能只验证输出文件存在。几何检查工具不可用时返回NOT_RUN或ERROR，并阻止宣称对应要求已满足。\n\n解析方法不是自由文本执行：registry_id=plate_single_through_hole_volume，输入具名量值。实施时注册可执行函数并验证单位、π计算与容差；设计JSON中没有计算出的“实测值”。\n\n## 5. 反例与兼容\n\n样例列出6个派生反例的变更与预期层次：缺厚度、缺单位、孔径越界、错孔位但体积相同、计划循环、改变输入版本。每个反例是待运行定义，不是已失败/通过的回执。错孔位反例修改模型执行结果而保留原要求，防止把“改需求后符合需求”误当检错成功。\n\n旧七对象消费者遇扩展包应在入口明确拒绝版本，不把它作为旧bundle解析；共同资产引用仍使用已支持合同。未来兼容检查包括现有二维样例回归、跨scope引用、未知操作、source_refs未读、确认范围错误和撤回后旧快照访问等。\n\n## 6. 本轮静态验证的范围\n\n初次编写时只用临时检查程序验证样例可解析、正参数与内含算术、依赖闭合无环、验证项与要求引用闭合，以及明确SYNTHETIC_DESIGN/NOT_RUN。当时没有编写Schema或运行建模；后续已新增限定设计Schema与只读validate_plan校验接口，5个测试方法通过，见10和机器回执。resolve_bindings、execute_plan、validate_result及publish_result仍是拟议接口，未导入内核或运行建模验证。静态样例检查通过不关闭3D-A01或3D-A03；这些条目仍需可执行合同和真实内核证据。", "reference": false, "current": false, "truncated": false, "tags": ["design"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/09-%E9%A6%96%E9%98%B6%E6%AE%B5%E6%8E%A5%E5%8F%A3%E4%B8%8E%E6%9D%BF%E5%AD%94%E6%A0%B7%E4%BE%8B%E8%AE%BE%E8%AE%A1.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e首阶段接口与板孔样例设计\u003c/h2\u003e\u003cp\u003e2026-10-16；M1实施底稿，执行接口未实现；限定设计Schema与validate_plan附件已实现并校验，当前进展见\u003ca href=\"#doc=cad3-4fcba31dfb65f88e\" data-preview-doc=\"cad3-4fcba31dfb65f88e\"\u003e10\u003c/a\u003e。基于\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-29c6a198af2edf05\"\u003e二维16 ↗\u003c/a\u003e的单位、版本、条件和引用语义；与\u003ca href=\"#doc=cad3-cdbdb6499bad06c7\" data-preview-doc=\"cad3-cdbdb6499bad06c7\"\u003e02增量对象\u003c/a\u003e、\u003ca href=\"#doc=cad3-91e81d5b6d72ab7c\" data-preview-doc=\"cad3-91e81d5b6d72ab7c\"\u003e04内核适配\u003c/a\u003e一致。\u003c/p\u003e\u003ch3\u003e1. 首阶段最小包\u003c/h3\u003e\u003cp\u003e先限定新建板孔模型，减少同时引入类型。采用独立三维计划扩展包设计，引用共同资产/知识对象；不把未知新字段塞入现有拒绝额外字段的七对象Schema。此处设计版本model3d-plan/0.1；本目录已编制限定设计JSON Schema；它不等于共同生产合同，接入时仍需核对版本与真实来源/执行扩展。\u003c/p\u003e\u003cp\u003e包顶层字段：schema_version、sample_class、scope、source_bindings、units、frame、parameters、requirements、steps、validations、expected_failures、limitations。首版不支持自由代码、表达式eval、任意文件路径、自动装配求解或无限递归计划。\u003c/p\u003e\u003cp\u003e每个参数有值、单位和来源角色。演示样例sample_class=SYNTHETIC_DESIGN，来源为sample_parameter，不能补造真实来源哈希或人工确认。真实运行改为共同资产版本/Unit引用并核对授权、内容哈希与读取状态。共享scope从受信任务上下文注入，样例里的scope只是设计占位，不是鉴权凭据。\u003c/p\u003e\u003ch3\u003e2. 拟议接口与返回\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e接口草案\u003c/td\u003e\u003ctd\u003e输入\u003c/td\u003e\u003ctd\u003e输出/异常\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003evalidate_plan(plan, context)\u003c/td\u003e\u003ctd\u003e计划、受信范围、支持版本/操作集合\u003c/td\u003e\u003ctd\u003enormalized_plan或结构化错误列表，不构造几何\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eresolve_bindings(plan, snapshot)\u003c/td\u003e\u003ctd\u003e已校验计划、共同知识/参数快照\u003c/td\u003e\u003ctd\u003eresolved_inputs、missing、conflicts及证据；缺输入不伪造值\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eexecute_plan(plan, resolved_inputs, budget)\u003c/td\u003e\u003ctd\u003e封闭输入与方法注册、资源预算\u003c/td\u003e\u003ctd\u003eRunReceipt；独立进程执行，失败留临时结果\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003evalidate_result(run, requirements)\u003c/td\u003e\u003ctd\u003e实际运行与目标要求\u003c/td\u003e\u003ctd\u003e逐项ValidationRecord，未运行明确NOT_RUN\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003epublish_result(run, validations, policy)\u003c/td\u003e\u003ctd\u003e当前有效输入、结果、交付要求\u003c/td\u003e\u003ctd\u003e新的模型版本与范围化结果；不覆盖原版本\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003eRunReceipt至少包含run_id、plan_hash、snapshot_refs、adapter/kernel版本、input_hashes、output_refs、step_results、budget_usage、started/finished_at和limitations。未运行时不得填伪run_id/输出哈希；本设计JSON没有这些字段。\u003c/p\u0 行建模；后续已新增限定设计Schema与只读validate_plan校验接口，5个测试方法通过，见10和机器回执。resolve_bindings、execute_plan、validate_result及publish_result仍是拟议接口，未导入内核或运行建模验证。静态样例检查通过不关闭3D-A01或3D-A03；这些条目仍需可执行合同和真实内核证据。\u003c/p\u003e"}, {"id": "cad3-4fcba31dfb65f88e", "path": "三维机械建模知识库方案/10-接口校验与二维增量跟进.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/10-接口校验与二维增量跟进.md", "title": "接口校验与二维增量跟进", "group": "contracts", "sub": "receipt", "role": "范围化核验与接口记录", "sha256": "b8d3afa87f6c33f5f4a3005a9a45b0a08cc3cd8b8703ecc4fa87f9e0a71becd0", "headings": ["接口校验与二维增量跟进", "1. 实际新增及用途", "2. 复现", "3. 检查覆盖与局限", "4. 二维增量与三维接入调整", "5. 下一步与完成判断"], "body": "# 接口校验与二维增量跟进\n\n2026-10-16；首阶段接口设计的限定验证。本轮继续目标，不宣布三维建模能力已完成。\n\n## 1. 实际新增及用途\n\n- [model-plan.schema.json](契约/model-plan.schema.json)：Draft 2020-12结构合同，首版限定合成板孔设计、毫米、右手局部坐标与三种受限操作。\n- [validate_plan.py](验证/validate_plan.py)：离线结构和语义校验，检查参数、引用、DAG、主/刀具体方向、要求与验证方法对应。\n- [test_plan.py](验证/test_plan.py)：五个测试方法，含一个合法设计与26个负向扰动场景。子场景不计为26个独立测试方法，也不计真实工程样本。\n- [接口校验结果](验证/接口校验结果.json)：实际解释器、运行、输入/代码指纹、结果及局限。\n\n独立设计附件只写本目录，不接管现有engineering-kb，不创建第二知识库，不引入内核新绑定，不更改系统环境或既有二维Schema。使用二维已存在的隔离环境中的jsonschema，只读调用依赖；无需为本附件再次安装环境。\n\n## 2. 复现\n\n在本目录执行以下命令。当前依赖环境是本机既有环境引用，若将附件迁到别的机器需另建独立环境并记录实际依赖，不将该绝对路径当通用部署方案。\n\n```sh\n/Users/ddt/work/projects/ai_agent/cad/engineering-kb/.venv-evidence/bin/python -m unittest discover -s 验证 -v\n```\n\n首次运行五个方法全部通过；随后去除一段无实际校验作用的冗余断言，重新运行并记录最终回执。校验器不写输入样例；测试核对合法输入前后字节相同。未运行任何几何或云端模型服务。\n\n## 3. 检查覆盖与局限\n\nSchema拒绝缺参数、未知字段/版本、NaN/指数、空单位/厘米、镜像frame、跨示例scope、伪真实来源、伪PASS。语义拒绝非正参数、越界孔/相切边界、断依赖/循环/重复ID、非注册操作、主刀具颠倒、参数绑定错误、缺执行设置、缺独立验证或要求错绑。\n\n成功返回DESIGN_COHERENT，executable=false、engineering_approved=false，并列出未决执行设置、内核容差、测量误差、真实来源和实际几何/工程验证。没有把显式“待指定”转换为可执行。\n\n支持范围刻意限于这一个设计任务。它不是三维通用Schema，不接受真实资产/装配计划，不具备生产鉴权、并发持久化、规范判据、几何验证或资源沙箱。首版拒绝cm表示本样例单位合同只接受mm，不是共同知识库不支持cm；未来真实输入先由共同单位转换层显式处理并保留原值。\n\n该附件推进3D-A01的局部设计验证，不能关闭三维工程对象/绑定/运行的全部合同问题；3D-A03的内核运行、A04绑定、A05真实图模、A06工艺知识均仍开放。\n\n## 4. 二维增量与三维接入调整\n\n本轮新读[19真实B验证与修订](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/19-真实工程样例B验证与方案修订.md)与[20目录检索和代际设计](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/20-目录检索原型与代际实施设计.md)。20当前是实施设计，不能据文件存在宣称目录服务已通过测试。\n\n|二维新增信息|三维具体承接|\n|---|---|\n|绑定位置复核发现数值相同但角色不同|EntityBinding必须保留角色证据，不能只对数值或bbox|\n|解析器版本改变CTM线宽含义|OperationRun同时固定内核、适配和解析版本，不只固定输入模型|\n|单SQLite代际事务、当前撤销独立于旧快照|三维只引用共同快照/资产身份；后续不得自建绕过撤销的模型知识目录|\n|material_roles与read_roles分列|模型文件哈希校验及位置可达只是材料可用；几何内容已解析、特征已确认、工程已判定分开|\n|原型每文件/总预算16MB|大三维模型不得直接塞进小文件读取接口；需受控几何worker读取、返回有界证据及方法回执|\n|MethodRun暂为JSON单元，完整Schema未统一|三维OperationRun仍为扩展提案，等待共同方法合同，不冒充已兼容|\n\n16MB是该原型设计预算，不是共同知识库或三维模型的永久大小限制。大模型超限时不能改小读数预算骗过检查，应走受控异步工具路径；原始模型仍在共用资产目录登记。\n\n## 5. 下一步与完成判断\n\n继续细化设计意图/参数依赖、装配事实及跨版本绑定的接口样例；对照二维实际新增Schema/回执更新映射。实施M2前核对本机内核运行条件与适用仓库Skill。首阶段要达到可实施，还需要实际方法的输入输出与误差/失败协议，而不是把当前合成计划包装成完整工程闭环。", "reference": false, "current": false, "truncated": false, "tags": ["receipt"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/10-%E6%8E%A5%E5%8F%A3%E6%A0%A1%E9%AA%8C%E4%B8%8E%E4%BA%8C%E7%BB%B4%E5%A2%9E%E9%87%8F%E8%B7%9F%E8%BF%9B.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e接口校验与二维增量跟进\u003c/h2\u003e\u003cp\u003e2026-10-16；首阶段接口设计的限定验证。本轮继续目标，不宣布三维建模能力已完成。\u003c/p\u003e\u003ch3\u003e1. 实际新增及用途\u003c/h3\u003e\u003cp\u003e- \u003ca href=\"#doc=cad3-8aa067ceff9079bb\" data-preview-doc=\"cad3-8aa067ceff9079bb\"\u003emodel-plan.schema.json\u003c/a\u003e：Draft 2020-12结构合同，首版限定合成板孔设计、毫米、右手局部坐标与三种受限操作。\u003c/p\u003e\u003cp\u003e- validate_plan.py（见原文附件）：离线结构和语义校验，检查参数、引用、DAG、主/刀具体方向、要求与验证方法对应。\u003c/p\u003e\u003cp\u003e- test_plan.py（见原文附件）：五个测试方法，含一个合法设计与26个负向扰动场景。子场景不计为26个独立测试方法，也不计真实工程样本。\u003c/p\u003e\u003cp\u003e- \u003ca href=\"#doc=cad3-b16b0eb98ae1cdc6\" data-preview-doc=\"cad3-b16b0eb98ae1cdc6\"\u003e接口校验结果\u003c/a\u003e：实际解释器、运行、输入/代码指纹、结果及局限。\u003c/p\u003e\u003cp\u003e独立设计附件只写本目录，不接管现有engineering-kb，不创建第二知识库，不引入内核新绑定，不更改系统环境或既有二维Schema。使用二维已存在的隔离环境中的jsonschema，只读调用依赖；无需为本附件再次安装环境。\u003c/p\u003e\u003ch3\u003e2. 复现\u003c/h3\u003e\u003cp\u003e在本目录执行以下命令。当前依赖环境是本机既有环境引用，若将附件迁到别的机器需另建独立环境并记录实际依赖，不将该绝对路径当通用部署方案。\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e/Users/ddt/work/projects/ai_agent/cad/engineering-kb/.venv-evidence/bin/python -m unittest discover -s 验证 -v\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e首次运行五个方法全部通过；随后去除一段无实际校验作用的冗余断言，重新运行并记录最终回执。校验器不写输入样例；测试核对合法输入前后字节相同。未运行任何几何或云端模型服务。\u003c/p\u003e\u003ch3\u003e3. 检查覆盖与局限\u003c/h3\u003e\u003cp\u003eSchema拒绝缺参数、未知字段/版本、NaN/指数、空单位/厘米、镜像frame、跨示例scope、伪真实来源、伪PASS。语义拒绝非正参数、越界孔/相切边界、断依赖/循环/重复ID、非注册操作、主刀具颠倒、参数绑定错误、缺执行设置、缺独立验证或要求错绑。\u003c/p\u003e\u003cp\u003e成功返回DESIGN_COHERENT，executable=false、engineering_approved=false，并列出未决执行设置、内核容差、测量误差、真实来源和实际几何/工程验证。没有把显式“待指定”转换为可执行。\u003c/p\u003e\u003cp\u003e支持范围刻意限于这一个设计任务。它不是三维通用Schema，不接受真实资产/装配计划，不具备生产鉴权、并发持久化、规范判据、几何验证或资源沙箱。首版拒绝cm表示本样例单位合同只接受mm，不是共同知识库不支持cm；未来真实输入先由共同单位转换层显式处理并保留原值。\u003c/p\u003e\u003cp\u003e该附件推进3D-A01的局部设计验证，不能关闭三维工程对象/绑定/运行的全部合同问题；3D-A03的内核运行、A04绑定、A05真实图模、A06工艺知识均仍开放。\u003c/p\u003e\u003ch3\u003e4. 二维增量与三维接入调整\u003c/h3\u003e\u003cp\u003e本轮新读\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-552f11dffb0771de\"\u003e19真实B验证与修订 ↗\u003c/a\u003e与\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-e4dcc8b7921bb85d\"\u003e20目录检索和代际设计 ↗\u003c/a\u003e。20当前是实施设计，不能据文件存在宣称目录服务已通过测试。\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e二维新增信息\u003c/td\u003e\u003ctd\u003e三维具体承接\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e绑定位置复核发现数值相同但角色不同\u003c/td\u003e\u003ctd\u003eEntityBinding必须保留角色证据，不能只对数值或bbox\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e解析器版本改变CTM线宽含义\u003c/td\u003e\u003ctd\u003eOperationRun同时固定内核、适配和解析版本，不只固定输入模型\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e单SQLite代际事务、当前撤销独立于旧快照\u003c/td\u003e\u003ctd\u003e三维只引用共同快照/资产身份；后续不得自建绕过撤销的模型知识目录\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ematerial_roles与read_roles分列\u003c/td\u003e\u003ctd\u003e模型文件哈希校验及位置可达只是材料可用；几何内容已解析、特征已确认、工程已判定分开\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e原型每文件/总预算16MB\u003c/td\u003e\u003ctd\u003e大三维模型不得直接塞进小文件读取接口；需受控几何worker读取、返回有界证据及方法回执\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMethodRun暂为JSON单元，完整Schema未统一\u003c/td\u003e\u003ctd\u003e三维OperationRun仍为扩展提案，等待共同方法合同，不冒充已兼容\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e16MB是该原型设计预算，不是共同知识库或三维模型的永久大小限制。大模型超限时不能改小读数预算骗过检查，应走受控异步工具路径；原始模型仍在共用资产目录登记。\u003c/p\u003e\u003ch3\u003e5. 下一步与完成判断\u003c/h3\u003e\u003cp\u003e继续细化设计意图/参数依赖、装配事实及跨版本绑定的接口样例；对照二维实际新增Schema/回执更新映射。实施M2前核对本机内核运行条件与适用仓库Skill。首阶段要达到可实施，还需要实际方法的输入输出与误差/失败协议，而不是把当前合成计划包装成完整工程闭环。\u003c/p\u003e"}, {"id": "cad3-96990c2a7a9d57ba", "path": "三维机械建模知识库方案/11-工程事实与设计意图.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/11-工程事实与设计意图.md", "title": "工程事实与设计意图", "group": "facts", "sub": "design", "role": "工程事实/意图设计", "sha256": "6d9497fbbe9bd8378f606c77582aa453f7899cec8ac1b844968dc3d6a495a462", "headings": ["工程事实与设计意图", "1. 工程事实不是一份新的“大真值表”", "2. 建议共同事实信封", "3. 模态新增与共同职责", "4. 设计意图的最小内容", "参数依赖与求值", "5. 约束及冲突语义", "6. 首轮可复核的设计样例", "7. 知识到意图再到操作", "8. 实施衔接与检查"], "body": "# 工程事实与设计意图\n\n2026-10-16；扩展设计。引用共同[知识组织](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/10-知识域与认知职责组织.md)、[最小契约](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/16-首轮实施与最小契约设计.md)和本方案[02](02-三维对象与共享数据契约扩展.md)。本篇提出共同概念的增量，不改现有七对象字段。\n\n## 1. 工程事实不是一份新的“大真值表”\n\n将“图面事实”扩展为“工程事实”，不是把所有来源合并为模型认定的唯一答案。事实应表达某来源、某对象版本、某上下文下的观察或陈述。图面文字、BRep测量、设计输入、手册条件和模型解释可以互相支持，也可以冲突。\n\n例如：图上读到φ10、JSON标注Diameter=20、三维圆柱面拟合半径5mm，是三条不同证据。先核对同对象、单位、版次和量的定义，再判断差异；不能直接选多数或把半径与直径同值比较。\n\n## 2. 建议共同事实信封\n\n未来通过共同Observation/Relation及方法记录组装，避免新增重复主存。建议语义字段：\n\n|字段角色|意义|必要约束|\n|---|---|---|\n|subject_ref/revision|被陈述的工程对象及版本|不能只写“这个孔”；表示内实体与持久对象身份分开|\n|predicate|如diameter、adjacent_to、instance_of、specified_material|注册语义，说明量纲、方向、基数和适用对象|\n|value/object_ref|量值、类别、关系目标或结构化内容|原文与解释分开；缺值显式UNKNOWN|\n|context_ref|工况、装配状态、视图/坐标、配置与用途|条件化事实不能脱离上下文复用|\n|representation_ref/locator|具体原图/模型/参数中的位置|绑定内容版本，指向共同资产|\n|assertion_kind|SOURCE_STATEMENT、MEASUREMENT、INFERENCE、DESIGN_REQUIREMENT等|来源陈述与工具测量不可互换|\n|provenance/method_run|谁/什么工具在什么输入上得到结果|方法/解析版本、单位、误差和实际执行状态|\n|state/conflict_refs|观察有效性、候选、未知、冲突及撤销|置信分数不能消解有意义的冲突|\n\n这是语义设计，不是现有Schema已接受的字段。实际可按观察、关系、上下文和方法运行分别存，用共同引用装配。\n\n## 3. 模态新增与共同职责\n\n图面事实：文字、符号、线/区域、尺寸附着及视图关系。\n\n三维几何事实：曲线/曲面类型、点/轴/法向、长度/面积/体积、距离、曲率和局部边界；测量方法与误差必须保留。\n\n拓扑事实：面边顶点邻接、边界环、壳体包含；它描述连接，不能独自证明功能或工艺。周期缝边、退化边等特殊拓扑应按方法合同理解，不机械当缺陷。\n\n参数事实：来源给定的名义值、上下限、推导值、设计变更值；与从几何测得值分开。几何名义值满足不代表实际制造件满足公差。\n\n装配事实：零件定义与实例、位姿、接触/配合、约束、自由度及工况；见12。\n\n同一predicate可有多种证据通道。查询返回“测得/规定/推测”及各自范围，不默认全部为确定事实。\n\n## 4. 设计意图的最小内容\n\nDesignIntent保存：任务目标、功能要求、接口要求、可变参数、冻结参数、约束、允许修改区域、依据、工况、交付表示和未知项。功能要求不从几何自动臆造；原件没有就保留UNKNOWN。\n\n参数建议分：输入参数INPUT、推导参数DERIVED、常量CONSTANT、待定参数UNKNOWN。每个值声明单位、定义域、来源/表达式和版本；不能给UNKNOWN自动填“行业常见值”。名义尺寸、工程极限和计算容差分开。\n\n### 参数依赖与求值\n\n首轮仅支持受限、注册的add/subtract/multiply/divide及具名方法；不执行资料文本中的Python/SQL。先做类型/量纲和DAG检查，再按依赖顺序求值。除零/溢出/定义域错误返回INVALID_EXPRESSION；缺输入返回UNKNOWN，不能当0。乘除的单位推导需要共同单位系统扩展，不复用只支持长度比较的旧求值器冒充已实现。\n\n允许多个参数组形成配置；配置身份及其来源固定。禁止将实例位姿参数直接修改零件定义，导致其他装配实例一起变形。\n\n## 5. 约束及冲突语义\n\n约束有id、subject/target、relation/method、parameters、required_or_preferred、applicability、tolerance、provenance、status。required与preferred是该任务设计要求和偏好，不是新的行政审批门槛。\n\n关系可包括尺寸、同轴、平行/垂直、位置、最小间隙、包含/穿透、功能计算。首阶段只实现已注册的少量方法，不先写通用约束求解器。\n\n必须区分：\n\n- 已给定模型上测量约束是否满足。\n- 按给定自由参数生成候选模型。\n- 求解所有满足约束的模型。\n\n第一项成功不能宣称第三项已完成。欠约束/过约束、约束互相冲突、工具不可用、条件不适用分别返回，不笼统当内核失败。\n\n冲突报告列参与的约束及可复查输入；未证明是最小冲突集时不得称“最小冲突集合”。首轮可返回保守相关集合。改偏好不等于解除必须满足的设计约束。\n\n## 6. 首轮可复核的设计样例\n\n|情境|正确行为|反例陷阱|\n|---|---|---|\n|板长100、孔中心要求50，模型测得45|位置约束FAIL，体积仍可能通过|只比体积后整件PASS|\n|轴径是未知，间隙需孔轴差|求值UNKNOWN及缺参，几何可暂用独立演示假设|把未知轴径当0求“合格间隙”|\n|要求厚度10且另一同范围要求12|报告来源与版本冲突|按最近文本静默选择|\n|只改变倒角显示质量|改变离散化参数，不更改精确设计几何|将粗糙网格当实体尺寸变更|\n|参数来源换版|新设计快照、依赖失效与复检|沿用旧模型的工程结论|\n\n这些是设计验证场景，未作为真实内核算例执行。\n\n## 7. 知识到意图再到操作\n\n检索结果必须说明作用角色：定义对象、选择结构、确定参数、解释原理、执行构造或验证。能力单元拿到所需输入与条件后才能生成具体计划。能检索到“退刀槽”的图不等于知道这个任务需要哪一种槽。\n\n参数选择记录选项、适用依据、排除的近似例、未满足前提、预计影响和验证方法。模型建议先成为候选DesignIntent/ModelPlan，不能直接覆盖共同知识项或用户原设计。\n\n## 8. 实施衔接与检查\n\nM1下一步扩展事实/意图Schema及单位/表达式类型；测试读数与要求分离、半径直径、量纲、欠/过约束、版本和未知传播。M2只执行闭合且参数充分的计划；“意图信息齐全”并不保证几何一定成功，失败走04协议。", "reference": false, "current": false, "truncated": false, "tags": ["design"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/11-%E5%B7%A5%E7%A8%8B%E4%BA%8B%E5%AE%9E%E4%B8%8E%E8%AE%BE%E8%AE%A1%E6%84%8F%E5%9B%BE.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e工程事实与设计意图\u003c/h2\u003e\u003cp\u003e2026-10-16；扩展设计。引用共同\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-f462ea074baa33ea\"\u003e知识组织 ↗\u003c/a\u003e、\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-29c6a198af2edf05\"\u003e最小契约 ↗\u003c/a\u003e和本方案\u003ca href=\"#doc=cad3-cdbdb6499bad06c7\" data-preview-doc=\"cad3-cdbdb6499bad06c7\"\u003e02\u003c/a\u003e。本篇提出共同概念的增量，不改现有七对象字段。\u003c/p\u003e\u003ch3\u003e1. 工程事实不是一份新的“大真值表”\u003c/h3\u003e\u003cp\u003e将“图面事实”扩展为“工程事实”，不是把所有来源合并为模型认定的唯一答案。事实应表达某来源、某对象版本、某上下文下的观察或陈述。图面文字、BRep测量、设计输入、手册条件和模型解释可以互相支持，也可以冲突。\u003c/p\u003e\u003cp\u003e例如：图上读到φ10、JSON标注Diameter=20、三维圆柱面拟合半径5mm，是三条不同证据。先核对同对象、单位、版次和量的定义，再判断差异；不能直接选多数或把半径与直径同值比较。\u003c/p\u003e\u003ch3\u003e2. 建议共同事实信封\u003c/h3\u003e\u003cp\u003e未来通过共同Observation/Relation及方法记录组装，避免新增重复主存。建议语义字段：\u003c/p\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e字段角色\u003c/td\u003e\u003ctd\u003e意义\u003c/td\u003e\u003ctd\u003e必要约束\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003esubject_ref/revision\u003c/td\u003e\u003ctd\u003e被陈述的工程对象及版本\u003c/td\u003e\u003ctd\u003e不能只写“这个孔”；表示内实体与持久对象身份分开\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003epredicate\u003c/td\u003e\u003ctd\u003e如diameter、adjacent_to、instance_of、specified_material\u003c/td\u003e\u003ctd\u003e注册语义，说明量纲、方向、基数和适用对象\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003evalue/object_ref\u003c/td\u003e\u003ctd\u003e量值、类别、关系目标或结构化内容\u003c/td\u003e\u003ctd\u003e原文与解释分开；缺值显式UNKNOWN\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003econtext_ref\u003c/td\u003e\u003ctd\u003e工况、装配状态、视图/坐标、配置与用途\u003c/td\u003e\u003ctd\u003e条件化事实不能脱离上下文复用\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003erepresentation_ref/locator\u003c/td\u003e\u003ctd\u003e具体原图/模型/参数中的位置\u003c/td\u003e\u003ctd\u003e绑定内容版本，指向共同资产\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eassertion_kind\u003c/td\u003e\u003ctd\u003eSOURCE_STATEMENT、MEASUREMENT、INFERENCE、DESIGN_REQUIREMENT等\u003c/td\u003e\u003ctd\u003e来源陈述与工具测量不可互换\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eprovenance/method_run\u003c/td\u003e\u003ctd\u003e谁/什么工具在什么输入上得到结果\u003c/td\u003e\u003ctd\u003e方法/解析版本、单位、误差和实际执行状态\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003estate/conflict_refs\u003c/td\u003e\u003ctd\u003e观察有效性、候选、未知、冲突及撤销\u003c/td\u003e\u003ctd\u003e置信分数不能消解有意义的冲突\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e这是语义设计，不是现有Schema已接受的字段。实际可按观察、关系、上下文和方法运行分别存，用共同引用装配。\u003c/p\u003e\u003ch3\u003e3. 模态新增与共同职责\u003c/h3\u003e\u003cp\u003e图面事实：文字、符号、线/区域、尺寸附着及视图关系。\u003c/p\u003e\u003cp\u003e三维几何事实：曲线/曲面类型、点/轴/法向、长度/面积/体积、距离、曲率和局部边界；测量方法与误差必须保留。\u003c/p\u003e\u003cp\u003e拓扑事实：面边顶点邻接、边界环、壳体包含；它描述连接，不能独自证明功能或工艺。周期缝边、退化边等特殊拓扑应按方法合同理解，不机械当缺陷。\u003c/p\u003e\u003cp\u003e参数事实：来源给定的名义值、上下限、推导值、设计变更值；与从几何测得值分开。几何名义值满足不代表实际制造件满足公差。\u003c/p\u003e\u003cp\u003e装配事实：零件定义与实例、位姿、接触/配合、约束、自由度及工况；见12。\u003c/p\u003e\u003cp\u003e同一predicate可有多种证据通道。查询返回“测得/规定/推测”及各自范围，不默认全部为确定事实。\u003c/p\u003e\u003ch3\u003e4. 设计意图的最小内容\u003c/h3\u003e\u003cp\u003eDesignIntent保存：任务目标、功能要求、接口要求、可变参数、冻结参数、约束、允许修改区域、依据、工况、交付表示和未知项。功能要求不从几何自动臆造；原件没有就保留UNKNOWN。\u003c/p\u003e\u003cp\u003e参数建议分：输入参数INPUT、推导参数DERIVED、常量CONSTANT、待定参数UNKNOWN。每个值声明单位、定义域、来源/表达式和版本；不能给UNKNOWN自动填“行业常见值”。名义尺寸、工程极限和计算容差分开。\u003c/p\u003e\u003ch4\u003e参数依赖与求值\u003c/h4\u003e\u003cp\u003e首轮仅支持受限、注册的add/subtract/multiply/divide及具名方法；不执行资料文本中的Python/SQL。先做类型/量纲和DAG检查，再按依赖顺序求值。除零/溢出/定义域错误返回INVALID_EXPRESSION；缺输入返回UNKNOWN，不能当0。乘除的单位推导需要共同单位系统扩展，不复用只支持长度比较的旧求值器冒充已实现。\u003c/p\u003e\u003cp\u003e允许多个参数组形成配置；配置身份及其来源固定。禁止将实例位姿参数直接修改零件定义，导致其他装配实例一起变形。\u003c/p\u003e\u003ch3\u003e5. 约束及冲突语义\u003c/h3\u003e\u003cp\u003e约束有id、subject/target、relation/method、parameters、required_or_preferred、applicability、tolerance、provenance、status。required与preferred是该任务设计要求和偏好，不是新的行政审批门槛。\u003c/p\u003e\u003cp\u003e关系可包括尺寸、同轴、平行/垂直、位置、最小间隙、包含/穿透、功能计算。首阶段只实现已注册的少量方法，不先写通用约束求解器。\u003c/p\u003e\u003cp\u003e必须区分：\u003c/p\u003e\u003cp\u003e- 已给定模型上测量约束是否满足。\u003c/p\u003e\u003cp\u003e- 按给定自由参数生成候选模型。\u003c/p\u003e\u003cp\u003e- 求解所有满足约束的模型。\u003c/p\u003e\u003cp\u003e第一项成功不能宣称第三项已完成。欠约束/过约束、约束互相冲突、工具不可用、条件不适用分别返回，不笼统当内核失败。\u003c/p\u003e\u003cp\u003e冲突报告列参与的约束及可复查输入；未证明是最小冲突集时不得称“最小冲突集合”。首轮可返回保守相关集合。改偏好不等于解除必须满足的设计约束。\u003c/p\u003e\u003ch3\u003e6. 首轮可复核的设计样例\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e情境\u003c/td\u003e\u003ctd\u003e正确行为\u003c/td\u003e\u003ctd\u003e反例陷阱\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e板长100、孔中心要求50，模型测得45\u003c/td\u003e\u003ctd\u003e位置约束FAIL，体积仍可能通过\u003c/td\u003e\u003ctd\u003e只比体积后整件PASS\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e轴径是未知，间隙需孔轴差\u003c/td\u003e\u003ctd\u003e求值UNKNOWN及缺参，几何可暂用独立演示假设\u003c/td\u003e\u003ctd\u003e把未知轴径当0求“合格间隙”\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e要求厚度10且另一同范围要求12\u003c/td\u003e\u003ctd\u003e报告来源与版本冲突\u003c/td\u003e\u003ctd\u003e按最近文本静默选择\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e只改变倒角显示质量\u003c/td\u003e\u003ctd\u003e改变离散化参数，不更改精确设计几何\u003c/td\u003e\u003ctd\u003e将粗糙网格当实体尺寸变更\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e参数来源换版\u003c/td\u003e\u003ctd\u003e新设计快照、依赖失效与复检\u003c/td\u003e\u003ctd\u003e沿用旧模型的工程结论\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e这些是设计验证场景，未作为真实内核算例执行。\u003c/p\u003e\u003ch3\u003e7. 知识到意图再到操作\u003c/h3\u003e\u003cp\u003e检索结果必须说明作用角色：定义对象、选择结构、确定参数、解释原理、执行构造或验证。能力单元拿到所需输入与条件后才能生成具体计划。能检索到“退刀槽”的图不等于知道这个任务需要哪一种槽。\u003c/p\u003e\u003cp\u003e参数选择记录选项、适用依据、排除的近似例、未满足前提、预计影响和验证方法。模型建议先成为候选DesignIntent/ModelPlan，不能直接覆盖共同知识项或用户原设计。\u003c/p\u003e\u003ch3\u003e8. 实施衔接与检查\u003c/h3\u003e\u003cp\u003eM1下一步扩展事实/意图Schema及单位/表达式类型；测试读数与要求分离、半径直径、量纲、欠/过约束、版本和未知传播。M2只执行闭合且参数充分的计划；“意图信息齐全”并不保证几何一定成功，失败走04协议。\u003c/p\u003e"}, {"id": "cad3-90d5afcaf0082189", "path": "三维机械建模知识库方案/12-装配事实与条件化验证.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/12-装配事实与条件化验证.md", "title": "装配事实与条件化验证", "group": "validation", "sub": "design", "role": "验证/装配/修改设计", "sha256": "a75daf001b48df37f791b7d679ce34f6ae1e9741786259c4cc72efd1aae681d3", "headings": ["装配事实与条件化验证", "1. 定义、实例、配置与状态", "2. 最小关系与证据", "3. 位姿合同", "4. 约束与自由度的边界", "5. 条件化装配检查", "6. 孔轴小装配设计例", "7. 修改影响", "8. 实施接口与验收设计"], "body": "# 装配事实与条件化验证\n\n2026-10-16；装配扩展设计。继承共同[判断链](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/11-工程判断链与能力单元.md)与[数据治理](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/02-全量记忆与数据治理.md)。与[11工程事实](11-工程事实与设计意图.md)共同定义三维输入，不代表usd-brep已有完整装配求解器。\n\n## 1. 定义、实例、配置与状态\n\nPartDefinition指某一零件内容版本；PartOccurrence是它在特定装配中的实例。两颗相同螺钉可共享定义，却有不同实例ID、位姿和接触对象。AssemblyConfiguration固定选件、尺寸配置及抑制状态；AssemblyState固定运动位置/工况。查询、测量与结论要绑定配置/状态。\n\n模型场景的父子变换可帮助表达实例位姿，但不能代替工程BOM、装配约束、紧固状态或设计意图。BOM数量与几何实例数也可能因简化表示不同，差异需声明。\n\n## 2. 最小关系与证据\n\n|关系|对象与属性|所需证据/限制|\n|---|---|---|\n|instance_of|实例→定义版本|装配文件/清单来源；不按文件名猜版本|\n|placed_in|实例→装配frame，变换|明确单位、矩阵方向、轴向和源/目标|\n|mated_to|功能面/轴之间约束|功能角色与参数来源；不能仅由面接近推断|\n|contacts/clearance|对象间接触或间隙|特定状态、测量方法与误差|\n|interferes|体积穿透或禁止接近|允许接触/过盈的任务定义；几何穿透不自动等于设计错误|\n|assembly_precedes|装配步骤依赖|工艺方法/现场记录；静态位置不提供顺序真值|\n|supports_load|传力/支撑候选|工程原理及工况；不能仅靠连接图确定载荷路径|\n\n几何工具输出距离/交集等观察，工程方法结合装配意图判断。过盈配合的名义实体重叠可能符合设计意图；无依据不能把所有重叠都标设计错误。\n\n## 3. 位姿合同\n\n首轮采用右手坐标，列向量约定，4×4齐次矩阵T_parent_from_child将子frame点映射至父frame：p_parent=T_parent_from_child·p_child。层级组合顺序与约定一致，记录长度单位；不能同时混用行向量约定。\n\n纯刚体变换要求旋转正交、det≈+1、末行[0,0,0,1]，比较容差显式声明。镜像/缩放单列转换，不能通过刚体入口混入。变换树禁止循环；每个实例在一个配置中有唯一父路径。重复使用定义不等于循环实例图。\n\n外部引擎坐标约定不同，由适配器做明确转换并记录，原始位姿不覆盖。坐标系、实例、形状发生变化分别追踪失效范围。\n\n## 4. 约束与自由度的边界\n\n首轮支持显式位姿下的同轴/平行/距离等检查，后续再选择求解器。报告“检查了同轴”不等于解决了全部装配约束。单个同轴关系通常仍允许沿轴位移或旋转，不能默认装配完全定位。\n\n自由度统计依赖约束独立性与特殊位置，不能简单“每加一个约束减一个自由度”。多解、欠约束、过约束、奇异位置与不可解分开。无可用求解工具时输出METHOD_UNAVAILABLE，不让语言模型伪造收敛残差。\n\n## 5. 条件化装配检查\n\n分三层：包围盒等粗筛 → 精确/受控近似几何距离或相交测量 → 基于功能、允许间隙/过盈、公差与工况的工程判断。粗筛命中不是干涉确认；粗筛排除也依赖包围盒是否保守、坐标正确。\n\n路径检查需覆盖运动过程，不以首尾无碰撞证明整个路径畅通。离散采样只证明采样位置，报告步长/漏检风险；连续碰撞或保守界限未实现时不能声称全路径无碰撞。\n\n名义间隙不等于最坏公差间隙。公差累积方法必须说明极值/RSS等假设、相关性、温度和制造分布前提；首轮没有这些输入则只报告名义测量与缺口，不输出统计合格率。\n\n## 6. 孔轴小装配设计例\n\n合成输入：孔径20mm、轴径19.98mm、显式同轴位姿。名义直径间隙为0.02mm；若以单侧径向间隙表达则为0.01mm，predicate与定义必须区分。不能把两者数值差异判为矛盾。\n\n已知名义尺寸与位姿时可以设计几何检查；孔轴公差、材料、温度、载荷、润滑未知，不能进一步宣称符合某种配合制度、运行可靠或工艺可达。若轴径20.02mm，先报告名义重叠和缺设计意图，不能自动宣布过盈设计错误。\n\n所有数值为合成说明，未调用内核，没有实际制造或标准依据。\n\n## 7. 修改影响\n\n改定义影响其所有实例；改实例位姿只影响该实例及相关关系；配置切换影响抑制/选件与关系可用性。依赖图对受影响的距离、干涉、装配路径、检验和工程结论失效，重新验证后形成新版本。不能把原配置结论贴到新配置。\n\n## 8. 实施接口与验收设计\n\n拟议validate_assembly_manifest检查定义/实例/配置引用、scope、单位、变换树；measure_relations只返回几何观察及状态；assess_assembly用适用知识、工况和方法输出范围化结论。三者尚未实现，不以一张装配截图作为代替。\n\n必须覆盖两实例共定义、错位姿、矩阵乘序、镜像/缩放误入、变换循环、同轴但自由度未闭合、过盈意图、名义/极限间隙、端点安全但中间碰撞、变更定义影响多实例。M1先验证合同，M5再做选定装配的真实工具验证。", "reference": false, "current": false, "truncated": false, "tags": ["design"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/12-%E8%A3%85%E9%85%8D%E4%BA%8B%E5%AE%9E%E4%B8%8E%E6%9D%A1%E4%BB%B6%E5%8C%96%E9%AA%8C%E8%AF%81.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e装配事实与条件化验证\u003c/h2\u003e\u003cp\u003e2026-10-16；装配扩展设计。继承共同\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-e7f9b4f47365ab28\"\u003e判断链 ↗\u003c/a\u003e与\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-6f91c9fd23fcf004\"\u003e数据治理 ↗\u003c/a\u003e。与\u003ca href=\"#doc=cad3-96990c2a7a9d57ba\" data-preview-doc=\"cad3-96990c2a7a9d57ba\"\u003e11工程事实\u003c/a\u003e共同定义三维输入，不代表usd-brep已有完整装配求解器。\u003c/p\u003e\u003ch3\u003e1. 定义、实例、配置与状态\u003c/h3\u003e\u003cp\u003ePartDefinition指某一零件内容版本；PartOccurrence是它在特定装配中的实例。两颗相同螺钉可共享定义，却有不同实例ID、位姿和接触对象。AssemblyConfiguration固定选件、尺寸配置及抑制状态；AssemblyState固定运动位置/工况。查询、测量与结论要绑定配置/状态。\u003c/p\u003e\u003cp\u003e模型场景的父子变换可帮助表达实例位姿，但不能代替工程BOM、装配约束、紧固状态或设计意图。BOM数量与几何实例数也可能因简化表示不同，差异需声明。\u003c/p\u003e\u003ch3\u003e2. 最小关系与证据\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e关系\u003c/td\u003e\u003ctd\u003e对象与属性\u003c/td\u003e\u003ctd\u003e所需证据/限制\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003einstance_of\u003c/td\u003e\u003ctd\u003e实例→定义版本\u003c/td\u003e\u003ctd\u003e装配文件/清单来源；不按文件名猜版本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eplaced_in\u003c/td\u003e\u003ctd\u003e实例→装配frame，变换\u003c/td\u003e\u003ctd\u003e明确单位、矩阵方向、轴向和源/目标\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003emated_to\u003c/td\u003e\u003ctd\u003e功能面/轴之间约束\u003c/td\u003e\u003ctd\u003e功能角色与参数来源；不能仅由面接近推断\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003econtacts/clearance\u003c/td\u003e\u003ctd\u003e对象间接触或间隙\u003c/td\u003e\u003ctd\u003e特定状态、测量方法与误差\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003einterferes\u003c/td\u003e\u003ctd\u003e体积穿透或禁止接近\u003c/td\u003e\u003ctd\u003e允许接触/过盈的任务定义；几何穿透不自动等于设计错误\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eassembly_precedes\u003c/td\u003e\u003ctd\u003e装配步骤依赖\u003c/td\u003e\u003ctd\u003e工艺方法/现场记录；静态位置不提供顺序真值\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003esupports_load\u003c/td\u003e\u003ctd\u003e传力/支撑候选\u003c/td\u003e\u003ctd\u003e工程原理及工况；不能仅靠连接图确定载荷路径\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e几何工具输出距离/交集等观察，工程方法结合装配意图判断。过盈配合的名义实体重叠可能符合设计意图；无依据不能把所有重叠都标设计错误。\u003c/p\u003e\u003ch3\u003e3. 位姿合同\u003c/h3\u003e\u003cp\u003e首轮采用右手坐标，列向量约定，4×4齐次矩阵T_parent_from_child将子frame点映射至父frame：p_parent=T_parent_from_child·p_child。层级组合顺序与约定一致，记录长度单位；不能同时混用行向量约定。\u003c/p\u003e\u003cp\u003e纯刚体变换要求旋转正交、det≈+1、末行[0,0,0,1]，比较容差显式声明。镜像/缩放单列转换，不能通过刚体入口混入。变换树禁止循环；每个实例在一个配置中有唯一父路径。重复使用定义不等于循环实例图。\u003c/p\u003e\u003cp\u003e外部引擎坐标约定不同，由适配器做明确转换并记录，原始位姿不覆盖。坐标系、实例、形状发生变化分别追踪失效范围。\u003c/p\u003e\u003ch3\u003e4. 约束与自由度的边界\u003c/h3\u003e\u003cp\u003e首轮支持显式位姿下的同轴/平行/距离等检查，后续再选择求解器。报告“检查了同轴”不等于解决了全部装配约束。单个同轴关系通常仍允许沿轴位移或旋转，不能默认装配完全定位。\u003c/p\u003e\u003cp\u003e自由度统计依赖约束独立性与特殊位置，不能简单“每加一个约束减一个自由度”。多解、欠约束、过约束、奇异位置与不可解分开。无可用求解工具时输出METHOD_UNAVAILABLE，不让语言模型伪造收敛残差。\u003c/p\u003e\u003ch3\u003e5. 条件化装配检查\u003c/h3\u003e\u003cp\u003e分三层：包围盒等粗筛 → 精确/受控近似几何距离或相交测量 → 基于功能、允许间隙/过盈、公差与工况的工程判断。粗筛命中不是干涉确认；粗筛排除也依赖包围盒是否保守、坐标正确。\u003c/p\u003e\u003cp\u003e路径检查需覆盖运动过程，不以首尾无碰撞证明整个路径畅通。离散采样只证明采样位置，报告步长/漏检风险；连续碰撞或保守界限未实现时不能声称全路径无碰撞。\u003c/p\u003e\u003cp\u003e名义间隙不等于最坏公差间隙。公差累积方法必须说明极值/RSS等假设、相关性、温度和制造分布前提；首轮没有这些输入则只报告名义测量与缺口，不输出统计合格率。\u003c/p\u003e\u003ch3\u003e6. 孔轴小装配设计例\u003c/h3\u003e\u003cp\u003e合成输入：孔径20mm、轴径19.98mm、显式同轴位姿。名义直径间隙为0.02mm；若以单侧径向间隙表达则为0.01mm，predicate与定义必须区分。不能把两者数值差异判为矛盾。\u003c/p\u003e\u003cp\u003e已知名义尺寸与位姿时可以设计几何检查；孔轴公差、材料、温度、载荷、润滑未知，不能进一步宣称符合某种配合制度、运行可靠或工艺可达。若轴径20.02mm，先报告名义重叠和缺设计意图，不能自动宣布过盈设计错误。\u003c/p\u003e\u003cp\u003e所有数值为合成说明，未调用内核，没有实际制造或标准依据。\u003c/p\u003e\u003ch3\u003e7. 修改影响\u003c/h3\u003e\u003cp\u003e改定义影响其所有实例；改实例位姿只影响该实例及相关关系；配置切换影响抑制/选件与关系可用性。依赖图对受影响的距离、干涉、装配路径、检验和工程结论失效，重新验证后形成新版本。不能把原配置结论贴到新配置。\u003c/p\u003e\u003ch3\u003e8. 实施接口与验收设计\u003c/h3\u003e\u003cp\u003e拟议validate_assembly_manifest检查定义/实例/配置引用、scope、单位、变换树；measure_relations只返回几何观察及状态；assess_assembly用适用知识、工况和方法输出范围化结论。三者尚未实现，不以一张装配截图作为代替。\u003c/p\u003e\u003cp\u003e必须覆盖两实例共定义、错位姿、矩阵乘序、镜像/缩放误入、变换循环、同轴但自由度未闭合、过盈意图、名义/极限间隙、端点安全但中间碰撞、变更定义影响多实例。M1先验证合同，M5再做选定装配的真实工具验证。\u003c/p\u003e"}, {"id": "cad3-c733cc1066e6c53f", "path": "三维机械建模知识库方案/13-跨版本特征绑定与修改协议.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/13-跨版本特征绑定与修改协议.md", "title": "跨版本特征绑定与修改协议", "group": "validation", "sub": "design", "role": "验证/装配/修改设计", "sha256": "121ec1d3ecca489d817ae6dd82a0403e2719fa3641bb0407df1f16dc67220516", "headings": ["跨版本特征绑定与修改协议", "1. 四种身份", "2. 绑定记录", "3. 候选生成与核对顺序", "4. 分裂、合并、删除和语义变化", "5. 修改协议", "6. 保留区与冻结约束", "7. 可实施验收序列"], "body": "# 跨版本特征绑定与修改协议\n\n2026-10-16；参考共同[16身份与范围](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/16-首轮实施与最小契约设计.md)、[19关系证据修订](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/19-真实工程样例B验证与方案修订.md)。本文把02的绑定原则展开为可实施协议，算法仍待验证。\n\n## 1. 四种身份\n\n- 工程对象ID：孔、槽、轴肩或零件的持久逻辑身份，来源于登记或显式建模计划。\n- 对象revision：本次参数、作用关系和语义的版本。\n- 表示version：模型文件/内存几何快照，绑定内容哈希与生产方法。\n- 表示内实体locator：当前快照中的面/边/区域。只在其表示版本内有意义，不跨版本保证稳定。\n\n同一孔可能由一个圆柱面，也可能因周期接缝、布尔分割或导入形成多个面。工程对象与拓扑实体必须允许一对多、多对一及部分区域，不能要求一个特征等于一个面。\n\n## 2. 绑定记录\n\nbinding_id、object_ref/revision、representation_ref/version、entity_locators、semantic_role、scope_region、method_run_ref、support_refs、candidate_set、state、valid_for、invalidated_by。它是共同Relation/Observation的专门用法，未来统一合同；不另建三维来源事实库。\n\nentity_locator可以包含原生持久句柄（仅当格式保证）、模型内索引和局部几何/拓扑定位。索引可作为当前快照地址，但不承担跨版本对象身份。显示网格三角形索引与BRep面索引也不可互换。\n\n## 3. 候选生成与核对顺序\n\n1. 优先使用可信生成步骤/内核历史映射（如果实际API提供且已验证），记录分裂/合并/删除。\n2. 没有可靠历史时，使用所属零件、对象种类、局部frame、几何量区间、曲面类型、邻接和支撑关系生成候选。\n3. 对候选执行任务相关核对：例如孔轴线、半径、轴向范围、开口/贯穿关系；几何相似分数不等于确认。\n4. 唯一且证据足够时RESOLVED；多个等价候选AMBIGUOUS；无匹配UNRESOLVED；输入已变化未重定位INVALIDATED。\n5. 记录选择/拒绝依据；需确认的只请求指定对象/范围，不让确认扩张到整件设计。\n\n不能为了成功率默认按数组顺序选第一个，不能用“最近中心点”覆盖对称歧义。候选唯一但依据不足也不能自动RESOLVED。\n\n## 4. 分裂、合并、删除和语义变化\n\n|变化|处理|\n|---|---|\n|一个面分裂为多个面|验证并记录集合覆盖与所属同一特征，不改成其中任意一个|\n|多面合并|保留共同支撑与区域映射；原局部语义不一定能直接移植|\n|删除孔或切断槽|原对象可保留历史身份，新版本记录不存在/删除依据，不把未找到当删除|\n|圆角替换锐边|旧边绑定失效，新的过渡面/边记录形成新关系|\n|复制/镜像特征|创建不同工程对象/实例身份，不能因几何相同合并|\n|保持几何但改功能意图|几何绑定可能有效，工程适用性和结论仍需重新判断|\n\n无法证明拓扑映射完整时返回覆盖未知。面数相等、体积相同、哈希相似均不足以证明同一绑定或几何等价。\n\n## 5. 修改协议\n\n输入：base_model_version、object_revisions、知识/工况快照、变更要求、允许修改区和冻结约束。基版本变化即返回STALE_INPUT，重装配后再运行，不静默把旧计划施加到新模型。\n\n步骤：固定输入快照 → 计算保守影响集合 → 对副本执行候选计划 → 记录拓扑/参数变化 → 使受影响绑定和结论失效 → 重定位/重新验证 → 保存新表示版本 → 发布范围化结果。失败保留候选与诊断，旧已验收版本不变。\n\n几何生成与发布可以分阶段：worker写临时模型/日志并fsync或校验完整性，生成内容manifest；共同发布服务在事务中登记结果引用并切换当前版本。发布前崩溃的临时文件不成为已发布模型；事务后崩溃应可按manifest回查。跨SQLite与文件系统不存在天然单事务，需显式staged→verified→registered协议与幂等恢复，不能写“原子发布”就假定已经解决。\n\n首阶段可采用串行发布者、不可变文件、共同目录事务及孤儿清理清单。外置盘离线时不切换当前版本，恢复后核对同一输出哈希再登记。生产故障协议仍需测试，不能以本文设计代替实现。\n\n## 6. 保留区与冻结约束\n\n允许修改区域通常与工程对象、参数和几何范围共同声明。圆角/偏置可能影响区域外的邻接、壁厚和配合；超出范围必须形成候选新计划及影响说明。不得通过放宽冻结约束或删掉失败检查来宣布成功。\n\n几何版本检查通过，不说明旧工程结论可沿用。依赖分为几何、参数、对象语义、知识版次、工况、方法版本；各自变化触发相应复检，依赖不全时保守扩大失效范围。\n\n## 7. 可实施验收序列\n\nA：板双对称孔，改变一个孔半径，要求重定位基于来源与参数，不按顺序。\n\nB：单孔被其他切削分割，要求一特征多实体映射或明确UNKNOWN，不能丢掉半个特征。\n\nC：倒角后原边消失，旧边上的操作请求必须STALE_BINDING；不能自动找邻近边继续切削。\n\nD：计划构建后基模型版本改变，执行拒绝；重装配形成新计划而非修改旧回执。\n\nE：worker成功、发布前断盘，当前版本不变；恢复核验同hash后可幂等登记。\n\nF：几何无变化但手册适用条件/工况变化，原工艺结论失效而原模型字节保留。\n\n以上均为待执行设计例。需要实际内核提供的历史接口能力先查版本；若没有则如实采用候选匹配与人工复核范围，不能写一个理想历史API假称内核支持。", "reference": false, "current": false, "truncated": false, "tags": ["design"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/13-%E8%B7%A8%E7%89%88%E6%9C%AC%E7%89%B9%E5%BE%81%E7%BB%91%E5%AE%9A%E4%B8%8E%E4%BF%AE%E6%94%B9%E5%8D%8F%E8%AE%AE.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e跨版本特征绑定与修改协议\u003c/h2\u003e\u003cp\u003e2026-10-16；参考共同\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-29c6a198af2edf05\"\u003e16身份与范围 ↗\u003c/a\u003e、\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-552f11dffb0771de\"\u003e19关系证据修订 ↗\u003c/a\u003e。本文把02的绑定原则展开为可实施协议，算法仍待验证。\u003c/p\u003e\u003ch3\u003e1. 四种身份\u003c/h3\u003e\u003cp\u003e- 工程对象ID：孔、槽、轴肩或零件的持久逻辑身份，来源于登记或显式建模计划。\u003c/p\u003e\u003cp\u003e- 对象revision：本次参数、作用关系和语义的版本。\u003c/p\u003e\u003cp\u003e- 表示version：模型文件/内存几何快照，绑定内容哈希与生产方法。\u003c/p\u003e\u003cp\u003e- 表示内实体locator：当前快照中的面/边/区域。只在其表示版本内有意义，不跨版本保证稳定。\u003c/p\u003e\u003cp\u003e同一孔可能由一个圆柱面，也可能因周期接缝、布尔分割或导入形成多个面。工程对象与拓扑实体必须允许一对多、多对一及部分区域，不能要求一个特征等于一个面。\u003c/p\u003e\u003ch3\u003e2. 绑定记录\u003c/h3\u003e\u003cp\u003ebinding_id、object_ref/revision、representation_ref/version、entity_locators、semantic_role、scope_region、method_run_ref、support_refs、candidate_set、state、valid_for、invalidated_by。它是共同Relation/Observation的专门用法，未来统一合同；不另建三维来源事实库。\u003c/p\u003e\u003cp\u003eentity_locator可以包含原生持久句柄（仅当格式保证）、模型内索引和局部几何/拓扑定位。索引可作为当前快照地址，但不承担跨版本对象身份。显示网格三角形索引与BRep面索引也不可互换。\u003c/p\u003e\u003ch3\u003e3. 候选生成与核对顺序\u003c/h3\u003e\u003cp\u003e1. 优先使用可信生成步骤/内核历史映射（如果实际API提供且已验证），记录分裂/合并/删除。\u003c/p\u003e\u003cp\u003e2. 没有可靠历史时，使用所属零件、对象种类、局部frame、几何量区间、曲面类型、邻接和支撑关系生成候选。\u003c/p\u003e\u003cp\u003e3. 对候选执行任务相关核对：例如孔轴线、半径、轴向范围、开口/贯穿关系；几何相似分数不等于确认。\u003c/p\u003e\u003cp\u003e4. 唯一且证据足够时RESOLVED；多个等价候选AMBIGUOUS；无匹配UNRESOLVED；输入已变化未重定位INVALIDATED。\u003c/p\u003e\u003cp\u003e5. 记录选择/拒绝依据；需确认的只请求指定对象/范围，不让确认扩张到整件设计。\u003c/p\u003e\u003cp\u003e不能为了成功率默认按数组顺序选第一个，不能用“最近中心点”覆盖对称歧义。候选唯一但依据不足也不能自动RESOLVED。\u003c/p\u003e\u003ch3\u003e4. 分裂、合并、删除和语义变化\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e变化\u003c/td\u003e\u003ctd\u003e处理\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e一个面分裂为多个面\u003c/td\u003e\u003ctd\u003e验证并记录集合覆盖与所属同一特征，不改成其中任意一个\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e多面合并\u003c/td\u003e\u003ctd\u003e保留共同支撑与区域映射；原局部语义不一定能直接移植\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e删除孔或切断槽\u003c/td\u003e\u003ctd\u003e原对象可保留历史身份，新版本记录不存在/删除依据，不把未找到当删除\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e圆角替换锐边\u003c/td\u003e\u003ctd\u003e旧边绑定失效，新的过渡面/边记录形成新关系\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e复制/镜像特征\u003c/td\u003e\u003ctd\u003e创建不同工程对象/实例身份，不能因几何相同合并\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e保持几何但改功能意图\u003c/td\u003e\u003ctd\u003e几何绑定可能有效，工程适用性和结论仍需重新判断\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e无法证明拓扑映射完整时返回覆盖未知。面数相等、体积相同、哈希相似均不足以证明同一绑定或几何等价。\u003c/p\u003e\u003ch3\u003e5. 修改协议\u003c/h3\u003e\u003cp\u003e输入：base_model_version、object_revisions、知识/工况快照、变更要求、允许修改区和冻结约束。基版本变化即返回STALE_INPUT，重装配后再运行，不 维工程。\n\n## 1. 已执行的只读环境探测\n\n[探测回执](验证/内核环境只读探测.json)：在已有engineering-kb的Python3.12.14、arm64/macOS证据环境内，find_spec未发现_omni_solid、usd_brep、pxr。未遍历构建目录或系统安装，未安装/构建依赖，也未执行几何。结论仅为该解释器默认导入路径尚未就绪。\n\n仓库[README](/Users/ddt/work/projects/ai_agent/cad/usd-brep/README.md)区分macOS默认构建与需要本地OpenUSD的Tier1。源码存在不代表Python绑定已可用；本阶段不能从已有代码推断算例已成功。M2真实执行需单独核对匹配Python、OpenUSD、构建工具及绑定导入，不修改二维证据环境承担大依赖。\n\n## 2. 已核函数与语义映射\n\n本地[类型声明](/Users/ddt/work/projects/ai_agent/cad/usd-brep/source/SmPyLib/stubs/usd_brep/__init__.pyi)与[体元指南](/Users/ddt/work/projects/ai_agent/cad/usd-brep/.agents/operations/primitives.md)支持以下草案映射；实际运行仍需匹配同一版本。\n\n|计划语义|已核Python入口|转换与检查|\n|---|---|---|\n|create_plate|create_box(origin,length,width,height)|原点为最小角，分别映射X/Y/Z；全部正值|\n|create_through_hole_tool|create_cylinder(origin,radius,height)|底圆中心、Z方向；直径除2，长度覆盖板两端，余量独立登记|\n|subtract|boolean_difference(brep1,brep2)|板为主实体、圆柱为刀具体；输入可能被消耗，操作副本|\n|solid_validity|Brep.is_manifold_solid()及所需补充工具|单个布尔值不证明所有几何、参数或工程要求|\n|plate_bounds|Brep.bounding_box(tight=False/True)|普通界限可保守，精确检查须明确紧界限/解析方法与容差|\n|volume observation|Brep.volume(relative_accuracy=...)|有数值误差和已知缺陷，精度参数显式记录|\n|native exact output|Brep.write_to_file(filename,ascii=True)|只作为选定精确输出方案；另核对往返与单位语义|\n\n不在此硬编“hole_geometry_and_throughness()”内核接口。它是上层拟注册验证方法，需组合可用查询/截面/拓扑和关系检查。实现前查当前查询指南和绑定，若缺必要功能返回METHOD_UNAVAILABLE，不用语义方法名称冒充已有内核API。\n\n## 3. 已知缺陷会改变验证方法\n\n本轮读到[KNOWN_ISSUES](/Users/ddt/work/projects/ai_agent/cad/usd-brep/KNOWN_ISSUES.md)：圆形等带内部结点的裁剪曲线可能使面积/体积/质量属性计算不准；文档记载默认relative_accuracy=1e-3下部分面积例误差可约1.4%，更粗设定可更大。这个数字不是所有板孔模型的统一误差，也不能当设计允许公差。\n\n影响：板孔恰有圆边界，默认volume()不应直接作为高精度唯一验收量。实际运行应显式记录relative_accuracy、精度收紧前后数值和耗时，与解析体积比较，并独立检查孔轴线、孔径、孔位、贯穿及目标实体类型。数值收敛是诊断证据，不是消除全部系统误差的证明。\n\n若在既定精度/预算下量测不可靠，应输出MEASUREMENT_UNCERTAIN或METHOD_LIMITATION，不通过扩大工程公差或删掉检查换PASS。后续采用其他独立方法需说明其精度和来源，网格体积也有离散误差，不能无条件称真值。\n\n其他本地已知项：remove_fillet可能返回成功但未改变模型；heal_brep可能在修复失败时报告成功；某些外部闭合面/缝边修复有风险；不合法BrepArray导入可能崩溃。因此适配器必须检查结果与隔离导入，不能把函数返回成功当验证完成。这里仅引用本地快照，后续版本可能已修复，实施前重查。\n\n## 4. M2实际运行前置清单\n\n 查与实施移交.md)。\n\n\u003e 后续补充：多域工程事实、意图、绑定与装配已有受限设计Schema和校验附件，见[16](16-工程事实扩展合同实施设计.md)、[17](17-工程事实合同验证与实施边界.md)；不等于生产合同或内核能力已验收。\n\n# 共库接口映射与首阶段评审清单\n\n2026-10-16；目标范围内的实施底稿。引用二维[16共同契约](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/16-首轮实施与最小契约设计.md)、[20目录设计](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/20-目录检索原型与代际实施设计.md)、[21实际进展](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/21-目录检索原型验证与实施差距更新.md)。不设行政门禁，不改变二维正在开发的范围。\n\n## 1. 本轮实际核验\n\n[共库兼容测试](验证/test_shared_compat.py)对当前共同代码进行只读调用；[机器记录](验证/共库兼容结果.json)固定输入、Schema与代码指纹。\n\n五个测试方法分别核对：旧合成bundle有效且输入不变；真实A身份/原文和文件字节保留；三维设计入口有效但旧bundle入口拒绝；旧bundle不静默接受新model_plan字段；改变观察scope仍被原引用检查拒绝。未运行二维全部79项回归，不能因此宣称整个共同工程兼容性都已验收。\n\n复现命令（本目录运行，禁止pyc写入共同工程）：\n\n```sh\n/Users/ddt/work/projects/ai_agent/cad/engineering-kb/.venv-evidence/bin/python -B -m unittest discover -s 验证 -p test_shared_compat.py -v\n```\n\n兼容含义是当前旧输入/旧语义保留、独立入口避免误解析；不等于新增三维数据已能直接导入当前目录或已有共同服务API。\n\n## 2. 数据/接口映射表\n\n|三维内容|当前共同入口|增量实施方式|\n|---|---|---|\n|原模型/参数文件|AssetVersion可描述来源版本；当前读取器类型/预算有限|在共同来源登记，读取策略另扩，不用未知MEDIA类型冒充已支持|\n|模型实体范围|当前Unit仅有IMAGE/JSON/TEXT；目录原型另有PDF|先以具版本JSON manifest中的实体描述作Unit；真正BREP locator需新增版本，不能伪装JSON指针读取模型字节|\n|几何/拓扑/参数观察|Observation描述带来源的观察|引用模型manifest和MethodRun；大数组只存受控引用，明确实际已解析范围|\n|功能对象与关系|共同Relation正式Schema仍演进|EngineeringObject/EntityBinding作为有证据的扩展，映射共同ID；不得偷偷建第二主存|\n|建模方法与知识|KnowledgeItem+CapabilityUnit|复用命题/条件/输入角色；工具使用知识与工艺依据分开|\n|实际操作运行|目录试验将方法JSON作为单元|OperationRun候选字段先统一到MethodRun；试验JSON保存不等于正式运行服务|\n|首阶段设计计划|本目录model3d-plan/0.1|独立DESIGN包，不能交给旧bundle入口执行|\n|几何worker结果|共同来源+方法结果+ValidationRecord设计|校验输出、登记模型版本、返回有界证据；权限/当前撤销仍走共同层|\n|确认|当前ReviewEvent只支持READING|几何/意图/工程确认需新scope设计；不继承旧READING为工程批准|\n|查询与发布|目录原型单SQLite代际/注册读源|三维不改既有原型预算，模型加载走专门工具；发布恢复见13|\n\nmanifest只是定位描述，不自动证明模型已解析正确；目录返回MATERIAL_ONLY时三维应用必须补读/执行，不能把历史模型摘要当当前已读事实。\n\n## 3. 首阶段实施任务的具体输入输出\n\n详见[07文件级清单](07-分阶段实施与验收设计.md)。先执行M1：以当前七对象Schema/校验器、三维09及11—13为输入；产出扩展合同版本、正反样例、兼容映射和实际校验回执。正式跨源真实包必须包含scope(tenant/project)、资产/单元ref、内容版本、来源状态及单位坐标；设计样例的固定scope不是生产鉴权。\n\nM1分三小包但不缩小后续目标：\n\n- M1-A：计划结构与条件、旧输入兼容。本目录已有受限板孔设计验证附件；真实来源和执行接口仍需实现。\n- M1-B：表示/工程对象/EntityBinding与事实信封。字段与状态见02/11/13；覆盖同对象多实体、歧义、失效与跨scope。\n- M1-C：DesignIntent/Assembly事实与方法运行/验证记录。参数依赖和量纲见11，变换约定和条件见12；MethodRun/Relation沿用二维届时统一合同。\n\n三包都需正例、错误/未知/冲突、旧合同回归和输入不变证明。M1-A绿色不代表全部M1完成。共同合同尚未统一的部分可用明确实验命名空间验证，不宣称已发布服务兼容。\n\n随后M2以封闭参数计划和可导入内核环境为输入，产出模型、步骤运行、量测与失败回执。具体函数、单位/原点和测量风险见14；缺环境是实施依赖，不伪造运行成功。\n\n## 4. 真实验证材料的选择与边界\n\n|层次|当前可用材料|选择/执行办法与不能声称的内容|\n|---|---|---|\n|真实来源与共库身份|现有ParaCAD真实A bundle|本轮实际校验其旧合同与ID；继续保留cm/mm、256/512来源差异，不把缺尺度/附着变成3D真值|\n|明确参数几何执行|本目录板孔计划；仓库已有布尔板孔算例|先以合成输入执行，依解析量/位置/贯穿核验；算例是工具验证，不是工业图纸金标准|\n|复杂操作参考|仓库Examples/PyAPI公开示例|实施时按源版本核对参数与测试，本轮未读其完整测试或运行，不能计作已验证模型|\n|真实图纸/模型关联|共同来源里的T01—T05与可取得的原CAD文件|先登记实际成对存在性、单位/版次/对象范围；没有可信三维原件就保留多个候选，不造“真值模型”|\n|工艺知识闭环|共同14采购与已有正文清单|取得可用手册/图册小段后保留表格/变量/例外，选一个真实工况；未取得正文不编参数或条款|\n|装配/修改|后续选定带来源的小装配/历史版本|先核定义/实例/配置、变换和允许修改范围，再按12/13设计跑正常、歧义、失效与复检|\n\n选择协议：先固定来源与支持的结论范围，再写预期方法/分支，最后执行；不根据运行结果反过来挑只会通过的案例。开发样例与按来源族隔离的保留集分开。真实图纸材料未成对时仍可验证来源链和歧义处理，不能把它计成完整图模准确率。\n\n## 5. 目标逐项证据与未完成事项\n\n|目标要求|方案/当前证据|实现或证据的剩余范围|\n|---|---|---|\n|两套方案共建一个知识库且引用二维|README、00/01及本映射表|生产接入共同合同仍需协作实施|\n|工程事实含几何/拓扑/参数/装配|02、11、12|事实/装配通用可执行Schema未落地|\n|三维对象和特征、跨版本绑定|02、13|实际特征恢复与拓扑映射未测|\n|设计意图/参数约束/建模过程|09、11、计划JSON及设计校验回执|M1-B/C、真实包及约束工具未实现|\n|知识到计划和内核操作|03/04、09/14实际签名映射|真实几何环境与操作运行未完成|\n|分层验证/解释/改进复检|05、11—14、07场景|几何/工程方法仍需真实执行|\n|资料吸收和工艺条件|03、06及共同14链接|实际手册知识提炼、工况与工程样本未全取得|\n|检索/资源与秒级边界|06、14/二维21范围化回执|三维和TB资源指标未测|\n|接口可复核|设计Schema、5+5针对性测试、实际指纹|仅限定设计和兼容探针，非通用服务合同|\n|分阶段文件级实施与真实验证设计|07、14、本篇M1分包与材料路线|首阶段完整合同及运行依赖仍需后续细化验证|\n|持续跟进二维|08/10/14、本篇21更新与指纹|按阶段继续核对，不从源文件存在推断通过|\n\n当前可开展架构/数据模型评审，M1-A已有实现准备与验证附件，M1-B/C和M2有明确技术路线；尚不能把整套三维合同与运行接口标为已验收。保持持续目标active，继续以这些剩余项推进到首阶段可实施、关键接口与验证设计可完整复核。\n\n## 6. 评审重点\n\n评审时优先问：共享ID是否稳定；事实/要求/推测是否分离；条件未知是否传播；对象与表示绑定能否失效；知识是否真的决定方法与输入；模型结果由哪些独立量验证；副本/发布/回滚是否保留旧版本；哪些耗时属于检索、哪些属于工具；旧二维输入是否仍可用。\n\n这些是技术讨论问题，不是新增签字流程。对每项建议给出影响对象、合同差异、样例和验证办法，避免只增加抽象术语或文档数量。", "reference": false, "current": false, "truncated 3e\u003ctd\u003e查询与发布\u003c/td\u003e\u003ctd\u003e目录原型单SQLite代际/注册读源\u003c/td\u003e\u003ctd\u003e三维不改既有原型预算，模型加载走专门工具；发布恢复见13\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003emanifest只是定位描述，不自动证明模型已解析正确；目录返回MATERIAL_ONLY时三维应用必须补读/执行，不能把历史模型摘要当当前已读事实。\u003c/p\u003e\u003ch3\u003e3. 首阶段实施任务的具体输入输出\u003c/h3\u003e\u003cp\u003e详见\u003ca href=\"#doc=cad3-b99c290817c8dc6f\" data-preview-doc=\"cad3-b99c290817c8dc6f\"\u003e07文件级清单\u003c/a\u003e。先执行M1：以当前七对象Schema/校验器、三维09及11—13为输入；产出扩展合同版本、正反样例、兼容映射和实际校验回执。正式跨源真实包必须包含scope(tenant/project)、资产/单元ref、内容版本、来源状态及单位坐标；设计样例的固定scope不是生产鉴权。\u003c/p\u003e\u003cp\u003eM1分三小包但不缩小后续目标：\u003c/p\u003e\u003cp\u003e- M1-A：计划结构与条件、旧输入兼容。本目录已有受限板孔设计验证附件；真实来源和执行接口仍需实现。\u003c/p\u003e\u003cp\u003e- M1-B：表示/工程对象/EntityBinding与事实信封。字段与状态见02/11/13；覆盖同对象多实体、歧义、失效与跨scope。\u003c/p\u003e\u003cp\u003e- M1-C：DesignIntent/Assembly事实与方法运行/验证记录。参数依赖和量纲见11，变换约定和条件见12；MethodRun/Relation沿用二维届时统一合同。\u003c/p\u003e\u003cp\u003e三包都需正例、错误/未知/冲突、旧合同回归和输入不变证明。M1-A绿色不代表全部M1完成。共同合同尚未统一的部分可用明确实验命名空间验证，不宣称已发布服务兼容。\u003c/p\u003e\u003cp\u003e随后M2以封闭参数计划和可导入内核环境为输入，产出模型、步骤运行、量测与失败回执。具体函数、单位/原点和测量风险见14；缺环境是实施依赖，不伪造运行成功。\u003c/p\u003e\u003ch3\u003e4. 真实验证材料的选择与边界\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e层次\u003c/td\u003e\u003ctd\u003e当前可用材料\u003c/td\u003e\u003ctd\u003e选择/执行办法与不能声称的内容\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e真实来源与共库身份\u003c/td\u003e\u003ctd\u003e现有ParaCAD真实A bundle\u003c/td\u003e\u003ctd\u003e本轮实际校验其旧合同与ID；继续保留cm/mm、256/512来源差异，不把缺尺度/附着变成3D真值\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e明确参数几何执行\u003c/td\u003e\u003ctd\u003e本目录板孔计划；仓库已有布尔板孔算例\u003c/td\u003e\u003ctd\u003e先以合成输入执行，依解析量/位置/贯穿核验；算例是工具验证，不是工业图纸金标准\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e复杂操作参考\u003c/td\u003e\u003ctd\u003e仓库Examples/PyAPI公开示例\u003c/td\u003e\u003ctd\u003e实施时按源版本核对参数与测试，本轮未读其完整测试或运行，不能计作已验证模型\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e真实图纸/模型关联\u003c/td\u003e\u003ctd\u003e共同来源里的T01—T05与可取得的原CAD文件\u003c/td\u003e\u003ctd\u003e先登记实际成对存在性、单位/版次/对象范围；没有可信三维原件就保留多个候选，不造“真值模型”\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e工艺知识闭环\u003c/td\u003e\u003ctd\u003e共同14采购与已有正文清单\u003c/td\u003e\u003ctd\u003e取得可用手册/图册小段后保留表格/变量/例外，选一个真实工况；未取得正文不编参数或条款\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e装配/修改\u003c/td\u003e\u003ctd\u003e后续选定带来源的小装配/历史版本\u003c/td\u003e\u003ctd\u003e先核定义/实例/配置、变换和允许修改范围，再按12/13设计跑正常、歧义、失效与复检\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e选择协议：先固定来源与支持的结论范围，再写预期方法/分支，最后执行；不根据运行结果反过来挑只会通过的案例。开发样例与按来源族隔离的保留集分开。真实图纸材料未成对时仍可验证来源链和歧义处理，不能把它计成完整图模准确率。\u003c/p\u003e\u003ch3\u003e5. 目标逐项证据与未完成事项\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e目标要求\u003c/td\u003e\u003ctd\u003e方案/当前证据\u003c/td\u003e\u003ctd\u003e实现或证据的剩余范围\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e两套方案共建一个知识库且引用二维\u003c/td\u003e\u003ctd\u003eREADME、00/01及本映射表\u003c/td\u003e\u003ctd\u003e生产接入共同合同仍需协作实施\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e工程事实含几何/拓扑/参数/装配\u003c/td\u003e\u003ctd\u003e02、11、12\u003c/td\u003e\u003ctd\u003e事实/装配通用可执行Schema未落地\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e三维对象和特征、跨版本绑定\u003c/td\u003e\u003ctd\u003e02、13\u003c/td\u003e\u003ctd\u003e实际特征恢复与拓扑映射未测\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e设计意图/参数约束/建模过程\u003c/td\u003e\u003ctd\u003e09、11、计划JSON及设计校验回执\u003c/td\u003e\u003ctd\u003eM1-B/C、真实包及约束工具未实现\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e知识到计划和内核操作\u003c/td\u003e\u003ctd\u003e03/04、09/14实际签名映射\u003c/td\u003e\u003ctd\u003e真实几何环境与操作运行未完成\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e分层验证/解释/改进复检\u003c/td\u003e\u003ctd\u003e05、11—14、07场景\u003c/td\u003e\u003ctd\u003e几何/工程方法仍需真实执行\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e资料吸收和工艺条件\u003c/td\u003e\u003ctd\u003e03、06及共同14链接\u003c/td\u003e\u003ctd\u003e实际手册知识提炼、工况与工程样本未全取得\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e检索/资源与秒级边界\u003c/td\u003e\u003ctd\u003e06、14/二维21范围化回执\u003c/td\u003e\u003ctd\u003e三维和TB资源指标未测\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e接口可复核\u003c/td\u003e\u003ctd\u003e设计Schema、5+5针对性测试、实际指纹\u003c/td\u003e\u003ctd\u003e仅限定设计和兼容探针，非通用服务合同\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e分阶段文件级实施与真实验证设计\u003c/td\u003e\u003ctd\u003e07、14、本篇M1分包与材料路线\u003c/td\u003e\u003ctd\u003e首阶段完整合同及运行依赖仍需后续细化验证\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e持续跟进二维\u003c/td\u003e\u003ctd\u003e08/10/14、本篇21更新与指纹\u003c/td\u003e\u003ctd\u003e按阶段继续核对，不从源文件存在推断通过\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e当前可开展架构/数据模型评审，M1-A已有实现准备与验证附件，M1-B/C和M2有明确技术路线；尚不能把整套三维合同与运行接口标为已验收。保持持续目标active，继续以这些剩余项推进到首阶段可实施、关键接口与验证设计可完整复核。\u003c/p\u003e\u003ch3\u003e6. 评审重点\u003c/h3\u003e\u003cp\u003e评审时优先问：共享ID是否稳定；事实/要求/推测是否分离；条件未知是否传播；对象与表示绑定能否失效；知识是否真的决定方法与输入；模型结果由哪些独立量验证；副本/发布/回滚是否保留旧版本；哪些耗时属于检索、哪些属于工具；旧二维输入是否仍可用。\u003c/p\u003e\u003cp\u003e这些是技术讨论问题，不是新增签字流程。对每项建议给出影响对象、合同差异、样例和验证办法，避免只增加抽象术语或文档数量。\u003c/p\u003e"}, {"id": "cad3-2c368f8bb44bddb2", "path": "三维机械建模知识库方案/16-工程事实扩展合同实施设计.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/16-工程事实扩展合同实施设计.md", "title": "工程事实扩展合同实施设计", "group": "contracts", "sub": "design", "role": "合同设计", "sha256": "08fc7499105fe8e629d002b31bdbfc657bc5ccf999fe69212d3177704dc20ccf", "headings": ["工程事实扩展合同实施设计", "1. 本轮实现范围", "2. 必须约束的语义", "3. 失败与验证", "4. 合同兼容与后续接入", "5. 2026-10-21：实际自审发现的覆盖边界"], "body": "# 工程事实扩展合同实施设计\n\n2026-10-16；先于本轮附件编码。继承[02](02-三维对象与共享数据契约扩展.md)、[11](11-工程事实与设计意图.md)、[12](12-装配事实与条件化验证.md)、[13](13-跨版本特征绑定与修改协议.md)，共同来源与版本仍按[二维16](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/16-首轮实施与最小契约设计.md)。\n\n## 1. 本轮实现范围\n\n在本目录新增契约/engineering-facts.schema.json、设计样例/工程事实包.json、验证/validate_facts.py、验证/test_facts.py和验证/工程事实合同结果.json。仅为可复核的离线合同附件，不创建数据库或第二来源库，不改二维合同。\n\n合同版本engineering-facts/0.1，包含表示representations、工程对象objects、工况contexts、事实facts、对象绑定bindings、设计意图intents、装配instances。引用共同资产版本由调用方提供可信registry；不从包内声明任意路径和权限。演示固定为DESIGN_SIMULATION，字段和关系可覆盖多类工程事实，但不假称真实BRep、真实量测或真实确认。\n\n本轮不实现几何内核、约束求解、正式MethodRun、工艺规则执行或真实装配检查；这些继续按原范围实施设计。本附件是接口结构与部分语义验证，非机械正确性验证。\n\n## 2. 必须约束的语义\n\nscope与外部资产引用匹配；所有对象/表示/工况/关系引用闭合，ID唯一；绑定只作用于确定对象revision及表示版本，实体集合属于该表示，状态与候选数一致；模型变版的旧绑定不能作为RESOLVED继续执行。\n\n事实保留assertion_kind和domain：GEOMETRY、TOPOLOGY、PARAMETER、ASSEMBLY；几何测量与设计要求分开；数值单位不得伪造，UNKNOWN没有确定值，冲突引用保留。合同只验证表达，不宣称已求得真假。\n\n意图参数保留INPUT/DERIVED/UNKNOWN和依赖；求值方法名来自受限集合，图无环，未知传播在执行层处理；本轮仅检查依赖，不实现四则量纲求值。冻结与可变参数不得重叠，约束引用的对象/参数须存在。\n\n装配实例引用零件定义和同配置父实例；父链无环、矩阵为显式右手刚体变换，输入不允许隐式镜像/缩放。约定列向量、T_parent_from_child，末行与正交/行列式检查容差作为验证附件设置，非设计公差。\n\n## 3. 失败与验证\n\n错误类别SCHEMA、REFERENCE、SCOPE、IDENTITY、BINDING、STALE_BINDING、CONFLICT、INTENT、CYCLE、TRANSFORM。绑定AMBIGUOUS允许记录但不能作为可执行定位；通过合同校验不等于绑定已被专业确认。不同工程事实可冲突，不能为了校验通过删除冲突。\n\n测试覆盖合法多域包、跨scope/断引用、重复ID、错revision、实体不属于表示、唯一/歧义状态矛盾、未知带确定值、冲突引用、参数循环/冻结冲突、父链循环、镜像/缩放/错末行。实际记录测试方法数与子场景数，不当真实样本准确率。\n\n## 4. 合同兼容与后续接入\n\n旧bundle仍由旧入口处理；新包通过显式schema_version入口，外部registry由共同资产/授权快照组装。本附件拒绝任意路径，不负责认证调用方，也不提供网络服务。接入时还需统一Relation/MethodRun/Generation、真实来源locator和撤回策略，不能把本包批准为另一套主事实源。\n\n完成标准为Schema有效、正负例可复现、跨引用/状态反例有效、输入不改写、共享旧契约指纹可追溯。内核实际验证继续保持未运行状态。\n\n## 5. 2026-10-21：实际自审发现的覆盖边界\n\n现有校验器允许直径deg、拓扑关系改标量、长度角度相加的设计表达；16项旧测试仍可通过，不能据此声称已检验物理语义。三次内存扰动见[证据](验证/自审证据_20261021.json)。本轮不改旧Schema/校验器和历史通过记录；生产入口须补20第4节的谓词、对象类型、量纲及方法准入，新增反例必须真正拒绝后才可关闭待办。", "reference": false, "current": false, "truncated": false, "tags": ["design"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/16-%E5%B7%A5%E7%A8%8B%E4%BA%8B%E5%AE%9E%E6%89%A9%E5%B1%95%E5%90%88%E5%90%8C%E5%AE%9E%E6%96%BD%E8%AE%BE%E8%AE%A1.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e工程事实扩展合同实施设计\u003c/h2\u003e\u003cp\u003e2026-10-16；先于本轮附件编码。继承\u003ca href=\"#doc=cad3-cdbdb6499bad06c7\" data-preview-doc=\"cad3-cdbdb6499bad06c7\"\u003e02\u003c/a\u003e、\u003ca href=\"#doc=cad3-96990c2a7a9d57ba\" data-preview-doc=\"cad3-96990c2a7a9d57ba\"\u003 权快照组装。本附件拒绝任意路径，不负责认证调用方，也不提供网络服务。接入时还需统一Relation/MethodRun/Generation、真实来源locator和撤回策略，不能把本包批准为另一套主事实源。\u003c/p\u003e\u003cp\u003e完成标准为Schema有效、正负例可复现、跨引用/状态反例有效、输入不改写、共享旧契约指纹可追溯。内核实际验证继续保持未运行状态。\u003c/p\u003e\u003ch3\u003e5. 2026-10-21：实际自审发现的覆盖边界\u003c/h3\u003e\u003cp\u003e现有校验器允许直径deg、拓扑关系改标量、长度角度相加的设计表达；16项旧测试仍可通过，不能据此声称已检验物理语义。三次内存扰动见\u003ca href=\"#doc=cad3-e379503c52109a34\" data-preview-doc=\"cad3-e379503c52109a34\"\u003e证据\u003c/a\u003e。本轮不改旧Schema/校验器和历史通过记录；生产入口须补20第4节的谓词、对象类型、量纲及方法准入，新增反例必须真正拒绝后才可关闭待办。\u003c/p\u003e"}, {"id": "cad3-c592d1bd1b31841b", "path": "三维机械建模知识库方案/17-工程事实合同验证与实施边界.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/17-工程事实合同验证与实施边界.md", "title": "工程事实合同验证与实施边界", "group": "contracts", "sub": "receipt", "role": "范围化核验与接口记录", "sha256": "3e796c9163afebac7666387bed97d4448c57015e97c636ba50a1acc7db867bd5", "headings": ["工程事实合同验证与实施边界", "1. 实际附件与结果", "2. 可复现命令", "3. 明确支持的表达与拒绝", "4. 首阶段设计差距的变化"], "body": "# 工程事实合同验证与实施边界\n\n2026-10-16；对应[16先行设计](16-工程事实扩展合同实施设计.md)。本轮交付的是合同设计的可执行附件，不是几何建模服务。\n\n## 1. 实际附件与结果\n\n[Schema](契约/engineering-facts.schema.json)、[合成事实包](设计样例/工程事实包.json)、[校验器](验证/validate_facts.py)、[测试](验证/test_facts.py)。结果见[工程事实合同回执](验证/工程事实合同结果.json)。六个测试方法覆盖四类事实、29个拒绝场景及若干合法状态；不将子场景计作独立工程样本。\n\n四类事实为GEOMETRY、TOPOLOGY、PARAMETER、ASSEMBLY。合法包保留UNKNOWN；冲突事实可并存而非被覆盖；一个工程对象可对应多个实体；多个装配实例可共用一个零件定义。输入包不改写，输出始终geometry_verified=false、engineering_approved=false。\n\n全部三维附件组合回归见[组合回执](验证/三维附件组合结果.json)，包括计划设计、共库兼容和工程事实三个组。本轮没有重新运行二维完整79项测试，没有调用内核或付费模型。\n\n## 2. 可复现命令\n\n在本目录执行：\n\n```sh\n/Users/ddt/work/projects/ai_agent/cad/engineering-kb/.venv-evidence/bin/python -B -m unittest discover -s 验证 -v\n```\n\n依赖是本机现有隔离环境中的jsonschema，实际版本见回执。迁移环境时需要单独安装/锁定依赖并记录，本命令不是跨机器通用路径。校验附件没有开放网络服务。\n\n## 3. 明确支持的表达与拒绝\n\n当前包固定DESIGN_SIMULATION；外部registry引用二维合成示例中的资产登记，真实来源、内容和权限并未由三维附件鉴真。它证明引用和scope的使用方式，不给合成来源追加真实权威。\n\n事实支持来源陈述、推断和设计要求；真实MEASUREMENT及MethodRun尚待共同正式合同接入，因此没有把模拟观察写成已实际测量。量值支持首轮长度/角度/无量纲的有限单位；面积、体积及复合量纲需后续扩展，不能用mm暗代mm²/mm³。\n\n参数DERIVED含两个有序操作数引用（允许引用同一参数两次），方法限定加减乘除，value/unit均为null表示尚未求值。只验证依赖与字段，不执行表达式、量纲推导或约束求解；数值未知不能被认为等于0。\n\n绑定RESOLVED仅表示设计包声明一个候选集合且版本一致，不代表真实几何识别或专家确认。AMBIGUOUS/UNRESOLVED/INVALIDATED可保存但输出不可作为执行定位。INVALIDATED历史记录的真实性/完整版本链尚未鉴真；生产使用需共同版本目录保存旧表示和旧对象revision，不能只将旧revision数字写在新表示旁冒充历史。\n\n装配验证只检查实例引用、父链和矩阵结构/刚体条件；没有检查真实接触、干涉、自由度或公差。矩阵算术阈值1e-9为附件的浮点检查设置，与工程尺寸公差分离。\n\n## 4. 首阶段设计差距的变化\n\n3D-A01从字段草案推进到计划与多域事实两份可校验设计附件；仍非全部生产数据合同。3D-A02已实核旧入口兼容，并有二维20/21映射，但MethodRun/Relation仍等待共同统一。A04的歧义/失效表达有测试，实际拓扑识别未测试。其余内核、真实图模、工艺、规模、确认发布仍按原实施工作包保留。\n\n这不把方案目标扩大成需要本轮完成整个软件，也不把合同附件当整个软件完成。方案的评审与首阶段实施依据由01—16和本记录共同提供；后续工程运行按07/14实施并另行验收。", "reference": false, "current": false, "truncated": false, "tags": ["receipt"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/17-%E5%B7%A5%E7%A8%8B%E4%BA%8B%E5%AE%9E%E5%90%88%E5%90%8C%E9%AA%8C%E8%AF%81%E4%B8%8E%E5%AE%9E%E6%96%BD%E8%BE%B9%E7%95%8C.md", "source_kind": "markdown", "preview_html": "\u003ch2\u003e工程事实合同验证与实施边界\u003c/h2\u003e\u003cp\u003e2026-10-16；对应\u003ca href=\"#doc=cad3-2c368f8bb44bddb2\" data-preview-doc=\"cad3-2c368f8bb44bddb2\"\u003e16先行设计\u003c/a\u003e。本轮交付的是合同设计的可执行附件，不是几何建模服务。\u003c/p\u003e\u003ch3\u003e1. 实际附件与结果\u003c/h3\u003e\u003cp\u003e\u003ca href=\"#doc=cad3-2fd0617749710660\" data-preview-doc=\"cad3-2fd0617749710660\"\u003eSchema\u003c/a\u003e、\u003ca href=\"#doc=cad3-6b71bb9e42482222\" data-preview-doc=\"cad3-6b71bb9e42482222\"\u003e合成事实包\u003c/a\u003e、校验器（见原文附件）、测试（见原文附件）。结果见\u003ca href=\"#doc=cad3-8149228d3b1c5598\" data-preview-doc=\"cad3-8149228d3b1c5598\"\u003e工程事实合同回执\u003c/a\u003e。六个测试方法覆盖四类事实、29个拒绝场景及若干合法状态；不将子场景计作独立工程样本。\u003c/p\u003e\u003cp\u003e四类事实为GEOMETRY、TOPOLOGY、PARAMETER、ASSEMBLY。合法包保留UNKNOWN；冲突事实可并存而非被覆盖；一个工程对象可对应多个实体；多个装配实例可共用一个零件定义。输入包不改写，输出始终geometry_verified=false、engineering_approved=false。\u003c/p\u003e\u003cp\u003e全部三维附件组合回归见\u003ca href=\"#doc=cad3-57e3d2427d4ff18d\" data-preview-doc=\"cad3-57e3d2427d4ff18d\"\u003e组合回执\u003c/a\u003e，包括计划设计、共库兼容和工程事实三个组。本轮没有重新运行二维完整79项测试，没有调用内核或付费模型。\u003c/p\u003e\u003ch3\u003e2. 可复现命令\u003c/h3\u003e\u003cp\u003e在本目录执行：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e/Users/ddt/work/projects/ai_agent/cad/engineering-kb/.venv-evidence/bin/python -B -m unittest discover -s 验证 -v\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e依赖是本机现有隔离环境中的jsonschema，实际版本见回执。迁移环境时需要单独安装/锁定依赖并记录，本命令不是跨机器通用路径。校验附件没有开放网络服务。\u003c/p\u003e\u003ch3\u003e3. 明确支持的表达与拒绝\u003c/h3\u003e\u003cp\u003e当前包固定DESIGN_SIMULATION；外部registry引用二维合成示例中的资产登记，真实来源、内容和权限并未由三维附件鉴真。它证明引用和scope的使用方式，不给合成来源追加真实权威。\u003c/p\u003e\u003cp\u003e事实支持来源陈述、推断和设计要求；真实MEASUREMENT及MethodRun尚待共同正式合同接入，因此没有把模拟观察写成已实际测量。量值支持首轮长度/角度/无量纲的有限单位；面积、体积及复合量纲需后续扩展，不能用mm暗代mm²/mm³。\u003c/p\u003e\u003cp\u003e参数DERIVED含两个有序操作数引用（允许引用同一参数两次），方法限定加减乘除，value/unit均为null表示尚未求值。只验证依赖与字段，不执行表达式、量纲推导或约束求解；数值未知不能被认为等于0。\u003c/p\u003e\u003cp\u003e绑定RESOLVED仅表示设计包声明一个候选集合且版本一致，不代表真实几何识别或专家确认。AMBIGUOUS/UNRESOLVED/INVALIDATED可保存但输出不可作为执行定位。INVALIDATED历史记录的真实性/完整版本链尚未鉴真；生产使用需共同版本目录保存旧表示和旧对象revision，不能只将旧revision数字写在新表示旁冒充历史。\u003c/p\u003e\u003cp\u003e装配验证只检查实例引用、父链和矩阵结构/刚体条件；没有检查真实接触、干涉、自由度或公差。矩阵算术阈值1e-9为附件的浮点检查设置，与工程尺寸公差分离。\u003c/p\u003e\u003ch3\u003e4. 首阶段设计差距的变化\u003c/h3\u003e\u003cp\u003e3D-A01从字段草案推进到计划与多域事实两份可校验设计附件；仍非全部生产数据合同。3D-A02已实核旧入口兼容，并有二维20/21映射，但MethodRun/Relation仍等待共同统一。A04的歧义/失效表达有测试，实际拓扑识别未测试。其余内核、真实图模、工艺、规模、确认发布仍按原实施工作包保留。\u003c/p\u003e\u003cp\u003e这不把方案目标扩大成需要本轮完成整个软件，也不把合同附件当整个软件完成。方案的评审与首阶段实施依据由01—16和本记录共同提供；后续工程运行按07/14实施并另行验收。\u003c/p\u003e"}, {"id": "cad3-2cbe394557f4bc58", "path": "三维机械建模知识库方案/18-交付自查与实施移交.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/18-交付自查与实施移交.md", "title": "交付自查与实施移交", "group": "delivery", "sub": "record", "role": "编写/阶段交付快照", "sha256": "a071632ebba8c2316f5bdb7670d82de49401c5f5c1cc4fdcf58d034c485615af", "headings": ["交付自查与实施移交", "1. 本次目标与完成标准", "2. 逐项核对", "3. 首阶段可直接开始的实施入口", "4. 最新二维跟进及三维影响", "5. 风险与取舍移交", "6. 自查结论的边界"], "body": "\u003e 2026-10-17后续复核：本文为初版交付快照。“首阶段可实施”仅覆盖可启动合同/技术验证；完整首期开工差距见[19待办](19-首期开工差距与待办清单.md)。历史测试和目标记录不改写。\n\n# 交付自查与实施移交\n\n2026-10-16；KB-3D-DESIGN-001。性质：作者逐项自查与工程移交，不是独立专家评审或生产软件验收。\n\n## 1. 本次目标与完成标准\n\n用户要求在独立三维方案目录中，与仍在开发的二维方案共建一个工程知识库；持续完善至方案可评审、首阶段可实施、关键接口与验证设计可复核。原始[00工作方案](00-编制工作方案与协作边界.md)限定方案建设，随后按授权补充必要小范围校验。\n\n本次按完整方案范围审计，包括四块必须补齐的能力、共库接口、资料/检索/资源、文件级实施和真实验证路线。软件执行仍在07的M1—M5工程路线中；不能把本次方案完成写成内核已跑通、真实机械设计已验证或1TB性能已达成。\n\n完成证据见[目标逐项审计](验证/目标逐项审计.json)及[来源/链接记录](依据与自查记录.json)。静态检查证明附件与链接可回查；内容判断还须逐项阅读，不以文件数代替成熟度。\n\n## 2. 逐项核对\n\n|原目标|已具备的方案与验证依据|工程实施仍需什么|\n|---|---|---|\n|指定目录、独立三维文档集且链接二维|README及00/01；所有设计均在本目录；链接可达性以最终机器记录为准|后续维护同一入口与版本|\n|两个方案共建一库，二维聚焦不受影响|01、02、15；当前旧合同只读兼容实核5项|共享Relation/MethodRun等统一时按具体版本接入|\n|工程事实覆盖几何/拓扑/参数/装配|02/11/12、16/17；四域事实包和Schema实际验证|真实来源、真实MEASUREMENT和复合量纲扩展|\n|对象、工程特征与跨版本绑定|02/13；唯一/多候选/失效及一对象多实体的合同检查|真实内核拓扑映射、特征识别与历史鉴真|\n|设计意图、参数约束与建模过程|09/11/16；参数来源、冻结/可变、DAG和未知状态有附件|求值、量纲、约束工具与真实输入接入|\n|知识到计划与usd-brep操作映射|03/04/09/14；真实API签名、所有权、错误、输出方式和前后检查已核|几何环境、适配器/worker实现与实际运行|\n|分层验证、解释、改进与复检|05 V1—V6、13修改协议、07场景、14测量风险|具体工程方法与真实模型执行|\n|共同底座及三维增量界定|01/02/06/15共享身份与入口映射|按共同版本与当前用途/撤回状态装配|\n|资料吸收与工艺知识|03及共同14链接；有角色、提炼粒度、上下文和条件|实际可用正文及工况；不能由书名编知识|\n|检索、资源与秒级范围|06及二维21小快照证据；与建模耗时分开|规模/冷热/并发、几何峰值及恢复实测|\n|接口合同可复核|09/16两Schema、校验器、合成样例、组合16项测试|生产合同、认证、持久化、执行和完整版本发布|\n|阶段/文件级实施与真实验证设计|07/14/15：文件、依赖、输入/输出、错误/未知、12场景、真实材料选择协议|实施时核对环境/资料并按原路线运行验收|\n|跟进二维并保持一致|已跟进16—22；79项已有回执、22仅设计；来源指纹及只读兼容测试|实施阶段继续核对二维届时最新合同|\n|必要验证与证据诚实|16项附件测试，输入/代码指纹、环境只读探测；无原件/二维代码改写|不得将合成测试外推成真实准确率|\n\n以上各项的方案内容均已具备，可交付评审；右列是明确的工程实施/外部输入任务，并非被静默删除的建设范围。它们不能被误标“已验收”。\n\n## 3. 首阶段可直接开始的实施入口\n\n执行者先读01、02、07、09、14、15、16；核对共同合同当前指纹。M1拆为计划、工程事实/绑定、意图/装配/运行三包，详细文件清单见07。当前两套附件可作为合同设计参考与回归材料，不直接复制为生产服务。\n\n每包交付：版本化Schema、接口/错误语义、来源与scope引用、合法/错误/未知/冲突例、旧合同兼容结果和输入不变证据。真实来源与动作确认不能沿用模拟actor/伪哈希；未满足真实引用与身份条件时继续保持实验命名空间，不伪装生产发布。\n\n合同附件复现：\n\n```sh\n/Users/ddt/work/projects/ai_agent/cad/engineering-kb/.venv-evidence/bin/python -B -m unittest discover -s 验证 -v\n```\n\n换机器时新建独立Python3.12环境，以[依赖锁定](验证/requirements-design.lock.txt)安装；共享代码/样例按审计指纹提供只读快照并调整测试的COMMON路径。不得把环境绝对路径当正式部署方案。仓库内核的构建准备遵循14及其官方本地说明，不在二维证据环境中静默安装大依赖。\n\nM2开始条件和错误协议已写明：绑定可导入，单位/坐标/所有权已核，实验余量/容差有明确值与理由，原件只读，步骤有预算，输出与失败有回执。未知测量精度不以默认volume()掩盖；没有几何工具就不宣称模型已验证。\n\n## 4. 最新二维跟进及三维影响\n\n[二维22确认设计](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/22-人工确认持久化与真实反馈实施设计.md)新增ReviewTarget与Capture、Append/RETRACT和SQLite重放设计。三维据此继续使用确定目标版本、确认范围和可信来源；不把新ReviewTarget假装成旧Observation，也不迁移READING为设计/工程确认。\n\nCARD_ONLY目标不能用于精确实体绑定；REGION读取确认也只说明该位置字符，不说明特征、尺寸或制造正确。三维未来新增几何/意图/工程确认必须另有目标、条件和范围合同，仍复用共同事件治理，不建立另一套权威确认库。\n\n本次看到review_capture.sqlite文件出现，未见其最终验收回执，故仅记“设计与工件存在”，不宣称持久化已经完成。二维已核验进度仍以79项现有回执的准确范围为准；没有读取正在写入的数据库或干预另一开发过程。\n\n## 5. 风险与取舍移交\n\n- 真实图模不一定成对，二维不唯一性和对象歧义必须保留；原JSON/训练标签不当三维真值。\n- 拓扑身份跨修改不稳定，几何签名只能生成候选；INVALIDATED记录的历史真实性需共同版本链支持。\n- BRep/网格/特征历史/装配约束含义不同，显示资产流程不能代替工程模型保存。\n- 本地内核已知圆边界量测及修复假成功等风险，需实际版本复查和独立量交叉验证。\n- 工艺经验需设备/工序/工况等前提，不能从几何成功推出可制造。\n- 秒级检索与TB容量是目标，既有毫秒级小快照观测不能外推；备份和故障域仍需工程实施。\n\n## 6. 自查结论的边界\n\n整套方案具备架构和接口评审条件；首阶段已有具体任务、数据/接口、依赖、复现材料、验收与失败路径，可开始工程实施。此结论依据整个文档和附件链，不仅依据16个测试方法。\n\n原型中的缺口已分类到具体后续工作包，未伪装成完成。正式软件、全量知识库、内核环境与真实机械验收不在本次方案交付中被宣称达成。持续目标是否完成以本聊天目标审计与状态工具为准，而非由本文自行修改目标状态。", "reference": false, "current": false, "truncated": false, "tags": ["record"], "reason": "按三维文档职责分类；不从标题推断实现状态", "assets": [], "href": "%E4%B8%89%E7%BB%B4%E6%9C%BA%E6%A2%B0%E5%BB%BA%E6%A8%A1%E7%9F%A5%E8%AF%86%E5%BA%93%E6%96%B9%E6%A1%88/18-%E4%BA%A4%E4%BB%98%E8%87%AA%E6%9F%A5%E4%B8%8E%E5%AE%9E%E6%96%BD%E7%A7%BB%E4%BA%A4.md", "source_kind": "markdown", "preview_html": "\u003cp\u003e\u0026gt; 2026-10-17后续复核：本文为初版交付快照。“首阶段可实施”仅覆盖可启动合同/技术验证；完整首期开工差距见\u003ca href=\"#doc=cad3-1e8881c86734c226\" data-preview-doc=\"cad3-1e8881c86734c226\"\u003e19待办\u003c/a\u003e。历史测试和目标记录不改写。\u003c/p\u003e\u003ch2\u003e交付自查与实施移交\u003c/h2\u003e\u003cp\u003e2026-10-16；KB-3D-DESIGN-001。性质：作者逐项自查与工程移交，不是独立专家评审或生产软件验收。\u003c/p\u003e\u003ch3\u003e1. 本次目标与完成标准\u003c/h3\u003e\u003cp\u003e用户要求在独立三维方案目录中，与仍在开发的二维方案共建一个工程知识库；持续完善至方案可评审、首阶段可实施、关键接口与验证设计可复核。原始\u003ca href=\"#doc=cad3-5aec3600449ed190\" data-preview-doc=\"cad3-5aec3600449ed190\"\u003e00工作方案\u003c/a\u003e限定方案建设，随后按授权补充必要小范围校验。\u003c/p\u003e\u003cp\u003e本次按完整方案范围审计，包括四块必须补齐的能力、共库接口、资料/检索/资源、文件级实施和真实验证路线。软件执行仍在07的M1—M5工程路线中；不能把本次方案完成写成内核已跑通、真实机械设计已验证或1TB性能已达成。\u003c/p\u003e\u003cp\u003e完成证据见\u003ca href=\"#doc=cad3-79073e5afd3b515f\" data-preview-doc=\"cad3-79073e5afd3b515f\"\u003e目标逐项审计\u003c/a\u003e及来源/链接记录（见原文附件）。静态检查证明附件与链接可回查；内容判断还须逐项阅读，不以文件数代替成熟度。\u003c/p\u003e\u003ch3\u003e2. 逐项核对\u003c/h3\u003e\u003ctable\u003e\u003ctr\u003e\u003ctd\u003e原目标\u003c/td\u003e\u003ctd\u003e已具备的方案与验证依据\u003c/td\u003e\u003ctd\u003e工程实施仍需什么\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e指定目录、独立三维文档集且链接二维\u003c/td\u003e\u003ctd\u003eREADME及00/01；所有设计均在本目录；链接可达性以最终机器记录为准\u003c/td\u003e\u003ctd\u003e后续维护同一入口与版本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e两个方案共建一库，二维聚焦不受影响\u003c/td\u003e\u003ctd\u003e01、02、15；当前旧合同只读兼容实核5项\u003c/td\u003e\u003ctd\u003e共享Relation/MethodRun等统一时按具体版本接入\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e工程事实覆盖几何/拓扑/参数/装配\u003c/td\u003e\u003ctd\u003e02/11/12、16/17；四域事实包和Schema实际验证\u003c/td\u003e\u003ctd\u003e真实来源、真实MEASUREMENT和复合量纲扩展\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e对象、工程特征与跨版本绑定\u003c/td\u003e\u003ctd\u003e02/13；唯一/多候选/失效及一对象多实体的合同检查\u003c/td\u003e\u003ctd\u003e真实内核拓扑映射、特征识别与历史鉴真\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e设计意图、参数约束与建模过程\u003c/td\u003e\u003ctd\u003e09/11/16；参数来源、冻结/可变、DAG和未知状态有附件\u003c/td\u003e\u003ctd\u003e求值、量纲、约束工具与真实输入接入\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e知识到计划与usd-brep操作映射\u003c/td\u003e\u003ctd\u003e03/04/09/14；真实API签名、所有权、错误、输出方式和前后检查已核\u003c/td\u003e\u003ctd\u003e几何环境、适配器/worker实现与实际运行\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e分层验证、解释、改进与复检\u003c/td\u003e\u003ctd\u003e05 V1—V6、13修改协议、07场景、14测量风险\u003c/td\u003e\u003ctd\u003e具体工程方法与真实模型执行\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e共同底座及三维增量界定\u003c/td\u003e\u003ctd\u003e01/02/06/15共享身份与入口映射\u003c/td\u003e\u003ctd\u003e按共同版本与当前用途/撤回状态装配\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e资料吸收与工艺知识\u003c/td\u003e\u003ctd\u003e03及共同14链接；有角色、提炼粒度、上下文和条件\u003c/td\u003e\u003ctd\u003e实际可用正文及工况；不能由书名编知识\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e检索、资源与秒级范围\u003c/td\u003e\u003ctd\u003e06及二维21小快照证据；与建模耗时分开\u003c/td\u003e\u003ctd\u003e规模/冷热/并发、几何峰值及恢复实测\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e接口合同可复核\u003c/td\u003e\u003ctd\u003e09/16两Schema、校验器、合成样例、组合16项测试\u003c/td\u003e\u003ctd\u003e生产合同、认证、持久化、执行和完整版本发布\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e阶段/文件级实施与真实验证设计\u003c/td\u003e\u003ctd\u003e07/14/15：文件、依赖、输入/输出、错误/未知、12场景、真实材料选择协议\u003c/td\u003e\u003ctd\u003e实施时核对环境/资料并按原路线运行验收\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e跟进二维并保持一致\u003c/td\u003e\u003ctd\u003e已跟进16—22；79项已有回执、22仅设计；来源指纹及只读兼容测试\u003c/td\u003e\u003ctd\u003e实施阶段继续核对二维届时最新合同\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e必要验证与证据诚实\u003c/td\u003e\u003ctd\u003e16项附件测试，输入/代码指纹、环境只读探测；无原件/二维代码改写\u003c/td\u003e\u003ctd\u003e不得将合成测试外推成真实准确率\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cp\u003e以上各项的方案内容均已具备，可交付评审；右列是明确的工程实施/外部输入任务，并非被静默删除的建设范围。它们不能被误标“已验收”。\u003c/p\u003e\u003ch3\u003e3. 首阶段可直接开始的实施入口\u003c/h3\u003e\u003cp\u003e执行者先读01、02、07、09、14、15、16；核对共同合同当前指纹。M1拆为计划、工程事实/绑定、意图/装配/运行三包，详细文件清单见07。当前两套附件可作为合同设计参考与回归材料，不直接复制为生产服务。\u003c/p\u003e\u003cp\u003e每包交付：版本化Schema、接口/错误语义、来源与scope引用、合法/错误/未知/冲突例、旧合同兼容结果和输入不变证据。真实来源与动作确认不能沿用模拟actor/伪哈希；未满足真实引用与身份条件时继续保持实验命名空间，不伪装生产发布。\u003c/p\u003e\u003cp\u003e合同附件复现：\u003c/p\u003e\u003cpre\u003e\u003ccode\u003e/Users/ddt/work/projects/ai_agent/cad/engineering-kb/.venv-evidence/bin/python -B -m unittest discover -s 验证 -v\n\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e换机器时新建独立Python3.12环境，以依赖锁定（见原文附件）安装；共享代码/样例按审计指纹提供只读快照并调整测试的COMMON路径。不得把环境绝对路径当正式部署方案。仓库内核的构建准备遵循14及其官方本地说明，不在二维证据环境中静默安装大依赖。\u003c/p\u003e\u003cp\u003eM2开始条件和错误协议已写明：绑定可导入，单位/坐标/所有权已核，实验余量/容差有明确值与理由，原件只读，步骤有预算，输出与失败有回执。未知测量精度不以默认volume()掩盖；没有几何工具就不宣称模型已验证。\u003c/p\u003e\u003ch3\u003e4. 最新二维跟进及三维影响\u003c/h3\u003e\u003cp\u003e\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://127.0.0.1:8842/#doc=cad-b85668429b980490\"\u003e二维22确认设计 ↗\u003c/a\u003e新增ReviewTarget与Capture、Append/RETRACT和SQLite重放设计。三维据此继续使用确定目标版本、确认范围和可信来源；不把新ReviewTarget假装成旧Observation，也不迁移READING为设计/工程确认。\u003c/p\u003e\u003cp\u003eCARD_ONLY目标不能用于精确实体绑定；REGION读取确认也只说明该位置字符，不说明特征、尺寸或制造正确。三维未来新增几何/意图/工程确认必须另有目标、条件和范围合同，仍复用共同事件治理，不建立另一套权威确认库。\u003c/p\u003e\u003cp\u003e本次看到review_capture.sqlite文件出现，未见其最终验收回执，故仅记“设计与工件存在”，不宣称持久化已经完成。二维已核验进度仍以79项现有回执的准确范围为准；没有读取正在写入的数据库或干预另一开发过程。\u003c/p\u003e\u003ch3\u003e5. 风险与取舍移交\u003c/h3\u003e\u003cp\u003e- 真实图模不一定成对，二维不唯一性和对象歧义必须保留；原JSON/训练标签不当三维真值。\u003c/p\u003e\u003cp\u003e- 拓扑身份跨修改不稳定，几何签名只能生成候选；INVALIDATED记录的历史真实性需共同版本链支持。\u003c/p\u003e\u003cp\u003e- BRep/网格/特征历史/装配约束含义不同，显示资产流程不能代替工程模型保存。\u003c/p\u003e\u003cp\u003e- 本地内核已知圆边界量测及修复假成功等风险，需实际版本复查和独立量交叉验证。\u003c/p\u003e\u003cp\u003e- 工艺经验需设备/工序/工况等前提，不能从几何成功推出可制造。\u003c/p\u003e\u003cp\u003e- 秒级检索与TB容量是目标，既有毫秒级小快照观测不能外推；备份和故障域仍需工程实施。\u003c/p\u003e\u003ch3\u003e6. 自查结论的边界\u003c/h3\u003e\u003cp\u003e整套方案具备架构和接口评审条件；首阶段已有具体任务、数据/接口、依赖、复现材料、验收与失败路径，可开始工程实施。此结论依据整个文档和附件链，不仅依据16个测试方法。\u003c/p\u003e\u003cp\u003e原型中的缺口已分类到具体后续工作包，未伪装成完成。正式软件、全量知识库、内核环境与真实机械验收不在本次方案交付中被宣称达成。持续目标是否完成以本聊天目标审计与状态工具为准，而非由本文自行修改目标状态。\u003c/p\u003e"}, {"id": "cad3-1e8881c86734c226", "path": "三维机械建模知识库方案/19-首期开工差距与待办清单.md", "source_path": "/Users/ddt/work/projects/ai_agent/docs/项目调研/三维机械建模/三维机械建模知识库方案/19-首期开工差距与待办清单.md", "title": "首期开工差距与待办清单", "group": "delivery", "sub": "todo", "role": "实施路线/未完成事项", "sha256": "7d1abfc27cb88f2ea2924716f2040774f37044ee29a656306f53181680576ea2", "headings": ["首期开工差距与待办清单", "1. 总待办", "2. START-01：明确首期交付边界", "3. START-02：与二维最新合同真正对齐", "4. START-03：真实依据参与的完整工程链", "5. START-04：内核运行与验证方法落地", "6. START-05：从设计合同到实际运行合同", "7. START-06：任务与验收到可交接深度", "8. START-07：建设覆盖表", "9. 建议推进顺序", "10. 维护规则", "11. 2026-10-21自审新增待办", "START-08：共同工程Wiki与维护", "START-09：工程语义与执行准入", "START-10：证据与工具血缘"], "body": "# 首期开工差距与待办清单\n\n记录日期：2026-10-17。来源：本聊天关于“从全面、详细到可开工还差什么”的复核，用户要求记录为待办。\n\n**当前判断：整体架构与覆盖方向可评审，可以启动合同和技术验证；距离实施者拿方案连续实现完整首期功能，还需以下工程收敛。** 此前“首阶段可实施”应按这一较窄范围理解，不能当作完整首期施工细节已全部确定。\n\n两套方案共建一个知识库，不新增独立知识主存；[二维方案入口](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/README.md)。本次只登记待办，没有自动开始实施，也没有重开已完成的方案目标。已有16项附件测试与历史交付记录保留，但不能据此关闭下列工程差距。\n\n## 1. 总待办\n\nP0为首期开工包优先补齐的工作；P1为需随首期同步收敛的工作，不设置行政审批。原START-01—07保持TODO；2026-10-21自审新增START-08—10，也均为TODO。只有达到完成证据后才能勾选。\n\n|编号|优先级|待办|完成状态|\n|---|---|---|---|\n|START-01|P0|明确首期交付边界|[ ] TODO|\n|START-02|P0|对齐二维最新runtime_v02及共同接口|[ ] TODO|\n|START-03|P0|走通一条有真实依据的完整工程链|[ ] TODO|\n|START-04|P0|落实内核运行与具体验证方法|[ ] TODO|\n|START-05|P1|设计合同升级为实际运行合同|[ ] TODO|\n|START-06|P1|开发任务与验收到可交接深度|[ ] TODO|\n|START-07|P1|建立统一建设覆盖表|[ ] TODO|\n|START-08|P1|接入共同工程Wiki、增量编译与三维失效传播|[ ] TODO|\n|START-09|P0|补谓词/对象类型/量纲及确定执行准入|[ ] TODO|\n|START-10|P1|补模型/工具血缘与证据独立性对照|[ ] TODO|\n\n## 2. START-01：明确首期交付边界\n\n明确首期支持的零件族、输入格式与来源、参数范围、操作集合、知识问题、输出表示、人工介入点和暂不支持范围。现有板孔/阶梯轴是候选，不因方案中出现就当作已经选定的最终产品范围。\n\n产物：首期范围说明、用户任务清单、输入/输出样例、验收场景映射。\n\n完成证据：每项首期功能均能对应可用输入、具体方法、预期输出及验收案例；单零件、装配、逆向、工艺建议与自由曲面等范围有明确取舍，开发者无需自行猜测第一期到底交什么。\n\n依赖：既有[07实施路线](07-分阶段实施与验收设计.md)及真实可用资料。此项先行，并驱动其余任务的范围。\n\n## 3. START-02：与二维最新合同真正对齐\n\n三维当前主要实核了旧七对象入口兼容。二维已在[25验证记录](../../CAD识图评分/CAD图纸智能审查系统_全套建设文档/知识库重点建设方案/25-统一契约与当前确认查询验证记录.md)中报告runtime_v02，组合Source/Unit/Relation、ReviewTarget/ReviewEvent、MethodRun与结构化查询。实施时重新核对当时版本，不能停留在旧快照。\n\n产物：字段/版本映射表、接口责任边界、迁移/适配策略、正反样例及回归结果。三维来源、对象绑定、方法运行、验证记录、确认范围、查询回执与撤回状态均应有明确落点。\n\n完成证据：在固定版本上通过旧输入兼容和新合同接入检查；断引用、错版本、跨scope、确认范围错误及撤回后的读取都有测试。明确哪些字段共用、哪些为三维扩展，避免出现第二套来源或事件主存。\n\n依赖：START-01，二维实际代码/Schema/机器回执；只读跟进后再协调共同修改，不干扰正在开发的文件。\n\n## 4. START-03：真实依据参与的完整工程链\n\n至少实际走通：资料原页 → 工程对象与条件 → 检索知识 → 生成建模计划 → 内核执行 → 几何/工程检查 → 解释 → 修改复检。必须同时覆盖正常、错误和缺条件分支。\n\n重点证明知识影响工程决策。例如同类轴肩结构因工序或配合条件变化，系统找到不同适用知识，形成有依据的不同候选，并说明检查与复检要求。这个例子只是选题方向；具体槽型、尺寸和依据必须来自实际可用资料，不能编造。\n\n产物：固定版本真实来源、对象/条件绑定、方法与参数依据、运行及验证回执、修改前后证据、未覆盖范围。\n\n完成证据：知识检索或适用条件变化确实改变了方法、参数选择或结论；只按固定参数生成模型不足以关闭本项。正常/错误/未知分支均保留来源和实际结果；合成扰动单列，不能计成新的真实样本。\n\n依赖：START-01/02/04，START-05的必要运行合同，以及有实际可用正文与工况的主题。图纸/三维不成对时不得伪造真值模型。\n\n## 5. START-04：内核运行与验证方法落地\n\n在独立几何环境中运行选定usd-brep版本，核对API、所有权、单位坐标及输出。前次只读探测仅说明所测解释器未发现几何绑定，实施时须重新核对，不据此宣称整机没有安装。\n\n把孔径、孔位、贯穿、体积等需求落实为具体可调用方法；确定测量精度、允许误差、超时、内存预算、失败分类、原件保留和恢复路径。\n\n产物：可复现环境及版本记录、实际适配器小链、方法输入输出与误差说明、正常/失败运行证据。\n\n完成证据：已实际产生并独立检查模型；错孔位即使体积相同也会失败；未知单位被拒绝；操作/测量不可靠与设计不满足可区分。结合[14内核风险](14-内核适配前置与测量风险.md)，不能只调用默认volume()就认定几何正确。\n\n依赖：START-01与可用运行环境；可与START-02并行核对。\n\n## 6. START-05：从设计合同到实际运行合同\n\n现有附件主要面向模拟设计，需补真实资产/单元引用、方法实际执行、测量记录、复合量纲、运行状态、输出发布与绑定失效。每个字段明确由哪个组件产生、何时校验、谁能更改及何时作废。\n\n产物：版本化实际输入/输出合同、状态转换、错误合同、方法注册、权限/撤回接口、持久化与兼容策略。\n\n完成证据：真实来源的合法包可运行；缺来源、错单位/量纲、缺方法回执、假成功、旧绑定或撤回来源不能进入确定结果；原文、推断、设计要求和实测值不相互覆盖。\n\n依赖：START-01/02，与START-04共同确定执行字段；沿用共同MethodRun/Relation，不另建平行体系。\n\n## 7. START-06：任务与验收到可交接深度\n\n在[07文件清单](07-分阶段实施与验收设计.md)基础上，将首期任务逐个固定为输入、输出、依赖、目录/文件、测试、失败处理、完成证据和风险。责任按模块分工定义，具体人员和工时不凭空填写。\n\n产物：首期开工任务包与验收矩阵；质量阈值、测量口径、开发集/独立保留集及故障测试计划。\n\n完成证据：另一位开发者能依任务执行并判断完成，不需临场补关键产品语义；阈值在验收运行前确定，结果有范围与分母。已知不支持、UNKNOWN与工具ERROR不混成PASS。独立样本按来源族隔离，不把同图变体计成盲测。\n\n依赖：START-01；根据02/04/05的实际结果逐步收敛，不用猜测填满任务表。\n\n## 8. START-07：建设覆盖表\n\n建立“对象族 × 知识职责D × 工程任务 × 适用条件 × 验证方法”的统一覆盖视图，与既有来源S和判断环节J可关联。每格分别记录已有资料、已提炼知识、已有方法、已真实验证、未知/不支持及来源版本。\n\n产物：覆盖表字段定义、首期主题的实际填表、缺口统计口径。优先沿用共同目录中的ID，不重新复制知识正文。\n\n完成证据：能区分缺知识、缺工具、缺工况和缺验证；资料量增长不自动变为能力覆盖增长。每个“已支持”均有任务范围、条件及实际证据，未检查格子不能当不存在或已覆盖。\n\n依赖：START-01；先定义表结构，随START-03及资料吸收填入真实证据。\n\n## 9. 建议推进顺序\n\n1. 先明确首期交付边界，并建立覆盖表结构。\n2. 对齐二维v0.2，同时准备独立内核环境与验证方法。\n3. 收敛实际运行合同和文件级任务，确定验收口径与保留集。\n4. 跑通真实工程纵向链，按结果补缺口，再复核完整首期开工条件。\n\n下一次开工判断应联合查看范围说明、共享合同映射、真实工程链和方法证据。不得仅以“七项文档都写了”或“接口测试绿色”关闭所有待办。\n\n## 10. 维护规则\n\n每项更新时记录日期、实际状态、完成证据链接和剩余问题；缺证据保持TODO或IN_PROGRESS。历史18及目标审计保留为当时方案交付快照，本清单是后续开工差距的当前入口。本轮登记不表示这些待办已实施。\n\n## 11. 2026-10-21自审新增待办\n\n### START-08：共同工程Wiki与维护\n\n设计已补入[20](20-持续知识编译
